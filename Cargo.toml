# Empty [workspace] table opts this package OUT of any containing workspace
# found by Cargo's parent-directory autodiscovery. AGENTS.md is explicit:
# "single binary crate with a library surface in the same package; not a
# workspace in phase 0". On RCH workers, the synced project sometimes
# lands under /data/projects/ which contains an unrelated FCP workspace
# Cargo.toml at the parent — without this opt-out, cargo treats eidetic
# as a member of that workspace and tries to load its (missing) crates.
#
# `exclude` keeps cargo's subdirectory autodiscovery from picking up the
# fuzz/ subproject (its own [package]) and the franken_publish_status
# test fixture (its own nested [workspace]). Without these excludes,
# cargo would try to inherit workspace.package.license-file from
# eidetic's root, which is undefined on purpose — see
# tests/fixtures/franken_publish_status/fnx_repo/Cargo.toml.
[workspace]
exclude = [
    "fuzz",
    "tests/fixtures",
    ".ci",
]

[package]
name = "eidetic-engine"
version = "0.13.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Durable, local-first, explainable memory for coding agents."
repository = "https://github.com/Dicklesworthstone/eidetic_engine_cli"
homepage = "https://github.com/Dicklesworthstone/eidetic_engine_cli"
documentation = "https://docs.rs/eidetic-engine"
readme = "README.md"
keywords = ["memory", "agents", "cli", "local-first", "search"]
categories = ["command-line-utilities", "database", "development-tools"]
default-run = "ee"
publish = true
exclude = [
    "tests/fixtures/*",
    "tests/golden/*",
    "tests/artifacts/*",
    ".beads/*",
    ".beads.snapshot_*",
    ".beads.snapshot_*/*",
    "FINAL_AUDIT_REPORT",
    "FINAL_AUDIT_REPORT.*",
    ".audit_log",
    ".audit_log/*",
    "*.audit_log",
    ".*-report.json",
    "perf-target/*",
    "perf.data",
    "*.profraw",
    "*.json,bak",
    "tmp/*",
    "temp/*",
    ".tmp/*",
    ".temp/*",
]

[lib]
name = "ee"
path = "src/lib.rs"

[[bin]]
name = "ee"
path = "src/main.rs"

# Feature flags. See docs/feature_flag_registry.md for status, gate surface,
# and owner-bead per flag. tests/feature_flag_registry_in_sync.rs enforces
# 1:1 correspondence with that registry. `[]` as a value means "no optional
# Cargo dependencies" — a flag can still cfg-gate code in src/ with `[]` value.
[features]
default = ["fts5", "json", "embed-fast", "lexical-bm25", "graph"]
fts5 = ["frankensearch/fts5"]
# Reserved (status: reserved). No cfg-gates in src/ today. Reserved for a
# future "JSON-only minimal output" build profile. See docs/feature_flag_registry.md.
json = []
embed-fast = ["frankensearch/model2vec", "frankensearch/download"]
# Blocked: frankensearch/fastembed currently pulls reqwest/tokio/hyper/tower.
# Do not expose an embed-quality feature until that tree is forbidden-dep clean.
lexical-bm25 = ["frankensearch/lexical-tantivy"]
# Active. Gates ~42 cfg-gated functions under src/graph/mod.rs. Default-on.
graph = []
# Active test-only gate for the heavyweight Python NetworkX differential suite.
# This feature pulls no Rust dependencies and is intended for nightly CI or
# explicit local/RCH runs where Python + networkx are available.
differential-networkx = []
# Active. Gates `pub mod mcp;` at src/lib.rs:23 (the full 2.6k-LOC MCP adapter).
# Opt-in via `cargo install eidetic-engine --features mcp` per README.
mcp = []
# Reserved (status: reserved). No cfg-gates in src/ today. Reserved for the
# future localhost HTTP/SSE adapter described in AGENTS.md §Module Layout.
serve = []
# Reserved (status: reserved). The default build already includes lightweight
# deterministic science metrics and the read-only `ee analyze science-status`
# surface; this empty flag is retained for future heavier analytics backends
# (EE-171). See docs/feature_flag_registry.md and docs/silent-fallback-inventory.md.
science-analytics = []

[dependencies]
asupersync = { version = "=0.4.3", default-features = false, features = ["tracing-integration"] }
arc-swap = { version = "=1.9.2" }
base64 = { version = "0.22.1" }
blake3 = { version = "1.5" }
crossbeam-queue = { version = "0.3" }
determinism = { version = "0.1.0", path = "crates/determinism" }
franken-agent-detection = { version = "0.1.3", path = "../franken_agent_detection", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.6.1" }
fnx-algorithms = { version = "0.2.0", path = "../franken_networkx/crates/fnx-algorithms" }
fnx-classes = { version = "0.2.0", path = "../franken_networkx/crates/fnx-classes" }
fnx-runtime = { version = "0.2.0", path = "../franken_networkx/crates/fnx-runtime", default-features = false, features = ["asupersync-integration"] }
frankensearch = { version = "0.3.0", path = "../frankensearch/frankensearch", default-features = false, features = ["hash", "storage", "model2vec", "download", "rerank", "native"] }
# MSRV-compatible, safe advisory file locking for doctor fix/undo coordination.
# Keep async features disabled: Tokio/async-std/smol are forbidden here.
fs4 = { version = "0.13.1", default-features = false, features = ["sync"] }
getrandom = { version = "0.4.2" }
regex-lite = { version = "0.1" }
# Direct libc remains available for low-level platform adapters; daemon gates
# use safe wrappers in source to keep the crate-level unsafe-code ban intact.
libc = { version = "0.2" }
ring = { version = "0.17" }
roaring = { version = "0.11.4" }
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yaml = { version = "0.9.34" }
sha2 = { version = "0.11.0" }
signal-hook = { version = "0.4" }
sqlmodel-core = { version = "0.3.0", path = "../sqlmodel_rust/crates/sqlmodel-core" }
sqlmodel-frankensqlite = { version = "0.3.0", path = "../sqlmodel_rust/crates/sqlmodel-frankensqlite" }
tempfile = { version = "3.27.0" }
# Real BPE tokenization for context pack budget enforcement
# (eidetic_engine_cli-aitk). Default features only; the `async-openai`
# feature would pull tokio/reqwest/hyper which are forbidden here.
tiktoken-rs = { version = "0.12.0", default-features = false }
toon = { package = "tru", version = "0.2.2", path = "../toon_rust", default-features = false }
toml_edit = { version = "0.25.12", default-features = false, features = ["parse", "display"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# NFC normalization for policy tag/secret detection (bd-17c65.3.3 / C3).
# Already in dep tree transitively; explicit dep documents the contract.
unicode-normalization = { version = "0.1" }
uuid = { version = "1", features = ["v7"] }
# Direct dependency for deterministic pack-compression dictionary training.
# The default zstd features include zdict_builder; no forbidden async or HTTP
# stack is introduced.
zstd = { version = "0.13.3" }
# Pure-Rust tar extraction to unpack the reranker model artifact (.tar.zst) into a
# loadable model dir during `ee model fetch`. default-features off drops the
# unix-only xattr extra so it cross-compiles to windows-msvc cleanly.
tar = { version = "0.4", default-features = false }

[dev-dependencies]
# asupersync's `Cx::for_testing()` (and the other `for_testing*`/`for_request*`
# constructors) are gated behind `cfg(any(test, feature = "test-internals"))`
# since 0.3.6 (br-asupersync-2x6hbi) so external crates cannot mint an ambient
# full-capability `Cx` in production. Our unit/integration/bench suites still
# rely on those constructors, so we opt in here: as a dev-dependency the feature
# is unified into test/bench/`--all-targets` builds only and stays OUT of the
# release binary (which uses the detached, capability-less production Cx path).
asupersync = { version = "=0.4.3", default-features = false, features = ["tracing-integration", "test-internals"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { version = "1.48.0", features = ["json"] }
proptest = { version = "1.9.0", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
static_assertions = { version = "1.1.0" }

