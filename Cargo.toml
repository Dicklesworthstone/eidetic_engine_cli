# Lint Policy (EE-002)
# CI runs: cargo clippy --all-targets -- -D warnings
# See AGENTS.md for rationale.

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Core safety lints - discourage panic paths in library code
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Tests may use #[allow(clippy::unwrap_used)] or #[allow(clippy::expect_used)]
# when the context makes the assertion obvious

# Nightly Clippy drift baseline, captured from the 2026-06-05 CI wave.
# These are style/mechanical lints whose cleanup should be handled in
# focused source slices instead of blocking every unrelated readiness run.
approx_constant = "allow"
bool_assert_comparison = "allow"
cmp_owned = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
collapsible_str_replace = "allow"
derivable_impls = "allow"
doc_lazy_continuation = "allow"
double_must_use = "allow"
explicit_auto_deref = "allow"
field_reassign_with_default = "allow"
if_same_then_else = "allow"
io_other_error = "allow"
iter_cloned_collect = "allow"
large_enum_variant = "allow"
let_and_return = "allow"
manual_contains = "allow"
manual_div_ceil = "allow"
manual_ok_err = "allow"
manual_saturating_arithmetic = "allow"
map_clone = "allow"
needless_as_bytes = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
needless_lifetimes = "allow"
needless_option_as_deref = "allow"
needless_return = "allow"
obfuscated_if_else = "allow"
ptr_arg = "allow"
question_mark = "allow"
redundant_guards = "allow"
result_large_err = "allow"
single_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_map_or = "allow"
unusual_byte_groupings = "allow"
useless_conversion = "allow"
vec_init_then_push = "allow"
while_let_loop = "allow"
