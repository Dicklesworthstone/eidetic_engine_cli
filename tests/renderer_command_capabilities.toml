# Command-level renderer capability matrix.
#
# Owned by bd-2ulvu.1. This inventory complements the field-level
# renderer parity matrix in tests/renderer_parity_matrix.rs. It records
# what each command promises for every public output format so future
# tests can distinguish explicit Mermaid diagram support from accidental
# Markdown/human fallback.
#
# Capability values:
# - canonical: canonical machine contract for the command
# - machine: machine-readable renderer derived from the canonical contract
# - human_text: intentional human-readable text renderer
# - diagram: explicit Mermaid diagram renderer
# - json_override: JSON/robot mode intentionally overrides the requested format
# - unsupported: non-machine requests must return an explicit structured usage
#   error; --json/--robot still override to the canonical machine contract
#
# Matrix entries are deliberately representative, not exhaustive. Add a command
# here whenever a command claims a non-JSON format, gains a custom renderer branch,
# or appears in agent-facing docs as format-aware.

[[command]]
name = "context"
owner = "src/core/context.rs"
notes = "Context defaults to Markdown for agent prompt text and has an explicit Mermaid pack-topology renderer."
formats.human = "human_text"
formats.markdown = "human_text"
formats.mermaid = "diagram"
formats.json = "canonical"
formats.toon = "machine"
formats.jsonl = "machine"
formats.compact = "machine"
formats.hook = "machine"
json_override = true
mermaid_markers = ["flowchart", "pack", "provenance"]

