# Per-stage budgets for scripts/verify.sh.
#
# expected_seconds_p50 is the expected median on a mid-tier dev machine.
# regression_factor = 1.5 emits an advisory when elapsed time exceeds p50 * 1.5.
# scripts/verify.sh fails the run when elapsed time exceeds p50 * 3.
#
# Non-benchmark p50 values must not EXCEED 601s, the 10-minute readiness
# target plus the one stage added since. This is a ceiling, not an equality. It
# used to be an exact sum, which
# meant adding any verify.sh stage forced someone to reduce another stage's p50
# to keep the total -- i.e. to write down a number that was not the
# measurement. A budget file that can only stay green by falsifying a latency
# is worse than a loose one, so the equality was removed on 2026-09-16.
#
# Benchmarks are optional behind --include-bench and excluded from that total.
#
# A stage with no measurement yet declares `expected_seconds_p50_unmeasured =
# true` and NO `expected_seconds_p50`. That is deliberate: verify.sh's
# stage_budget_thresholds fails to resolve a threshold when the field is
# absent, and enforce_stage_budget then skips the stage, so an unmeasured stage
# is structurally unenforceable rather than enforced against a guess. Replace
# the marker with a real p50 the first time the stage is timed, and lower
# UNMEASURED_STAGE_ALLOWANCE in tests/verification_drift_guard.rs in the same
# commit -- that allowance is a ratchet and only moves down.
# p50 PROVENANCE FOR CARGO-INVOKING STAGES (bd-vihzq)
#
# THE HEADER ABOVE NAMES A HOST THIS REPO FORBIDS FOR THESE STAGES. It says
# expected_seconds_p50 is "the expected median on a mid-tier dev machine". For
# a stage that shells out to cargo, that host does not exist here:
# scripts/check-local-cargo-tripwire.sh classifies a direct `cargo
# build/check/test/bench/clippy` in this repo as DENIED (verified 2026-09-22:
# "direct cargo test invocation bypasses the RCH wrapper"), AGENTS.md says not
# to fall back to local Cargo, and docs/operator-swarm-slo.md names Gate 5 and
# the other cargo-heavy gates as RCH-only. So the cargo stages' p50s cannot
# have been measured the way the header says they were measured. That is not a
# wording quibble; it is the reason nobody noticed the numbers going stale.
#
# A cargo stage's cost is NOT its script's cost. It is dominated by the
# toolchain re-walking freshness across every crate in Cargo.lock (573 today).
# That walk is paid in full on EVERY entry into cargo and does not amortise
# between invocations: one WARM single-target `cargo test --locked --test
# lexical_relevance_contract -- --ignored` on RCH worker hz4 at 82926d4c5 cost
# 74s with zero Compiling lines and 0.00s of actual test execution.
#
# Every stage that reaches cargo therefore carries a machine-checked record:
#
#   # P50_PROVENANCE measured=YYYY-MM-DD host=<host> load=<avg> \
#       samples_s=a,b,c median_s=<m> declared_p50_s=<p50>
#   # P50_PROVENANCE unmeasured_reason=<token>          (and NO p50 declared)
#   # P50_PROVENANCE inherited_unverified_reason=<token> declared_p50_s=<p50>
#
# The third spelling exists because the file previously had no honest exit. A
# cargo p50 nobody had timed could be left as a plausible-looking number, which
# is the fabrication bd-vihzq was filed about, or dropped to `unmeasured`, which
# pushes the unmeasured count past its own down-only allowance. The file
# punished the honest move. `inherited_unverified_reason` keeps the number and
# says out loud that it is a guess, and the count of them is ratcheted by
# UNVERIFIED_CARGO_P50_ALLOWANCE in tests/verification_drift_guard.rs.
#
# `every_cargo_invoking_stage_declares_p50_provenance` enforces this, and it
# restates declared_p50_s ON PURPOSE: a p50 can no longer be retuned to fit the
# ceiling without editing the evidence beside it, which is exactly the
# retune-to-fit that verification_drift_guard.rs:1361 calls fiction. It cannot
# detect the world getting slower -- nothing static can, and verify.sh already
# reports that at run time as `budget=advisory` / `budget=fail`. Its job is to
# make sure the p50 those verdicts are computed against is a number somebody
# actually observed, on a host they named.
# REQUIREMENT POLICY (bd-reality-core-convergence-1azkt.5)
#
# Every stage is REQUIRED unless it declares otherwise. A stage may declare
#
#     requirement = "advisory"                 # runs, must not block the wave
#     requirement = "tracked_red"              # known red, owned by a bead
#     tracked_red_bead = "bd-xxxxx"            # MANDATORY with tracked_red
#
# and those declarations carry one hard rule, ruled 2026-09-17:
#
#   A DECLARED-NON-REQUIRED STAGE MAY NEVER REPORT GREEN.
#
# ADVISORY and TRACKED_RED are terminal statuses in their own right. They are
# never collapsed into, aliased to, or rendered as PASS, and verify.sh's summary
# prints a census per status so the excused population appears in the same line
# that claims success. An excuse you cannot count is an excuse nobody audits.
#
# The distinction this preserves: green means ONE thing, "this ran and passed".
# The moment green can also mean "this was excused", no consumer can tell a
# stage that worked from a stage that was allowed not to.
#
# TWO stages declare a non-required requirement today, both declared
# 2026-09-19:
#   "Lexical Relevance Contract (tracked red)"  -> bd-reality-core-convergence-1azkt.11
#       the pins themselves, red on purpose, documenting the relevance defect
#   "Lexical Relevance Contract Harness Guard"  -> bd-iqg34
#       red for an UNRELATED reason: the RCH target-dir layout puts the test
#       binary outside <target>/debug/deps, so the harness cannot find it
# Two reds, two causes, two owning beads -- kept separate so neither is read as
# the other. That count is asserted by
# `no_stage_is_declared_non_required_without_a_bead` in
# tests/verification_drift_guard.rs, so introducing one is a deliberate,
# reviewable act rather than a default anybody can drift into — and removing one
# is equally deliberate, because the count has to move in the same commit.
total_expected_seconds = 601
total_regression_factor = 1.5

# CANDIDATE BINARY (bd-reality-core-convergence-1azkt.5, bullet 1). The manifest
# is required to name WHICH binary a run verifies. Until this block it did not:
# the eight keys above and below declare stage names, budgets and requirement
# policy only, and the string "binary" appeared solely in comments and in one
# stage NAME ("EE Binary Resolution Contract"). A stage that VALIDATES a binary
# is not a declaration of WHICH binary, so the clause was unmet.
#
# PLACEMENT IS FORCED, NOT STYLISTIC. Both manifest parsers mis-handle a table
# that sits after the stages, in different ways:
#   - scripts/verify.sh:894 sets `in_stage = 1` on `[[stage]]` and NEVER clears
#     it on a later table header, so keys here would be read as fields of the
#     LAST stage.
#   - tests/verification_drift_guard.rs:1210 `budget_stage_blocks` starts a
#     block on ANY line beginning `name = `, inside a stage or not, and then
#     absorbs every following line until the next `[[stage]]`.
# Hence: before the first [[stage]], and NO key literally named `name` -- which
# is why the field below is `binary_name`. Verified by running the guard both
# ways before committing.
#
# This block is DECLARATIVE. It does not resolve anything at run time; verify.sh
# still resolves via scripts/lib/ee_binary_resolution.sh. It is load-bearing
# because tests/verification_drift_guard.rs asserts verify.sh's resolution
# agrees with it, so the two cannot drift apart silently. A declaration nothing
# checks would be decoration.
#
# Features are deliberately NOT restated here. Cargo.toml's `default = [...]`
# is the single source, cross-checked against build_features() by
# every_default_feature_is_reported_by_build_features. A third copy would be a
# third drift seat.
[candidate_binary]
binary_name = "ee"
target_subpath = "debug/ee"
resolver = "scripts/lib/ee_binary_resolution.sh"

# PLATFORM / FEATURES / RESOURCES (bd-reality-core-convergence-1azkt.5, bullet 1).
# The manifest is required to name the platform, features and resources a run
# needs. Before this block it named none: zero occurrences of "platform" or
# "feature" anywhere in the file, comments included.
#
# EVERY KEY HERE IS A CONTRACT OR A SOURCE POINTER, NEVER A COPY. That is the
# rule in docs/testing-strategy.md, "Declare a contract, not a list": a list has
# to be maintained by whoever changes the thing it describes, while a contract
# either holds or does not and its check can find its own population.
#
#   supported_target_os        A real declaration -- this IS the source of truth
#                              for where the manifest is valid, not a copy of
#                              one. verify.sh reads it and refuses a host
#                              outside it, so the list is load-bearing.
#   feature_source             A POINTER, deliberately not a feature list.
#                              Cargo.toml's `default = [...]` is the single
#                              source; it is already cross-checked against
#                              build_features() by
#                              every_default_feature_is_reported_by_build_features.
#                              Restating the features here would be a THIRD copy,
#                              and that cross-check only guards two.
#   requires_candidate_binary  A resource precondition, bound to behaviour:
#                              verify.sh refuses to run stages when the binary is
#                              missing, foreign, or the wrong version.
#
# Placement and naming follow [candidate_binary] above: before the first
# [[stage]], and no key literally named `name`. Both manifest parsers mis-handle
# a table after the stages -- see the comment there for the measured reason.
[requirements]
supported_target_os = ["macos", "linux"]
feature_source = "Cargo.toml#default"
requires_candidate_binary = true

# AGGREGATE COMPLETENESS (bd-reality-core-convergence-1azkt.5, bullet 1). The
# reconciliation has been ENFORCED since 6c518cad8, but the manifest never SAID
# what completeness means -- so the property lived only in a test body, where a
# reader checking whether this manifest is complete had nothing to read.
#
# `predicate` states the property; it is not a second copy of anything, because
# no other file states it in words. `enforced_by` names the test that decides it,
# and a drift-guard test asserts that function actually exists -- a pointer to a
# check that was renamed away would be worse than no pointer, since it reads as
# coverage.
#
# NOT CLAIMED HERE: completeness of the TEST INVENTORY (bullet 1's remaining
# clause) is a different property about logical tests across shards, and is not
# what this predicate covers.
[completeness]
predicate = "every run_stage call site in verify.sh has exactly one [[stage]] entry here, and every [[stage]] entry has exactly one call site, except names listed MUTUALLY_EXCLUSIVE in the enforcing test whose call sites cannot both execute in one invocation"
enforced_by = "tests/verification_drift_guard.rs::every_run_stage_call_site_is_accountable_in_the_manifest"

# EXACT TEST INVENTORY / SHARDS (bd-reality-core-convergence-1azkt.5, bullet 1).
# Before this block the ONLY shard declaration in the repository was a job matrix
# inside a workflow that is disabled_manually -- i.e. a declaration nothing reads
# in a file nothing runs.
#
# THIS IS NOT A LIST OF TESTS, ON PURPOSE. Enumerating 45 targets here would rot
# on the next added test and would be a second copy of Cargo.toml. What the
# manifest declares instead is WHERE the inventory derives from and WHAT must
# hold of it; a test derives both sides and compares, so neither is a copy. See
# docs/testing-strategy.md, "Declare a contract, not a list".
#
#   target_source            Cargo.toml's [[test]] blocks. `autotests = false`
#                            (Cargo.toml:36), so a tests/*.rs file that is
#                            neither declared nor #[path]-included compiles into
#                            nothing -- which is why "declared" is the inventory
#                            and the filesystem is not.
#   shard_glob / shard_count The shard set is small and stable, so the count is a
#                            RATCHET rather than a copy: adding a shard must be a
#                            deliberate edit here, and the enforcing test globs
#                            the directory and refuses a mismatch.
#   exactly_once_enforced_by Bullet 1 wants each logical test to appear once. The
#                            check already exists; this names it so the property
#                            is findable from the manifest, and a test asserts
#                            the named function is really there.
# EVIDENCE OUTPUTS (bd-reality-core-convergence-1azkt.5, bullet 1). Held back
# deliberately until 061761cb3, because until then the thing this would have
# declared was broken: run_stage captured artifact paths only on the PASS branch,
# and the index was never printed at all on a run that hard-failed. Declaring
# evidence outputs over that substrate would have been correct on paper and
# useless in fact -- outputs nobody could find. bd-ovsjv fixed both halves first.
#
# A CONTRACT AND AN INVARIANT, NOT A LIST OF PATHS. The paths are DISCOVERED AT
# RUN TIME from each stage's own output, so enumerating them here would be a
# second copy of a runtime value -- the rot shape docs/testing-strategy.md warns
# about. What is declarable is the protocol a stage follows, the invariant that
# must hold of the recorder, and pointers to the two functions that implement it;
# a test derives all three from verify.sh, so nothing here is a copy.
[evidence_outputs]
capture_contract = "a stage that produces evidence prints `Artifacts: <dir>` in its output; run_stage records that directory in the end-of-run index, tagged with the terminal status that produced it"
invariant = "every run_stage branch that discards a stage's captured output records that stage's artifacts first, so no terminal status drops evidence"
recorded_by = "scripts/verify.sh::record_stage_artifacts"
printed_by = "scripts/verify.sh::print_artifact_index"

[test_inventory]
target_source = "Cargo.toml#[[test]]"
shard_glob = "tests/suites/integration_*.rs"
shard_count = 7
exactly_once_enforced_by = "tests/suites/inventory.rs::no_test_bearing_helper_is_included_by_two_targets"

