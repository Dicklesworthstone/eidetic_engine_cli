# NOT A MEASUREMENT, AND THE NUMBER SAYS SO ITSELF (bd-vihzq).
#
# The stage runs, from fuzz_smoke() in verify.sh:
#     cargo +nightly fuzz run search_query_parser -- -max_total_time=30 ...
# and the declared p50 is 30 -- the value of the tool's own `-max_total_time`
# knob, copied across. A p50 that equals a time LIMIT passed to the command
# cannot be an observation of the command: it is the one number in the whole
# invocation that is guaranteed not to include cargo-fuzz's build of the
# nightly fuzz target, the libFuzzer link, or process startup. Whatever this
# stage costs, it costs 30s of fuzzing PLUS all of that, so 30 is not a median
# of anything; it is a lower bound stated as if it were the middle.
#
# Left at 30 rather than re-measured: the stage is opt-in behind
# --include-fuzz-smoke and did not run in this session's lane, and a nightly
# toolchain plus cargo-fuzz on a declared host is a measurement in its own
# right rather than a side effect of this one. Timing it is the work that
# replaces this record and lowers UNVERIFIED_CARGO_P50_ALLOWANCE by one.
#
# Worth noting while it sits here: the 30 is charged against the 601s ceiling
# on every run even though the stage is gated off by default, so an opt-in
# stage is holding budget that the default path never spends.
# P50_PROVENANCE inherited_unverified_reason=equals-the-max-total-time-knob declared_p50_s=30
expected_seconds_p50 = 30
