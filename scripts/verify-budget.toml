[[stage]]
name = "Lexical Relevance Contract Harness Guard"
# TRACKED RED AGAINST bd-iqg34, NOT against the pin bead. Measured on RCH
# worker hz4 (job 30025237340881842): this arm exits 1 because the test binary
# is written to `<target>/debug/build/eidetic-engine/<hash>/out/` rather than
# `<target>/debug/deps/`, so the harness cannot locate the artifact Gate 5 just
# built. That is a worker/rch layout defect, filed as bd-iqg34; it is not a
# defect in what this gate asserts.
#
# It was REQUIRED when introduced at e99eb0bbb, which meant verify.sh
# fail-fasted here on this fleet -- a hard red on a required stage, worse than
# the inert stage it was assumed to be. Declaring it tracked_red keeps the
# stage IN verify.sh (no gate-removal diff to defend), keeps it RED for a TRUE
# reason with the owning bead named, and costs ~0s because it fails before any
# work. Restore `requirement`-less REQUIRED status the moment bd-iqg34 is
# fixed, and drop the non-required count in
# `no_stage_is_declared_non_required_without_a_bead` back by one.
requirement = "tracked_red"
tracked_red_bead = "bd-iqg34"
#
# Proves its own listing predicate against synthetic input (so a guard that
# cannot fail is caught before it is trusted), then checks the live artifact:
# the binary exists, is not older than tests/lexical_relevance_contract.rs, and
# enumerates exactly the two pins by name. Without this arm a missing or stale
# binary would exit nonzero into the tracked-red stage below and be excused as
# the known red.
#
# 1s, not the 0s it measures at: the hard-fail line is p50*3, and 3s is ample
# for a no-cargo bash arm that runs one `--list` against a prebuilt binary.
expected_seconds_p50 = 1
regression_factor = 1.5

[[stage]]
name = "Lexical Relevance Contract (tracked red)"
# THE FIRST DECLARED-NON-REQUIRED STAGE IN THIS FILE
# (bd-reality-core-convergence-1azkt.11, declared 2026-09-19).
#
# Two #[ignore]d pins in tests/lexical_relevance_contract.rs that FAIL against
# the current product on purpose. They exist so the repair has a pre-existing
# red to be measured against: rename ScoreSource::Lexical's score kind and the
# first pin either flips or it does not, which a rename landed alongside a
# regenerated golden set could never demonstrate.
#
# 1s because this arm executes the binary Gate 5 already built; the pins run in
# 0.00s. It deliberately does NOT re-enter cargo, which measured 74s on RCH hz4
# at 82926d4c5 purely re-walking freshness over ~350 crates Gate 5 had just
# walked. That double charge was a real cost in the gate, not a budgeting
# obstacle -- removing it is why these two stages fit in 2s where one cargo
# stage did not fit in 74.
#
# This stage MUST NOT report PASS while it carries this declaration. When the
# pins go green, delete `requirement`/`tracked_red_bead` in the SAME commit and
# drop the non-required count in `no_stage_is_declared_non_required_without_a_bead`
# back by one. A tracked_red stage that quietly starts passing is exactly the
# collapse between "this ran and passed" and "this was excused" that the
# requirement policy above exists to prevent. scripts/lexical_relevance_pins.sh
# prints an unmissable banner on a zero exit for that reason.
requirement = "tracked_red"
tracked_red_bead = "bd-reality-core-convergence-1azkt.11"
expected_seconds_p50 = 1
regression_factor = 1.5

