[[stage]]
name = "Unit, Contract, and Golden Tests"
# THE STAGE bd-vihzq WAS FILED ABOUT. 120 IS NOT A MEASUREMENT.
#
# The command is
#     cargo test --workspace --lib --bins --tests --examples -- --test-threads=1
# and three independent lines of evidence say 120s cannot be its median.
#
# 1. WHAT IT HAS TO RUN. 522 integration test targets under tests/, plus the
#    lib and bins: 11,080 `#[test]` functions in src/ and 5,176 in tests/,
#    16,256 in total, executed SERIALLY because of --test-threads=1. For 120s
#    to be the median, the whole suite would have to average ~7ms per test
#    INCLUDING 522 separate test-binary process launches and cargo's freshness
#    walk. Counted 2026-09-22 with `grep -rn '^\s*#\[test\]'`.
#
# 2. THE FRESHNESS WALK, WHICH THIS STAGE PAYS ONCE FOR ALL 522 TARGETS. A
#    WARM single-target `cargo test --locked --test lexical_relevance_contract
#    -- --ignored` on RCH worker hz4 at 82926d4c5 took 74s with ZERO Compiling
#    lines and 0.00s of test execution. That 74s is cargo re-walking freshness
#    across the lock file, and this stage's walk covers every target rather
#    than one.
#
# 3. A DIRECT OBSERVATION, WITH ITS CONTAMINATION STATED. On 2026-09-22 on RCH
#    worker hz4 (64 cores, load 7.71) the BUILD PHASE ALONE of this stage --
#    the same command with --no-run, so not a single test executed -- ran for
#    639s and then failed to link. 639s is 5.3x the declared p50 for the whole
#    stage. It is NOT offered as the p50: the working tree had just been synced,
#    so that run compiled rather than only walking freshness, and it terminated
#    on a build failure rather than completing. It is offered for the one thing
#    it does establish without needing to be clean -- that the part of this
#    stage which runs no tests at all does not fit inside 120s.
#
# WHY THE NUMBER IS STILL 120.
#
# Because every honest replacement is worse, and bd-vihzq says so directly:
# "do NOT raise the ceiling to accommodate a stage". The non-benchmark p50s
# total exactly 601 against a 601 ceiling, so there is no headroom; writing the
# real figure here would red verification_drift_guard.rs for the whole swarm,
# and writing a smaller-but-larger guess would repeat the original defect with
# a fresher date on it. Lowering another stage to make room is the retune-to-fit
# the ceiling comment already calls fiction.
#
# So the number stays and is LABELLED, and the two consequences are stated
# rather than absorbed:
#   - p50*3 = 360s is a HARD FAIL line derived from a number nobody measured,
#     sitting under a stage whose no-test build phase alone was observed at
#     639s. Either this gate has not been failing because full runs are rare,
#     or it has been failing and being re-run.
#   - The 601s readiness ceiling is not a budget this suite fits inside. It is
#     an ASPIRATION. Re-deriving it from measured totals is a decision for
#     whoever owns the 10-minute target, and bd-vihzq is where that decision
#     belongs -- not in a drive-by edit from the stage that noticed.
#
# TO REPLACE THIS RECORD: time the command end to end on a named host under a
# named load, several samples, median. Note that it needs more than the 900s
# rch job timeout, and that local cargo is denied in this repo by
# scripts/check-local-cargo-tripwire.sh, so it is an RCH measurement or none.
# P50_PROVENANCE inherited_unverified_reason=build-phase-alone-observed-at-639s declared_p50_s=120
expected_seconds_p50 = 120
regression_factor = 1.5

