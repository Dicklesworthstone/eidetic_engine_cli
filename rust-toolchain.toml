# Nightly only. Never stable, beta, or a dated *stable* pin.
# Mixing nightly cargo with stable rustc produces E0514 crate mismatches.
# Release/DSR hosts must set RUSTUP_TOOLCHAIN=nightly (see AGENTS.md).
#
# Pinned to a DATED nightly on purpose -- this satisfies the nightly-only rule
# above while removing the floating-channel hazard. Do not change this back to a
# bare `channel = "nightly"`.
#
# A floating nightly means the compiler moves under the repo between builds: the
# same commit can build clean on one host and ICE on another simply because the
# two resolved `nightly` on different days. That failure presents as a code bug
# and gets debugged as one. It also breaks release reproducibility, since the
# host that gates a release and the host that builds the artifact can disagree
# about what `nightly` means.
#
# nightly-2026-08-31 is the date standardised across this workspace. Bump it
# deliberately, as its own commit, after a green gate -- never by letting it
# float.
#
# This sentence named nightly-2026-08-25 until 2026-09-21, six days behind the
# `channel` two lines below it. Every OPERATIONAL value was already coherent --
# 46 files pin 08-31, including every workflow that installs a toolchain -- so
# nothing built wrong; only the sentence explaining the pin was stale. A
# constant that moves while the prose beside it does not is the same defect
# whichever direction it points, and it is worse in a rationale than in code,
# because the rationale is what the next person reads to decide whether the
# constant is still right.
#
# CHANGELOG.md:388 still says 08-25 and MUST KEEP SAYING IT: that entry records
# what was true at that release, which is the one place the old value belongs.
[toolchain]
channel = "nightly-2026-08-31"
components = ["rustfmt", "clippy"]
profile = "default"
