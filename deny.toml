# EE-012 — cargo-deny configuration for the forbidden-dependency audit.
#
# AGENTS.md mandates that the resolved dependency tree must exclude the
# crates listed below. The integration test in `tests/forbidden_deps.rs` is
# the load-bearing gate; this file lets contributors who already use
# `cargo-deny` (https://embarkstudios.github.io/cargo-deny) get the same
# signal locally with `cargo deny check bans`.
#
# Schema reference: https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html

[graph]
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

# Hard-rule forbidden crates. AGENTS.md `Forbidden Dependencies (Hard Rule,
# Audited By CI)`. Any crate listed here causes `cargo deny check bans` to
# fail.
deny = [
    { name = "tokio" },
    { name = "tokio-util" },
    { name = "async-std" },
    { name = "smol" },
    { name = "rusqlite" },
    { name = "sqlx" },
    { name = "diesel" },
    { name = "sea-orm" },
    { name = "petgraph" },
    { name = "hyper" },
    { name = "axum" },
    { name = "tower" },
    { name = "reqwest" },
]

[licenses]
# License posture is owned elsewhere; this file is scoped to `bans` only.
# Run `cargo deny check bans` (not `cargo deny check`) to use this config.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
# Gate mode (bd-2efax). `cargo deny check advisories` now FAILS the build on
# any open RustSec advisory (vulnerability / unmaintained / unsound) or yanked
# crate anywhere in the resolved tree — including the `fsqlite`/`frankensearch`
# path-dep stack and `serde_json`. Sigstore signing (release.yml) proves the
# binary's provenance; this gate proves the signed tree excluded known-CVE
# crates, closing the false-assurance gap reviewer-p2-r3 flagged.
#
# With `version = 2` the deprecated per-class severity fields are removed and
# every advisory class defaults to `deny`. Time-boxed exceptions go in
# `ignore` below with a RUSTSEC id + justification (and, ideally, an expiry
# date the ban-gate review revisits) — never a blanket downgrade.
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained (a maintenance advisory, not a
    # vulnerability; "no safe upgrade available"). It enters the tree purely
    # transitively via frankensearch -> frankensearch-embed -> tokenizers ->
    # paste and cannot be removed without dropping tokenizers from the embed
    # stack. Ignored to unblock the v0.4.0 release; revisit when tokenizers
    # drops its paste dependency.
    "RUSTSEC-2024-0436",
]
