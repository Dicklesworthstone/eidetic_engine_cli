# Performance budgets for ee benchmarks (eidetic_engine_cli-htjd)
#
# These values define the pass/fail thresholds for CI. Regressions beyond
# the specified percentages fail the bench job.
#
# Schema: ee.perf.budgets.v1
# Source: baselines/v0.1.json, README performance table

[meta]
schema = "ee.perf.budgets.v1"
version = "0.1.0"
regression_pct_p50 = 20   # Fail if p50 regresses > 20%
regression_pct_p99 = 50   # Fail if p99 regresses > 50%
budget_mode = "advisory"

[profiles.ci-smoke]
description = "Smallest RCH-friendly no-mock smoke profile for PR and agent closeout checks"
ci_suitability = "normal_ci"
workload_tier = "small"
benches = [
  "status",
  "cass_prefetch",
  "daemon_protocol",
  "daemon_dispatch",
  "daemon_round_trip",
  "pack_replay_freshness_smoke",
  "journal_capture_smoke",
]
sample_size = 10
measurement_time_secs = 0.5
release_blocking = false
advisory = true

[profiles.nightly]
description = "Broader nightly profile over all Criterion benchmark groups"
ci_suitability = "nightly_ci"
workload_tier = "medium"
benches = [
  "remember",
  "search",
  "context",
  "tiered_recall",
  "context_l2_warm",
  "context_arena_mode",
  "context_with_ppr",
  "pack_size",
  "why",
  "why_toon_token_count",
  "outcome",
  "status",
  "workspace_init",
  "audit_query",
  "index_rebuild",
  "concurrent_writes",
  "import_cass",
  "link",
  "graph_pagerank",
  "graph_ppr",
  "graph_louvain",
  "graph_ktruss",
  "graph_gomory_hu",
  "graph_hits",
  "graph_full_stack",
  "cass_prefetch",
  "daemon_protocol",
  "daemon_dispatch",
  "daemon_round_trip",
  "curate_candidates",
  "graph_refresh_cooperative",
]
sample_size = 20
measurement_time_secs = 2.0
release_blocking = false
advisory = true

[profiles.stress]
description = "Large-machine exploratory profile for 256GB+/64-core validation runs"
ci_suitability = "local_256gb"
workload_tier = "stress"
benches = [
  "remember",
  "search",
  "context",
  "tiered_recall",
  "context_l2_warm",
  "context_arena_mode",
  "context_with_ppr",
  "pack_size",
  "why",
  "why_toon_token_count",
  "outcome",
  "status",
  "workspace_init",
  "audit_query",
  "index_rebuild",
  "concurrent_writes",
  "import_cass",
  "link",
  "graph_pagerank",
  "graph_ppr",
  "graph_louvain",
  "graph_ktruss",
  "graph_gomory_hu",
  "graph_hits",
  "graph_full_stack",
  "cass_prefetch",
  "daemon_protocol",
  "daemon_dispatch",
  "daemon_round_trip",
  "curate_candidates",
  "graph_refresh_cooperative",
]
sample_size = 100
measurement_time_secs = 5.0
release_blocking = false
advisory = true

[operations.ee_remember]
p50_ms_max = 8.0
p99_ms_max = 22.0
description = "Store a new memory with indexing"

[operations.ee_search]
p50_ms_max = 38.0
p99_ms_max = 110.0
description = "Hybrid lexical+semantic search over 5k memories"

[operations.ee_context]
p50_ms_max = 95.0
p99_ms_max = 240.0
description = "Build 4k-token context pack; S4 resource-scale benchmark covers 1k/10k/100k memory fixtures"

[operations.ee_tiered_recall]
p50_ms_max = 140.0
p99_ms_max = 340.0
description = "Compare disabled and enabled tiered hot/warm/cold recall over the same context fixture; enabled path must preserve required cold evidence"

[operations.ee_context_with_ppr]
p50_ms_max = 125.0
p99_ms_max = 300.0
description = "Build 4k-token context pack with PPR rerank enabled on a 1k-memory graph; full-context deltas are diagnostic, while the 30ms PPR overhead budget applies to the instrumented pprRerank stage"

[operations.ee_context_s4_resource_scales]
