name: Resume coherent source snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/resume-coherence-20260919.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-coherence-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. This env var overrides the
      # action's install AT INVOCATION TIME, so the bare `rustfmt` later in this
      # job resolves through it and not through `toolchain:` below. Pinning only
      # the action installs rustfmt onto nightly-2026-08-31 and then runs
      # rustfmt from floating `nightly`, which does not have it:
      #   error: 'rustfmt' is not installed for the toolchain
      #          'nightly-x86_64-unknown-linux-gnu'
      # That is exactly what d315cdc7f did here. Before it both names read
      # `nightly` and the job worked by the two COINCIDING, not by design.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      # bd-niay4: `toolchain: nightly` is FLOATING and overrides
      # rust-toolchain.toml via RUSTUP_TOOLCHAIN. Pin it to the repo channel.
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            evidence-export-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Apply the complete reviewed source change against exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/core/resume.rs)" = 85a0e2d9d8d4bbcbe1edf2eeb0371179cc825b31
          test ! -e src/core/resume_snapshot.rs
          test ! -e src/core/resume_snapshot_tests.rs
          cat <<'PAYLOAD' | base64 --decode | xz --decompress > "$RUNNER_TEMP/resume.patch"
          
          PAYLOAD
          echo "0c03932fb257d6499d54129b48b0a6ec3471ced2d5731b09875d8a3fdad7a237  $RUNNER_TEMP/resume.patch" | sha256sum --check
          git apply --check --whitespace=error-all "$RUNNER_TEMP/resume.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/resume.patch"
          test "$(git hash-object src/core/resume.rs)" = bc0a57ae87a7d08f4a6ebf0d1ace385e1f4b7cee
          test "$(git hash-object src/core/resume_snapshot.rs)" = 1a3b66cb160cc1edbdcb110f6e9fbadea6b01bfc
          test "$(git hash-object src/core/resume_snapshot_tests.rs)" = 9a032f8451409d83c85fa4f02633cc4032e03815
          rustfmt --edition 2024 --config skip_children=true src/core/resume.rs src/core/resume_snapshot.rs src/core/resume_snapshot_tests.rs
          git diff --check
      - name: Prove real-writer snapshot coherence and existing resume behavior before source publication
        shell: bash
        run: |
          set -euo pipefail
          run_group() {
            local name="$1" filter="$2" count="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/resume-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/resume-$name.log"
            test "$status" -eq 0
            grep -Fq "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/resume-$name.log"
          }
          run_group snapshot core::resume::snapshot::tests 6
          run_group existing core::resume::tests 22
          paths=(src/core/resume.rs src/core/resume_snapshot.rs src/core/resume_snapshot_tests.rs)
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'fix(resume): assemble session state from one owned source snapshot' -m 'Pin workspace binding, memory bodies, session tags and canonical decision fields together. Release the read snapshot before projection and nearby discovery. Six real-database interleaving and lifetime regressions plus all 22 existing resume unit tests passed before publication. No policy or scope admission is relaxed.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git fetch origin main
            git diff --exit-code "$base" origin/main -- "${paths[@]}"
            git merge --no-edit origin/main
            run_group snapshot core::resume::snapshot::tests 6
            run_group existing core::resume::tests 22
            base=$(git rev-parse origin/main)
          done
          git rev-parse HEAD > "$RUNNER_TEMP/resume-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/resume-source.tar.gz"
      - name: Check all targets and production Clippy
        if: ${{ success() }}
        run: |
          failed=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/resume-check.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/resume-check.log"
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/resume-clippy.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/resume-clippy.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: resume-coherence-source-and-verification
          path: ${{ runner.temp }}/resume-*
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
