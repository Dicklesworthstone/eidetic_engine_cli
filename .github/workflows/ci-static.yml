name: CI Static

# bd-o7wh0. Hosted cargo-free gate that can actually execute while the three
# existing workflows (CI, Release, macOS EE Artifact) stay disabled_manually.
#
# Why a new workflow instead of enabling ci.yml:
# - ci.yml still has `on: push: branches: [main]` plus 90-minute cargo shards.
#   Enabling it during a 6-agent main swarm queues those shards against a
#   predicted-red tree (Windows handoff smoke, shard caps, integration_s_z).
# - GitHub disables workflows by id. This file is a new id, so it is not the
#   disabled trio and can run without flipping those three back on.
# - The cargo-free half of `verify` was re-measured green on 2026-09-17
#   (forbidden-deps, migration-registry, closure-lint, vision-coverage,
#   mcp_lib_tests --self-test, format, contract-drift-radar). Those are the
#   steps this job runs. cargo test stays on RCH until a green scratch run of
#   the full CI exists. Clippy runs in the separate `clippy` job below
#   (operator decision 2026-09-26).
#
# This job is the hosted system of record for those cheap invariants. It does
# not prove the Rust test suite. Do not read a green CI Static run as "CI is
# restored."

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # SCHEDULED SWEEP OF main HEAD — bd-fy92m.
  #
  # MEASURED 2026-09-20T00:31Z over a 6h window of origin/main:
  #     bot commits (github-actions[bot])   29 total,  0 with a CI Static run
  #     human commits                       74 total, 66 with a CI Static run
  # ZERO OF TWENTY-NINE. This workflow has no paths filter -- its push trigger
  # is `branches: [main]` -- so every push to main SHOULD run it. Bot pushes
  # never do.
  #
  # LIKELY CAUSE, STATED AS A HYPOTHESIS: GitHub does not trigger workflow runs
  # for pushes made with the default GITHUB_TOKEN, to prevent recursive loops.
  # Every one of the 24 workflows that pushes to main does so with that token
  # (`grep -rnE 'secrets\.[A-Z_]+'` over .github/workflows returns nothing but
  # GITHUB_TOKEN), so THERE IS NO CONTROL IN THIS REPO to test it against. The
  # 0-of-29 is measured; the token is inferred.
  #
  # WHY A SCHEDULE RATHER THAN A CREDENTIAL CHANGE: pushing with a PAT would
  # fix the trigger at its source, but needs a secret this lane cannot create,
  # and adding gates to all 24 delivery workflows multiplies the surface that
  # has to stay correct. A sweep of HEAD is one place, cannot be forgotten by
  # the next workflow author, and converts "ungated commits accumulate
  # invisibly" into "ungated commits are caught within the interval".
  #
  # WHAT IT DOES NOT DO: it does not gate a bot commit BEFORE it lands, and if
  # several land between sweeps only the newest HEAD is evaluated. The tree is
  # still checked -- a defect from an earlier unswept commit is present in HEAD
  # and fails here -- but attribution to the introducing commit is not restored.
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  # Push/PR: latest commit wins so a 6-agent swarm does not queue a stack of
  # franken-stack clones. workflow_dispatch: unique per run so a scratch proof
  # (bd-o7wh0) is not cancelled by the next push to main. The first push run
  # of this workflow (35221242320 on 548ef61d6) was cancelled that way.
  # SCHEDULE IS GROUPED LIKE workflow_dispatch, NOT LIKE push (bd-fy92m).
  #
  # The push/PR group keys on github.ref with cancel-in-progress, so the latest
  # commit wins. A scheduled sweep shares that ref, so under the old expression
  # the next push would CANCEL it -- and the sweep exists precisely to cover
  # commits whose own push never triggered a run. Losing it to a push is losing
  # the only coverage those commits get.
  #
  # This repo has already been bitten by exactly that: the header above records
  # run 35221242320 cancelled on 548ef61d6, which is why workflow_dispatch was
  # given a run_id-keyed group. Schedule needs the same treatment for the same
  # reason.
  # bd-i4t23: PUSH NOW KEYS ON github.sha, NOT github.ref. Keying every push to
  # main on the shared ref meant each push cancelled the previous commit's run,
  # so a commit's verdict depended on nobody pushing for the ~2.6 minutes it
  # takes. Measured 2026-09-20 over the last 100 runs: 45 cancelled, and ALL 45
  # were `push` -- zero from the dispatch/schedule arms above, which is the
  # evidence that those exemptions work and that the ref key was the whole
  # remaining problem.
  #
  # THE "LATEST COMMIT WINS" RATIONALE DID NOT SURVIVE MEASUREMENT. It assumed
  # queued runs stack up. They do not at this workflow's size: completed runs
  # take a median 2.6 min (p90 6.2) while pushes arrive a median 3.5 min apart,
  # so in the typical case a run finishes before the next push exists. What the
  # cancellation actually did was discard runs at a median of 2.0 min -- roughly
  # three quarters finished.
  #
  # AND THE LOSS WAS NOT EVENLY SPREAD. A burst cancels whatever is IN FLIGHT,
  # and after a red what is in flight is the FIX: 3a97fc839 (an fmt repair) and
  # ea8e9b0a5 (which contained it) were both cancelled, while the last completed
  # run predated both the break and the repair. So main showed a red whose fix
  # had already landed and could not be confirmed (bd-fy92m mechanisms B and C).
  #
  # cancel-in-progress stays TRUE: with a sha key it now cancels only a genuine
  # duplicate of the SAME commit (a re-push or re-run), which is what it was for.
  group: ci-static-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}

jobs:
  static:
    name: cargo-free static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Install nightly Rust
        # bd-niay4. `@nightly` here is the ACTION REF, not the toolchain. Without
        # an explicit `toolchain:` input the action installs a FLOATING nightly
        # and exports RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml --
        # so the repo's dated pin is silently defeated on the one gate that
        # blocks main. This run resolved rustc 1.100.0-nightly (2026-09-18)
        # against a pin of nightly-2026-08-31.
        #
        # The date is duplicated from rust-toolchain.toml rather than read from
        # it: this action takes the toolchain from its ref or this input and
        # does not consult the file. Six workflows in this repo already use this
        # exact form, so the duplication is the established convention here, not
        # a new one -- but it IS a second source of truth and it will drift.
        # Keep it equal to rust-toolchain.toml's `channel`.
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # bd-1idg3. ONE RED MUST NOT HIDE THE REST. Under the default `if:
      # success()`, the first failing gate SKIPS every step after it. Measured
      # 2026-09-22: four consecutive runs failed at "Action pins" (a stale
      # baseline row), and module reachability, Format and the include!-only fmt
      # checks were all `skipped`. For four runs the only hosted gate did not
      # check fmt, and nothing said so.
      #
      # So every gate below runs after an earlier gate FAILED, while the job
      # still concludes `failure` (no continue-on-error anywhere). Two
      # conditions stay in place, deliberately:
      #   - SETUP IS A PREREQUISITE. The steps above keep the default condition,
      #     and this marker runs only if all of them succeeded. A gate over a
      #     half-checked-out tree or a missing toolchain would be a verdict on
      #     garbage.
      #   - AN AUDIT STILL REQUIRES ITS OWN SELF-TEST. The self-test-first rule
      #     (bd-yytkz, bd-niay4, bd-uhml2) exists because a clean audit from an
      #     instrument whose failure arms are broken is worse than no audit. So
      #     each audit also requires its self-test's outcome to be `success`. A
      #     red in an UNRELATED gate no longer silences it.
      # Format depends only on setup. It does not consume module reachability's
      # output, and a reachability red is exactly when an fmt verdict on the
      # reached population is still wanted.
      - name: Setup complete
        id: setup
        run: echo "checkout, franken stack, toolchain and jq all succeeded"

      # Self-test BEFORE the audit, for the reason the pinned-definition steps
      # below already give: if the failure arms have stopped working, the audit
      # is a clean answer from a broken instrument. Both of these self-tests
      # existed and were invoked ONLY by scripts/verify.sh (:1260 and :1334),
      # so inside THIS job -- the one most people read -- these gates ran their
      # audit with their failure arms unexercised. They were never unguarded;
      # their guard ran somewhere else, and that distinction was invisible here.
      - name: Forbidden dependency guard --self-test
        id: forbidden_deps_self_test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/check-forbidden-deps.sh --self-test

      - name: Forbidden dependency audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.forbidden_deps_self_test.outcome == 'success' }}
        run: ./scripts/check-forbidden-deps.sh

      # bd-reality-core-convergence-1azkt.18 C4. deny.toml's [advisories]
      # (yanked = "deny"), [bans] and [sources] (unknown-registry and
      # unknown-git = "deny") were enforced only by ci.yml and release.yml,
      # and both are disabled_manually, so nothing that executes checked
      # them. bd-xz8jm's RUSTSEC-2026-0285 in rustls reached main that way.
      #
      # Two steps, as in ci.yml and release.yml: one red step should mean one
      # thing, and a bans or sources regression must not hide behind an
      # unrelated advisory. The schedule above re-checks an unchanged lock
      # against new advisories.
      #
      # This audit has no --self-test. Its failure arm was measured instead,
      # with cargo-deny 0.20.2 (the version this action commit bundles) and
      # --all-features (the action's default): on the lock before 71f8b12fd,
      # with everything else as at HEAD, `check advisories` exits 1 with only
      # RUSTSEC-2026-0285, and `check bans sources` exits 0. At HEAD both exit 0.
      #
      # `licenses` stays OFF: 35 upstream franken crates declare no license
      # field, and 10 more licenses need a policy ruling (see ci.yml).
      #
      # Pinned to the action's v2 COMMIT, not the annotated v2 tag object
      # (b66acf5e...) that release.yml pins; the commits API does not resolve
      # the tag object.
      - name: RustSec advisory audit (cargo-deny)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories

      - name: Ban and source audit (cargo-deny)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check bans sources

      - name: Migration registry co-commit invariant
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/check-migration-registry.sh

      - name: Closure linter
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/closure-lint.sh --audit --json

      - name: Vision coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          git fetch origin +main:refs/remotes/origin/main --depth=1
          sh ./scripts/vision-coverage.sh --json --compare-ref origin/main

      - name: MCP lib unit-test guard --self-test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/mcp_lib_tests.sh --self-test

      - name: Contract drift radar guard --self-test
        id: drift_radar_self_test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/contract-drift-radar.sh --self-test

      - name: Contract drift radar
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.drift_radar_self_test.outcome == 'success' }}
        run: ./scripts/contract-drift-radar.sh

      # bd-yytkz. Self-test FIRST and as its own step: if the guard's failure
      # arms have stopped working, the audit below is a clean answer from a
      # broken instrument, and a combined step would report that as one green.
      - name: Pinned definition guard --self-test
        id: pinned_definitions_self_test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/check-pinned-definitions.sh --self-test

      - name: Pinned definitions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.pinned_definitions_self_test.outcome == 'success' }}
        run: ./scripts/check-pinned-definitions.sh

      # bd-niay4. Self-test first, same reason as bd-yytkz above. This guard sits
      # immediately before Format on purpose: Format is the step whose verdict
      # depends on WHICH rustfmt ran, and this is the check that the toolchain
      # was chosen rather than resolved on the day.
      - name: Toolchain pin guard --self-test
        id: toolchain_pins_self_test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/check-toolchain-pins.sh --self-test

      - name: Toolchain pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.toolchain_pins_self_test.outcome == 'success' }}
        run: ./scripts/check-toolchain-pins.sh

      # bd-uhml2. SIBLING OF THE GUARD ABOVE, AND DELIBERATELY SEPARATE FROM IT.
      # check-toolchain-pins enforces the toolchain INPUT; this enforces the
      # ACTION REF. Its header is explicit that those are different things, and
      # a repo can be fully green on one while every action it runs is a
      # movable tag -- which was the measured state: 75 of 262 pinnable refs
      # pinned, 187 mutable, and release.yml the only fully pinned file of 43.
      # Self-test first, same reason as its sibling.
      - name: Action pin guard --self-test
        id: action_pins_self_test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 ./scripts/check-action-pins.py --self-test

      - name: Action pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.action_pins_self_test.outcome == 'success' }}
        run: python3 ./scripts/check-action-pins.py

      # bd-l6h3g. THIS MUST RUN BEFORE Format, NOT AFTER, AND THAT ORDER IS THE
      # WHOLE POINT. `cargo fmt --check` walks cargo targets and follows
      # mod/#[path] from each root, so a .rs file NO TARGET REACHES is reported
      # clean by definition -- and the same reachability decides what rustc
      # compiles. A green Format step over a population that silently excludes a
      # file is not evidence about that file. This gate establishes the
      # population first; Format then means something.
      #
      # The guard itself has existed since bd-l6h3g and was referenced by ZERO
      # workflows until now, so it has been failing on src/mcp_ask.rs since
      # 2026-09-18 with nobody to notice. A gate nothing runs is a file, not a
      # gate.
      - name: Module reachability guard --self-test
        id: mod_reachability_self_test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 scripts/lib/mod_reachability.py --self-test

      - name: Module reachability
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.mod_reachability_self_test.outcome == 'success' }}
        run: python3 scripts/lib/mod_reachability.py

      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo fmt --check

      # bd-39y21. `cargo fmt --check` above walks the module tree via `mod` and
      # `#[path]` and NEVER follows `include!`, so a file that is textually
      # inlined compiles but is invisible to it. Measured 2026-09-21:
      # src/cass/backfill_public_tests.rs carried 329 lines of rustfmt diff while
      # the step above exited 0.
      #
      # This step widens the POPULATION rather than re-checking what Format
      # already covers, and it consumes mod_reachability's own include!-only set
      # (--list-include-only) instead of re-deriving it, so the two cannot
      # disagree about what `include!` means.
      # bd-reality-core-convergence-1azkt.5 bullet 4. This grader decides the
      # test-level states verify.sh's "Unit, Contract, and Golden Tests" stage
      # now gates on -- ignored, zero and omitted tests, which cargo's exit code
      # cannot express. Its 15 self-test arms were invoked by NOTHING until this
      # step: a grader whose own control never runs is the defect it exists to
      # find, one level up.
      - name: Test-log grader --self-test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 scripts/lib/grade_test_log.py --self-test

      - name: Format (include!-only files) --self-test
        id: include_fmt_self_test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/check-include-fmt.sh --self-test

      - name: Format (include!-only files)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.include_fmt_self_test.outcome == 'success' }}
        run: ./scripts/check-include-fmt.sh

      # bd-reality-core-convergence-1azkt.7.1. The shipped-binary probe grades a
      # published archive against pre-registered expectations. The probe itself
      # needs a release archive and a Model2Vec cache, so it runs at release time
      # (.19), not here. What runs here is its grader's --self-test: every check
      # failing in isolation, an empty capture and a non-neural backend reading
      # as incomplete rather than pass, and a checksum mismatch refusing to
      # execute. Cargo-free, network-free.
      - name: Release binary probe --self-test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/release_binary_probe.sh --self-test

  # bd-ci-static-covers-no-cargo. Operator decision 2026-09-26: "Add clippy to
  # CI Static". The job above is cargo-free, and ci.yml is disabled_manually,
  # so NOTHING hosted compiled main. In the 24 hours before this job, three
  # pushes broke the build or the lint for every lane, and each red was found
  # hours later by a lane's own remote run:
  #   610aefc23  lib TEST build E0433 (Utc)          -> bd-scboh
  #   b970aa30e  lib TEST build E0599 (upsert_...)   -> bd-ql35o
  #   5d2934fa6  clippy::cloned_ref_to_slice_refs    -> bd-23wde
  # `clippy --all-targets -D warnings` fails on every one of them.
  #
  # A SEPARATE JOB, not steps in `static`: that job is deliberately cargo-free
  # with a 20-minute limit, and a cold all-targets build does not fit in it.
  #
  # BOUNDED COST. Pushes arrive minutes apart, and this job takes tens of
  # minutes. The workflow-level group is keyed per sha, so without a job-level
  # group every push would start its own build and they would pile up. This
  # group has NO cancel-in-progress: at most one run executes and one waits,
  # and a newer waiting run replaces the older one. Each verdict is for a
  # recent HEAD, never a stale queue, and the cost is about one runner.
  #
  # Every action is pinned to the commit sha release.yml already uses, so the
  # action-pin baseline for this file does not grow.
  clippy:
    name: clippy --all-targets -D warnings (compile + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: ci-static-clippy-${{ github.ref }}
      cancel-in-progress: false
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install nightly Rust with clippy
        # The same dated pin as the job above and rust-toolchain.toml
        # (bd-niay4): the action ref alone would float the toolchain.
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-static-clippy-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ci-static-clippy-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            ci-static-clippy-${{ runner.os }}-nightly-2026-08-31-

      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
