name: Exact memory time
on:
  push:
    branches: [main]
    paths:
      - 'src/db/memory_temporal*.rs'
      - 'src/db/mod.rs'
      - 'src/core/memory.rs'
      - 'src/core/memory_revision_typed.rs'
      - 'src/core/jsonl_import.rs'
      - '.github/workflows/exact-memory-time.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exact-memory-time-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture the exact committed lifecycle implementation
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/temporal-source-sha.log"
          grep -Fq 'mod memory_temporal;' src/db/mod.rs
          grep -Fq 'typed_revision.apply(&conn, &new_id)?;' src/core/memory.rs
          git archive --format=tar.gz --output="$RUNNER_TEMP/temporal-source.tar.gz" HEAD \
            src/db/mod.rs src/db/memory_temporal.rs src/db/memory_temporal_tests.rs \
            src/core/memory.rs src/core/memory_revision_typed.rs src/core/jsonl_import.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporal-source
          path: ${{ runner.temp }}/temporal-source*
          retention-days: 7
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: exact-time-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            exact-time-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            workspace-backup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            session-learning-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Exercise exact time and typed revision contracts
        run: |
          set -euo pipefail
          failed=0
          for group in db::memory_temporal::tests core::memory::revision_typed::tests; do
            log="$RUNNER_TEMP/temporal-${group//::/-}.log"
            if ! cargo test --locked --lib "$group" -- --test-threads=2 2>&1 | tee "$log"; then
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: temporal-db-results
          path: ${{ runner.temp }}/temporal-*.log
          retention-days: 7
      - name: Exercise existing import and revision contracts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          failed=0
          for group in core::jsonl_import::tests core::memory::tests::revise core::memory::tests::revision core::memory::tests::expire; do
            log="$RUNNER_TEMP/temporal-${group//::/-}.log"
            if ! cargo test --locked --lib "$group" -- --test-threads=2 2>&1 | tee "$log"; then
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: temporal-results
          path: ${{ runner.temp }}/temporal-*.log
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
