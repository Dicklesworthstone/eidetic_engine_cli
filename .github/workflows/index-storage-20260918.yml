name: Private index generations
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/index-private-staging.patch
      - .github/workflows/index-storage-20260918.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate reviewed private staging
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git apply --check scripts/delivery/index-private-staging.patch
          git apply scripts/delivery/index-private-staging.patch
          rustfmt --edition 2024 --config skip_children=true src/core/index.rs
          git diff --check
          git diff --stat
      - name: Compile production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/privacy-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/privacy-check.log"
          exit "$status"
      - name: Execute permissive-umask and publication privacy regressions
        run: |
          status=0
          cargo test --locked --lib core::index::private_staging_tests:: -- --nocapture > "$RUNNER_TEMP/privacy-tests.log" 2>&1 || status=$?
          tail -n 180 "$RUNNER_TEMP/privacy-tests.log"
          test "$status" -eq 0
          grep -Eq 'test result: ok\. 3 passed; 0 failed' "$RUNNER_TEMP/privacy-tests.log"
      - name: Commit tested private generation creation directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/index.rs
          git commit -m 'fix(index): create private generation directories before writing corpus data' -m 'On Unix create every new publication staging directory with owner-only mode 0700 atomically, independent of a permissive umask. Activation, retention and rollback preserve that mode through renames. Do not chmod existing operator parents or legacy generations; preserve symlink refusal and non-Unix behavior. Three regressions passed, including an isolated child under umask 000 and real publication, failed-commit quarantine and retention. Production library check passed before commit; the full index group is reported separately.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git fetch origin main
            git merge --no-edit origin/main
          done
          git rev-parse HEAD > "$RUNNER_TEMP/privacy-source-sha.log"
      - name: Execute complete index regression group
        run: |
          status=0
          timeout 20m cargo test --locked --lib core::index:: -- --test-threads=2 > "$RUNNER_TEMP/privacy-index.log" 2>&1 || status=$?
          tail -n 250 "$RUNNER_TEMP/privacy-index.log"
          test "$status" -eq 0
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/privacy-index.log"
      - name: Preserve exact source and logs
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/privacy-final-sha.log"
          git diff -- src/core/index.rs > "$RUNNER_TEMP/privacy-uncommitted.patch"
          cp src/core/index.rs "$RUNNER_TEMP/privacy-index.rs"
          cp src/core/index_storage.rs "$RUNNER_TEMP/privacy-storage.rs"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: index-private-storage-verification
          path: |
            ${{ runner.temp }}/privacy-*.log
            ${{ runner.temp }}/privacy-*.patch
            ${{ runner.temp }}/privacy-*.rs
          retention-days: 7
