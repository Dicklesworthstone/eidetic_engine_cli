name: Index storage admission
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/index-storage-admission.patch
      - .github/workflows/index-storage-20260918.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate reviewed storage admission
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git apply --check scripts/delivery/index-storage-admission.patch
          git apply scripts/delivery/index-storage-admission.patch
          rustfmt --edition 2024 --config skip_children=true src/core/index.rs src/core/index_storage.rs
          git diff --check
          git diff --stat
      - name: Compile production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/storage-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/storage-check.log"
          exit "$status"
      - name: Execute storage admission regressions
        run: |
          status=0
          cargo test --locked --lib core::index::storage::tests:: -- --nocapture > "$RUNNER_TEMP/storage-tests.log" 2>&1 || status=$?
          tail -n 180 "$RUNNER_TEMP/storage-tests.log"
          test "$status" -eq 0
          grep -Eq 'test result: ok\. 8 passed; 0 failed' "$RUNNER_TEMP/storage-tests.log"
      - name: Commit tested storage admission directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/index.rs src/core/index_storage.rs
          git commit -m 'feat(index): preflight generation storage before embedding and tier allocation' -m 'Measure source text, titles, serialized metadata and selected vector dimensions without duplicating the corpus. Refuse insufficient destination space or Unix inodes before tier writes, retaining a 64 MiB filesystem reserve and explicit actionable failures. Preserve current publication and rollback behavior. Eight resource, cancellation, path and real tier-build regressions passed with the production library check. This is an estimate, not a reservation or quota; concurrent external disk consumption can still cause I/O failure.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git fetch origin main
            git merge --no-edit origin/main
          done
          git rev-parse HEAD > "$RUNNER_TEMP/storage-source-sha.log"
      - name: Execute publication safety regressions
        run: |
          status=0
          cargo test --locked --lib core::index::tests::publication_ -- --nocapture > "$RUNNER_TEMP/storage-publication.log" 2>&1 || status=$?
          tail -n 180 "$RUNNER_TEMP/storage-publication.log"
          test "$status" -eq 0
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/storage-publication.log"
      - name: Preserve exact source and logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/storage-source"
          git rev-parse HEAD > "$RUNNER_TEMP/storage-source/source-sha.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/storage-source/source.tar.gz" HEAD
          git diff -- src/core/index.rs src/core/index_storage.rs > "$RUNNER_TEMP/storage-uncommitted.patch"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: index-storage-verification
          path: |
            ${{ runner.temp }}/storage-*.log
            ${{ runner.temp }}/storage-*.patch
            ${{ runner.temp }}/storage-source/
          retention-days: 7
