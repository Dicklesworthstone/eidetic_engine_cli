name: Doctor repair receipts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/doctor-repair-receipts.yml
      - scripts/delivery/doctor-index-rebuild.patch
      - src/core/doctor_index_repair.rs
      - src/core/index_doctor_repair.rs

permissions:
  contents: write

concurrency:
  group: doctor-repair-receipts
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: doctor-receipts-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            doctor-receipts-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            doctor-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate actual repair with current advisory dispatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/doctor-receipts"
          git rev-parse HEAD > "$RUNNER_TEMP/doctor-receipts/source-sha.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/doctor-receipts/committed-source.tar.gz" HEAD
          # 3e87240 already delivered the missing-index identity and truthful
          # per-fixer guidance labels. Preserve that implementation and its
          # tests instead of reapplying the superseded receipt draft.
          grep -q 'fn fix_search_index_missing' src/core/doctor_fixers.rs
          grep -q 'guidanceOnlyFixerCount' src/cli/mod.rs
          if ! grep -q 'mod index_repair;' src/core/doctor_runtime.rs; then
            git apply --check scripts/delivery/doctor-index-rebuild.patch
            git apply scripts/delivery/doctor-index-rebuild.patch
          fi
          grep -q 'mod source_snapshot;' src/core/index.rs
          rustfmt --edition 2024 --config skip_children=true src/cli/mod.rs src/core/doctor_fixers.rs src/core/doctor_runtime.rs src/core/index.rs src/core/doctor_index_repair.rs src/core/index_doctor_repair.rs
          git diff --check
          git diff > "$RUNNER_TEMP/doctor-receipts/source.patch"
      - name: Test actual builds, source preservation, undo and CLI dispatch
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib core::doctor_runtime::index_repair::tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/doctor-receipts/index-repair.log"
          grep -Eq 'test result: ok\. 5 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/doctor-receipts/index-repair.log"
          cargo test --locked --lib core::doctor_fixers::tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/doctor-receipts/dispatch.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/doctor-receipts/dispatch.log"
          cargo test --locked --lib core::doctor_runtime::tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/doctor-receipts/runtime.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/doctor-receipts/runtime.log"
          cargo test --locked --lib cli::tests::doctor_fix_ -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/doctor-receipts/cli.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/doctor-receipts/cli.log"
      - name: Commit tested implementation directly to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch origin main
          base=$(cat "$RUNNER_TEMP/doctor-receipts/source-sha.txt")
          paths=(src/cli/mod.rs src/core/doctor_fixers.rs src/core/doctor_runtime.rs src/core/index.rs src/core/doctor_index_repair.rs src/core/index_doctor_repair.rs)
          git diff --exit-code "$base" origin/main -- "${paths[@]}"
          git merge --ff-only origin/main
          cargo test --locked --lib core::doctor_runtime::index_repair::tests:: -- --test-threads=1
          cargo test --locked --lib cli::tests::doctor_fix_ -- --test-threads=1
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(doctor): rebuild damaged indexes with source-preserving audited undo' -m 'Build the canonical corpus through a read-only snapshot, validate every tier off-path, fence readers and publishers, and publish the admission marker last. Journal every real file mutation with existing hash-checked backups; undo holds the same generation lease. Preserve the current missing-index identity and advisory-guidance contracts. Actual build, source-byte, undo, safety and CLI regression tests passed before this normal main push.'
            git push origin HEAD:main
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/doctor-receipts/integrated-sha.txt"
      - name: Exercise the unchanged real missing-index fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin ee
          export EE_DOCTOR_FIXTURE_BINARY="$PWD/target/debug/ee"
          export EE_DOCTOR_FIXTURE_TARGET="$RUNNER_TEMP/doctor-receipts/real-missing-index"
          export EE_DOCTOR_FIXTURE_RUN_EE=1
          bash tests/doctor_fixtures/fm-search_indexes-index_missing/corrupt.sh 2>&1 | tee "$RUNNER_TEMP/doctor-receipts/fixture-corrupt.log"
          bash tests/doctor_fixtures/fm-search_indexes-index_missing/assert.sh 2>&1 | tee "$RUNNER_TEMP/doctor-receipts/fixture-roundtrip.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: doctor-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/doctor-receipts/
          retention-days: 7
          include-hidden-files: true
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
