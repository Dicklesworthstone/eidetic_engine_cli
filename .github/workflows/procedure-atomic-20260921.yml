name: Atomic procedure learning delivery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/procedure-atomic-20260921.yml
      - scripts/delivery/procedure-atomic-20260921.py
      - scripts/delivery/procedure-atomic-20260921-tests.txt
permissions:
  contents: read
concurrency:
  group: procedure-atomic-delivery-20260921-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Apply exact reviewed changes and parse edited Rust units
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/delivery/procedure-atomic-20260921.py)" = '189e9e5428ae8c51e94dae90877f479f2de551ac'
          test "$(git hash-object scripts/delivery/procedure-atomic-20260921-tests.txt)" = '0d74255dbf79c4f3893b4272e453446592703736'
          python3 scripts/delivery/procedure-atomic-20260921.py
          git diff --check
          git diff --stat
      - name: Commit all three source changes directly to main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(src/db/mod.rs src/core/outcome.rs src/core/outcome_procedure_atomic_tests.rs)
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'fix(outcome): commit procedure scoring and feedback evidence atomically' -m 'Apply procedure counters, confidence, utility and retirement history in the feedback/audit transaction and write-intake fence. Retain the standalone transactional API and expose a caller-owned variant to avoid nested BEGIN. Recheck procedure ownership inside the transaction; preserve signal aliases, weights, neutral behavior, dry-run and quarantine. Add nine real-store rollback, same-ID retry, retirement, scope and API regressions. Exact source hashes, edited-unit nightly rustfmt parsing and git diff checks passed before publication. Rust compilation and runtime results are not claimed by this commit; the separate read-only job exercises them.'
          header=$(python3 -c 'import base64,os; print(base64.b64encode(("x-access-token:" + os.environ["GH_TOKEN"]).encode()).decode())')
          echo "::add-mask::$header"
          for attempt in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:main; then
              echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "$attempt" -lt 3
            git fetch origin main
            git diff --exit-code "$base" origin/main -- "${paths[@]}"
            git merge --no-edit origin/main
            base=$(git rev-parse origin/main)
          done
  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require the published learning changes on current main
        env:
          PUBLISHED_SOURCE: ${{ needs.publish.outputs.source }}
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/procedure-atomic-source.log"
          git merge-base --is-ancestor "$PUBLISHED_SOURCE" HEAD
          git diff --exit-code "$PUBLISHED_SOURCE" HEAD -- src/db/mod.rs src/core/outcome.rs src/core/outcome_procedure_atomic_tests.rs Cargo.toml Cargo.lock rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Run nine procedure atomicity regressions
        run: |
          set -euo pipefail
          cargo test --locked --lib core::outcome::procedure_atomic_tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/procedure-atomic-tests.log"
          grep -Fq 'test result: ok. 9 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/procedure-atomic-tests.log"
      - name: Preserve existing atomic memory learning behavior
        run: |
          set -euo pipefail
          cargo test --locked --lib core::outcome::atomic_learning_tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/procedure-atomic-memory.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/procedure-atomic-memory.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: procedure-atomic-source-and-verification
          path: ${{ runner.temp }}/procedure-atomic-*.log
          retention-days: 7
