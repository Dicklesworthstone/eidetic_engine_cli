          assert set(payload["replacements"]) == set(EXPECTED)
          assert set(payload["newFiles"]) == {new_path}
          paths = [*EXPECTED, new_path]

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          assert git("branch", "--show-current") == "main", "not the main checkout"
          assert not git("status", "--porcelain", "--", *paths), "targeted files are dirty"
          assert not pathlib.Path(new_path).exists(), "test module already exists"
          original = {}
          for name, expected in EXPECTED.items():
              path = pathlib.Path(name)
              assert not any(part.is_symlink() for part in (path, *path.parents)), name
              content = path.read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()
              assert actual == expected, "source changed; review required: " + name
              original[name] = content.decode("utf-8")
          assert not any(part.is_symlink() for part in (pathlib.Path(new_path), *pathlib.Path(new_path).parents))

          def formatted(text):
              # Format isolated edited Rust units, not the multi-megabyte DB module or
              # unrelated existing code. Parsing is not compilation or runtime proof.
              command = ["rustfmt", "--edition", "2024", "--config", "skip_children=true", "--emit", "stdout"]
              result = subprocess.run(command, input=text, text=True, capture_output=True, check=True)
              checked = subprocess.run(command, input=result.stdout, text=True, capture_output=True, check=True)
              assert checked.stdout == result.stdout, "changed Rust unit is not format-stable"
              return result.stdout

          db_edit = payload["replacements"]["src/db/mod.rs"][0]
          wrapper = "impl DbConnection {\n"
          formatted_db = formatted(wrapper + db_edit["new"] + "}\n")
          assert formatted_db.startswith(wrapper) and formatted_db.endswith("}\n")
          db_edit["new"] = formatted_db[len(wrapper):-2]
          helper_edit = payload["replacements"]["src/core/outcome.rs"][2]
          assert helper_edit["new"].endswith(helper_edit["old"])
          helper = helper_edit["new"][:-len(helper_edit["old"])]
          helper_edit["new"] = formatted(helper).rstrip() + "\n\n" + helper_edit["old"]
          new_content = formatted(payload["newFiles"][new_path])
          assert new_content.count("#[test]") == 9 and "#[ignore" not in new_content
          planned = {}
          for name, edits in payload["replacements"].items():
              text = original[name]
              for edit in edits:
                  assert edit["old"] and text.count(edit["old"]) == 1, "source fragment changed: " + name
                  text = text.replace(edit["old"], edit["new"], 1)
              planned[name] = text
          planned[new_path] = new_content
          # Validate all three files before writing any; no deletion or branch switch.
          for name, text in planned.items():
              pathlib.Path(name).write_text(text, encoding="utf-8")
              print("APPLIED", name, hashlib.sha256(text.encode()).hexdigest())
          pathlib.Path(os.environ["RUNNER_TEMP"], "procedure-atomic-payload.sha256").write_text(PAYLOAD_SHA256 + "\n")
          PY
          git diff --check
          git diff --stat
      - name: Commit all three source changes directly to main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(src/db/mod.rs src/core/outcome.rs src/core/outcome_procedure_atomic_tests.rs)
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'fix(outcome): commit procedure scoring and feedback evidence atomically' -m 'Apply procedure counters, confidence, utility and retirement history in the feedback/audit transaction and write-intake fence. Retain the standalone transactional API and expose a caller-owned variant to avoid nested BEGIN. Recheck procedure ownership inside the transaction; preserve signal aliases, weights, neutral behavior, dry-run and quarantine. Add nine real-store rollback, same-ID retry, retirement, scope and API regressions. Exact source hashes, edited-unit nightly rustfmt parsing and git diff checks passed before publication. Rust compilation and runtime results are not claimed by this commit; the separate read-only job exercises them.'
          header=$(python3 -c 'import base64,os; print(base64.b64encode(("x-access-token:" + os.environ["GH_TOKEN"]).encode()).decode())')
          echo "::add-mask::$header"
          for attempt in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:main; then
              echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "$attempt" -lt 3
            git fetch origin main
            git diff --exit-code "$base" origin/main -- "${paths[@]}"
            git merge --no-edit origin/main
            base=$(git rev-parse origin/main)
          done
  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact published source before verification
        env:
          PUBLISHED_SOURCE: ${{ needs.publish.outputs.source }}
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/procedure-atomic-source.log"
          test "$(git rev-parse HEAD)" = "$PUBLISHED_SOURCE"
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Run nine procedure atomicity regressions
        run: |
          set -euo pipefail
          cargo test --locked --lib core::outcome::procedure_atomic_tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/procedure-atomic-tests.log"
          grep -Fq 'test result: ok. 9 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/procedure-atomic-tests.log"
      - name: Preserve existing atomic memory learning behavior
        run: |
          set -euo pipefail
          cargo test --locked --lib core::outcome::atomic_learning_tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/procedure-atomic-memory.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/procedure-atomic-memory.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: procedure-atomic-source-and-verification
          path: ${{ runner.temp }}/procedure-atomic-*.log
          retention-days: 7
