name: Verify recorded and operational recovery boundaries
on:
  push:
    branches: [main]
    paths:
      - 'src/core/backup*.rs'
      - 'src/db/**'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: recorded-provenance-recovery-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: recorded-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            recorded-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            operational-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Compile every target
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/recorded-identity.log"
          timeout 25m cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/recorded-check.log"
      - name: Execute real-store corruption, repeated recovery and consumers
        run: |
          set -euo pipefail
          failed=0
          # FLOOR, NOT AN EXACT COUNT (bd-n47uq: gate-maintenance drift, not product).
          #
          # This matched `test result: ok. $2 passed; 0 failed; 0 ignored;` as a LITERAL, so it
          # failed the moment anyone ADDED a test. On 2026-10-06 that is exactly what happened:
          # core::backup::recovery::history::operational::tests grew from the reviewed 9 to 11
          # (the two newest operational_fence_* arms), all 11 PASSED, and this step still
          # reported INVALID TEST INVENTORY and exited 1. Every one of the eleven groups in this
          # step carried the same trap, so one added test anywhere reds a lane whose suite is
          # green -- and the green `test result: ok.` lines were sitting in the same log.
          #
          # The property worth gating is "at least the reviewed inventory ran and NOTHING
          # failed", so $2 is now a floor. `0 failed; 0 ignored;` stays inside the matched
          # pattern, so a run with any failure or any ignored test cannot satisfy the floor, and
          # an absent line is treated as failure rather than as zero. The observed count is
          # printed on BOTH paths, so growth stays visible to a reader without reding the lane
          # and a shortfall names its own numbers instead of leaving them to be counted by hand.
          group() {
            local actual=""
            if ! timeout 25m cargo test --locked --lib "$1" -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/recorded-$3.log"; then
              echo "FAILED: $3" | tee -a "$RUNNER_TEMP/recorded-summary.log"
              failed=1
              return
            fi
            actual=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored;.*/\1/p' "$RUNNER_TEMP/recorded-$3.log" | head -1)
            if test -z "$actual" || test "$actual" -lt "$2"; then
              echo "INVALID TEST INVENTORY: $3 -- passing-with-zero-failures count '${actual:-none}', required floor $2" | tee -a "$RUNNER_TEMP/recorded-summary.log"
              failed=1
            else
              echo "PASS: $3 ($actual tests ran, floor $2)" | tee -a "$RUNNER_TEMP/recorded-summary.log"
            fi
          }
          group core::backup::recovery_faults 1 fault-control
          group core::backup::recovery::history::tests 3 rows
          group core::backup::tests::recovery_rejects_ 6 corruption
          group core::backup::tests::recorded_recovery_survives_rebackup_without_changing_failed_evidence 1 recorded-roundtrip
          group core::backup::tests::provenance_recovery_survives_rebackup_without_rejudging_evidence 1 provenance-roundtrip
          group core::backup::tests::default_backup_restores_recorded_history_and_live_consumers 1 recorded-consumers
          group core::backup::tests::default_backup_restores_error_recall_and_live_diagnosis 1 diagnosis
          group core::backup::recovery::history::operational::tests 9 operational
          group core::backup::recovery::history::imports::tests 7 imports
          group core::backup::tests::default_backup_restores_import_checkpoints_and_reopens_same_source 1 import-continuation
          group core::backup::recovery::tests 15 inventory
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: recorded-provenance-results
          path: ${{ runner.temp }}/recorded-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
