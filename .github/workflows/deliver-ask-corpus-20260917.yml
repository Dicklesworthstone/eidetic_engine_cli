name: Deliver current ask corpus

# Bounded main-only integration of the reviewed source patch.
# Retire after observing the source commit; never opens a PR or force-pushes.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deliver-ask-corpus-20260917.yml
      - scripts/delivery/ask-current-corpus-20260917.patch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deliver-ask-corpus-20260917
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          clean: false
      - name: Integrate current-memory admission
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          patch=scripts/delivery/ask-current-corpus-20260917.patch
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo 'Current-memory admission is already integrated.'
            exit 0
          fi
          git apply --check "$patch"
          git apply "$patch"
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustfmt +nightly --edition 2024 --config skip_children=true src/core/ask_corpus.rs src/core/ask_corpus_tests.rs tests/contracts/ask_lifecycle.rs
          rustfmt +nightly --edition 2024 --config skip_children=true --emit stdout src/core/ask.rs >/dev/null
          rustfmt +nightly --edition 2024 --config skip_children=true --emit stdout src/cli/mod.rs >/dev/null
          rustfmt +nightly --edition 2024 --config skip_children=true --emit stdout tests/contracts/audit_event_coverage.rs >/dev/null
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/ask.rs src/core/ask_corpus.rs src/core/ask_corpus_tests.rs src/cli/mod.rs tests/contracts/audit_event_coverage.rs tests/contracts/ask_lifecycle.rs
          git commit -m 'fix(ask): exclude expired and future evidence before all answer paths' -m 'Connect the current-corpus loader to the public CLI. Preserve active citations and links, withhold invalid validity metadata, and register real-store and public-CLI regressions. Nightly Rustfmt parsed the integration; compilation and behavioral tests are not claimed by this delivery step.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              printf 'Delivered source commit: '
              git rev-parse HEAD
              exit 0
            fi
            git fetch --unshallow origin main 2>/dev/null || git fetch origin main
            git merge --no-edit origin/main
          done
          exit 1
