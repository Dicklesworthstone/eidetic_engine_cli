name: Core source handoff

on:
  push:
    branches: [main]
    paths: [.github/workflows/deliver-ask-corpus-20260917.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Package tracked source and task inventory
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/source.tar.gz"
          python3 - <<'PY'
          import json
          from collections import Counter
          rows = [json.loads(line) for line in open('.beads/issues.jsonl') if line.strip()]
          print('STATUS COUNTS', dict(Counter(row.get('status') for row in rows)))
          for row in rows:
              if row.get('status') in ('open', 'in_progress') and (row.get('priority', 9) <= 1 or row['id'].startswith('bd-reality-core-convergence-1azkt')):
                  print(json.dumps({k: row.get(k) for k in ('id','title','status','assignee','priority')}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: core-source
          path: |
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
