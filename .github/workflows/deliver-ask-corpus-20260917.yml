name: Ask delivery (retired)

# Production integrations committed directly to main without PRs or force pushes:
# d40e84b4daf5757a45411e3dc4fd822c6565ca40 - complete scoped counterevidence
# 0ceafad1dbd578107c024606c6f52c996a2d05c1 - exact sparse span clustering
# d71032d6a62ca2c8b775fdf10b3ef20080b20557 - current evidence in the public CLI
# ae2397d4105d5ffd0b7a58d876ff0dfa8d18e82d - coherent memory/link read snapshot
# Lifecycle integration run 35264710898 passed its nightly Rustfmt checks.
# Verification attempt 35265617837 separately records compiler/test outcomes.
# A delivery commit is not a compilation or behavioral-test pass.
# Retirement prevents new automatic runs; it does not cancel an existing run.
on:
  workflow_dispatch:
permissions: {}
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'This one-time delivery is retired.'
