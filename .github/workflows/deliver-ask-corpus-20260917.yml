name: Atomic peer enrollment

on:
  push:
    branches: [main]
    paths: [.github/workflows/deliver-ask-corpus-20260917.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deliver-atomic-peers-20260917
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.deliver.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          clean: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - id: deliver
        shell: bash
        run: |
          set -euo pipefail
          patch=scripts/delivery/mesh-enrollment-write-20260917.patch
          git apply --check "$patch"
          git apply "$patch"
          rustfmt +nightly --edition 2024 --config skip_children=true src/cli/mesh_auto_enrollment_write.rs src/cli/mesh_auto_enrollment_write_tests.rs src/cli/mesh.rs
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli/mesh_auto_enrollment_write.rs src/cli/mesh_auto_enrollment_write_tests.rs src/cli/mesh.rs
          git commit -m 'fix(mesh): atomically recheck and materialize peer enrollment' -m 'Reject stale discovery snapshots before override or peer writes, validate authoritative transport bindings, and preserve migrated manual principals without overriding explicit revocation. Peer writes and consent invalidation share one transaction, with 11 real-store regressions including rollback and concurrent revocation. Rustfmt parsing passed; compiler and test outcomes are separate.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --unshallow origin main 2>/dev/null || git fetch origin main
            git merge --no-edit origin/main
          done
          exit 1
  verify:
    needs: deliver
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deliver.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Exact source identity
        run: |
          git rev-parse HEAD
          git status --porcelain
          rustc --version --verbose
      - name: Compile production library
        run: cargo check --locked --lib
      - name: Execute stable peer regressions
        run: |
          cargo test --locked --lib cli::mesh::peer_identity:: -- --nocapture
      - name: Execute atomic enrollment regressions
        run: |
          cargo test --locked --lib cli::mesh::auto_enrollment_write:: -- --nocapture
      - name: Execute existing enrollment regressions
        run: cargo test --locked --lib auto_enrollment -- --nocapture
