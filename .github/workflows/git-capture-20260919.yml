name: Git capture completeness
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/git-capture-completeness-20260919/**
      - .github/workflows/git-capture-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-capture-security
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Retain exact starting source
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/capture-base-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/capture-base.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capture-base-source
          path: ${{ runner.temp }}/capture-base*
          retention-days: 7
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: capture-complete-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            capture-complete-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            capture-security-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            journal-ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Apply preserved capture increments and execute real Rust regressions
        run: |
          set -euo pipefail
          paths=(src/core/memory.rs src/core/memory_git_capture_repo.rs src/core/memory_git_capture_repo_tests.rs src/core/memory_git_capture_identity_tests.rs src/core/memory_git_capture_security_tests.rs)
          if ! git ls-files --error-unmatch src/core/memory_git_capture_identity_tests.rs >/dev/null 2>&1; then
            xz -dc scripts/delivery/git-capture-completeness-20260919/01.patch.xz > "$RUNNER_TEMP/01.patch"
            xz -dc scripts/delivery/git-capture-completeness-20260919/02.patch.xz > "$RUNNER_TEMP/02.patch"
            echo "2dce61606816ef64a149b81bc98f4009c4a227bda1805543c100b9265348bbf9  $RUNNER_TEMP/01.patch" | sha256sum -c
            echo "ee2562b7e05f5a6c0478b077f14817dabc0360596ffa1e964da6ba637e45713b  $RUNNER_TEMP/02.patch" | sha256sum -c
            for n in 01 02; do
              git apply --check --whitespace=error-all "$RUNNER_TEMP/$n.patch"
              git apply "$RUNNER_TEMP/$n.patch"
            done
          fi
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          git diff --check
          run_group() {
            local name="$1" filter="$2" expected="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/capture-$name.log" 2>&1 || status=$?
            tail -n 120 "$RUNNER_TEMP/capture-$name.log"
            test "$status" -eq 0
            grep -Fq "test result: ok. $expected passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/capture-$name.log"
          }
          run_group repository core::memory::git_capture_repo::tests 15
          run_group identity core::memory::git_capture_identity_tests 7
          run_group security core::memory::git_capture_security_tests 11
          run_group policy policy::git_capture_redaction_tests 7
          run_group existing core::memory::tests::remember_git_capture 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "${paths[@]}" || test -n "$(git ls-files --others --exclude-standard -- "${paths[@]}")"; then
            base=$(git rev-parse HEAD)
            git add -- "${paths[@]}"
            git commit -m 'feat(capture): collect complete Git changes and fingerprint all sanitized evidence' -m 'Capture staged and unstaged tracked content before the first commit, root and first-parent merge deltas, and pinned revision ranges from one NUL-framed comparison. Preserve exact paths, reject conflicts and missing shallow ancestry, and disable external diff/textconv. Fingerprint the complete sanitized diff while presenting bounded excerpts and only complete visible symbol anchors. Reconciles the two preserved local increments, repairs their missing delimiter, and passes all 44 real Rust capture regressions before publication.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch --deepen=100 origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/capture-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/capture-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: capture-source-and-tests
          path: ${{ runner.temp }}/capture-*
          retention-days: 7
      - name: Check all targets and strict Clippy
        if: ${{ !cancelled() }}
        run: |
          failed=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/capture-check.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/capture-check.log"
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/capture-clippy.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/capture-clippy.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: capture-verification
          path: ${{ runner.temp }}/capture-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: capture-complete-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
