# Apply the two immutable, reviewed source patches in separate main commits.
# Source publication performs syntax/format checks; behavioral verification is
# deliberately separate and must never be inferred from publication success.
name: Index source generation admission
on:
  push:
    branches: [main]
    paths: [.github/workflows/index-generation-admission-20260925.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: index-generation-admission-20260925
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install the repository-pinned Rust formatter
        run: |
          set -euo pipefail
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          case "$channel" in nightly|nightly-*) ;; *) exit 1 ;; esac
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
          fi
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Recover the submitted hand-authored patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess
          path = '.github/workflows/index-generation-admission-20260925.yml'
          for number, revision in [(1, 'e6e423da6da30e6c3d3cfd34b9c33f6e5db5032e'), (2, 'e8fcfe914f8d4cfe6fc8b9ae5d4bb7ff400198d1')]:
              text = subprocess.check_output(['git', 'show', f'{revision}:{path}'], text=True)
              assert text.count("<<'PATCH'\n") == 1
              body = text.split("<<'PATCH'\n", 1)[1].split('          PATCH\n', 1)[0]
              lines = body.splitlines(keepends=True)
              assert all(line.startswith('          ') for line in lines)
              patch = ''.join(line[10:] for line in lines)
              assert patch.startswith('diff --git a/src/core/index.rs b/src/core/index.rs\n')
              pathlib.Path(os.environ['RUNNER_TEMP'], f'generation-stage{number}.patch').write_text(patch)
          PY
      - name: Publish strict admission and bounded recovery as separate source commits
        id: publish
        run: |
          set -euo pipefail
          paths=(src/core/index.rs src/core/index_generation_watermark.rs)
          # bd-aav0v: these two guards were BARE `test` commands under `set -euo pipefail`,
          # so either one aborted the step with NO OUTPUT AT ALL. This lane fails in eight
          # milliseconds -- step start 03:07:09.9692624Z, error 03:07:09.9770461Z in run
          # 37559823155 -- with an empty log and the whole verify job skipped.
          #
          # The first guard is CORRECT AND WORKING. `test ! -f` means "refuse to deliver if
          # the file is already present"; it IS present (450 lines, 14 #[test], mounted at
          # src/core/index.rs:69 via #[path]), so the feature is delivered and the guard fires
          # exactly as designed. Being a bare `test`, its only way to say "already delivered,
          # nothing to do" was a bare nonzero exit, which renders as a red lane with no log.
          #
          # THE TWO GUARDS NOW END DIFFERENTLY, and the difference is the point. Whether an
          # already-delivered lane should succeed rather than refuse was an owner's call,
          # because it changes what this lane PUBLISHES; it was decided on 2026-10-07 in
          # favour of succeeding, following 4372cef4a. So:
          #   already delivered  -> exit 0, nothing to apply, verify still runs (see below)
          #   blob pin stale     -> exit 1, a real "cannot deliver against this tree"
          # Both still say which guard stopped the lane and why, which is what the empty
          # 8ms failure could not do.
          if test -f src/core/index_generation_watermark.rs; then
            # bd-aav0v / bd-...hpgw8: ALREADY DELIVERED IS A SUCCESS, NOT A REFUSAL.
            #
            # This guard means the file is present, so the delivery landed by some route and
            # there is nothing to apply. It used to abort -- first silently, then (after
            # 6ea8c48c3) with a message -- which displayed a permanent red for a feature that
            # is in the tree. Operator decision 2026-10-07: an already-delivered lane should
            # succeed.
            #
            # Exiting 0 here is deliberate and bounded. The `verify` job `needs: integrate`,
            # so it still runs and still executes the fourteen admission regressions against
            # the delivered source; this skips only the APPLY and the PUSH, which have nothing
            # left to do. The lane's purpose -- the feature is on main and verified -- is
            # satisfied on this path, which is the same reasoning as 4372cef4a for
            # verify-ask-admission.
            #
            # The blob pin below keeps `exit 1`. "Cannot deliver against an unrecognised tree"
            # is a real refusal and is not what this branch covers.
            echo "ATTRIBUTION: delivery ALREADY PRESENT -- src/core/index_generation_watermark.rs exists, so there is nothing to apply or push. Succeeding rather than refusing: the verify job still runs the admission regressions against the delivered source, so 'on main and verified' both hold. Skipped: the patch apply and the push."
            exit 0
          fi
          actual_index_blob=$(git rev-parse HEAD:src/core/index.rs)
          if test "$actual_index_blob" != c09fb551d055c1fe90cdbbe63d0c7d1952ca8518; then
            echo "ATTRIBUTION: guard 'src/core/index.rs blob pin' STOPPED this lane -- expected c09fb551d055c1fe90cdbbe63d0c7d1952ca8518, found $actual_index_blob. The file has changed since this delivery was authored, so its patch is no longer known to apply."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          push_source() {
            local pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
            # bd-aav0v: a BARE `test` under errexit, inside a helper. It means EVERY push
            # attempt failed, which is a completely different situation from a failing test --
            # the verification may have passed and only PUBLICATION failed. Silently the two
            # are indistinguishable. `return 1` from a bare call still trips errexit, so the
            # hard stop is preserved exactly.
            if test "$pushed" -ne 1; then
              echo "ATTRIBUTION: PUBLICATION FAILED, not verification -- all 3 'git push origin HEAD:main' attempts were rejected, each followed by a fetch/merge onto the new origin/main. The work above was prepared and its checks ran; nothing reached main. Re-running the lane is the remedy, not changing the source."
              return 1
            fi
          }
          base=$(git rev-parse HEAD)
          echo "$base" | tee "$RUNNER_TEMP/generation-stage1-base.log"
          git apply --recount --check "$RUNNER_TEMP/generation-stage1.patch"
          git apply --recount "$RUNNER_TEMP/generation-stage1.patch"
          cat > "$RUNNER_TEMP/generation-fixture.patch" <<'PATCH'
          diff --git a/src/core/index_generation_watermark.rs b/src/core/index_generation_watermark.rs
          --- a/src/core/index_generation_watermark.rs
          +++ b/src/core/index_generation_watermark.rs
          @@ -169,5 +169,10 @@
                   ).map_err(|error| error.to_string())?;
                   match damage {
          -            "missing" => { metadata.as_object_mut().expect("manifest").remove("sourceGeneration"); }
          +            "missing" => {
          +                let object = metadata.as_object_mut().expect("manifest");
          +                for field in FIELDS {
          +                    object.remove(field);
          +                }
          +            }
                       "null" => metadata["sourceGeneration"] = Value::Null,
                       "conflicting" => metadata["generation"] = Value::from(1_u64),
          PATCH
          git apply --recount --check "$RUNNER_TEMP/generation-fixture.patch"
          git apply --recount "$RUNNER_TEMP/generation-fixture.patch"
          rustfmt --edition 2024 src/core/index_generation_watermark.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/core/index.rs > "$RUNNER_TEMP/generation-stage1-syntax.rs"
          git diff --check
          git add -- "${paths[@]}"
          git commit -m 'fix(index): reject missing and conflicting source generation watermarks' -m 'Require unsigned watermarks and agreement among canonical and legacy aliases across shared index admission. Preserve explicit zero and unadmitted bytes. Add ten regressions using actual vector and lexical indexes. Patch application, Rust syntax parsing, and new-module formatting passed. Cargo compilation and behavioral tests are separate verification, not claimed by this commit.'
          git rev-parse HEAD | tee "$RUNNER_TEMP/generation-stage1-commit.log"
          push_source
          git rev-parse HEAD | tee "$RUNNER_TEMP/generation-stage1-published.log"
          base=$(git rev-parse HEAD)
          git apply --recount --check "$RUNNER_TEMP/generation-stage2.patch"
          git apply --recount "$RUNNER_TEMP/generation-stage2.patch"
          rustfmt --edition 2024 src/core/index_generation_watermark.rs
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/core/index.rs > "$RUNNER_TEMP/generation-stage2-syntax.rs"
          git diff --check
          git add -- "${paths[@]}"
          git commit -m 'fix(index): bound recovery to the captured source snapshot' -m 'Thread captured generations through rebuild, re-embedding, coalesced jobs, and individual jobs. Do not activate future retained or inode-attested displaced generations. Add four regressions preserving future and uncommitted bytes, including a real directory exchange. Patch application and Rust syntax/format checks passed. Cargo compilation and behavioral tests remain separate verification.'
          git rev-parse HEAD | tee "$RUNNER_TEMP/generation-stage2-commit.log"
          push_source
          git rev-parse HEAD | tee "$RUNNER_TEMP/generation-stage2-published.log"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: generation-admission-source-delivery
          path: |
            ${{ runner.temp }}/generation-*.log
            ${{ runner.temp }}/generation*.patch
            src/core/index_generation_watermark.rs
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - name: Install the repository-pinned nightly
        run: |
          set -euo pipefail
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          case "$channel" in nightly|nightly-*) ;; *) exit 1 ;; esac
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: generation-admission-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.integrate.outputs.source_sha }}
          restore-keys: |
            generation-admission-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Check the library and run all fourteen admission regressions
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/generation-source-sha.log"
          cargo check --locked --lib 2>&1 | tee "$RUNNER_TEMP/generation-check.log"
          cargo test --locked --lib 'core::index::generation_watermark::tests::' -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/generation-tests.log"
          # FLOOR, at a MEASURED value (bd-lagsa, bd-aav0v). Was a bare exact-count grep,
          # which reds this lane when the subtree GROWS and aborts with no output. Measured
          # on RCH 2026-10-08: `cargo test --locked --lib
          # 'core::index::generation_watermark::tests::'` -> ok. 14 passed; 0 failed.
          gen_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/generation-tests.log" | head -1)
          if test -z "$gen_ran" || test "$gen_ran" -lt 14; then
            echo "ATTRIBUTION: arm 'core::index::generation_watermark::tests::' STOPPED this lane -- passing-with-zero-failures count '${gen_ran:-none}', required floor 14. An empty count means no 'test result: ok.' line at all, which is what a filter matching zero tests looks like."
            exit 1
          fi
          echo "ATTRIBUTION: arm 'core::index::generation_watermark::tests::' ok -- ran $gen_ran tests (floor 14, measured 14 on 2026-10-08), 0 failed."
      - name: Exercise existing reader and rollback recovery behavior
        if: ${{ !cancelled() }}
        run: |
          # ASSERT THAT SOMETHING RAN (bd-lagsa). These three suites had NO count
          # assertion at all. Under the previous `set -euo pipefail` a FAILING test did
          # abort, so this was never a hole for failures -- the hole is VACUITY. A filter
          # that matches nothing reports zero passed and zero failed and exits 0, so the
          # step passed while verifying nothing.
          #
          # The third filter is the fragile one: `recover_interrupted` is a bare
          # SUBSTRING, not a module path, so any rename of those test functions silently
          # empties it. Both module filters resolve today through index.rs:67 and :79 to
          # index_rollback_manifest.rs and index_read_lease.rs.
          #
          # Observed counts at the time of writing, recorded as INFORMATION and
          # deliberately NOT asserted: read_lease 7, rollback_manifest 9,
          # recover_interrupted 10. The floors are 1, because a floor of 1 is exactly
          # what kills the vacuous case and I have not reviewed these inventories --
          # pinning 7/9/10 would invent a requirement nobody signed off and reintroduce
          # the treadmill this bead is about. Raise a floor deliberately when you want a
          # specific suite guaranteed present.
          #
          # Accumulating rather than aborting, which is also what makes this safe to add:
          # three assertions in an ABORTING non-publishing step is the kill-switch shape
          # scripts/check-step-assertion-isolation.py exists to refuse, and the first
          # failure would hide the other two suites. This step performs no push, so
          # accumulation is the correct form and every suite still runs and reports.
          set -uo pipefail
          failed=0
          floor() {
            local log="$1" floor="$2" label="$3" actual=""
            actual=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed;.*/\1/p' "$log" | head -1)
            if test -z "$actual" || test "$actual" -lt "$floor"; then
              echo "ATTRIBUTION: $label FAILED -- passing-with-zero-failures count '${actual:-none}', required floor $floor"
              failed=1
            else
              echo "ATTRIBUTION: $label ok -- $actual tests ran, floor $floor"
            fi
          }
          # bd-aav0v: the `floor` helper names its own `$label`, so the COUNT arm of each
          # of these three was already attributed -- but the CARGO arm was a bare
          # `|| failed=1`, so a crashed harness or a failing test on any of the three set
          # the shared flag in silence. Count drift said which filter; a real failure said
          # nothing, which is the inverse of what a reader needs.
          #
          # `cargo_arm` keeps the pipeline shape (the `tee` must stay, since `floor` reads
          # the log) and reports WHICH filter's cargo invocation failed. Redness unchanged:
          # it still sets the same flag, and every arm still runs so none masks another.
          cargo_arm() {
            local label="$1" log="$2"
            shift 2
            if ! cargo test --locked --lib "$@" -- --test-threads=2 2>&1 | tee "$log"; then
              echo "ATTRIBUTION: arm '$label' FAILED AT CARGO -- a test failed or the harness crashed, which is NOT the count check below. Read the log above for the failing test; the count arm for this filter may also report, and the cargo failure is the cause."
              failed=1
            fi
          }
          cargo_arm 'read_lease' "$RUNNER_TEMP/generation-readers.log" 'core::index::read_lease::'
          floor "$RUNNER_TEMP/generation-readers.log" 1 'read_lease'
          cargo_arm 'rollback_manifest' "$RUNNER_TEMP/generation-rollback.log" 'core::index::rollback_manifest::'
          floor "$RUNNER_TEMP/generation-rollback.log" 1 'rollback_manifest'
          cargo_arm 'recover_interrupted' "$RUNNER_TEMP/generation-recovery.log" recover_interrupted
          floor "$RUNNER_TEMP/generation-recovery.log" 1 'recover_interrupted'
          exit "$failed"
      - name: Production lint and module formatting
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/generation-clippy.log"
          rustfmt --edition 2024 --check src/core/index_generation_watermark.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: generation-admission-verification
          path: |
            ${{ runner.temp }}/generation-*.log
            src/core/index_generation_watermark.rs
            src/core/index.rs
          retention-days: 7
