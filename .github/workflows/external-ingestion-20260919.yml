# Central policy source was tested and published by the first run of this lane.
name: External evidence ingestion
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/external-ingestion-20260919/**
      - .github/workflows/external-ingestion-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-ingestion-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. RUSTUP_TOOLCHAIN overrides the
      # action's install AT INVOCATION TIME, so pinning only the action installs
      # components onto the dated toolchain and then runs a bare rustfmt/cargo on
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            evidence-export-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate and verify screening before CASS excerpt truncation
        run: |
          set -euo pipefail
          git ls-files --error-unmatch src/policy/ingestion.rs
          paths=(src/cass/import.rs src/cass/ingestion.rs tests/e2e_cass_import_redaction.rs tests/e2e_cass_import_redaction/ingestion_boundaries.rs)
          if ! git ls-files --error-unmatch src/cass/ingestion.rs >/dev/null 2>&1; then
            test "$(git rev-parse HEAD:src/cass/import.rs)" = 4eb49a189307560326d892b2d71639ce712a842d
            test "$(git rev-parse HEAD:tests/e2e_cass_import_redaction.rs)" = f6b4464c2f2974a0c035624120be771d11fc32f7
            base64 --decode scripts/delivery/external-ingestion-20260919/cass.patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/ingestion-cass.patch"
            echo "d9f71d02169ad2e21b9e6d09ea35eb84a8ed4fbb4b939f402e99852bf1e97031  $RUNNER_TEMP/ingestion-cass.patch" | sha256sum --check
            git apply --check --whitespace=error-all "$RUNNER_TEMP/ingestion-cass.patch"
            git apply "$RUNNER_TEMP/ingestion-cass.patch"
          fi
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          git diff --check
          status=0
          cargo test --locked --lib cass::import::ingestion::tests -- --test-threads=2 > "$RUNNER_TEMP/ingestion-cass-unit.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/ingestion-cass-unit.log"
          test "$status" -eq 0
          grep -Fq 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/ingestion-cass-unit.log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            base=$(git rev-parse HEAD)
            git commit -m 'fix(cass): screen complete source lines before retaining evidence excerpts' -m 'Screen before the UTF-8 byte cut so a full credential cannot become an undetected durable fragment. Retain only screened excerpt bytes with a matching canonical hash and carry provider redaction classes into authenticated DB metadata, including when redaction occurred in an omitted tail. Preserve useful prose and fail-closed structured-record admission. Six real parser/storage/projection tests passed before publication; two public CLI import/search/pack regressions are added and verified separately.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch --deepen=100 origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/ingestion-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/ingestion-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: external-ingestion-source-and-tests
          path: ${{ runner.temp }}/ingestion-*
          retention-days: 7
      - name: Prove public import search and native evidence packing
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo test --locked --test integration_e_f e2e_cass_import_redaction::ingestion_boundaries:: -- --test-threads=1 > "$RUNNER_TEMP/ingestion-e2e.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/ingestion-e2e.log"
          test "$status" -eq 0
          grep -Fq 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/ingestion-e2e.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: external-ingestion-cli-results
          path: ${{ runner.temp }}/ingestion-*.log
          retention-days: 7
      - name: Verify parser compatibility and production compilation
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for filter in policy::ingestion:: cass::import::tests::; do
            log="$RUNNER_TEMP/ingestion-${filter%%::*}.log"
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$log" 2>&1 || failed=1
            tail -n 100 "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$log" || failed=1
          done
          cargo check --locked --all-targets > "$RUNNER_TEMP/ingestion-check.log" 2>&1 || failed=1
          tail -n 80 "$RUNNER_TEMP/ingestion-check.log"
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/ingestion-clippy.log" 2>&1 || failed=1
          tail -n 80 "$RUNNER_TEMP/ingestion-clippy.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: external-ingestion-verification
          path: ${{ runner.temp }}/ingestion-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
