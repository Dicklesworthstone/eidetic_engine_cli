# Central policy source was tested and published by the first run of this lane.
name: External evidence ingestion
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/external-ingestion-20260919/**
      - .github/workflows/external-ingestion-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-ingestion-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. RUSTUP_TOOLCHAIN overrides the
      # action's install AT INVOCATION TIME, so pinning only the action installs
      # components onto the dated toolchain and then runs a bare rustfmt/cargo on
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            evidence-export-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate and verify screening before CASS excerpt truncation
        run: |
          set -euo pipefail
          git ls-files --error-unmatch src/policy/ingestion.rs
          paths=(src/cass/import.rs src/cass/ingestion.rs tests/e2e_cass_import_redaction.rs tests/e2e_cass_import_redaction/ingestion_boundaries.rs)
          if ! git ls-files --error-unmatch src/cass/ingestion.rs >/dev/null 2>&1; then
            test "$(git rev-parse HEAD:src/cass/import.rs)" = 4eb49a189307560326d892b2d71639ce712a842d
            test "$(git rev-parse HEAD:tests/e2e_cass_import_redaction.rs)" = f6b4464c2f2974a0c035624120be771d11fc32f7
            base64 --decode scripts/delivery/external-ingestion-20260919/cass.patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/ingestion-cass.patch"
            echo "d9f71d02169ad2e21b9e6d09ea35eb84a8ed4fbb4b939f402e99852bf1e97031  $RUNNER_TEMP/ingestion-cass.patch" | sha256sum --check
            git apply --check --whitespace=error-all "$RUNNER_TEMP/ingestion-cass.patch"
            git apply "$RUNNER_TEMP/ingestion-cass.patch"
          fi
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          git diff --check
          status=0
          cargo test --locked --lib cass::import::ingestion::tests -- --test-threads=2 > "$RUNNER_TEMP/ingestion-cass-unit.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/ingestion-cass-unit.log"
          test "$status" -eq 0
          # ACTIVELY STALE PIN (bd-lagsa). It demanded exactly 6; the filter now matches 16,
          # so this step fails on every run -- and it sits immediately before this step's own
          # commit and push, so the delivery can never land while it is wrong.
          #
          # Counted at HEAD rather than guessed: `cass::import::ingestion` resolves through
          # src/cass/import.rs:1561, `#[path = "ingestion.rs"] mod ingestion`, and
          # src/cass/ingestion.rs declares `mod tests {` at :282 with all 16 of the file's
          # #[test] functions inside it and none before that line.
          #
          # Floor of 6, keeping the reviewed minimum rather than re-pinning to 16, and the
          # observed count prints so the gap stays visible. Note the commit message below
          # still says "Six real parser/storage/projection tests passed" -- that sentence
          # describes what was reviewed in 2026-09-19 and is left alone; it is provenance,
          # not an assertion.
          ingestion_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored;.*/\1/p' "$RUNNER_TEMP/ingestion-cass-unit.log" | head -1)
          if test -z "$ingestion_ran" || test "$ingestion_ran" -lt 6; then
            echo "ATTRIBUTION: cass::import::ingestion::tests reported passing-with-zero-failures count '${ingestion_ran:-none}', required floor 6"
            exit 1
          fi
          echo "ATTRIBUTION: cass::import::ingestion::tests ran $ingestion_ran tests (floor 6)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            base=$(git rev-parse HEAD)
            git commit -m 'fix(cass): screen complete source lines before retaining evidence excerpts' -m 'Screen before the UTF-8 byte cut so a full credential cannot become an undetected durable fragment. Retain only screened excerpt bytes with a matching canonical hash and carry provider redaction classes into authenticated DB metadata, including when redaction occurred in an omitted tail. Preserve useful prose and fail-closed structured-record admission. Six real parser/storage/projection tests passed before publication; two public CLI import/search/pack regressions are added and verified separately.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch --deepen=100 origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/ingestion-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/ingestion-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: external-ingestion-source-and-tests
          path: ${{ runner.temp }}/ingestion-*
          retention-days: 7
      - name: Prove public import search and native evidence packing
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo test --locked --test integration_e_f e2e_cass_import_redaction::ingestion_boundaries:: -- --test-threads=1 > "$RUNNER_TEMP/ingestion-e2e.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/ingestion-e2e.log"
          # bd-aav0v: two BARE assertions under errexit -- a tool exit and an exact count --
          # so a red named neither and produced no message. Fail-fast is preserved; the
          # exits below are what the bare commands already did, with a reason attached.
          ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/ingestion-e2e.log" | head -1)
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: arm 'ingestion_boundaries e2e' FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
            exit 1
          fi
          if test -z "$ran"; then
            echo "ATTRIBUTION: arm 'ingestion_boundaries e2e' FAILED -- cargo exited 0 but emitted NO 'test result: ok. N passed; 0 failed' line; the suite reported nothing, which is what a filter matching zero tests looks like"
            exit 1
          fi
          if test "$ran" != 2; then
            echo "ATTRIBUTION: arm 'ingestion_boundaries e2e' FAILED -- expected exactly 2 passing, counted $ran. If $ran is GREATER the suite grew and this pin is stale; if LOWER a test was removed or filtered out"
            exit 1
          fi
          echo "ATTRIBUTION: arm 'ingestion_boundaries e2e' ok -- exactly 2 passed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: external-ingestion-cli-results
          path: ${{ runner.temp }}/ingestion-*.log
          retention-days: 7
      - name: Verify parser compatibility and production compilation
        if: ${{ !cancelled() }}
        run: |
          failed=0
          # bd-aav0v, and this step is the second worked example. It is RED right now and
          # the step reports one flag across six arms, so nothing in its name or exit says
          # that ONE filter failed while the other passed. Diagnosing run 37562494007
          # meant reading the log to find
          #
          #   policy::ingestion::      test result: FAILED. 28 passed; 2 failed
          #   cass::import::tests::    test result: ok.     65 passed; 0 failed
          #
          # and then two more greps to name the two failures. Printed per arm, that is one
          # line. The failing tests are filed as their own bead; this step's job is to say
          # WHICH arm, not to fix them.
          #
          # Note the per-arm assertion also distinguishes a FAILED suite from a tool
          # failure, which matters here: `cargo test` exiting nonzero because tests failed
          # looks identical to a compile error under one shared flag.
          report_arm() {
            local label="$1" cmd_exit="$2" log="$3"
            local ran
            ran=$(sed -nE 's/^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed.*/\2 passed \3 failed/p' "$log" | head -1)
            if test "$cmd_exit" -ne 0; then
              echo "ATTRIBUTION: arm '$label' FAILED -- cargo exit $cmd_exit; summary line reports: ${ran:-no summary line}"
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$log"; then
              echo "ATTRIBUTION: arm '$label' FAILED -- no passing-with-zero-failures line; summary reports: ${ran:-none}"
              failed=1
            else
              echo "ATTRIBUTION: arm '$label' ok -- ${ran:-summary present}"
            fi
          }
          for filter in policy::ingestion:: cass::import::tests::; do
            log="$RUNNER_TEMP/ingestion-${filter%%::*}.log"
            cmd_exit=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$log" 2>&1 || cmd_exit=$?
            tail -n 100 "$log"
            report_arm "$filter" "$cmd_exit" "$log"
          done
          check_exit=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/ingestion-check.log" 2>&1 || check_exit=$?
          tail -n 80 "$RUNNER_TEMP/ingestion-check.log"
          if test "$check_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo check --all-targets' FAILED -- exit $check_exit"
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo check --all-targets' ok"
          fi
          clippy_exit=0
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/ingestion-clippy.log" 2>&1 || clippy_exit=$?
          tail -n 80 "$RUNNER_TEMP/ingestion-clippy.log"
          if test "$clippy_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' FAILED -- exit $clippy_exit"
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' ok"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: external-ingestion-verification
          path: ${{ runner.temp }}/ingestion-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
