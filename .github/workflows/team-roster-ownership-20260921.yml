name: Workspace-owned team roster
on:
  push:
    branches: [main]
    paths: [.github/workflows/team-roster-ownership-20260921.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: team-roster-ownership-20260921
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Publish reviewed workspace authorization boundary
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '39ef11549af2315142da911e842476a126ff7cec7f1e5e011c94785a1568600c  scripts/delivery/team-roster-ownership-20260921.patch' | sha256sum --check
          git apply --check scripts/delivery/team-roster-ownership-20260921.patch
          git apply scripts/delivery/team-roster-ownership-20260921.patch
          rustfmt --edition 2024 --config skip_children=true src/core/memory_scope.rs
          git diff --check
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'Dicklesworthstone/eidetic_engine_cli'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          path = 'src/core/memory_scope.rs'
          assert subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines() == [path]
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          root = 'https://api.github.com/repos/Dicklesworthstone/eidetic_engine_cli/'
          def api(method, suffix, data=None):
              request = urllib.request.Request(root + suffix, method=method,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json',
                      'User-Agent': 'ee-roster-ownership'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)
          original = api('GET', 'git/commits/' + base)
          blob = api('POST', 'git/blobs', {'encoding': 'utf-8', 'content': pathlib.Path(path).read_text()})
          assert blob['sha'] == subprocess.check_output(['git', 'hash-object', path]).decode().strip()
          tree = api('POST', 'git/trees', {'base_tree': original['tree']['sha'], 'tree': [
              {'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}]})
          subprocess.run(['git', 'add', '--', path], check=True)
          assert tree['sha'] == subprocess.check_output(['git', 'write-tree']).decode().strip()
          commit = api('POST', 'git/commits', {'tree': tree['sha'], 'parents': [base], 'message':
              'fix(scope): authorize team producers only through their workspace roster\n\n'
              'Bind the roster to the addressed workspace before admitting active display\n'
              'names or origin nodes. Another workspace cannot authorize local producers\n'
              'or undo local membership removal. Pin binding and roster in one owned read\n'
              'snapshot; never begin or release a caller-owned snapshot. Preserve the\n'
              'existing default-roster versus explicit external-store authority boundary.\n'
              'Missing, broken or unbound stores authorize no team members. No mutations.\n\n'
              'Add five real-store regressions for cross-workspace grants, active namesakes,\n'
              'unbound stores, concurrent revocation and failed authority. Upgrade two\n'
              'existing positive fixtures to real workspace schemas without changing any\n'
              'assertion. Exact patch/digest, pinned rustfmt and whole-tree checks passed.\n'
              'Runtime tests follow separately; no runtime success is claimed here.'})
          api('PATCH', 'git/refs/heads/main', {'sha': commit['sha'], 'force': False})
          pathlib.Path(os.environ['RUNNER_TEMP'], 'roster-source.log').write_text(json.dumps({
              'sourceCommit': commit['sha'], 'sourceTree': tree['sha'], 'sourceBlob': blob['sha'],
              'baseCommit': base}, indent=2))
          print('Published exact source:', commit['sha'])
          PY
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: roster-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            roster-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            core-retrieval-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            eval-diagnostics-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Resolve pinned source dependencies
        run: |
          set -euo pipefail
          ./scripts/checkout-franken-stack.sh "$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml
          git diff -- Cargo.toml > "$RUNNER_TEMP/roster-build-paths.patch"
          rustc --version --verbose > "$RUNNER_TEMP/roster-toolchain.log"
      - name: Execute five authorization and snapshot regressions
        run: |
          set -uo pipefail
          status=0
          cargo test --locked --lib 'core::memory_scope::tests::roster_ownership_tests::' -- --test-threads=2 > "$RUNNER_TEMP/roster-regressions.log" 2>&1 || status=$?
          tail -n 160 "$RUNNER_TEMP/roster-regressions.log"
          # bd-aav0v: two BARE assertions under errexit -- a tool exit and an exact count --
          # reported as one silent abort. Fail-fast is unchanged; it just says why now.
          #
          # The exact 5 STAYS: bd-lagsa's pin audit resolved this filter against a counted
          # population and recorded it correct.
          ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/roster-regressions.log" | head -1)
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: arm 'roster_ownership_tests' FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
            exit 1
          fi
          if test -z "$ran"; then
            echo "ATTRIBUTION: arm 'roster_ownership_tests' FAILED -- cargo exited 0 but emitted NO 'test result: ok. N passed; 0 failed' line; the suite reported nothing"
            exit 1
          fi
          if test "$ran" != 5; then
            echo "ATTRIBUTION: arm 'roster_ownership_tests' FAILED -- expected exactly 5 passing, counted $ran. If $ran is GREATER the suite grew and this pin is stale; if LOWER a test was removed"
            exit 1
          fi
          echo "ATTRIBUTION: arm 'roster_ownership_tests' ok -- exactly 5 passed"
      - name: Preserve existing scope behavior
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          set -uo pipefail
          status=0
          cargo test --locked --lib 'core::memory_scope::tests::' -- --test-threads=2 > "$RUNNER_TEMP/roster-all-scope.log" 2>&1 || status=$?
          tail -n 160 "$RUNNER_TEMP/roster-all-scope.log"
          # bd-aav0v: two BARE assertions under errexit. This arm is already a FLOOR (a
          # nonzero-count regex, correct for a whole-module filter whose population grows),
          # so only the attribution is new -- and it now prints the observed count, which a
          # regex floor never did.
          ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/roster-all-scope.log" | head -1)
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: arm 'core::memory_scope::tests (all scope behavior)' FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
            exit 1
          fi
          if test -z "$ran" || test "$ran" -lt 1; then
            echo "ATTRIBUTION: arm 'core::memory_scope::tests (all scope behavior)' FAILED -- counted '${ran:-none}' passing with 0 failures; the suite reported nothing, which is what a filter matching zero tests looks like"
            exit 1
          fi
          echo "ATTRIBUTION: arm 'core::memory_scope::tests (all scope behavior)' ok -- $ran passed, floor 1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: roster-ownership-verification
          path: |
            ${{ runner.temp }}/roster-*.log
            ${{ runner.temp }}/roster-*.patch
          retention-days: 7
