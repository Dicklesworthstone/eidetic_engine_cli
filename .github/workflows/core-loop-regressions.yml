name: Workspace relocation regressions
on:
  push:
    branches: [main]
    paths:
      - src/core/workspace*.rs
      - src/core/effect.rs
      - src/db/mod.rs
      - src/cli/mod.rs
      - src/policy/store_auth.rs
      - tests/contracts/workspace_relocation.rs
      - .github/workflows/core-loop-regressions.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-relocation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  workspace-relocation:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: workspace-relocation-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            workspace-relocation-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cass-refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate reviewed relocation changes without replacing concurrent work
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          repo = 'repos/Dicklesworthstone/eidetic_engine_cli/git/blobs/'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def fetch(sha):
              response = json.loads(subprocess.check_output(['gh', 'api', repo + sha]))
              data = base64.b64decode(response['content'])
              digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert digest == sha, 'Transport changed reviewed source bytes'
              return data
          paths = [
              'src/db/mod.rs', 'src/cli/mod.rs', 'src/core/workspace.rs',
              'src/policy/store_auth.rs', 'src/core/effect.rs', 'src/output/mod.rs',
              'tests/contracts.rs', 'README.md',
          ]
          bases = {path: git('rev-parse', 'HEAD:' + path) for path in paths}
          additions = {
              'src/core/workspace_relocation.rs': '638fa0ee4180f1dbb8907631dbdd47b529435e83',
              'src/core/workspace_relocation_tests.rs': '1ff2bf8b88a7549be3ee470a41be233d99f8b8dc',
              'tests/contracts/workspace_relocation.rs': '30aba23ce3fb0e6187cf7f17e74fc78bdf33f2ef',
              'docs/schemas/ee.workspace.relocate.v1.json': '9883d38dda2d8b394f6489da5fb01debb8589ebe',
              'docs/adr/0089-authenticated-workspace-relocation.md': '55e22c08e59b67d23fd930a02e83313f1039f442',
          }
          for path in additions:
              assert not pathlib.Path(path).exists(), 'Candidate already landed: ' + path
          def apply(sha, name, *flags):
              path = pathlib.Path(os.environ['RUNNER_TEMP'], name)
              path.write_bytes(fetch(sha))
              subprocess.run(['git', 'apply', '--check', *flags, str(path)], check=True)
              subprocess.run(['git', 'apply', *flags, str(path)], check=True)
          # Exact reviewed patches; any conflicting context fails closed. No
          # replacement of the current main versions of these large modules.
          apply('6c52c35ce65d6dc2fdd6a8506fcd7819f9205579', 'relocation-wiring.patch')
          apply('1796ac1d6fca758b153eb099d665e2179414cb07', 'relocation-cli.patch', '--include=src/cli/mod.rs')
          for path, sha in additions.items():
              pathlib.Path(path).write_bytes(fetch(sha))
          paths += list(additions)
          rust = [path for path in paths if path.endswith('.rs')]
          subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', *rust], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          manifest = {'baseCommit': git('rev-parse', 'HEAD'), 'files': []}
          for path in paths:
              data = pathlib.Path(path).read_text()
              response = json.loads(subprocess.check_output(['gh', 'api', repo.rstrip('/'), '--input', '-'], input=json.dumps({'content': data, 'encoding':'utf-8'}).encode()))
              assert response['sha'] == git('hash-object', path)
              manifest['files'].append({'path': path, 'baseBlob': bases.get(path), 'sha': response['sha']})
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'relocation-source.json')
          output.write_text(json.dumps(manifest, indent=2))
          print(output.read_text())
          subprocess.run(['git', 'add', '--intent-to-add', '--', *additions], check=True)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'relocation-reviewed.patch').write_text(subprocess.check_output(['git', 'diff'], text=True))
          PY
      - name: Check all Cargo targets
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/relocation-check.log"
      - name: Verify relocation and atomicity with real stores
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --lib core::workspace::relocation::tests -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/relocation-unit.log"
          grep -Fq 'test result: ok. 13 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/relocation-unit.log"
          cargo test --locked --lib db::tests::workspace_relocation_ -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/relocation-primitive.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/relocation-primitive.log"
      - name: Verify the public copy approval reindex and retrieval loop
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --test contracts workspace_relocation:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/relocation-public.log"
          grep -Fq 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/relocation-public.log"
      - name: Report strict Clippy and repository formatting
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          set +e
          set -uo pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/relocation-clippy.log"
          lint=${PIPESTATUS[0]}
          cargo fmt --check 2>&1 | tee "$RUNNER_TEMP/relocation-format.log"
          fmt=${PIPESTATUS[0]}
          test "$lint" -eq 0 && test "$fmt" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: relocation-verification
          path: ${{ runner.temp }}/relocation-*
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
