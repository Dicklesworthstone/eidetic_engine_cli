name: Durable index publication

on:
  push:
    branches: [main]
    paths:
      - 'scripts/delivery/index-publication-durability.patch'
      - '.github/workflows/index-publication-20260918.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Apply reviewed durability barriers
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          grep -q 'fn with_publication_fence' src/core/index.rs
          git apply --check scripts/delivery/index-publication-durability.patch
          git apply scripts/delivery/index-publication-durability.patch
          rustfmt --edition 2024 --config skip_children=true src/core/index.rs
          git diff --check
          git diff --stat
      - name: Compile production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/index-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/index-check.log"
          exit "$status"
      - name: Execute fencing and durability fault regressions
        run: |
          status=0
          cargo test --locked --lib core::index::tests::publication_ -- --nocapture > "$RUNNER_TEMP/index-boundaries.log" 2>&1 || status=$?
          tail -n 160 "$RUNNER_TEMP/index-boundaries.log"
          exit "$status"
      - name: Commit verified durability change directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/index.rs
          git commit -m 'fix(index): persist staged generations and directory transitions before job commit' -m 'Flush every regular staged file and child directory before metadata becomes recoverable, keeping the bulk phase cancellable and outside the writer fence. On Unix, persist staging, retention, activation, recovery and rollback directory changes before reporting success. Keep both pre-activation restoration and post-activation quarantine protected during errors and unwinding. Refuse symlinks and special entries. Non-Unix directory rename semantics are explicitly unchanged. Production compilation and 13 fencing/durability regressions passed before this commit; full index-module results are separate.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              git rev-parse HEAD
              exit 0
            fi
            git fetch origin main
            git merge --no-edit origin/main
          done
          exit 1
      - name: Execute complete index module regression suite
        run: |
          status=0
          cargo test --locked --lib core::index::tests:: -- --test-threads=2 > "$RUNNER_TEMP/index-module.log" 2>&1 || status=$?
          tail -n 240 "$RUNNER_TEMP/index-module.log"
          exit "$status"
      - name: Preserve exact source and verification logs
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/index-source-sha.log"
          git diff -- src/core/index.rs > "$RUNNER_TEMP/index-uncommitted.patch"
          cp src/core/index.rs "$RUNNER_TEMP/index-verified-source.rs"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: index-durability-verification
          path: |
            ${{ runner.temp }}/index-*.log
            ${{ runner.temp }}/index-*.patch
            ${{ runner.temp }}/index-verified-source.rs
          retention-days: 7
