name: Task-scoped context packs
on:
  push:
    branches: [main]
    paths:
      - 'src/core/context_task_paths.rs'
      - 'scripts/delivery/pack-task-paths.py.xz.b64'
      - 'tests/pack_task_paths_cli.py'
      - '.github/workflows/pack-task-paths.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pack-task-paths-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Integrate explicit task-target admission and replay
        id: source
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          if ! grep -Fq 'mod task_paths;' src/core/context.rs; then
            python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = Path('scripts/delivery/pack-task-paths.py.xz.b64').read_text()
          script = lzma.decompress(base64.b64decode(''.join(encoded.split()), validate=True))
          if hashlib.sha256(script).hexdigest() != '8d60286efaeb05bf1518b995a5e6be3d8d527989227c3e7a57d31cc9d03bbf06':
              raise SystemExit('Task-target integration checksum mismatch')
          Path(os.environ['RUNNER_TEMP'], 'pack-task-integrate.py').write_bytes(script)
          PY
            python3 "$RUNNER_TEMP/pack-task-integrate.py" > "$RUNNER_TEMP/pack-task-paths.txt"
            files=(src/core/context_task_paths.rs)
            while IFS= read -r path; do files+=("$path"); done < "$RUNNER_TEMP/pack-task-paths.txt"
            for path in "${files[@]}"; do
              case "$path" in *.rs) rustfmt --edition 2024 --config skip_children=true "$path";; esac
            done
            python3 -m py_compile tests/pack_task_paths_cli.py
            git diff --check
            git add -- "${files[@]}"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(pack): admit task-scoped rules with replayable literal targets' -m 'Carry repeated --task-path values through canonical pack, context alias and query-file builds. Validate relative literal paths with the rule writer safety boundary, apply live directory/file scopes, bind normalized targets into hashes and stream identities, preserve redacted replay records and rebuild commands, and bypass path-insensitive caches. Keep no-target output and hash bytes unchanged. Source edits passed unique-anchor validation and rustfmt; runtime verdicts are separate.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${files[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/task-pack-source-sha.log"
          git archive --format=tar.gz --output="$RUNNER_TEMP/task-pack-source.tar.gz" HEAD src Cargo.toml Cargo.lock rust-toolchain.toml tests/pack_task_paths_cli.py docs/schemas/ee.pack.v2.json docs/schemas/ee.pack.stream.v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: task-pack-source
          path: ${{ runner.temp }}/task-pack-source*
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: task-pack-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            task-pack-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recall-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            exact-time-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            workspace-backup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Exercise target scope and streaming regressions
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/task-pack-identity.log"
          failed=0
          for group in core::context::task_paths::tests output::streaming::tests; do
            log="$RUNNER_TEMP/task-pack-${group//::/-}.log"
            if ! cargo test --locked --lib "$group" -- --test-threads=2 2>&1 | tee "$log"; then
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: task-pack-unit-results
          path: ${{ runner.temp }}/task-pack-*.log
          retention-days: 7
      - name: Run the public scoped-pack lifecycle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo build --locked --bin ee 2>&1 | tee "$RUNNER_TEMP/task-pack-build.log"
          python3 tests/pack_task_paths_cli.py target/debug/ee 2>&1 | tee "$RUNNER_TEMP/task-pack-cli.log"
          grep -q '^PASS: literal task scopes' "$RUNNER_TEMP/task-pack-cli.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: task-pack-cli-results
          path: ${{ runner.temp }}/task-pack-*.log
          retention-days: 7
      - name: Compile existing callers and exercise replay contracts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/task-pack-check.log"
          for group in pack_stream_conformance_v1 context_show_persisted_pack; do
            log="$RUNNER_TEMP/task-pack-$group.log"
            cargo test --locked --test contracts "$group" -- --test-threads=2 2>&1 | tee "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: task-pack-results
          path: ${{ runner.temp }}/task-pack-*.log
          retention-days: 7
