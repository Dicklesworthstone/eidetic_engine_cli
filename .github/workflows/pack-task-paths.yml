name: Task-scoped context packs
on:
  push:
    branches: [main]
    paths:
      - 'src/core/context_task_paths.rs'
      - 'scripts/delivery/pack-scope-explanations.patch.xz.b64'
      - 'tests/pack_task_paths_cli.py'
      - '.github/workflows/pack-task-paths.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pack-task-scope-explanations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Preserve each selected rule's conditional applicability
        id: source
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          if ! grep -Fq 'and_then(task_paths::scope_explanation)' src/core/context.rs; then
            python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = Path('scripts/delivery/pack-scope-explanations.patch.xz.b64').read_text()
          patch = lzma.decompress(base64.b64decode(''.join(encoded.split()), validate=True))
          if hashlib.sha256(patch).hexdigest() != 'b916c014779aab82d3396467941c789991e261d15aa7e70edb301448937d71ab':
              raise SystemExit('Scope explanation patch checksum mismatch')
          Path(os.environ['RUNNER_TEMP'], 'pack-scope.patch').write_bytes(patch)
          PY
            git apply --check --whitespace=error-all "$RUNNER_TEMP/pack-scope.patch"
            git apply "$RUNNER_TEMP/pack-scope.patch"
            files=(src/core/context.rs src/core/context_task_paths.rs tests/pack_task_paths_cli.py)
            rustfmt --edition 2024 --config skip_children=true src/core/context.rs src/core/context_task_paths.rs
            python3 -m py_compile tests/pack_task_paths_cli.py
            git diff --check
            git add -- "${files[@]}"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(pack): retain conditional rule applicability in mixed-target packs' -m 'Attach the admitted native directory/file pattern to each selected rule explanation without rewriting its source body. Account for the additional applicability text in candidate token estimates. Withhold private, control-bearing and oversized patterns before matching or public disclosure. Cover scope explanation, unchanged source bytes and mixed-target public selection.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${files[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/task-pack-source-sha.log"
          git archive --format=tar.gz --output="$RUNNER_TEMP/task-pack-source.tar.gz" HEAD src/core/context.rs src/core/context_task_paths.rs tests/pack_task_paths_cli.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: task-pack-source
          path: ${{ runner.temp }}/task-pack-source*
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: task-pack-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            task-pack-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recall-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            exact-time-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            workspace-backup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Exercise target scope, native authorization and streaming
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/task-pack-identity.log"
          failed=0
          for group in core::context::task_paths::tests core::context::rule_admission_tests output::streaming::tests; do
            log="$RUNNER_TEMP/task-pack-${group//::/-}.log"
            if ! cargo test --locked --lib "$group" -- --test-threads=2 2>&1 | tee "$log"; then
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: task-pack-unit-results
          path: ${{ runner.temp }}/task-pack-*.log
          retention-days: 7
      - name: Run the public scoped-pack lifecycle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo build --locked --bin ee 2>&1 | tee "$RUNNER_TEMP/task-pack-build.log"
          python3 tests/pack_task_paths_cli.py target/debug/ee 2>&1 | tee "$RUNNER_TEMP/task-pack-cli.log"
          grep -q '^PASS: literal task scopes' "$RUNNER_TEMP/task-pack-cli.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: task-pack-cli-results
          path: ${{ runner.temp }}/task-pack-*.log
          retention-days: 7
      - name: Compile existing callers and exercise replay contracts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/task-pack-check.log"
          for group in pack_stream_conformance_v1 context_show_persisted_pack; do
            log="$RUNNER_TEMP/task-pack-$group.log"
            cargo test --locked --test contracts "$group" -- --test-threads=2 2>&1 | tee "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: task-pack-results
          path: ${{ runner.temp }}/task-pack-*.log
          retention-days: 7
