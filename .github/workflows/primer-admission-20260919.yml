name: Primer sealed evidence admission
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/primer-admission-20260919.patch
      - .github/workflows/primer-admission-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primer-admission-20260919
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Commit sealed primer and historical global source admission
        id: source
        run: |
          set -euo pipefail
          paths=(src/core/primer.rs src/core/primer_seal_admission_tests.rs src/core/global_store.rs)
          if test -f src/core/primer_seal_admission_tests.rs; then
            grep -q 'primer_seal_admission(connection, workspace_id)' src/core/primer.rs
            grep -q 'Keep that independent from this API' src/core/global_store.rs
          else
            test "$(git rev-parse HEAD:src/core/primer.rs)" = 3ce1fa281ded3b84f3b271ed4c60029f07d976b6
            test "$(git rev-parse HEAD:src/core/global_store.rs)" = 50054605b43a249be1ef610ef6df0038064aad4a
            base=$(git rev-parse HEAD)
            git apply --check scripts/delivery/primer-admission-20260919.patch
            git apply scripts/delivery/primer-admission-20260919.patch
            rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "${paths[@]}"
            git commit -m 'fix(recall): bind primer caches to seal authority and preserve global history' -m 'Validate source seals before cold assembly or cache lookup; include a versioned deterministic admission digest in cache keys so seal-only writes cannot reuse old responses without a generation bump. Keep caller snapshots, read-only behavior and revealed controls intact. Separate global history visibility from tombstone exclusion. Add seven real-store tests covering cache invalidation, malformed authority, unmodified generations, global retirement/sealing and exact historical boundaries. Patch application and formatting passed; execution evidence follows separately.'
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
            # bd-aav0v: a BARE `test` under errexit. It means EVERY push attempt failed, which
            # is a completely different situation from a failing test -- the verification above
            # may have passed and only PUBLICATION failed. Silently the two are
            # indistinguishable. Exit code and condition unchanged; still a hard stop.
            if test "$pushed" -ne 1; then
              echo "ATTRIBUTION: PUBLICATION FAILED, not verification -- all 3 'git push origin HEAD:main' attempts were rejected, each followed by a fetch/merge onto the new origin/main. The work above was prepared and its checks ran; nothing reached main. Re-running the lane is the remedy, not changing the source."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/primer-source-sha.log"
      - uses: actions/upload-artifact@v4
        with:
          name: primer-admission-source
          path: ${{ runner.temp }}/primer-source-sha.log
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. This overrides the action's install
      # AT INVOCATION TIME, so a bare rustfmt/cargo in THIS job resolves through
      # it, not through the `toolchain:` input. Pinning one half only installs
      # components onto the dated toolchain and then invokes floating nightly,
      # which does not have them. That was d315cdc7f, repaired at 021a033b8.
      # NOTE: this env exists on THIS job only; the other job in this file has
      # no override, so its invocation is pinned by its input alone and that is
      # correct there. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: primer-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ needs.integrate.outputs.source_sha }}
          restore-keys: |
            primer-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            global-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            seed-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check production library
        run: |
          set -o pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/primer-source-sha.log"
          cargo check --locked --lib 2>&1 | tee "$RUNNER_TEMP/primer-check.log"
      - name: Execute current and historical recall admission regressions
        run: |
          set -uo pipefail
          failed=0
          # bd-lagsa / bd-aav0v. This step used to compare each arm's count EXACTLY and
          # record the result in a shared `failed` flag with no output, so a mismatch
          # ended the step at a bare `exit "$failed"` naming no arm, no filter and no
          # number. Run 37660994662 (2026-10-07 17:41Z) is the instance: all four suites
          # printed `0 failed`, and the lane still died 3ms after the last one.
          #
          # The cause was cargo counting 28 for core::global_store:: against a pin of 27.
          # b3e08c1bc, three hours earlier, added
          # `default_user_data_root_requires_absolute_xdg_and_preserves_home_fallback`
          # to src/core/global_store.rs -- a config fix with a test for it, i.e. plain
          # progress, which reddened a primer-admission delivery lane that has nothing to
          # do with XDG path resolution. An exact count fails in the direction of progress.
          #
          # FLOORS, at the ORIGINAL reviewed values, not today's counts. All four filters
          # end in `::`, so each names a population that grows; the precedent for flooring
          # those while keeping single-test pins exact is d26210858, and there are no
          # single-test pins here. Keeping 27 rather than ratcheting to 28 follows
          # external-ingestion-20260919's reasoning verbatim -- "the reviewed minimum
          # rather than re-pinning, and the observed count prints so the gap stays
          # visible". 28 includes a test nobody reviewed as part of this lane's charter,
          # and ratcheting to it would red the lane again if that config test were later
          # moved to another module, which is a reorganisation, not a coverage loss.
          #
          # A below-floor count still fails: a suite that SHRANK means coverage was
          # removed or a filter stopped matching, which is the direction worth stopping.
          #
          # ACCUMULATION IS PRESERVED, AND IT IS SAFE TO PRESERVE. Each arm sets the flag
          # and RETURNS rather than calling `exit 1`: `run_group` is a shell function, so
          # an `exit` there would end the whole step and skip the remaining arms, turning
          # "run all four and report all four" into "stop at the first". That is a
          # diagnostic loss, not a gain. It is not a publication interlock either -- the
          # `git push` lives in the `integrate` job, not in `verify` -- so nothing is
          # published on the strength of a later arm.
          run_group() {
            local name="$1" filter="$2" floor="$3" status=0 observed=
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/primer-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/primer-$name.log"
            observed=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed;.*/\1/p' "$RUNNER_TEMP/primer-$name.log" | head -1)
            if test "$status" -ne 0; then
              echo "ATTRIBUTION: arm '$name' ($filter) STOPPED this lane -- cargo exited $status, so the suite did not pass. This is a TEST FAILURE, not a count mismatch; the failing test is in the tail above. Observed summary count: ${observed:-none}."
              failed=1
              return 0
            fi
            if test -z "$observed"; then
              echo "ATTRIBUTION: arm '$name' ($filter) STOPPED this lane -- cargo exited 0 but printed no 'test result: ok. N passed; 0 failed;' line, so the population could not be read. That is what a filter matching ZERO tests looks like, and an unreadable population is treated as a failure rather than as a pass."
              failed=1
              return 0
            fi
            if test "$observed" -lt "$floor"; then
              echo "ATTRIBUTION: arm '$name' ($filter) STOPPED this lane -- ran $observed tests with 0 failures, BELOW the floor of $floor. The suite shrank: coverage was removed, or the filter stopped matching after a rename or a module move. Adding tests is fine and only raises this number."
              failed=1
              return 0
            fi
            echo "ATTRIBUTION: arm '$name' ($filter) ok -- ran $observed tests (floor $floor), 0 failed."
          }
          run_group admission 'core::primer::seal_tests::' 7
          run_group existing 'core::primer::tests::' 16
          run_group global 'core::global_store::' 27
          run_group similar 'core::search::rule_admission::memory_revisions::seed_tests::' 6
          exit "$failed"
      - name: Check production Clippy and formatting
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          failed=0
          # bd-aav0v: a production lint and a three-file format check under one flag. Keep
          # the `|| var=...` on each pipeline: with errexit on (default `bash -e {0}`) and
          # pipefail set here, a BARE pipeline would abort the step and no arm would report.
          clippy_exit=0
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/primer-clippy.log" || clippy_exit=$?
          fmt_exit=0
          rustfmt --edition 2024 --config skip_children=true --check src/core/primer.rs src/core/primer_seal_admission_tests.rs src/core/global_store.rs 2>&1 | tee "$RUNNER_TEMP/primer-fmt.log" || fmt_exit=$?
          if test "$clippy_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' FAILED -- exit $clippy_exit"
            grep -m1 -E '^error' "$RUNNER_TEMP/primer-clippy.log" || true
            grep -m1 -E '^\s*-->' "$RUNNER_TEMP/primer-clippy.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' ok"
          fi
          if test "$fmt_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'rustfmt --check on primer.rs, primer_seal_admission_tests.rs and global_store.rs' FAILED -- exit $fmt_exit; files named:"
            grep -m5 -E '^Diff in ' "$RUNNER_TEMP/primer-fmt.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'rustfmt --check on the three primer sources' ok"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: primer-admission-verification
          path: ${{ runner.temp }}/primer-*.log
          retention-days: 7
