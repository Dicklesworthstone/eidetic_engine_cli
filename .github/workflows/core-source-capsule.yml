name: Core source capsule

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/core-source-capsule.yml

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Prepare reviewed promotion sources with exact preimage guards
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'promotion-source'
          root.mkdir()
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = git('rev-parse', 'HEAD')
          assert base == os.environ['GITHUB_SHA']
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          expected = {
              '.github/workflows/core-memory-regressions.yml': 'dd36b68315223a64a976fd227d3be822c1bfe99e',
              'src/core/global_promotion.rs': '8c2525231bbdd0cb167f941e19eb738748ab667a',
              'src/core/global_promotion_admission.rs': '747d7568af778e58468835db178e68f4f54e2989',
              'src/core/global_promotion_admission_tests.rs': 'b377b2f3469dfd43f386376999522da1e46e2229',
              'src/core/global_promotion_payload.rs': None,
              'src/core/global_promotion_payload_tests.rs': None,
              'tests/mcp_capture_git.rs': '2affcd7951a372015a28f134bfbae38cf0d9141a',
          }
          for path, sha in expected.items():
              if sha is None:
                  assert not pathlib.Path(path).exists(), 'Concurrent new source: ' + path
              else:
                  assert git('rev-parse', 'HEAD:' + path) == sha, 'Concurrent source change: ' + path
          endpoint = 'repos/Dicklesworthstone/eidetic_engine_cli/git/blobs'
          blob = json.loads(subprocess.check_output(['gh', 'api', endpoint + '/89f7a0de0929dfb781286e52acde8a2446cc58ba']))
          compressed = base64.b64decode(blob['content'])
          assert hashlib.sha256(compressed).hexdigest() == 'b70e130ba06e7bf109c395e458beaffc8eb22f64823bdccd194b464213e2cd92'
          patch = root / 'reviewed.patch'
          patch.write_bytes(lzma.decompress(compressed))
          touched = {line.split('\t', 2)[2] for line in git('apply', '--numstat', str(patch)).splitlines()}
          assert touched == set(expected)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          rust = [path for path in expected if path.endswith('.rs')]
          subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', *rust], check=True)
          subprocess.run(['git', 'add', '-N', *[path for path, sha in expected.items() if sha is None]], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          manifest = {'baseCommit': base, 'files': []}
          for path, original in expected.items():
              data = pathlib.Path(path).read_bytes()
              request = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              created = json.loads(subprocess.check_output(['gh', 'api', endpoint, '--input', '-'], input=request))
              assert created['sha'] == git('hash-object', path)
              manifest['files'].append({'path': path, 'baseBlob': original, 'sha': created['sha']})
              output = root / path
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
          (root / 'source.json').write_text(json.dumps(manifest, indent=2))
          (root / 'formatted.patch').write_text(subprocess.check_output(['git', 'diff', '--', *expected], text=True))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-promotion-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/promotion-source/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: global-promotion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            cass-refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Verify promotion payloads and attempt-family admission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promotion-checks"
          cargo check --locked --all-targets --features mcp 2>&1 | tee "$RUNNER_TEMP/promotion-checks/check.log"
          cargo test --locked --lib core::global_promotion:: -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/promotion-checks/tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/promotion-checks/tests.log"
          cargo clippy --locked --all-targets --features mcp -- -D warnings 2>&1 | tee "$RUNNER_TEMP/promotion-checks/clippy.log"
          rustfmt --check --edition 2024 --config skip_children=true src/core/global_promotion.rs src/core/global_promotion_admission.rs src/core/global_promotion_admission_tests.rs src/core/global_promotion_payload.rs src/core/global_promotion_payload_tests.rs tests/mcp_capture_git.rs 2>&1 | tee "$RUNNER_TEMP/promotion-checks/fmt.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: global-promotion-checks-${{ github.sha }}
          path: ${{ runner.temp }}/promotion-checks/
          retention-days: 7
