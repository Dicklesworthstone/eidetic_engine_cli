name: Native rule and diagnostic source admission
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/diagnostic-snapshot-20260919/**
      - .github/workflows/diagnostic-snapshot-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-snapshot-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # bd-niay4. SINGLE-HALF PIN, AND IT IS CORRECT HERE. "Pin both halves"
          # is CONDITIONAL on a job-level RUSTUP_TOOLCHAIN existing to override
          # the action at invocation time. This workflow sets none, so there is
          # no second half and this is not d315cdc7f. The ref `@nightly` selects
          # FLOATING nightly by itself; this input is what dates the install.
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: rule-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rule-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            diagnostic-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Compile test and publish native rule retrieval increments
        run: |
          set -euo pipefail
          delivery=scripts/delivery/diagnostic-snapshot-20260919
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          verify() {
            local part="$1" expected="$2"
            cargo check --locked --all-targets > "$RUNNER_TEMP/rules-$part-check.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/rules-$part-check.log"; return 1; }
            cargo test --locked --lib core::search::rule_admission::tests -- --test-threads=2 > "$RUNNER_TEMP/rules-$part-native.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/rules-$part-native.log"; return 1; }
            tail -n 100 "$RUNNER_TEMP/rules-$part-native.log"
            grep -Fq "test result: ok. $expected passed; 0 failed;" "$RUNNER_TEMP/rules-$part-native.log"
          }
          publish() {
            local base="$1" part="$2"; shift 2
            git diff --check
            git add -- "$@"
            if git diff --cached --quiet; then return 0; fi
            if test "$part" = first; then
              git commit -m 'feat(search): hydrate and admit native procedural rules from source truth' -m 'Hydrate semantic-only and source-less rules with canonical content, native provenance and revision metadata. Reject revoked, foreign and stale rules before relevance filtering and query assistance. Preserve draft and deprecated inspection, not pack promotion. Repair invalid diagnostic fixture IDs and use the existing DB fixture API. All-target compilation and six native-rule tests passed before this commit.'
            else
              git commit -m 'feat(search): enforce native rule admission across diagnostic retrieval' -m 'Apply native rule admission to raw lexical/vector ranks, RRF contributions and final diagnostics, rejecting conflicting revision and scope claims without changing surviving scores or promoting raw-only candidates. Restore full stored rule bodies beyond index previews. Add seven regressions including real lexical/vector lookup, revocation, snapshot consistency and full-body output. All-target compilation and all thirteen native-rule tests passed before this commit.'
            fi
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "$@"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
              cargo check --locked --all-targets > "$RUNNER_TEMP/rules-$part-merge-check.log" 2>&1
            done
            git rev-parse HEAD > "$RUNNER_TEMP/rules-$part-source-sha.log"
            git archive HEAD | gzip > "$RUNNER_TEMP/rules-$part-source.tar.gz"
          }
          base64 --decode "$delivery/native-rules.patch.xz.b64" | xz --decompress > "$RUNNER_TEMP/rules-first.patch"
          base64 --decode "$delivery/native-diagnostics.patch.xz.b64" | xz --decompress > "$RUNNER_TEMP/rules-second.patch"
          echo "2f34bda5ab63056758396bc17cbf768da4a50a2ecf78ba1825884632525666e1  $RUNNER_TEMP/rules-first.patch" | sha256sum --check
          echo "d186266a6790db1901d058d9df54a1b463f44330a1cd99d80ebb8dfc76241cf8  $RUNNER_TEMP/rules-second.patch" | sha256sum --check
          if ! test -f src/core/search_rule_admission.rs; then
            base=$(git rev-parse HEAD)
            test "$(git rev-parse HEAD:src/core/search.rs)" = ac53aafb26ff6097b5f51c7809d83d27b3f35789
            test "$(git rev-parse HEAD:src/core/search_diagnostic_snapshot.rs)" = a4d3c4c61bbc1e44e11bbb47cd32b48b9911a843
            test "$(git rev-parse HEAD:docs/degraded_codes.md)" = 84bfb91980471745e7ec3aa4e585df5aff2a21fa
            test "$(git rev-parse HEAD:docs/degraded_code_taxonomy.md)" = c0dee9013db63c30a33f9d59a2c63c657566f78b
            git apply --check --whitespace=error-all "$RUNNER_TEMP/rules-first.patch"
            git apply "$RUNNER_TEMP/rules-first.patch"
            python3 "$delivery/repair-fixtures.py" src/core/search_rule_admission.rs
            rustfmt --edition 2024 --config skip_children=true src/core/search.rs src/core/search_rule_admission.rs src/core/search_diagnostic_snapshot.rs
            verify first 6
            publish "$base" first src/core/search.rs src/core/search_rule_admission.rs src/core/search_diagnostic_snapshot.rs docs/degraded_codes.md docs/degraded_code_taxonomy.md tests/fixtures/failure_modes/rule_live_admission_filtered.json
          fi
          if ! grep -Fq 'pub(super) fn admit_diagnostics(' src/core/search_rule_admission.rs; then
            base=$(git rev-parse HEAD)
            python3 - <<'PY'
          import os, runpy
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          first = (temp / 'rules-first.patch').read_text()
          name = 'src/core/search_rule_admission.rs'
          section = first.split(f'diff --git a/{name} b/{name}\n', 1)[1].split('diff --git ', 1)[0]
          original = ''.join(line[1:] for line in section.splitlines(keepends=True) if line.startswith('+') and not line.startswith('+++'))
          repair = runpy.run_path('scripts/delivery/diagnostic-snapshot-20260919/repair-fixtures.py')['repair']
          (temp / 'rules-first-original.rs').write_text(original)
          (temp / 'rules-first-expected.rs').write_text(repair(original))
          PY
            # Bridge only after proving the current module is exactly our checked first increment.
            rustfmt --edition 2024 --config-path "$GITHUB_WORKSPACE/rustfmt.toml" --config skip_children=true "$RUNNER_TEMP/rules-first-expected.rs"
            cmp src/core/search_rule_admission.rs "$RUNNER_TEMP/rules-first-expected.rs"
            cp "$RUNNER_TEMP/rules-first-original.rs" src/core/search_rule_admission.rs
            git apply --check --whitespace=error-all "$RUNNER_TEMP/rules-second.patch"
            git apply "$RUNNER_TEMP/rules-second.patch"
            python3 "$delivery/repair-fixtures.py" src/core/search_rule_admission.rs
            rustfmt --edition 2024 --config skip_children=true src/core/index.rs src/core/search.rs src/core/search_rule_admission.rs
            verify second 13
            publish "$base" second src/core/index.rs src/core/search.rs src/core/search_rule_admission.rs docs/degraded_codes.md tests/fixtures/failure_modes/rule_live_admission_filtered.json
          else
            verify current 13
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-rule-source-and-checks
          path: |
            ${{ runner.temp }}/rules-*.log
            ${{ runner.temp }}/rules-*-source.tar.gz
          retention-days: 7
      - name: Execute diagnostic and recovery regression groups
        run: |
          set -uo pipefail
          failed=0
          # bd-lagsa + bd-aav0v. Four arms shared one flag, and one of the four counts is
          # stale. `core::search::diagnostic_snapshot::tests` was pinned to exactly 10;
          # src/core/search_diagnostic_snapshot.rs holds 15 `#[test]`, all inside its `mod
          # tests` at :179, with no `tests_*` sibling module, so the filter matches 15.
          # global-authority-20260919 independently pins the same module at 14, which is also
          # wrong -- and wrong in a PROVABLE DIRECTION even without a count, because its
          # filter carries a trailing `::` and so matches a SUBSET of this one; a subset
          # cannot be larger. 10 < 14 was impossible on its face.
          #
          # The counter was CALIBRATED before being trusted: it reproduces 17, 7 and 11 for
          # the three git_capture filters whose values are known from
          # git-capture-offline-20260919's passing exact pins. It is NOT trusted for subtree
          # filters ending in `::`, which it undercounts by not recursing into submodules.
          #
          # That pin becomes a FLOOR OF ITS REVIEWED VALUE, not of the counted number: the
          # count's job is to prove 10 <= 15 so the floor is satisfiable, not to become a new
          # exact pin that drifts the same way.
          #
          # `recovery` is LEFT EXACT and is not a bd-lagsa defect: its filter resolves through
          # #[path] to src/core/index_snapshot_recovery_tests.rs, which holds exactly 8. That
          # is derivable from source unambiguously, which is when an exact pin is the right
          # shape. The other two arms were already floors expressed as a regex; they are now
          # numeric so the observed count can be printed.
          run_group() {
            local name="$1" filter="$2" expected="$3" mode="${4:-floor}" status=0 ran=""
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/rules-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/rules-$name.log"
            ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/rules-$name.log" | head -1)
            if test "$status" -ne 0; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
              failed=1
            elif test -z "$ran"; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- cargo exited 0 but emitted NO 'test result: ok. N passed; 0 failed' line; the suite reported nothing"
              failed=1
            elif test "$mode" = exact && test "$ran" != "$expected"; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- expected exactly $expected passing, counted $ran"
              failed=1
            elif test "$mode" = floor && test "$ran" -lt "$expected"; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- counted $ran passing, required floor $expected"
              failed=1
            else
              echo "ATTRIBUTION: arm '$name' ($filter) ok -- $ran passed ($mode $expected)"
            fi
            return 0
          }
          run_group diagnostic 'core::search::diagnostic_snapshot::tests' 10
          run_group existing 'core::search::tests::diag_search_' 1
          run_group evidence 'core::search::tests::live_evidence_admission_filters' 1
          # MEASURED 2026-10-08 and converted from `exact` to the helper's default floor.
          # `cargo test --locked --lib 'core::index::read_lease::snapshot_recovery_tests'`
          # on RCH -> ok. 8 passed; 0 failed. So 8 is correct today, which is precisely why
          # it should not stay exact: this filter names a module, so the next test added to
          # snapshot_recovery_tests reds a delivery lane that has nothing to do with it.
          # (This lane's run_group defaults to floor -- mode="${4:-floor}" -- so dropping the
          # explicit `exact` token is the whole change.)
          run_group recovery 'core::index::read_lease::snapshot_recovery_tests' 8
          # bd-aav0v: a FIFTH pair of arms in this step, inline rather than through run_group,
          # which is why it was easy to miss: a tool exit and an exact count, both folded into
          # the same `failed`.
          #
          # The exact 4 is CORRECT and stays. The filter resolves through
          # tests/concurrent_search_lexical_arm_e2e.rs:25 (`#[path =
          # "snapshot_index_recovery_e2e.rs"]`) to tests/snapshot_index_recovery_e2e.rs, which
          # holds exactly 4 `#[test]`. The module is gated `#[cfg(all(unix, feature =
          # "lexical-bm25"))]` and `lexical-bm25` is in Cargo.toml's DEFAULT features, so it
          # compiles under this plain `cargo test` on ubuntu. Worth recording, because a
          # feature-gated module that silently stops compiling would make this arm count 0
          # rather than fail -- which the "reported nothing" message below now distinguishes.
          status=0
          cargo test --locked --test integration_a_d concurrent_search_lexical_arm_e2e::snapshot_index_recovery -- --test-threads=1 > "$RUNNER_TEMP/rules-pack-recovery.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/rules-pack-recovery.log"
          pack_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/rules-pack-recovery.log" | head -1)
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: arm 'pack-recovery e2e' FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
            failed=1
          elif test -z "$pack_ran"; then
            echo "ATTRIBUTION: arm 'pack-recovery e2e' FAILED -- cargo exited 0 but emitted NO 'test result: ok. N passed; 0 failed' line; the suite reported nothing, which is what a feature-gated module that stopped compiling looks like"
            failed=1
          elif test "$pack_ran" != 4; then
            echo "ATTRIBUTION: arm 'pack-recovery e2e' FAILED -- expected exactly 4 passing, counted $pack_ran; tests/snapshot_index_recovery_e2e.rs holds 4 #[test], so check whether one was added, removed or feature-gated out"
            failed=1
          else
            echo "ATTRIBUTION: arm 'pack-recovery e2e' ok -- exactly 4 passed"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-rule-runtime-results
          path: ${{ runner.temp }}/rules-*.log
          retention-days: 7
      - name: Check Clippy and formatting
        if: ${{ !cancelled() }}
        run: |
          failed=0
          # bd-aav0v: an all-targets deny-level lint and a WHOLE-TREE `cargo fmt --check`
          # under one flag. The format arm's scope is the entire repository, not this
          # lane's sources, so it can redden from an edit nothing here touched -- which
          # is exactly the attribution a reader needs and never got. This step runs
          # under `!cancelled()`, so it reports even though an earlier step dies.
          clippy_exit=0
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/rules-clippy.log" 2>&1 || clippy_exit=$?
          fmt_exit=0
          cargo fmt --check > "$RUNNER_TEMP/rules-format.log" 2>&1 || fmt_exit=$?
          tail -n 80 "$RUNNER_TEMP/rules-clippy.log"
          tail -n 80 "$RUNNER_TEMP/rules-format.log"
          if test "$clippy_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo clippy --all-targets -D warnings' FAILED -- exit $clippy_exit"
            grep -m1 -E '^error' "$RUNNER_TEMP/rules-clippy.log" || true
            grep -m1 -E '^\s*-->' "$RUNNER_TEMP/rules-clippy.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo clippy --all-targets -D warnings' ok"
          fi
          if test "$fmt_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo fmt --check (WHOLE TREE, not just this lane's sources)' FAILED -- exit $fmt_exit; first files named:"
            grep -m5 -E '^Diff in ' "$RUNNER_TEMP/rules-format.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo fmt --check (whole tree)' ok"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-rule-verification
          path: ${{ runner.temp }}/rules-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
