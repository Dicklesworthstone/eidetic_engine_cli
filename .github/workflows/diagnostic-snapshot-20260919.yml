name: Native rule and diagnostic source admission
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/diagnostic-snapshot-20260919/**
      - .github/workflows/diagnostic-snapshot-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-snapshot-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Apply reviewed native rule retrieval increment
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/rules-base.log"
          if ! git ls-files --error-unmatch src/core/search_rule_admission.rs >/dev/null 2>&1; then
            test "$(git rev-parse HEAD:src/core/search.rs)" = ac53aafb26ff6097b5f51c7809d83d27b3f35789
            test "$(git rev-parse HEAD:src/core/search_diagnostic_snapshot.rs)" = a4d3c4c61bbc1e44e11bbb47cd32b48b9911a843
            test "$(git rev-parse HEAD:docs/degraded_codes.md)" = 84bfb91980471745e7ec3aa4e585df5aff2a21fa
            test "$(git rev-parse HEAD:docs/degraded_code_taxonomy.md)" = c0dee9013db63c30a33f9d59a2c63c657566f78b
            base64 --decode scripts/delivery/diagnostic-snapshot-20260919/native-rules.patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/rules.patch"
            echo "2f34bda5ab63056758396bc17cbf768da4a50a2ecf78ba1825884632525666e1  $RUNNER_TEMP/rules.patch" | sha256sum --check
            git apply --check --whitespace=error-all "$RUNNER_TEMP/rules.patch"
            git apply "$RUNNER_TEMP/rules.patch"
            rustfmt --edition 2024 --config skip_children=true src/core/search.rs src/core/search_rule_admission.rs src/core/search_diagnostic_snapshot.rs
            git diff --check
          fi
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: rule-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rule-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            diagnostic-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Compile all targets and execute native rule regressions before publication
        run: |
          set -euo pipefail
          cargo check --locked --all-targets > "$RUNNER_TEMP/rules-check.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/rules-check.log"; exit 1; }
          cargo test --locked --lib core::search::rule_admission::tests -- --test-threads=2 > "$RUNNER_TEMP/rules-native.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/rules-native.log"; exit 1; }
          tail -n 100 "$RUNNER_TEMP/rules-native.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed;' "$RUNNER_TEMP/rules-native.log"
      - name: Commit checked functional source directly to main
        run: |
          set -euo pipefail
          paths=(src/core/search.rs src/core/search_rule_admission.rs src/core/search_diagnostic_snapshot.rs docs/degraded_codes.md docs/degraded_code_taxonomy.md tests/fixtures/failure_modes/rule_live_admission_filtered.json)
          base=$(cat "$RUNNER_TEMP/rules-base.log")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'feat(search): hydrate and admit native procedural rules from source truth' -m 'Give semantic-only and source-less rules canonical body, native provenance, lifecycle and revision metadata without fabricating memory identities. Reject revoked, foreign, stale-revision and unverified rule authority before calibration and query hints. Preserve draft/deprecated inspection, not pack promotion. Repair invalid fixture IDs in the preceding diagnostic suite without weakening assertions. All-target compilation and six real-store rule regressions passed before publication; diagnostic runtime results follow separately.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
              cargo check --locked --all-targets > "$RUNNER_TEMP/rules-merge-check.log" 2>&1
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/rules-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/rules-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-rule-source-and-checks
          path: |
            ${{ runner.temp }}/rules-*.log
            ${{ runner.temp }}/rules-source.tar.gz
          retention-days: 7
      - name: Execute diagnostic and recovery regression groups
        run: |
          set -uo pipefail
          failed=0
          run_group() {
            local name="$1" filter="$2" expected="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/rules-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/rules-$name.log"
            if test "$status" -ne 0 || ! grep -Eq "test result: ok\. $expected passed; 0 failed;" "$RUNNER_TEMP/rules-$name.log"; then failed=1; fi
          }
          run_group diagnostic 'core::search::diagnostic_snapshot::tests' 10
          run_group existing 'core::search::tests::diag_search_' '[1-9][0-9]*'
          run_group evidence 'core::search::tests::live_evidence_admission_filters' '[1-9][0-9]*'
          run_group recovery 'core::index::read_lease::snapshot_recovery_tests' 8
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-rule-runtime-results
          path: ${{ runner.temp }}/rules-*.log
          retention-days: 7
      - name: Check Clippy and formatting
        if: ${{ !cancelled() }}
        run: |
          failed=0
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/rules-clippy.log" 2>&1 || failed=1
          cargo fmt --check > "$RUNNER_TEMP/rules-format.log" 2>&1 || failed=1
          tail -n 80 "$RUNNER_TEMP/rules-clippy.log"
          tail -n 80 "$RUNNER_TEMP/rules-format.log"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-rule-verification
          path: ${{ runner.temp }}/rules-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
