name: Live source-backed recall
on:
  push:
    branches: [main]
    paths:
      - 'src/core/recall*.rs'
      - 'scripts/delivery/recall-public-egress-20260922.patch'
      - 'tests/recall_source_lifecycle_cli.py'
      - '.github/workflows/recall-source-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Integrate source-preserving public recall projection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          files=(src/core/recall_scan.rs src/core/recall_projection.rs)
          if ! grep -Fq 'redacted_memories += usize::from(projection::apply' src/core/recall_scan.rs; then
            test "$(git hash-object src/core/recall_scan.rs)" = 449bb3db00fd415a254e15434a84e95b510a8994
            test "$(git hash-object src/core/recall_projection.rs)" = 4739124b0795fccb240b9b88ccf71cb1b5a643f9
            patch=scripts/delivery/recall-public-egress-20260922.patch
            test "$(git hash-object "$patch")" = 477cf2035964f058d49368ce01905d8d79303fe1
            git apply --check --whitespace=error-all "$patch"
            git apply "$patch"
          fi
          rustfmt --edition 2024 --config skip_children=true "${files[@]}"
          git diff --check
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(recall): redact stored private fields before public projection' -m 'Reuse public replay and pack provenance policies before recall previews and budgeting. Preserve raw stored records, safe source URIs and rankings; label private-source fallbacks as native memory identity rather than origin evidence. Reject private code locators rather than inventing redacted paths, and validate native identity and taxonomy. Add five regressions including real database JSON/markdown/Debug egress and token-budget checks.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${files[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/recall-source-sha.log"
          git archive --format=tar.gz --output="$RUNNER_TEMP/recall-source.tar.gz" HEAD src/core/recall*.rs tests/recall_source_lifecycle_cli.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: recall-source-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recall-source-sha.log
            ${{ runner.temp }}/recall-source.tar.gz
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: recall-source-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            recall-source-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            workspace-backup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            session-learning-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Exercise production recall and live source regressions
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/recall-identity.log"
          cargo test --locked --lib core::recall:: -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/recall-engine.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/recall-engine.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: recall-engine-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recall-*.log
          retention-days: 7
      - name: Exercise public recall lifecycle without models
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo build --locked --bin ee 2>&1 | tee "$RUNNER_TEMP/recall-build.log"
          python3 tests/recall_source_lifecycle_cli.py target/debug/ee 2>&1 | tee "$RUNNER_TEMP/recall-public.log"
          grep -q '^PASS: public anchored recall' "$RUNNER_TEMP/recall-public.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: recall-public-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recall-*.log
          retention-days: 7
      - name: Exercise existing recall CLI contracts and goldens
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --test integration_n_r recall_cli_golden -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/recall-contracts.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/recall-contracts.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: recall-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recall-*.log
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
