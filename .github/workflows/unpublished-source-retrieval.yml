name: Unpublished source retrieval

on:
  push:
    branches: [main]
    paths:
      - src/core/search*.rs
      - src/core/index_source_snapshot.rs
      - .github/workflows/unpublished-source-retrieval.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unpublished-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-retrieval:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Prepare reviewed source against exact preimages
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpublished"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'unpublished')
          endpoint = 'repos/Dicklesworthstone/eidetic_engine_cli/git/blobs/'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def fetch(sha):
              result = json.loads(subprocess.check_output(['gh', 'api', endpoint + sha]))
              data = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              return data
          path = 'src/core/search.rs'
          test = 'src/core/search_unpublished_tests.rs'
          base = git('rev-parse', 'HEAD')
          assert base == os.environ['GITHUB_SHA']
          original = git('rev-parse', 'HEAD:' + path)
          focus = ['src/core/focus_suggest.rs', 'src/core/focus_suggest_cass.rs']
          focus_preimages = {name: git('rev-parse', 'HEAD:' + name) for name in focus}
          integrate = not pathlib.Path(test).exists()
          manifest = {'testedBase': base, 'files': []}
          if integrate:
              assert original == 'd07c9405dd603c329e1ae91f02fffd9a7eba3bc8', 'Search preimage changed; review before integrating'
              patch = root / 'reviewed.patch'
              patch.write_bytes(fetch('02c439474ccd6d9bcc0e7f240c9409fcaa5967fd'))
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
              pathlib.Path(test).write_bytes(fetch('325c6de9cf90724c3318bfb822140f7b1df69acc'))
              handoff = root / 'handoff.patch'
              handoff.write_bytes(fetch('afb7785d3f2b9abd4e4651953c142f32e0202170'))
              subprocess.run(['git', 'apply', '--check', str(handoff)], check=True)
              subprocess.run(['git', 'apply', str(handoff)], check=True)
              subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', path, test], check=True)
              intermediate = git('hash-object', path)
              controls = root / 'legacy-controls.patch'
              controls.write_bytes(fetch('1824c6ef71c540cc533d2a9a63390cc981a88d12'))
              subprocess.run(['git', 'apply', '--check', str(controls)], check=True)
              subprocess.run(['git', 'apply', str(controls)], check=True)
              subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', path, test, *focus], check=True)
              subprocess.run(['git', 'add', '--intent-to-add', '--', test], check=True)
              manifest['files'] = [
                  {'path': path, 'baseBlob': original, 'alsoBaseBlobs': [intermediate], 'sha': git('hash-object', path)},
                  {'path': test, 'baseBlob': None, 'sha': git('hash-object', test)},
              ]
              for name in focus:
                  if git('hash-object', name) != focus_preimages[name]:
                      manifest['files'].append({'path': name, 'baseBlob': focus_preimages[name], 'sha': git('hash-object', name)})
          subprocess.run(['git', 'diff', '--check'], check=True)
          (root / 'source.json').write_text(json.dumps(manifest, indent=2))
          (root / 'applied.patch').write_text(subprocess.check_output(['git', 'diff', '--', path, test, *focus], text=True))
          (root / 'tracked.txt').write_bytes(subprocess.check_output(['git', 'ls-files', '-z']))
          subprocess.run(['tar', '--null', '-T', str(root / 'tracked.txt'), '-czf', str(root / 'source.tar.gz')], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('integrate=' + str(integrate).lower() + '\n')
          print((root / 'source.json').read_text())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        with:
          name: unpublished-prepared-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unpublished/
          retention-days: 7
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: unpublished-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Check all targets
        id: check
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/unpublished/check.log"
      - name: Verify complete source retrieval and read-only pack
        id: tests
        run: |
          set -uo pipefail
          failed=0
          # bd-aav0v: twelve arms under one flag -- the pinned suite and its assertion,
          # then five loop cases each with a tool outcome and an assertion. A red step
          # named none of them.
          #
          # bd-lagsa on the pin: `12 passed` was EXACT. Counted at HEAD, it is still
          # accurate -- src/core/search_unpublished_tests.rs, reached from
          # src/core/search.rs:11667 by `#[path]`, holds exactly 12 #[test]. So this one
          # is NOT drifted; it is converted to a floor only so that ADDING a test here
          # stops being a red, which is the tripwire bd-qz6dh retired. The observed count
          # prints either way.
          main_exit=0
          cargo test --locked --lib core::search::unpublished_tests:: -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/unpublished/tests.log" || main_exit=$?
          main_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/unpublished/tests.log" | head -1)
          if test "$main_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'core::search::unpublished_tests::' FAILED -- exit $main_exit (tool failure, not an assertion)"
            failed=1
          elif test -z "$main_ran" || test "$main_ran" -lt 12; then
            echo "ATTRIBUTION: arm 'core::search::unpublished_tests::' FAILED -- count '${main_ran:-none}', required floor 12"
            failed=1
          else
            echo "ATTRIBUTION: arm 'core::search::unpublished_tests::' ok -- $main_ran tests ran, floor 12"
          fi
          while read -r label filter; do
            case_exit=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/unpublished/$label.log" 2>&1 || case_exit=$?
            tail -n 80 "$RUNNER_TEMP/unpublished/$label.log"
            if test "$case_exit" -ne 0; then
              echo "ATTRIBUTION: case '$label' FAILED -- exit $case_exit (tool failure, not an assertion)"
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/unpublished/$label.log"; then
              echo "ATTRIBUTION: case '$label' FAILED -- no passing-with-zero-failures summary line"
              failed=1
            else
              echo "ATTRIBUTION: case '$label' ok"
            fi
          done <<'CASES'
          stale-source stale_read_only_search_retrieves_current_memory_and_rule_corpus_without_writes
          strict-source live_snapshot_fallback_preserves_strict_source_mode_and_cancellation
          empty-source empty_index_directory_keeps_missing_index_fallback_under_source_snapshot
          epoch-refusal search_refuses_pre_security_epoch_index_before_open
          focus core::focus_suggest::
          CASES
          exit "$failed"
      - name: Check strict library lint and changed source formatting
        id: lint
        run: |
          set -euo pipefail
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/unpublished/clippy.log"
          rustfmt --edition 2024 --check --config skip_children=true src/core/search.rs src/core/search_unpublished_tests.rs src/core/focus_suggest.rs src/core/focus_suggest_cass.rs 2>&1 | tee "$RUNNER_TEMP/unpublished/fmt.log"
      - name: Publish only tested source directly to current main
        if: ${{ success() && steps.source.outputs.integrate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'unpublished')
          manifest = json.loads((root / 'source.json').read_text())
          endpoint = 'repos/Dicklesworthstone/eidetic_engine_cli'
          def api(path, data=None, method=None):
              args = ['gh', 'api', endpoint + path]
              if method: args += ['--method', method]
              if data is not None: args += ['--input', '-']
              return json.loads(subprocess.check_output(args, input=None if data is None else json.dumps(data).encode()))
          for item in manifest['files']:
              blob = api('/git/blobs', {'content': pathlib.Path(item['path']).read_text(), 'encoding': 'utf-8'})
              assert blob['sha'] == item['sha'], 'Tested bytes changed'
          message = ('feat(search): retrieve complete unpublished source snapshots without rebuilding indexes\n\n'
              'Use the existing bounded in-memory Frankensearch lexical path when no usable published or retained index exists. '
              'Preserve typed source identities, live lifecycle/scope admission, strict semantic and historical refusals, '
              'corruption/symlink errors, cancellation, and complete-corpus size limits. '
              'Fresh memories, native rules and admitted CASS spans can participate before initial publication; '
              'a real read-only pack now selects unlinked CASS evidence without creating a memory alias or consuming index jobs.\n\n'
              'Twelve real-store tests, all-target compilation, strict library Clippy and changed-source rustfmt passed. '
              'Tests cover missing/empty indexes, deferred jobs, native identities, pack selection, mode/corpus boundaries, '
              'source lifecycle, borrowed snapshots, corrupt bytes, symlinks and cancellation. '
              'Complete source-only pack handoffs now tolerate index absence, not integrity failures, '
              'and retain request and source-generation checks through serialization. '
              'Four existing stale/empty/index-integrity controls and the complete focus unit suite passed as well. '
              'Update prior missing-index expectations to require real source results; retain historical error cleanup and diagnostic persisted-index checks. '
              'Include only formatter-produced focus changes, whose behavior was already committed independently. '
              'No full-suite or semantic-quality claim.\n\n'
              'Tested base: ' + manifest['testedBase'] + '\n'
              'GitHub Actions run: ' + os.environ['GITHUB_RUN_ID'] + '\n'
              'Publish exact tested blobs on current main only when touched preimages still match; no PR or force push.')
          for attempt in range(4):
              head = api('/git/ref/heads/main')['object']['sha']
              parent = api('/git/commits/' + head)
              # Read only the exact paths being replaced. Every unrelated main
              # entry is retained by building on its current tree.
              for item in manifest['files']:
                  probe = subprocess.run(['gh', 'api', endpoint + '/contents/' + item['path'] + '?ref=' + head], capture_output=True, text=True)
                  if item['baseBlob'] is None:
                      # A previous verified source-only delivery can already
                      # have published the same tests; never overwrite others.
                      assert (probe.returncode != 0 and '404' in probe.stderr) or (probe.returncode == 0 and json.loads(probe.stdout)['sha'] == item['sha']), 'New source path changed or cannot be checked'
                  else:
                      allowed = [item['baseBlob'], *item.get('alsoBaseBlobs', [])]
                      assert probe.returncode == 0 and json.loads(probe.stdout)['sha'] in allowed, 'Concurrent target change; do not overwrite'
              tree = api('/git/trees', {'base_tree': parent['tree']['sha'], 'tree': [
                  {'path': item['path'], 'mode': '100644', 'type': 'blob', 'sha': item['sha']} for item in manifest['files']]})
              commit = api('/git/commits', {'message': message, 'tree': tree['sha'], 'parents': [head]})
              result = subprocess.run(['gh', 'api', endpoint + '/git/refs/heads/main', '--method', 'PATCH', '--input', '-'],
                  input=json.dumps({'sha': commit['sha'], 'force': False}), text=True, capture_output=True)
              if result.returncode == 0:
                  assert api('/git/commits/' + commit['sha'])['tree']['sha'] == tree['sha']
                  (root / 'published.json').write_text(json.dumps({'commit': commit['sha'], 'parent': head, **manifest}, indent=2))
                  print('Published tested source: ' + commit['sha'])
                  break
              if '422' not in result.stderr:
                  raise RuntimeError(result.stderr)
              time.sleep(1)
          else:
              raise RuntimeError('Main advanced repeatedly; source retained in artifacts, no force push')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unpublished-results-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unpublished/*.log
            ${{ runner.temp }}/unpublished/*.json
            ${{ runner.temp }}/unpublished/*.patch
          retention-days: 7
