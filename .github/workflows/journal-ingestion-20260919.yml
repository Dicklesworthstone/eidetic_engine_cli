name: Journal evidence ingestion
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/journal-ingestion-20260919/**
      - .github/workflows/journal-ingestion-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journal-ingestion-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. RUSTUP_TOOLCHAIN overrides the
      # action's install AT INVOCATION TIME, so pinning only the action installs
      # components onto the dated toolchain and then runs a bare rustfmt/cargo on
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: journal-ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            journal-ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            evidence-export-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate and test canonical journal screening before publication
        run: |
          set -euo pipefail
          paths=(src/policy/mod.rs src/policy/ingestion.rs src/core/journal.rs src/core/journal_ingestion_tests.rs)
          if ! git ls-files --error-unmatch src/core/journal_ingestion_tests.rs >/dev/null 2>&1; then
            test "$(git rev-parse HEAD:src/policy/mod.rs)" = c398a739f573be0214b310e59e15e349aa8923fb
            test "$(git rev-parse HEAD:src/policy/ingestion.rs)" = eaf9c3eb870718b817f05e921fcafe7022af0d48
            test "$(git rev-parse HEAD:src/core/journal.rs)" = 8bbfe8fffced3eae17ffeda14624d4482223a5fa
            base64 --decode scripts/delivery/journal-ingestion-20260919/journal.patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/journal-ingestion.patch"
            echo "d50b06c132ec930aab4306cdc5bc3c67f12df630877337f224e51a19a24327fc  $RUNNER_TEMP/journal-ingestion.patch" | sha256sum --check
            git apply --check --whitespace=error-all "$RUNNER_TEMP/journal-ingestion.patch"
            git apply "$RUNNER_TEMP/journal-ingestion.patch"
          fi
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          git diff --check
          status=0
          cargo test --locked --lib core::journal::ingestion_tests:: -- --test-threads=2 > "$RUNNER_TEMP/journal-focused.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/journal-focused.log"
          test "$status" -eq 0
          # FLOOR (bd-lagsa). Pin matches today -- src/core/journal_ingestion_tests.rs holds
          # exactly 6 #[test] functions -- but it sits under an abort-on-error shell with a
          # second cargo suite after it, so a seventh test would switch that suite off.
          # 6 kept as the reviewed minimum.
          focused_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored;.*/\1/p' "$RUNNER_TEMP/journal-focused.log" | head -1)
          if test -z "$focused_ran" || test "$focused_ran" -lt 6; then
            echo "ATTRIBUTION: core::journal::ingestion_tests:: reported count '${focused_ran:-none}', required floor 6"
            exit 1
          fi
          echo "ATTRIBUTION: core::journal::ingestion_tests:: ran $focused_ran tests (floor 6)"
          status=0
          cargo test --locked --lib policy::ingestion:: -- --test-threads=2 > "$RUNNER_TEMP/journal-policy.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/journal-policy.log"
          test "$status" -eq 0
          # THIS PIN IS ACTIVELY STALE, not a landmine (bd-lagsa). It demanded exactly 8
          # while the filter now matches roughly THIRTY tests, so this lane fails here on
          # every dispatch -- it has simply not been dispatched, because its trigger paths
          # are only scripts/delivery/journal-ingestion-20260919/** and this file, so edits
          # under src/policy/ never fire it.
          #
          # `policy::ingestion::` is a subtree, which is where the drift came from. Counted
          # at HEAD: src/policy/ingestion.rs carries 10 #[test] in its own `mod tests`
          # (:198), plus `#[path = "ingestion_json.rs"] mod encoded_json` (:14-16) with 11,
          # plus `#[cfg(test)] #[path = "ingestion_store_tests.rs"] mod store_tests` (:438-440)
          # with 9. The filter matches all three. ingestion.rs was last touched 2026-10-06,
          # so this is live drift, not ancient history.
          #
          # 8 is kept as the floor rather than re-pinned to 30: re-pinning would just reset
          # the clock, and 8 is the inventory this assertion was reviewed against.
          policy_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored;.*/\1/p' "$RUNNER_TEMP/journal-policy.log" | head -1)
          if test -z "$policy_ran" || test "$policy_ran" -lt 8; then
            echo "ATTRIBUTION: policy::ingestion:: reported count '${policy_ran:-none}', required floor 8"
            exit 1
          fi
          echo "ATTRIBUTION: policy::ingestion:: ran $policy_ran tests (floor 8)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            base=$(git rev-parse HEAD)
            git commit -m 'fix(journal): screen complete capture content before truncation and persistence' -m 'Use the canonical external ingestion policy for body and every structured content field, preserving actual replacement counts without counting existing placeholders. Screen before the body cut so credentials cannot become durable fragments and omitted instruction-bearing tails cannot be silently downgraded for distillation. Cover direct, stdin, daemon preparation, same-ID fallback, actual database bytes, and distillation refusal. All six new journal and eight shared-policy regressions passed before publication.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch --deepen=100 origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/journal-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/journal-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: journal-ingestion-source-and-tests
          path: ${{ runner.temp }}/journal-*
          retention-days: 7
      - name: Verify journal compatibility and production checks
        if: ${{ !cancelled() }}
        run: |
          failed=0
          cargo test --locked --lib core::journal::tests:: -- --test-threads=2 > "$RUNNER_TEMP/journal-compatibility.log" 2>&1 || failed=1
          tail -n 120 "$RUNNER_TEMP/journal-compatibility.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/journal-compatibility.log" || failed=1
          cargo check --locked --all-targets > "$RUNNER_TEMP/journal-check.log" 2>&1 || failed=1
          tail -n 80 "$RUNNER_TEMP/journal-check.log"
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/journal-clippy.log" 2>&1 || failed=1
          tail -n 80 "$RUNNER_TEMP/journal-clippy.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: journal-ingestion-verification
          path: ${{ runner.temp }}/journal-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: journal-ingestion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
