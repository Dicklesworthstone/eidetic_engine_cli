name: Daemon search contract
on:
  push:
    branches: [main]
    paths:
      - src/core/mod.rs
      - src/core/search*.rs
      - src/cli/mod.rs
      - src/cli/daemon_search_diagnostics.rs
      - src/daemon/server.rs
      - src/daemon/protocol.rs
      - src/daemon/search_result_contract*.rs
      - docs/schemas/ee.search.document.v1.json
      - docs/schemas/ee.daemon.search.response.v3.json
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/daemon-search-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daemon-search-contract
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            prefetch-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check formatting of the committed contract
        run: |
          set -euo pipefail
          trap 'tail -n 120 "$RUNNER_TEMP"/daemon-search-contract-*.log 2>/dev/null || true' EXIT
          git rev-parse HEAD > "$RUNNER_TEMP/daemon-search-contract-source-sha.log"
          paths=(src/core/mod.rs src/core/search.rs src/core/search_result_document.rs src/cli/mod.rs src/cli/daemon_search_diagnostics.rs src/daemon/server.rs src/daemon/search_result_contract.rs src/daemon/search_result_contract_tests.rs)
          rustfmt --check --edition 2024 --config skip_children=true "${paths[@]}"
          # Test this exact checkout. Never apply source rewrites in CI: an
          # unlinked module or producer/validator drift must fail, not be fixed
          # transiently on the runner while the broken source stays on main.
          git diff --exit-code
      - name: Check the committed production library
        run: |
          set -euo pipefail
          trap 'tail -n 120 "$RUNNER_TEMP/daemon-search-contract-check.log" 2>/dev/null || true' EXIT
          cargo check --locked --lib > "$RUNNER_TEMP/daemon-search-contract-check.log" 2>&1
      - name: Test the committed producer, validator, and real wire round trips
        run: |
          set -euo pipefail
          trap 'tail -n 120 "$RUNNER_TEMP"/daemon-search-contract-*.log 2>/dev/null || true' EXIT
          run_tests() {
            local filter="$1" name="$2"
            shift 2
            local log="$RUNNER_TEMP/daemon-search-contract-${name}.log"
            cargo test --locked --lib "$filter" -- "$@" > "$log" 2>&1
            # A misspelled filter or unlinked test module must not pass with
            # zero tests. New regressions may be added without editing counts.
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
          }
          run_tests daemon::server::search_result_contract::tests tests --test-threads=2
          run_tests core::search_result_document::tests shared
          run_tests cli::daemon_search_diagnostics::tests diagnostics
          run_tests daemon::server::tests::daemon_search_result_rejects_schema_and_field_drift existing --exact
          git diff --exit-code
      - name: Check strict production Clippy
        run: |
          set -euo pipefail
          trap 'tail -n 120 "$RUNNER_TEMP/daemon-search-contract-clippy.log" 2>/dev/null || true' EXIT
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/daemon-search-contract-clippy.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: daemon-search-contract-verification
          path: ${{ runner.temp }}/daemon-search-contract-*
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
