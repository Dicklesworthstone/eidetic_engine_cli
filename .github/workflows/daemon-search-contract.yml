name: Daemon search contract
on:
  push:
    branches: [main]
    paths:
      - src/core/mod.rs
      - src/core/search.rs
      - src/core/search_result_document.rs
      - src/core/global_promotion.rs
      - src/cli/mod.rs
      - src/cli/daemon_search_diagnostics.rs
      - src/daemon/server.rs
      - src/daemon/search_result_contract*.rs
      - docs/schemas/ee.search.document.v1.json
      - docs/schemas/ee.daemon.search.response.v3.json
      - scripts/delivery/daemon-search-contract-56/**
      - .github/workflows/daemon-search-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daemon-search-contract
  cancel-in-progress: false
jobs:
  verify-and-integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      EE_DAEMON_SEARCH_CONTRACT_DELIVERY: '3'
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate the reviewed producer, validator, and diagnostic changes
        run: |
          set -euo pipefail
          python3 scripts/delivery/daemon-search-contract-56/test_apply.py
          python3 scripts/delivery/daemon-search-contract-56/test_integrate.py
          python3 scripts/delivery/daemon-search-contract-56/integrate.py
          python3 scripts/delivery/daemon-search-contract-56/integrate.py --check
          git diff --check
          git diff > "$RUNNER_TEMP/daemon-search-contract-source.patch"
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            prefetch-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            evidence-export-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Prepare the exact source patch for verification
        run: |
          set -euo pipefail
          trap 'tail -n 120 "$RUNNER_TEMP"/daemon-search-contract-*.log 2>/dev/null || true' EXIT
          paths=(src/core/mod.rs src/core/search.rs src/core/search_result_document.rs src/cli/mod.rs src/cli/daemon_search_diagnostics.rs src/daemon/server.rs src/daemon/search_result_contract.rs src/daemon/search_result_contract_tests.rs src/core/global_promotion.rs docs/schemas/ee.daemon.search.response.v3.json)
          rustfmt --edition 2024 --config skip_children=true "${paths[@]:0:9}"
          python3 scripts/delivery/daemon-search-contract-56/integrate.py --check
          git diff --check
          git diff > "$RUNNER_TEMP/daemon-search-contract-source.patch"
      - name: Check normal production library builds
        run: |
          set -euo pipefail
          trap 'tail -n 120 "$RUNNER_TEMP/daemon-search-contract-check.log" 2>/dev/null || true' EXIT
          cargo check --locked --lib > "$RUNNER_TEMP/daemon-search-contract-check.log" 2>&1
      - name: Verify eighteen schema, wire, and fallback regression tests
        run: |
          set -euo pipefail
          trap 'tail -n 120 "$RUNNER_TEMP"/daemon-search-contract-*.log 2>/dev/null || true' EXIT
          cargo test --locked --lib daemon::server::search_result_contract::tests -- --test-threads=2 > "$RUNNER_TEMP/daemon-search-contract-tests.log" 2>&1
          grep -Fq 'test result: ok. 11 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/daemon-search-contract-tests.log"
          cargo test --locked --lib core::search_result_document::tests > "$RUNNER_TEMP/daemon-search-contract-shared.log" 2>&1
          grep -Fq 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/daemon-search-contract-shared.log"
          cargo test --locked --lib cli::daemon_search_diagnostics::tests > "$RUNNER_TEMP/daemon-search-contract-diagnostics.log" 2>&1
          grep -Fq 'test result: ok. 4 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/daemon-search-contract-diagnostics.log"
          cargo test --locked --lib daemon::server::tests::daemon_search_result_rejects_schema_and_field_drift -- --exact > "$RUNNER_TEMP/daemon-search-contract-existing.log" 2>&1
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/daemon-search-contract-existing.log"
      - name: Check production Clippy without suppressing warnings
        run: |
          set -euo pipefail
          trap 'tail -n 120 "$RUNNER_TEMP/daemon-search-contract-clippy.log" 2>/dev/null || true' EXIT
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/daemon-search-contract-clippy.log" 2>&1
      - name: Commit the verified source directly to main
        run: |
          set -euo pipefail
          paths=(src/core/mod.rs src/core/search.rs src/core/search_result_document.rs src/cli/mod.rs src/cli/daemon_search_diagnostics.rs src/daemon/server.rs src/daemon/search_result_contract.rs src/daemon/search_result_contract_tests.rs src/core/global_promotion.rs docs/schemas/ee.daemon.search.response.v3.json)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "${paths[@]}"; then
            base=$(git rev-parse HEAD)
            git add -- "${paths[@]}"
            git commit -m 'fix(search): activate shared daemon result contract and lossless diagnostics (#56)' -m 'Wire the typed canonical producer and shared daemon validator, allow optional string/null calibrationId, preserve String and serde validation errors in normal CLI builds, and activate framed SearchReport round-trip regressions. Preserve the concurrent signed database row-count repair. Normal cargo check, eighteen targeted tests, and production Clippy passed before this commit.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}" scripts/delivery/daemon-search-contract-56 .github/workflows/daemon-search-contract.yml
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/daemon-search-contract-source-sha.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: daemon-search-contract-verification
          path: ${{ runner.temp }}/daemon-search-contract-*
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
