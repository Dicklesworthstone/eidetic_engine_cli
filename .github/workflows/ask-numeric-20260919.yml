name: Numeric setting answers

on:
  push:
    branches: [main]
    paths:
      - 'src/core/ask*.rs'
      - 'tests/contracts/ask*.rs'
      - 'docs/schemas/ee.ask.v1.json'
      - '.github/workflows/ask-numeric-20260919.yml'
  workflow_dispatch:

# The production changes are integrated. Verification must not modify main or
# replay historical delivery patches over later source changes.
permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-numeric-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ask-numeric-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            ask-evidence-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Record the exact unmodified source
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/numeric-source-sha.log"
          test -z "$(git status --porcelain --untracked-files=no)"
          grep -qF 'mod numeric_answer_tests;' src/core/ask.rs
          grep -qF 'fn same_numeric_context(' src/core/ask.rs
          grep -qF 'mod polarity_tests;' src/core/ask_numeric_tests.rs
          grep -qF 'mod polarity;' tests/contracts/ask_numeric.rs
      - name: Compile production library
        id: compile
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/numeric-check.log" 2>&1 || status=$?
          tail -n 140 "$RUNNER_TEMP/numeric-check.log"
          exit "$status"
      - name: Execute assignment classifiers in the real ask module
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          status=0
          cargo test --locked --lib core::ask::numeric:: -- --nocapture > "$RUNNER_TEMP/numeric-classifier.log" 2>&1 || status=$?
          tail -n 180 "$RUNNER_TEMP/numeric-classifier.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/numeric-classifier.log" || status=1
          grep -q 'calendar_and_clock_literals_validate_boundaries_without_locale_guessing ... ok' "$RUNNER_TEMP/numeric-classifier.log" || status=1
          grep -q 'public_ask_retains_a_conflicting_setting_beyond_the_candidate_cap ... ok' "$RUNNER_TEMP/numeric-classifier.log" || status=1
          exit "$status"
      - name: Execute real CLI numeric contracts
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          status=0
          cargo test --locked --test contracts ask_lifecycle::numeric:: -- --nocapture > "$RUNNER_TEMP/numeric-cli.log" 2>&1 || status=$?
          tail -n 180 "$RUNNER_TEMP/numeric-cli.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/numeric-cli.log" || status=1
          exit "$status"
      - name: Execute complete ask engine regressions
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          status=0
          cargo test --locked --lib core::ask:: -- --nocapture > "$RUNNER_TEMP/numeric-engine.log" 2>&1 || status=$?
          tail -n 260 "$RUNNER_TEMP/numeric-engine.log"
          grep -q 'numeric_answer_tests::numeric_assignments_are_disclosed_not_confidently_combined ... ok' "$RUNNER_TEMP/numeric-engine.log" || status=1
          grep -q 'numeric_answer_tests::polarity_tests::compatible_negation_cannot_steal_the_numeric_opposition_slot ... ok' "$RUNNER_TEMP/numeric-engine.log" || status=1
          grep -q 'independent_corroboration_survives_a_corpus_larger_than_the_scan_cap ... ok' "$RUNNER_TEMP/numeric-engine.log" || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: numeric-setting-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/numeric-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-numeric-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
