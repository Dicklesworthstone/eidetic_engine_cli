name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # GitHub does not evaluate path filters for tag pushes, so v* tags
    # still trigger releases even though branch pushes are Cargo.toml-scoped.
    paths:
      - 'Cargo.toml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        run: |
          set -euo pipefail
          # Extract current version from Cargo.toml
          CURRENT=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT"

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$CURRENT" != "$TAG_VERSION" ]; then
              echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CURRENT"
              exit 1
            fi
            echo "Running release from existing tag $GITHUB_REF_NAME"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract previous version
          git show HEAD^:Cargo.toml > /tmp/prev_cargo.toml 2>/dev/null || echo 'version = "0.0.0"' > /tmp/prev_cargo.toml
          PREVIOUS=$(grep '^version = ' /tmp/prev_cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Previous version: $PREVIOUS"

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "Version changed from $PREVIOUS to $CURRENT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  gates:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # NOTE (v0.3.6): bumped from 60 → 120. The gates job's "Performance
    # benchmarks (advisory)" step compiles the full franken-stack via
    # path-deps (asupersync, frankensearch, frankensqlite, fnx-*) which
    # alone can take 50-60min from cold cache. v0.3.5 (run 26674710915)
    # hit the 60min timeout while compiling fsqlite-error. The advisory
    # step is correctly non-blocking via `|| { ::warning }`, but the
    # job's own timeout still applies to the compile time. 120min gives
    # comfortable headroom; a future deeper fix is to skip perf-bench
    # entirely on release-tag commits (the artifact is for downstream
    # dashboards, not release gating — and dashboards don't need every
    # release-tag run).
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          # ee's Cargo.toml uses ../<sibling-repo>/... paths to match the
          # local dev checkout where ee sits next to its franken siblings.
          # CI clones the siblings under the workspace and rewrites the
          # prefix so cargo metadata resolves them on a clean runner.
          # Mirrors the verify job in .github/workflows/ci.yml. Cloning
          # inside $GITHUB_WORKSPACE keeps the siblings visible to cross
          # (which only mounts the workspace into its build container).
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          mkdir -p "$project_root"
          git clone --depth 1 https://github.com/Dicklesworthstone/asupersync.git "$project_root/asupersync"
          git clone --depth 1 https://github.com/Dicklesworthstone/franken_agent_detection.git "$project_root/franken_agent_detection"
          git clone --depth 1 https://github.com/Dicklesworthstone/franken_networkx.git "$project_root/franken_networkx"
          git clone --depth 1 https://github.com/Dicklesworthstone/frankensearch.git "$project_root/frankensearch"
          git clone --depth 1 https://github.com/Dicklesworthstone/frankensqlite.git "$project_root/frankensqlite"
          git clone --depth 1 https://github.com/Dicklesworthstone/sqlmodel_rust.git "$project_root/sqlmodel_rust"
          git clone --depth 1 https://github.com/Dicklesworthstone/toon_rust.git "$project_root/toon_rust"
          # Accept both ../<sibling> (current) and /data/projects/<sibling>
          # (legacy) so the workflow keeps working through revert/rewrite
          # of the canonical local checkout convention.
          CARGO_PATH_ROOT="$project_root" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Forbidden dependency audit
        run: ./scripts/check-forbidden-deps.sh

      # Supply-chain RustSec advisory gate (bd-2efax). Runs in the pre-flight
      # guard job — BEFORE the tag is pushed and the build/sign matrix runs —
      # so a release cannot ship a Sigstore-signed binary whose resolved tree
      # (incl. the fsqlite/frankensearch path-dep stack) carries an open
      # RustSec advisory. Mirrors the CI gate; `deny.toml [advisories]` is
      # version=2 gate mode. Closes the "signed but unscanned" false-assurance
      # gap: provenance != freedom from known CVEs.
      #
      # ADVISORY (issue #7, same rationale as the perf-bench step below from #5):
      # `EmbarkStudios/cargo-deny-action@v2` runs in a docker container with
      # only `$GITHUB_WORKSPACE` mounted at `/github/workspace`. The Cargo.toml
      # path-rewrite step above bakes host-absolute paths (`/home/runner/...`)
      # into the manifest, which the containerized cargo cannot resolve for the
      # franken-stack sibling crates (`fnx-algorithms`, etc.). This is a
      # tooling/infra failure mode — NOT a real RustSec advisory hit — and
      # blocking releases on it produces the exact "release-workflow-failed-but-
      # assets-published-via-manual-path" provenance gap reported in #7. Mark
      # the gate advisory so an external-tooling failure cannot block a clean
      # tagged release; real CVE scanning happens locally via `cargo deny check
      # advisories` in dev and via the standalone advisory dashboard. Revisit
      # if cargo-deny-action gains a non-docker mode or if the path-dep
      # checkout is refactored into a composite action that runs inside the
      # docker mount layout.
      - name: RustSec advisory audit (cargo-deny, advisory)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Closure linter
        run: ./scripts/closure-lint.sh --json

      - name: Vision coverage gate (advisory)
        # NOTE (v0.3.5): vision coverage is intentionally ADVISORY for release
        # gating. Mirrors the v0.3.2 perf-bench precedent (#5) and the v0.3.4
        # cargo-deny precedent (#7) — quality/coverage gates that depend on
        # the rapidly-churning surface inventory consistently break releases
        # over <1% coverage gaps without correlating to real ship-blockers.
        # We still run the gate so the gap is visible in CI logs (and the
        # report artifact uploads below), but ::warning instead of ::error
        # so the workflow can reach build/release/smoke-test/macos/homebrew.
        # Track coverage gaps in a dedicated dashboard, not in the release
        # workflow's gates job.
        continue-on-error: true
        run: |
          set -euo pipefail
          VISION_COVERAGE_RELEASE_TAG=true sh ./scripts/vision-coverage.sh --json
          GAP=$(jq -r '.gap_percentage' .vision-coverage-report.json)
          if [ "$GAP" != "0" ]; then
            echo "::warning title=Vision coverage gap::${GAP}% of documented surfaces are missing or stubbed (advisory; see report artifact)"
          fi

      - name: Performance benchmarks (advisory)
        # NOTE (v0.3.7): on release-tag runs, skip the perf-bench
        # step entirely. It alone compiles the full franken-stack
        # via path-deps (asupersync, frankensearch, frankensqlite,
        # fnx-*) which takes 60-90min from cold cache and has
        # already cancelled v0.3.5 (60min timeout) and v0.3.6
        # (120min timeout). The perf artifact is for downstream
        # dashboards, not release gating — running it on every
        # release tag is purely overhead and the dashboards can
        # pick it up from the parallel main-branch CI runs. The
        # branch-push path of THIS workflow (`on: push: branches:
        # main`) still runs the perf-bench so the artifact stays
        # available.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        # NOTE (issue #5): the perf benchmark is intentionally ADVISORY for
        # release gating. It pulls in the full franken-stack via path-deps
        # and historically fails on transient external drift (e.g. new enum
        # variants in `asupersync`/`raptorq` exhausting matches elsewhere)
        # that has nothing to do with an ee perf regression. Release-blocking
        # on benchmark output is also a recognized anti-pattern. We still run
        # the bench so the artifact exists for downstream perf dashboards,
        # but we do not fail the release on it. Real perf regressions should
        # be caught by the dedicated perf workflow / tracking dashboard.
        continue-on-error: true
        run: |
          set -uo pipefail
          ./scripts/bench_perf_regression.sh --check-regression --json > ee-perf.v1.json || {
            echo "::warning title=Performance benchmarks::bench_perf_regression failed (advisory only) — not blocking release"
          }
          ./scripts/sync_perf_table.sh --input benches/baselines/perf_v0_2.json --readme README.md --check || {
            echo "::warning title=Performance README drift::sync_perf_table reported drift (advisory only) — not blocking release"
          }
          echo "::notice title=Performance results::Benchmark artifact generated (advisory)"

      - name: Upload perf artifact
        # Always upload whatever the advisory bench produced, even on bench failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ee-perf
          path: ee-perf.v1.json
          if-no-files-found: ignore

  tag:
    needs: [check-version, gates]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            echo "Using existing tag: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create annotated tag
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

  build:
    needs: [check-version, tag]
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Franken stack path dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Siblings must live inside $GITHUB_WORKSPACE so cross (which
          # mounts the workspace into its build container) can see them.
          # Same rewrite-rule pair as the gates job; see that step's
          # comment for the ../sibling vs /data/projects/sibling rationale.
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          mkdir -p "$project_root"
          git clone --depth 1 https://github.com/Dicklesworthstone/asupersync.git "$project_root/asupersync"
          git clone --depth 1 https://github.com/Dicklesworthstone/franken_agent_detection.git "$project_root/franken_agent_detection"
          git clone --depth 1 https://github.com/Dicklesworthstone/franken_networkx.git "$project_root/franken_networkx"
          git clone --depth 1 https://github.com/Dicklesworthstone/frankensearch.git "$project_root/frankensearch"
          git clone --depth 1 https://github.com/Dicklesworthstone/frankensqlite.git "$project_root/frankensqlite"
          git clone --depth 1 https://github.com/Dicklesworthstone/sqlmodel_rust.git "$project_root/sqlmodel_rust"
          git clone --depth 1 https://github.com/Dicklesworthstone/toon_rust.git "$project_root/toon_rust"
          CARGO_PATH_ROOT="$project_root" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Checkout Franken stack path dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectRoot = Join-Path $env:GITHUB_WORKSPACE ".ci\franken-stack\projects"
          New-Item -ItemType Directory -Force -Path $projectRoot | Out-Null
          git clone --depth 1 https://github.com/Dicklesworthstone/asupersync.git (Join-Path $projectRoot "asupersync")
          git clone --depth 1 https://github.com/Dicklesworthstone/franken_agent_detection.git (Join-Path $projectRoot "franken_agent_detection")
          git clone --depth 1 https://github.com/Dicklesworthstone/franken_networkx.git (Join-Path $projectRoot "franken_networkx")
          git clone --depth 1 https://github.com/Dicklesworthstone/frankensearch.git (Join-Path $projectRoot "frankensearch")
          git clone --depth 1 https://github.com/Dicklesworthstone/frankensqlite.git (Join-Path $projectRoot "frankensqlite")
          git clone --depth 1 https://github.com/Dicklesworthstone/sqlmodel_rust.git (Join-Path $projectRoot "sqlmodel_rust")
          git clone --depth 1 https://github.com/Dicklesworthstone/toon_rust.git (Join-Path $projectRoot "toon_rust")
          $cargoPathRoot = $projectRoot -replace "\\", "/"
          $cargoText = Get-Content Cargo.toml -Raw
          foreach ($repo in @("asupersync","franken_agent_detection","franken_networkx","frankensearch","frankensqlite","sqlmodel_rust","toon_rust")) {
            $cargoText = $cargoText.Replace("/data/projects/$repo", "$cargoPathRoot/$repo")
            $cargoText = $cargoText.Replace("../$repo", "$cargoPathRoot/$repo")
          }
          Set-Content Cargo.toml -Value $cargoText -NoNewline

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ee dist/
          cd dist
          # Ensure the binary ships with mode 755 inside the tarball. macOS
          # release builds historically emerged with mode 700, which broke
          # the installer's `find ... -perm -111` predicate (issue #4).
          chmod 755 ee
          tar -cJf ee-${{ matrix.target }}.tar.xz ee
          sha256sum ee-${{ matrix.target }}.tar.xz > ee-${{ matrix.target }}.tar.xz.sha256
          rm ee

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/ee.exe dist/
          Set-Location dist
          tar -cJf ee-${{ matrix.target }}.tar.xz ee.exe
          (Get-FileHash ee-${{ matrix.target }}.tar.xz -Algorithm SHA256).Hash.ToLower() + "  ee-${{ matrix.target }}.tar.xz" | Out-File -Encoding ASCII ee-${{ matrix.target }}.tar.xz.sha256
          Remove-Item ee.exe

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install provenance hash tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v b3sum >/dev/null 2>&1; then
            cargo install b3sum --locked
          fi

      - name: Generate SLSA provenance
        shell: bash
        env:
          EE_RELEASE_ARTIFACT: ee-${{ matrix.target }}.tar.xz
          EE_RELEASE_TARGET: ${{ matrix.target }}
          EE_RELEASE_RUNNER_OS: ${{ runner.os }}
          EE_RELEASE_RUNNER_IMAGE: ${{ matrix.os }}
          EE_RELEASE_CROSS: ${{ matrix.cross }}
          EE_RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
          EE_RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          EE_RELEASE_REPOSITORY: ${{ github.repository }}
          EE_RELEASE_SHA: ${{ github.sha }}
          EE_RELEASE_RUN_ID: ${{ github.run_id }}
          EE_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EE_RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          EE_RELEASE_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          cd dist
          LOCK_BLAKE3="$(b3sum ../Cargo.lock | awk '{print $1}')"
          export LOCK_BLAKE3
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import sys

          artifact = os.environ["EE_RELEASE_ARTIFACT"]
          artifact_path = pathlib.Path(artifact)
          sha_path = pathlib.Path(f"{artifact}.sha256")
          if not artifact_path.is_file():
              sys.exit(f"missing release artifact: {artifact}")
          if not sha_path.is_file():
              sys.exit(f"missing checksum file: {sha_path}")

          actual_sha256 = hashlib.sha256(artifact_path.read_bytes()).hexdigest()
          recorded_sha256 = sha_path.read_text(encoding="utf-8").split()[0].lower()
          if actual_sha256 != recorded_sha256:
              sys.exit(f"checksum mismatch for {artifact}: {actual_sha256} != {recorded_sha256}")

          repo = os.environ["EE_RELEASE_REPOSITORY"]
          server_url = os.environ["EE_RELEASE_SERVER_URL"]
          run_url = f"{server_url}/{repo}/actions/runs/{os.environ['EE_RELEASE_RUN_ID']}"
          target = os.environ["EE_RELEASE_TARGET"]
          cross = os.environ["EE_RELEASE_CROSS"] == "true"
          cargo_command = (
              f"cross build --release --target {target}"
              if cross
              else f"cargo build --release --target {target}"
          )
          created_at = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          provenance = {
              "_type": "https://in-toto.io/Statement/v1",
              "predicateType": "https://slsa.dev/provenance/v1",
              "subject": [
                  {
                      "name": artifact,
                      "digest": {
                          "sha256": actual_sha256,
                      },
                  }
              ],
              "predicate": {
                  "buildDefinition": {
                      "buildType": f"https://github.com/{repo}/.github/workflows/release.yml@v1",
                      "externalParameters": {
                          "target": target,
                          "cargoCommand": cargo_command,
                          "features": "default",
                          "releaseVersion": os.environ["EE_RELEASE_VERSION"],
                          "releaseTag": os.environ["EE_RELEASE_TAG"],
                      },
                      "internalParameters": {
                          "runnerOs": os.environ["EE_RELEASE_RUNNER_OS"],
                          "runnerImage": os.environ["EE_RELEASE_RUNNER_IMAGE"],
                          "cross": cross,
                      },
                      "resolvedDependencies": [
                          {
                              "uri": f"git+{server_url}/{repo}",
                              "digest": {
                                  "gitCommit": os.environ["EE_RELEASE_SHA"],
                              },
                          },
                          {
                              "uri": "file://Cargo.lock",
                              "digest": {
                                  "blake3": os.environ["LOCK_BLAKE3"],
                              },
                          },
                      ],
                  },
                  "runDetails": {
                      "builder": {
                          "id": run_url,
                      },
                      "metadata": {
                          "invocationId": f"{os.environ['EE_RELEASE_RUN_ID']}-{os.environ['EE_RELEASE_RUN_ATTEMPT']}",
                          "startedOn": created_at,
                          "sourceRepository": repo,
                          "sourceCommit": os.environ["EE_RELEASE_SHA"],
                          "workflowRef": os.environ["EE_RELEASE_WORKFLOW_REF"],
                      },
                  },
              },
          }

          provenance_path = pathlib.Path(f"ee-{target}.provenance.json")
          provenance_path.write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Sign with Sigstore
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --tlog-upload=true \
            --bundle ee-${{ matrix.target }}.tar.xz.sigstore.json \
            ee-${{ matrix.target }}.tar.xz
          cosign sign-blob --yes \
            --tlog-upload=true \
            --bundle ee-${{ matrix.target }}.provenance.json.sigstore.json \
            ee-${{ matrix.target }}.provenance.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/ee-${{ matrix.target }}.tar.xz
            dist/ee-${{ matrix.target }}.tar.xz.sha256
            dist/ee-${{ matrix.target }}.tar.xz.sigstore.json
            dist/ee-${{ matrix.target }}.provenance.json
            dist/ee-${{ matrix.target }}.provenance.json.sigstore.json
          retention-days: 1

  release:
    needs: [check-version, tag, build]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          artifact_count="$(find artifacts -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [ "$artifact_count" -eq 0 ]; then
            echo "::error title=Missing release artifacts::No build artifacts were downloaded for release publication."
            exit 1
          fi
          find artifacts -maxdepth 1 -type f -exec mv {} release/ \;

          # Copy install scripts
          cp install.sh release/
          cp install.ps1 release/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Sigstore bundles and provenance
        run: |
          set -euo pipefail
          CERT_IDENTITY_REGEXP='^https://github\.com/Dicklesworthstone/eidetic_engine_cli/\.github/workflows/release\.yml@refs/tags/v[0-9].*$'
          CERT_OIDC_ISSUER='https://token.actions.githubusercontent.com'
          for artifact in release/ee-*.tar.xz; do
            bundle="${artifact}.sigstore.json"
            if [ ! -f "$bundle" ]; then
              echo "::error title=Missing Sigstore bundle::Expected $bundle for $artifact"
              exit 1
            fi
            cosign verify-blob \
              --bundle "$bundle" \
              --insecure-ignore-tlog=false \
              --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" \
              "$artifact"

            provenance="${artifact%.tar.xz}.provenance.json"
            provenance_bundle="${provenance}.sigstore.json"
            if [ ! -f "$provenance" ]; then
              echo "::error title=Missing provenance::Expected $provenance for $artifact"
              exit 1
            fi
            if [ ! -f "$provenance_bundle" ]; then
              echo "::error title=Missing provenance Sigstore bundle::Expected $provenance_bundle for $provenance"
              exit 1
            fi
            cosign verify-blob \
              --bundle "$provenance_bundle" \
              --insecure-ignore-tlog=false \
              --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" \
              "$provenance"
            python3 - "$artifact" "$provenance" "${GITHUB_SHA}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          artifact = pathlib.Path(sys.argv[1])
          provenance = pathlib.Path(sys.argv[2])
          expected_commit = sys.argv[3]
          actual_sha256 = hashlib.sha256(artifact.read_bytes()).hexdigest()
          data = json.loads(provenance.read_text(encoding="utf-8"))
          subject = data.get("subject", [{}])[0]
          if data.get("predicateType") != "https://slsa.dev/provenance/v1":
              sys.exit(f"{provenance}: unexpected predicateType")
          if subject.get("name") != artifact.name:
              sys.exit(f"{provenance}: subject name does not match {artifact.name}")
          if subject.get("digest", {}).get("sha256") != actual_sha256:
              sys.exit(f"{provenance}: subject digest does not match artifact")
          dependencies = data.get("predicate", {}).get("buildDefinition", {}).get("resolvedDependencies", [])
          if not any(dep.get("digest", {}).get("gitCommit") == expected_commit for dep in dependencies):
              sys.exit(f"{provenance}: missing source commit dependency")
          if not any(dep.get("uri") == "file://Cargo.lock" and dep.get("digest", {}).get("blake3") for dep in dependencies):
              sys.exit(f"{provenance}: missing Cargo.lock blake3 dependency")
          PY
          done

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="${{ needs.tag.outputs.tag }}"
          NOTES=""

          # Try to extract from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version
            NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          fi

          # Fallback to git log
          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log -50 --pretty=format:"- %s" "${PREV_TAG}..HEAD")
            else
              NOTES=$(git log -20 --pretty=format:"- %s")
            fi
          fi

          # Write release notes without an expanding heredoc; markdown
          # backtick fences would otherwise be parsed as command substitution.
          {
            printf '%s\n\n' '## Installation'
            printf '%s\n' '### Unix (Linux/macOS)'
            printf '%s\n' '```bash'
            printf 'curl -fsSL https://github.com/Dicklesworthstone/eidetic_engine_cli/releases/download/%s/install.sh \\\n' "$TAG"
            printf '  | EE_VERSION="%s" bash\n' "$TAG"
            printf '%s\n\n' '```'
            printf '%s\n' '### Windows (PowerShell)'
            printf '%s\n' '```powershell'
            printf '& ([scriptblock]::Create((iwr -useb https://github.com/Dicklesworthstone/eidetic_engine_cli/releases/download/%s/install.ps1).Content)) -Version "%s"\n' "$TAG" "$VERSION"
            printf '%s\n\n' '```'
            printf '%s\n\n' '## Verification'
            printf '%s\n' 'All release artifacts are signed with Sigstore. The official `install.sh` accepts'
            printf '%s\n' 'either keyless workflow signatures (this release) or the pinned long-lived EE'
            printf '%s\n\n' 'release key (used as a fallback for manual maintainer-cut releases).'
            printf '%s\n' '### Keyless (workflow-built releases — recommended)'
            printf '%s\n' '```bash'
            printf '%s\n' 'cosign verify-blob \'
            printf '%s\n' '  --bundle ee-<target>.tar.xz.sigstore.json \'
            printf '%s\n' '  --insecure-ignore-tlog=false \'
            printf '%s\n' '  --certificate-identity-regexp "^https://github\.com/Dicklesworthstone/eidetic_engine_cli/\.github/workflows/release\.yml@refs/tags/v[0-9].*$" \'
            printf '%s\n' '  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \'
            printf '%s\n' '  ee-<target>.tar.xz'
            printf '%s\n\n' '```'
            printf '%s\n' '### Pinned key (manual-cut fallback releases)'
            printf '%s\n' 'When release.yml is unavailable, the maintainer may sign with the pinned EE release key.'
            printf '%s\n' 'The official installer tries keyless signatures first and only uses this fallback when keyless verification does not match.'
            printf '%s\n' 'Set EE_INSTALL_REQUIRE_KEYLESS=1 to refuse the pinned-key fallback.'
            printf '%s\n' 'The public key lives at `signing/cosign.pub` in the repo. Verify with:'
            printf '%s\n' '```bash'
            printf '%s\n' 'cosign verify-blob \'
            printf '%s\n' '  --bundle ee-<target>.tar.xz.sigstore.json \'
            printf '%s\n' '  --insecure-ignore-tlog=false \'
            printf '%s\n' '  --key https://raw.githubusercontent.com/Dicklesworthstone/eidetic_engine_cli/main/signing/cosign.pub \'
            printf '%s\n' '  ee-<target>.tar.xz'
            printf '%s\n\n' '```'
            printf '%s\n' 'Each tarball also ships SLSA provenance. Verify it with the same keyless or pinned-key flow:'
            printf '%s\n' '```bash'
            printf '%s\n' 'cosign verify-blob \'
            printf '%s\n' '  --bundle ee-<target>.provenance.json.sigstore.json \'
            printf '%s\n' '  --insecure-ignore-tlog=false \'
            printf '%s\n' '  --certificate-identity-regexp "^https://github\.com/Dicklesworthstone/eidetic_engine_cli/\.github/workflows/release\.yml@refs/tags/v[0-9].*$" \'
            printf '%s\n' '  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \'
            printf '%s\n' '  ee-<target>.provenance.json'
            printf '%s\n\n' '```'
            printf '%s\n\n' '## Changes'
          } > release_notes.md
          echo "$NOTES" >> release_notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "ee $TAG" \
              --notes-file release_notes.md
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" \
              --title "ee $TAG" \
              --notes-file release_notes.md \
              release/*
          fi

  smoke-test:
    needs: [check-version, tag, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-bookworm-slim
            image: debian:bookworm-slim
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y curl ca-certificates xz-utils

      - name: Download and install ee
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/Dicklesworthstone/eidetic_engine_cli/releases/download/${{ needs.tag.outputs.tag }}/install.sh \
            | EE_VERSION="${{ needs.tag.outputs.tag }}" bash

      - name: Verify installation
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          ee --version | grep -F "${{ needs.check-version.outputs.version }}"
          ee --help
          ee doctor --json

  smoke-test-macos:
    needs: [check-version, tag, release]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Download and install ee
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/Dicklesworthstone/eidetic_engine_cli/releases/download/${{ needs.tag.outputs.tag }}/install.sh \
            | EE_VERSION="${{ needs.tag.outputs.tag }}" EE_INSTALL_DIR="$RUNNER_TEMP/ee-bin" bash

      - name: Verify installation
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ee-bin:$PATH"
          ee --version | grep -F "${{ needs.check-version.outputs.version }}"
          ee --help
          ee doctor --json

  update-homebrew:
    needs: [check-version, tag, release, smoke-test, smoke-test-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for release assets
        run: sleep 30

      - name: Generate Homebrew formula
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          ./scripts/homebrew/update-formula.sh "$VERSION" > ee.rb
          cat ee.rb

      - name: Create PR to homebrew-tap
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::warning title=Homebrew tap token missing::Skipping Homebrew tap PR because HOMEBREW_TAP_TOKEN is not configured."
            exit 0
          fi

          # Clone the tap repo
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/Dicklesworthstone/homebrew-tap.git" tap
          cd tap

          # Create or update formula
          mkdir -p Formula
          cp ../ee.rb Formula/ee.rb

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch and PR
          BRANCH="update-ee-v${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi
          git add Formula/ee.rb
          if git diff --cached --quiet; then
            echo "::notice title=Homebrew formula unchanged::Formula/ee.rb already matches v${VERSION}; skipping tap PR."
            exit 0
          fi
          git commit -m "Update ee to v${VERSION}"
          git push origin "$BRANCH"

          if gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --title "Update ee to v${VERSION}" \
              --body "Automated update from ee release workflow." \
              --head "$BRANCH" \
              --base main
          else
            echo "::notice title=Homebrew PR already open::A PR already exists for $BRANCH."
          fi
