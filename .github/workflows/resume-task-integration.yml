name: Resume task integration

on:
  push:
    branches: [main]
    paths: [.github/workflows/resume-task-integration.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-task-integration
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Apply the exact initializer correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/cli/mod.rs)" = b24d3333595953388402bbba60997510b776c439
          cat > "$RUNNER_TEMP/resume-initializers.patch" <<'PATCH'
          diff --git a/src/cli/mod.rs b/src/cli/mod.rs
          --- a/src/cli/mod.rs
          +++ b/src/cli/mod.rs
          @@ -70000,9 +70000,10 @@
               fn resume_human_reports_candidate_last_write_and_truncated_outcome() -> TestResult {
                   let report = crate::core::resume::ResumeReport {
                       schema: crate::core::resume::RESUME_SCHEMA_V1,
                       workspace_id: "wsp_fixture".to_owned(),
                       episodic_total: 0,
                       sessions: Vec::new(),
                       transcript_history: crate::core::resume::ResumeTranscriptHistory::default(),
          +            task_frames: crate::core::resume::ResumeTaskFrames::default(),
                       open_loops: crate::core::resume::OpenLoops::default(),
                       stale_count: 0,
          @@ -70100,9 +70101,10 @@
               fn resume_human_preserves_unavailable_nearby_store_truth() -> TestResult {
                   let report = crate::core::resume::ResumeReport {
                       schema: crate::core::resume::RESUME_SCHEMA_V1,
                       workspace_id: "wsp_fixture".to_owned(),
                       episodic_total: 0,
                       sessions: Vec::new(),
                       transcript_history: crate::core::resume::ResumeTranscriptHistory::default(),
          +            task_frames: crate::core::resume::ResumeTaskFrames::default(),
                       open_loops: crate::core::resume::OpenLoops::default(),
                       stale_count: 0,
          @@ -70200,9 +70202,10 @@
               fn resume_human_reports_exact_open_loop_totals_and_truncation() -> TestResult {
                   let report = crate::core::resume::ResumeReport {
                       schema: crate::core::resume::RESUME_SCHEMA_V1,
                       workspace_id: "wsp_fixture".to_owned(),
                       episodic_total: 0,
                       sessions: Vec::new(),
                       transcript_history: crate::core::resume::ResumeTranscriptHistory::default(),
          +            task_frames: crate::core::resume::ResumeTaskFrames::default(),
                       open_loops: crate::core::resume::OpenLoops {
                           revisit_decisions_total: 40,
          PATCH
          git apply --check "$RUNNER_TEMP/resume-initializers.patch"
          git apply "$RUNNER_TEMP/resume-initializers.patch"
          git diff --check
          test "$(git diff --numstat -- src/cli/mod.rs)" = $'3\t0\tsrc/cli/mod.rs'
      - name: Publish checked source directly to main
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = 'https://api.github.com/repos/Dicklesworthstone/eidetic_engine_cli'
          path = 'src/cli/mod.rs'
          expected = 'b24d3333595953388402bbba60997510b776c439'
          def api(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + endpoint, data=data, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          content = Path(path).read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          blob = api('POST', '/git/blobs', {'content': content.decode(), 'encoding': 'utf-8'})
          if blob['sha'] != sha:
              raise SystemExit('Uploaded source differs from the checked candidate')
          for attempt in range(3):
              head = api('GET', '/git/ref/heads/main')['object']['sha']
              current = api('GET', '/contents/' + path + '?ref=' + head)['sha']
              if current == sha:
                  commit = head
                  break
              if current != expected:
                  raise SystemExit('Concurrent CLI edits detected; refusing to replace them')
              parent = api('GET', '/git/commits/' + head)
              tree = api('POST', '/git/trees', {
                  'base_tree': parent['tree']['sha'],
                  'tree': [{'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha}],
              })
              commit = api('POST', '/git/commits', {
                  'message': 'fix(resume): initialize task-frame state in every CLI regression fixture\n\nComplete the three ResumeReport initializers missed when task-frame recovery was added. Preserve the original nearby-store and open-loop assertions; an empty task projection is explicit fixture state, not a production fallback. Exact original CLI blob and patch application checked before publication. Native compilation and regression verdicts are recorded by the separate verification job, not assumed by this commit. No PR or force push.',
                  'tree': tree['sha'], 'parents': [head],
              })['sha']
              try:
                  api('PATCH', '/git/refs/heads/main', {'sha': commit, 'force': False})
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 422 or attempt == 2:
                      raise
                  time.sleep(1)
          else:
              raise SystemExit('Main kept advancing; source publication refused')
          print('PUBLISHED_SOURCE_COMMIT=' + commit)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commit + '\n')
          PY
  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: resume-task-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Compile and exercise the exact published source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resume-task"
          git rev-parse HEAD | tee "$RUNNER_TEMP/resume-task/source.log"
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/resume-task/check.log"
          for filter in 'core::resume::tasks::tests::' 'core::task_frame::' 'cli::tests::resume_human_'; do
            name="${filter//:/_}"
            timeout 12m cargo test --locked --lib "$filter" -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/resume-task/$name.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/resume-task/$name.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resume-task-${{ needs.publish.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resume-task/
          retention-days: 7
