name: Resume task integration

on:
  push:
    branches: [main]
    paths: [.github/workflows/resume-task-integration.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-task-integration
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Apply the exact initializer correction
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/resume-initializers.patch" <<'PATCH'
          diff --git a/src/cli/mod.rs b/src/cli/mod.rs
          --- a/src/cli/mod.rs
          +++ b/src/cli/mod.rs
          @@ -70000,9 +70000,10 @@
               fn resume_human_reports_candidate_last_write_and_truncated_outcome() -> TestResult {
                   let report = crate::core::resume::ResumeReport {
                       schema: crate::core::resume::RESUME_SCHEMA_V1,
                       workspace_id: "wsp_fixture".to_owned(),
                       episodic_total: 0,
                       sessions: Vec::new(),
                       transcript_history: crate::core::resume::ResumeTranscriptHistory::default(),
          +            task_frames: crate::core::resume::ResumeTaskFrames::default(),
                       open_loops: crate::core::resume::OpenLoops::default(),
                       stale_count: 0,
          @@ -70100,9 +70101,10 @@
               fn resume_human_preserves_unavailable_nearby_store_truth() -> TestResult {
                   let report = crate::core::resume::ResumeReport {
                       schema: crate::core::resume::RESUME_SCHEMA_V1,
                       workspace_id: "wsp_fixture".to_owned(),
                       episodic_total: 0,
                       sessions: Vec::new(),
                       transcript_history: crate::core::resume::ResumeTranscriptHistory::default(),
          +            task_frames: crate::core::resume::ResumeTaskFrames::default(),
                       open_loops: crate::core::resume::OpenLoops::default(),
                       stale_count: 0,
          @@ -70200,9 +70202,10 @@
               fn resume_human_reports_exact_open_loop_totals_and_truncation() -> TestResult {
                   let report = crate::core::resume::ResumeReport {
                       schema: crate::core::resume::RESUME_SCHEMA_V1,
                       workspace_id: "wsp_fixture".to_owned(),
                       episodic_total: 0,
                       sessions: Vec::new(),
                       transcript_history: crate::core::resume::ResumeTranscriptHistory::default(),
          +            task_frames: crate::core::resume::ResumeTaskFrames::default(),
                       open_loops: crate::core::resume::OpenLoops {
                           revisit_decisions_total: 40,
          PATCH
          # IDEMPOTENCY GUARD (bd-delivery-lanes-stuck-publish-to-main-hpgw8).
          #
          # This step applied its patch UNCONDITIONALLY, so it was guaranteed to fail once the
          # delivery landed: `git apply` refuses a patch already applied. Red since 2026-09-28
          # by construction.
          #
          # The delivery IS integrated: all three
          # `task_frames: crate::core::resume::ResumeTaskFrames::default(),` lines are present
          # in src/cli/mod.rs (the patch adds exactly three, and the count matches), and
          # ResumeTaskFrames exists at src/core/resume_tasks.rs:73.
          #
          # The numstat assertion moves INSIDE the guard with the apply. `3 0 src/cli/mod.rs`
          # is only true immediately after a fresh application; on the already-delivered path
          # the diff is empty and that assertion would fail for the opposite reason.
          #
          # Only the apply needs guarding here. Unlike the sibling lanes, the publish step is
          # ALREADY idempotent -- it compares the candidate blob sha against the file currently
          # on main via the API and breaks without committing when they match -- so it needs no
          # nothing-to-commit guard.
          if ! grep -Fq 'task_frames: crate::core::resume::ResumeTaskFrames::default(),' src/cli/mod.rs; then
            # The blob pin MOVES IN HERE with the apply, and this is why run 37531124863 still
            # failed after the guard landed: it sat ABOVE the guard, unconditional, under
            # `set -e`. src/cli/mod.rs is now a016fd32... and the pin wants b24d3333..., so the
            # step exited 1 in 15ms with no output at all -- before the guard could skip
            # anything. A guard placed below an unconditional precondition is unreachable.
            #
            # Like the hash pins in revision-record-recovery, it is kept rather than deleted or
            # re-pinned: on the not-yet-delivered path it is the "safe to patch this exact tree"
            # check and still does real work. Re-pinning to today's blob would only reset the
            # clock.
            # bd-aav0v: these two were BARE `test` commands under `set -euo pipefail`, and this
            # step is the one where this lane dies. Its log is COMPLETELY EMPTY -- run
            # 37531124863 emits `##[group]Run set -euo pipefail`, the shell line, `##[endgroup]`,
            # then `##[error]Process completed with exit code 1`, and nothing else. A reader
            # gets a red lane and no cause at all.
            #
            # It is the blob pin that fails. Measured 2026-10-07:
            #   pinned b24d3333595953388402bbba60997510b776c439
            #   actual 7d9ab3e6215a8f76384f082283590d61406d258a
            # The `else` branch below already announces the already-integrated case, so the
            # outer guard works; what is unreported is the not-yet-delivered path refusing
            # because src/cli/mod.rs moved for unrelated reasons.
            #
            # EXIT CODES AND CONDITIONS UNCHANGED -- still exit 1 on exactly the same tests.
            # The pin is deliberately NOT re-pinned: the comment above explains that re-pinning
            # to today's blob only resets the clock, and that reasoning still holds.
            actual_cli_blob=$(git hash-object src/cli/mod.rs)
            if test "$actual_cli_blob" != b24d3333595953388402bbba60997510b776c439; then
              echo "ATTRIBUTION: guard 'src/cli/mod.rs blob pin' STOPPED this lane -- expected b24d3333595953388402bbba60997510b776c439, found $actual_cli_blob. The file has changed since this delivery was authored, so its patch is no longer known to apply to this exact tree. This is a refusal, not a regression: nothing was modified."
              exit 1
            fi
            git apply --check "$RUNNER_TEMP/resume-initializers.patch"
            git apply "$RUNNER_TEMP/resume-initializers.patch"
            git diff --check
            applied_numstat=$(git diff --numstat -- src/cli/mod.rs)
            if test "$applied_numstat" != $'3\t0\tsrc/cli/mod.rs'; then
              echo "ATTRIBUTION: guard 'applied patch must add exactly 3 lines to src/cli/mod.rs' STOPPED this lane -- expected '3<TAB>0<TAB>src/cli/mod.rs', got '$applied_numstat'. The patch applied but changed a different amount than reviewed, so the delivery is not the one that was approved."
              exit 1
            fi
          else
            echo 'resume task-frame initializers already integrated; skipping delivery'
          fi
      - name: Publish checked source directly to main
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = 'https://api.github.com/repos/Dicklesworthstone/eidetic_engine_cli'
          path = 'src/cli/mod.rs'
          expected = 'b24d3333595953388402bbba60997510b776c439'
          def api(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + endpoint, data=data, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          content = Path(path).read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          blob = api('POST', '/git/blobs', {'content': content.decode(), 'encoding': 'utf-8'})
          if blob['sha'] != sha:
              raise SystemExit('Uploaded source differs from the checked candidate')
          for attempt in range(3):
              head = api('GET', '/git/ref/heads/main')['object']['sha']
              current = api('GET', '/contents/' + path + '?ref=' + head)['sha']
              if current == sha:
                  commit = head
                  break
              if current != expected:
                  raise SystemExit('Concurrent CLI edits detected; refusing to replace them')
              parent = api('GET', '/git/commits/' + head)
              tree = api('POST', '/git/trees', {
                  'base_tree': parent['tree']['sha'],
                  'tree': [{'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha}],
              })
              commit = api('POST', '/git/commits', {
                  'message': 'fix(resume): initialize task-frame state in every CLI regression fixture\n\nComplete the three ResumeReport initializers missed when task-frame recovery was added. Preserve the original nearby-store and open-loop assertions; an empty task projection is explicit fixture state, not a production fallback. Exact original CLI blob and patch application checked before publication. Native compilation and regression verdicts are recorded by the separate verification job, not assumed by this commit. No PR or force push.',
                  'tree': tree['sha'], 'parents': [head],
              })['sha']
              try:
                  api('PATCH', '/git/refs/heads/main', {'sha': commit, 'force': False})
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 422 or attempt == 2:
                      raise
                  time.sleep(1)
          else:
              raise SystemExit('Main kept advancing; source publication refused')
          print('PUBLISHED_SOURCE_COMMIT=' + commit)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commit + '\n')
          PY
  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: resume-task-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Compile and exercise the exact published source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resume-task"
          git rev-parse HEAD | tee "$RUNNER_TEMP/resume-task/source.log"
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/resume-task/check.log"
          for filter in 'core::resume::tasks::tests::' 'core::task_frame::' 'cli::tests::resume_human_'; do
            name="${filter//:/_}"
            timeout 12m cargo test --locked --lib "$filter" -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/resume-task/$name.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/resume-task/$name.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resume-task-${{ needs.publish.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resume-task/
          retention-days: 7
