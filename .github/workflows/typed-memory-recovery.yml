name: Typed memory recovery
on:
  push:
    branches: [main]
    paths: [scripts/delivery/typed-fields-transport.patch.xz.b64, scripts/delivery/typed-fields-fence.patch.xz.b64, .github/workflows/typed-memory-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typed-memory-delivery
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Publish typed transport and final-boundary recovery
        id: source
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          decode() {
            base64 -d "scripts/delivery/$1.patch.xz.b64" | xz -d > "$RUNNER_TEMP/$1.patch"
            echo "$2  $RUNNER_TEMP/$1.patch" | sha256sum -c
          }
          publish() {
            local title=$1
            shift
            rustfmt --edition 2024 --config skip_children=true "$@"
            git diff --check
            git add -- "$@"
            if ! git diff --cached --quiet; then
              git commit -m "$title" -m 'Implement durable typed memory preservation (bd-psjkr), retaining registry validation, redaction, authenticated records, tombstones and immutable recovery expectations. Includes real-store regressions. Patch checks and pinned-toolchain formatting passed; compilation and runtime verdicts are reported separately.'
              for attempt in 1 2 3; do
                if git push origin HEAD:main; then break; fi
                test "$attempt" -lt 3
                git fetch origin main
                git diff --exit-code "$base" origin/main -- "$@"
                git merge --no-edit origin/main
                base=$(git rev-parse origin/main)
              done
            fi
            base=$(git rev-parse HEAD)
          }
          decode typed-fields-transport 14ea310de2820b97afbd4f3c55e71a70225b828af178f1d849d678518057dd23
          if ! test -f src/output/jsonl_typed_fields.rs; then
            test "$(git rev-parse HEAD:src/models/jsonl.rs)" = e2fdba5d5dc5c4a53db74b300e53edffafcaa438
            test "$(git rev-parse HEAD:src/output/jsonl_export.rs)" = 13ccb791bbdea4c68c8d221946720d2c076292cf
            test "$(git rev-parse HEAD:src/core/backup.rs)" = e4c2e66227737eb5e2bedd400e408a197d7b2e74
            test "$(git rev-parse HEAD:src/core/jsonl_import.rs)" = c0c0208939ec965c922db4817ed2fe60328e3c13
            git apply --check --whitespace=error-all "$RUNNER_TEMP/typed-fields-transport.patch"
            git apply "$RUNNER_TEMP/typed-fields-transport.patch"
          fi
          publish 'fix(backup): preserve typed memory fields through authenticated JSONL recovery' src/models/jsonl.rs src/output/jsonl_export.rs src/core/backup.rs src/core/jsonl_import.rs src/output/jsonl_typed_fields.rs src/output/jsonl_typed_fields_tests.rs src/core/jsonl_typed_fields_tests.rs
          decode typed-fields-fence 194d2d238cc3020a0bc94f73d6cfa6d363fd236beefc09c058164d39dab203e0
          if ! test -f src/core/backup_typed_memory_recovery_tests.rs; then
            test "$(git rev-parse HEAD:src/core/jsonl_recovery.rs)" = 2e227d4d3c38d6dab673892f2999f4f3a47ba5c0
            test "$(git rev-parse HEAD:src/core/backup_recovery.rs)" = ff67d24be5cba678e857559f41e4828c4f34699d
            git apply --check --whitespace=error-all "$RUNNER_TEMP/typed-fields-fence.patch"
            git apply "$RUNNER_TEMP/typed-fields-fence.patch"
          fi
          publish 'fix(backup): enforce typed-field fidelity at both publication boundaries' src/core/jsonl_recovery.rs src/core/backup_recovery.rs src/core/backup_typed_memory_recovery_tests.rs
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/typed-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/typed-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: typed-memory-source
          path: |
            ${{ runner.temp }}/typed-source-sha.log
            ${{ runner.temp }}/typed-source.tar.gz
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: typed-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            typed-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recorded-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Compile all targets
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/typed-identity.log"
          timeout 20m cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/typed-check.log"
      - name: Test real export, import, backup, decisions and resume
        run: |
          set -euo pipefail
          failed=0
          group() {
            if ! timeout 25m cargo test --locked --lib "$1" -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/typed-$2.log"; then
              failed=1
            elif ! grep -Fq 'test result: ok. 5 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/typed-$2.log"; then
              failed=1
            fi
          }
          group core::jsonl_import::typed_fields_tests import
          group output::jsonl_export::typed_fields::tests export
          group core::backup::recovery::typed_memory_tests recovery
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: typed-memory-results
          path: ${{ runner.temp }}/typed-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
