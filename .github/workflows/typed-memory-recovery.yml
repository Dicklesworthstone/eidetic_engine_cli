name: Typed memory recovery
on:
  push:
    branches: [main]
    paths:
      - 'src/core/backup*.rs'
      - 'src/core/jsonl*.rs'
      - 'src/output/jsonl*.rs'
      - 'src/models/jsonl.rs'
      - 'tests/e2e_backup_restore_roundtrip.rs'
      - 'tests/backup_*.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/typed-memory-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typed-memory-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture immutable recovery source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-source-sha.log"
          git archive --format=tar.gz --output="$RUNNER_TEMP/recovery-source.tar.gz" HEAD \
            src tests scripts .beads/issues.jsonl Cargo.toml Cargo.lock rust-toolchain.toml \
            AGENTS.md COMPREHENSIVE_PLAN.md CLOSE_THE_GAP_PLAN.md .github/workflows/typed-memory-recovery.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-source-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recovery-source-sha.log
            ${{ runner.temp }}/recovery-source.tar.gz
          retention-days: 7
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            typed-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            session-learning-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Test typed transport and durable recovery consumers
        run: |
          set -euo pipefail
          failed=0
          for group in \
            core::jsonl_import::typed_fields_tests \
            output::jsonl_export::typed_fields::tests \
            core::backup::recovery::typed_memory_tests \
            core::backup::recovery::history::imports::tests \
            core::backup::recovery::history::operational::tests \
            core::backup::tests::provenance_recovery_survives_rebackup_without_rejudging_evidence; do
            log="$RUNNER_TEMP/recovery-${group//::/-}.log"
            if ! cargo test --locked --lib "$group" -- --test-threads=2 2>&1 | tee "$log"; then
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: recovery-consumer-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-*.log
          retention-days: 7
      - name: Execute public backup and restore round trips
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --test e2e_backup_restore_roundtrip -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/recovery-public.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/recovery-public.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: recovery-public-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-public.log
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
