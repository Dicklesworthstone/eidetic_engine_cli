name: Resume current state completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/resume-current-state-20260919.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-coherence-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Complete the compiled snapshot repair and preserve fresh-row clock precision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/core/resume.rs)" = 85a0e2d9d8d4bbcbe1edf2eeb0371179cc825b31
          test "$(git hash-object src/db/mod.rs)" = b874261b1bbdf86fe4bf931f4ab33cfd06bece68
          test "$(git hash-object src/core/context.rs)" = 8d597b3d659dad5cebbfb23aa778c6738b02e1c6
          test ! -e src/core/resume_snapshot.rs
          test ! -e src/core/resume_snapshot_tests.rs
          python3 - <<'PYCODE'
          import base64, hashlib, json, lzma, re, subprocess
          from pathlib import Path
          previous = Path('.github/workflows/resume-coherence-20260919.yml').read_text()
          candidates = re.findall(r'^\s+([A-Za-z0-9+/=]{100,})$', previous, re.M)
          assert len(candidates) == 1
          patch = lzma.decompress(base64.b64decode(candidates[0], validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0c03932fb257d6499d54129b48b0a6ec3471ced2d5731b09875d8a3fdad7a237'
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', '-'], input=patch, check=True)
          raw = lzma.decompress(base64.b64decode('', validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'e539a4cd68959f32c14a8bb97206aa9f35b26c08148f9bf1a9bce141e434cd63'
          change = json.loads(raw)
          exec(compile(change['apply'], 'reviewed_recency_clock_fix.py', 'exec'))
          tests = Path('src/core/resume_snapshot_tests.rs')
          tests.write_text(tests.read_text() + change['tests'])
          PYCODE
          rustfmt --edition 2024 --config skip_children=true src/core/resume.rs src/core/resume_snapshot.rs src/core/resume_snapshot_tests.rs src/core/context.rs src/db/mod.rs
          git diff --check
      - name: Verify and publish coherent fresh session state directly to main
        shell: bash
        run: |
          set -euo pipefail
          run_group() {
            local name="$1" filter="$2" count="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/resume-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/resume-$name.log"
            test "$status" -eq 0
            grep -Fq "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/resume-$name.log"
          }
          prove() {
            run_group snapshot core::resume::snapshot::tests 10
            run_group existing core::resume::tests 22
            run_group recency same_instant_fractional_created_at_does_not_outrank_fractionless_head 1
          }
          prove
          paths=(src/core/resume.rs src/core/resume_snapshot.rs src/core/resume_snapshot_tests.rs src/core/context.rs src/db/mod.rs)
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'fix(resume): read coherent session state without losing freshly committed memories' -m 'Pin workspace, bodies, tags and canonical decisions to one owned read snapshot, releasing it before projection/discovery. Preserve precise row-clock bounds in resume and fast context retrieval while separately canonicalizing author-validity and supersession bounds. The original run passed six real-writer tests and exposed two failures caused by clock truncation; repair the production query, not the tests. Ten snapshot/clock regressions, all 22 unchanged resume tests and the existing fractional-time recency regression passed before this source commit.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git fetch origin main
            git diff --exit-code "$base" origin/main -- "${paths[@]}"
            git merge --no-edit origin/main
            prove
            base=$(git rev-parse origin/main)
          done
          git rev-parse HEAD > "$RUNNER_TEMP/resume-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/resume-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: resume-current-state-source-and-tests
          path: ${{ runner.temp }}/resume-*
          retention-days: 7
      - name: Check all targets and production Clippy
        if: ${{ success() }}
        run: |
          failed=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/resume-check.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/resume-check.log"
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/resume-clippy.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/resume-clippy.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: resume-current-state-checks
          path: ${{ runner.temp }}/resume-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
