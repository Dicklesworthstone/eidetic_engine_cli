# Production fix delivered directly to main:
# 401665e3d572f9b2a93eb2939ac6dc012dc26e63.
# Delivery execution record: Actions run 35483358677 (integrate job succeeded).
# Follow-up/test execution record: Actions run 35483544988; consult its actual result.
# This retained workflow cannot modify the repository. Already-dispatched runs
# retain their original definitions and report their results independently.
name: Index rollback durability regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install the repository-pinned nightly toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          case "$channel" in nightly|nightly-*) ;; *) echo 'Expected a nightly toolchain' >&2; exit 1 ;; esac
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rollback-durability-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            rollback-durability-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            diag-fidelity-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Execute all seven rollback durability regressions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/rollback-source-sha.log"
          rustc --version | tee "$RUNNER_TEMP/rollback-toolchain.log"
          cargo test --locked --lib rollback_durability_tests -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/rollback-tests.log"
          grep -Fq 'test result: ok. 7 passed; 0 failed;' "$RUNNER_TEMP/rollback-tests.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: index-rollback-durability-verification
          path: ${{ runner.temp }}/rollback-*.log
          retention-days: 7
