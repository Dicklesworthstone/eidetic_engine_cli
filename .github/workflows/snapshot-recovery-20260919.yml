name: Snapshot generation recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot-recovery-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapshot-recovery-delivery
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # bd-niay4. SINGLE-HALF PIN, AND IT IS CORRECT HERE. "Pin both halves"
          # is CONDITIONAL on a job-level RUSTUP_TOOLCHAIN existing to override
          # the action at invocation time. This workflow sets none, so there is
          # no second half and this is not d315cdc7f. The ref `@nightly` selects
          # FLOATING nightly by itself; this input is what dates the install.
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            diagnostic-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Execute concurrent read-only recovery through the real Cargo suite
        run: |
          set -uo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/snapshot-source-sha.log"
          status=0
          cargo test --locked --test integration_a_d concurrent_search_lexical_arm_e2e::snapshot_index_recovery:: -- --test-threads=1 > "$RUNNER_TEMP/snapshot-e2e.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/snapshot-e2e.log"
          test "$status" -eq 0
          grep -Fq 'test result: ok. 4 passed; 0 failed;' "$RUNNER_TEMP/snapshot-e2e.log"
      - name: Execute real generation and lease regressions
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          for filter in core::index::read_lease::tests core::index::read_lease::snapshot_recovery_tests; do
            log="$RUNNER_TEMP/snapshot-${filter##*::}.log"
            status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$log" 2>&1 || status=$?
            tail -n 80 "$log"
            if test "$status" -ne 0 || ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$log"; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: snapshot-recovery-test-results
          path: ${{ runner.temp }}/snapshot-*.log
          retention-days: 7
      - name: Check all targets and Clippy
        if: ${{ !cancelled() }}
        run: |
          failed=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/snapshot-all-targets.log" 2>&1 || failed=1
          tail -n 80 "$RUNNER_TEMP/snapshot-all-targets.log"
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/snapshot-clippy.log" 2>&1 || failed=1
          tail -n 80 "$RUNNER_TEMP/snapshot-clippy.log"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: snapshot-recovery-verification
          path: ${{ runner.temp }}/snapshot-*.log
          retention-days: 7
