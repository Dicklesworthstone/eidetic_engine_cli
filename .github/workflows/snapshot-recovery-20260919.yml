name: Snapshot generation recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot-recovery-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapshot-recovery-delivery
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # bd-niay4. SINGLE-HALF PIN, AND IT IS CORRECT HERE. "Pin both halves"
          # is CONDITIONAL on a job-level RUSTUP_TOOLCHAIN existing to override
          # the action at invocation time. This workflow sets none, so there is
          # no second half and this is not d315cdc7f. The ref `@nightly` selects
          # FLOATING nightly by itself; this input is what dates the install.
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            diagnostic-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Execute concurrent read-only recovery through the real Cargo suite
        run: |
          set -uo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/snapshot-source-sha.log"
          status=0
          cargo test --locked --test integration_a_d concurrent_search_lexical_arm_e2e::snapshot_index_recovery:: -- --test-threads=1 > "$RUNNER_TEMP/snapshot-e2e.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/snapshot-e2e.log"
          # bd-aav0v: two BARE assertions under errexit -- a tool exit and an exact count --
          # reported as one silent abort. Fail-fast is unchanged; it just says why now.
          #
          # The exact 4 is CORRECT and stays: the filter resolves through
          # tests/concurrent_search_lexical_arm_e2e.rs:25 (`#[path =
          # "snapshot_index_recovery_e2e.rs"]`) to a file holding exactly 4 `#[test]`. That
          # module is `#[cfg(all(unix, feature = "lexical-bm25"))]` and the feature is a Cargo
          # default, so it compiles here -- and if it ever stops, the "reported nothing" arm
          # below catches it instead of letting a silent zero look like a pass.
          ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/snapshot-e2e.log" | head -1)
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: arm 'snapshot_index_recovery e2e' FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
            exit 1
          fi
          if test -z "$ran"; then
            echo "ATTRIBUTION: arm 'snapshot_index_recovery e2e' FAILED -- cargo exited 0 but emitted NO 'test result: ok. N passed; 0 failed' line; the suite reported nothing, which is what a feature-gated module that stopped compiling looks like"
            exit 1
          fi
          if test "$ran" != 4; then
            echo "ATTRIBUTION: arm 'snapshot_index_recovery e2e' FAILED -- expected exactly 4 passing, counted $ran; tests/snapshot_index_recovery_e2e.rs holds 4 #[test], so check whether one was added, removed or feature-gated out"
            exit 1
          fi
          echo "ATTRIBUTION: arm 'snapshot_index_recovery e2e' ok -- exactly 4 passed"
      - name: Execute real generation and lease regressions
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          for filter in core::index::read_lease::tests core::index::read_lease::snapshot_recovery_tests; do
            log="$RUNNER_TEMP/snapshot-${filter##*::}.log"
            status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$log" 2>&1 || status=$?
            tail -n 80 "$log"
            if test "$status" -ne 0 || ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed;' "$log"; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: snapshot-recovery-test-results
          path: ${{ runner.temp }}/snapshot-*.log
          retention-days: 7
      - name: Check all targets and Clippy
        if: ${{ !cancelled() }}
        run: |
          failed=0
          # bd-aav0v: THIS IS THE STEP THAT IS CURRENTLY RED on this lane (last three
          # runs: failure, failure, failure). It ran an all-targets compile and an
          # all-targets deny-level lint under one flag, which are not the same
          # emergency: the first means the tree does not build, the second means it
          # builds and a lint objects. The standing red has never said which.
          check_exit=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/snapshot-all-targets.log" 2>&1 || check_exit=$?
          tail -n 80 "$RUNNER_TEMP/snapshot-all-targets.log"
          clippy_exit=0
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/snapshot-clippy.log" 2>&1 || clippy_exit=$?
          tail -n 80 "$RUNNER_TEMP/snapshot-clippy.log"
          if test "$check_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo check --all-targets' FAILED -- exit $check_exit; the tree does not build, so the lint arm's result below is not meaningful"
            grep -m1 -E '^error' "$RUNNER_TEMP/snapshot-all-targets.log" || true
            grep -m1 -E '^\s*-->' "$RUNNER_TEMP/snapshot-all-targets.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo check --all-targets' ok"
          fi
          if test "$clippy_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo clippy --all-targets -D warnings' FAILED -- exit $clippy_exit"
            grep -m1 -E '^error' "$RUNNER_TEMP/snapshot-clippy.log" || true
            grep -m1 -E '^\s*-->' "$RUNNER_TEMP/snapshot-clippy.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo clippy --all-targets -D warnings' ok"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: snapshot-recovery-verification
          path: ${{ runner.temp }}/snapshot-*.log
          retention-days: 7
