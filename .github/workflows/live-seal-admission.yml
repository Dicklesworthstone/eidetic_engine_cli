name: Live seal admission regressions
on:
  push:
    branches: [main]
    paths:
      - src/core/memory_lifecycle.rs
      - src/core/ask_corpus.rs
      - src/core/resume_snapshot.rs
      - src/core/global_store.rs
      - src/core/primer.rs
      - src/core/search_revision_admission.rs
      - .github/workflows/live-seal-admission.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-seal-admission-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: live-seals-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            live-seals-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            roster-ownership-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            core-retrieval-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Record the exact tested source
        run: |
          mkdir -p "$RUNNER_TEMP/live-seals"
          git rev-parse HEAD > "$RUNNER_TEMP/live-seals/source.txt"
          rustc --version --verbose > "$RUNNER_TEMP/live-seals/toolchain.txt"
      - name: Exercise source admission and existing answer/resume contracts
        run: |
          set -uo pipefail
          failed=0
          while read -r expected filter; do
            log="$RUNNER_TEMP/live-seals/${filter//:/_}.log"
            status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$log" 2>&1 || status=$?
            tail -n 100 "$log"
            if test "$status" -ne 0 || ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$log"; then failed=1; fi
          done <<'CASES'
          6 core::memory_lifecycle::seal_admission_tests::
          10 core::ask::corpus::source_authority_tests::
          8 core::ask::corpus::rule_lineage_tests::
          4 core::resume::snapshot::seal_authority_tests::
          CASES
          exit "$failed"
      - name: Record all-target compile, lint, and formatting verdicts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/live-seals"
          failed=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/live-seals/check.log" 2>&1 || failed=1
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/live-seals/clippy.log" 2>&1 || failed=1
          cargo fmt --all --check > "$RUNNER_TEMP/live-seals/fmt.log" 2>&1 || failed=1
          for log in check clippy fmt; do tail -n 60 "$RUNNER_TEMP/live-seals/$log.log"; done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-seal-admission-${{ github.sha }}
          path: ${{ runner.temp }}/live-seals/
          retention-days: 7
