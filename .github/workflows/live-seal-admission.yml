name: Live seal admission regressions
on:
  push:
    branches: [main]
    paths:
      - src/core/memory_lifecycle.rs
      - src/core/ask_corpus.rs
      - src/core/resume_snapshot.rs
      - src/core/global_store.rs
      - src/core/primer.rs
      - src/core/search_revision_admission.rs
      - .github/workflows/live-seal-admission.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-seal-admission-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: live-seals-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            live-seals-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            roster-ownership-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            core-retrieval-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Record the exact tested source
        run: |
          mkdir -p "$RUNNER_TEMP/live-seals"
          git rev-parse HEAD > "$RUNNER_TEMP/live-seals/source.txt"
          rustc --version --verbose > "$RUNNER_TEMP/live-seals/toolchain.txt"
      - name: Exercise source admission and existing answer/resume contracts
        run: |
          set -uo pipefail
          failed=0
          # bd-aav0v + bd-lagsa.
          #
          # (1) FOUR CASES, EIGHT ARMS, ONE FLAG. The loop ran four filters and each
          #     iteration collapsed a tool failure (`status -ne 0`) and a failed count
          #     assertion into the same `failed=1`, so a red step named neither the case
          #     nor which of the two had happened. Each case now reports itself on both
          #     paths with the two causes separated.
          #
          # (2) ONE OF THE FOUR COUNTS IS STALE. Counted at HEAD by resolving each
          #     filter to its declaring module and counting #[test]:
          #
          #       seal_admission_tests     pinned 6   actual 7   <-- DRIFTED
          #       source_authority_tests   pinned 14  actual 14
          #       rule_lineage_tests       pinned 8   actual 8
          #       seal_authority_tests     pinned 10  actual 10
          #
          #     Three of four matching is what makes the fourth trustworthy: the method
          #     agrees with the file everywhere it is not claiming drift. This lane's
          #     most recent run was a success, so the seventh test landed after it and
          #     the next run would have failed because someone ADDED a passing test.
          #
          #     Converted to FLOORS at the reviewed values rather than re-pinned to 7.
          #     A floor keeps what an exact count is for -- silent deletion is still
          #     refused -- without reddening on growth, and the observed count prints on
          #     both paths so real drift stays visible instead of hiding in a grep.
          while read -r floor filter; do
            log="$RUNNER_TEMP/live-seals/${filter//:/_}.log"
            status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$log" 2>&1 || status=$?
            tail -n 100 "$log"
            ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$log" | head -1)
            if test "$status" -ne 0; then
              echo "ATTRIBUTION: case '$filter' FAILED -- cargo exit $status (tool failure, not an assertion)"
              failed=1
            elif test -z "$ran" || test "$ran" -lt "$floor"; then
              echo "ATTRIBUTION: case '$filter' FAILED -- passing-with-zero-failures count '${ran:-none}', required floor $floor"
              failed=1
            else
              echo "ATTRIBUTION: case '$filter' ok -- $ran tests ran, floor $floor"
            fi
          done <<'CASES'
          6 core::memory_lifecycle::seal_admission_tests::
          14 core::ask::corpus::source_authority_tests::
          8 core::ask::corpus::rule_lineage_tests::
          10 core::resume::snapshot::seal_authority_tests::
          CASES
          exit "$failed"
      - name: Record all-target compile, lint, and formatting verdicts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/live-seals"
          failed=0
          # bd-aav0v: three arms of different kinds shared one flag. The step is named
          # "Record ... verdicts" (plural) and then recorded exactly one.
          check_exit=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/live-seals/check.log" 2>&1 || check_exit=$?
          clippy_exit=0
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/live-seals/clippy.log" 2>&1 || clippy_exit=$?
          fmt_exit=0
          cargo fmt --all --check > "$RUNNER_TEMP/live-seals/fmt.log" 2>&1 || fmt_exit=$?
          for log in check clippy fmt; do tail -n 60 "$RUNNER_TEMP/live-seals/$log.log"; done
          for arm in "check:$check_exit:cargo check --all-targets" \
                     "clippy:$clippy_exit:cargo clippy --all-targets -D warnings" \
                     "fmt:$fmt_exit:cargo fmt --all --check"; do
            name=${arm%%:*}
            rest=${arm#*:}
            code=${rest%%:*}
            label=${rest#*:}
            if test "$code" -ne 0; then
              echo "ATTRIBUTION: arm '$name' FAILED -- $label exited $code"
              failed=1
            else
              echo "ATTRIBUTION: arm '$name' ok -- $label"
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-seal-admission-${{ github.sha }}
          path: ${{ runner.temp }}/live-seals/
          retention-days: 7
