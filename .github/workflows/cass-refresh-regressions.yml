name: CASS refresh regressions
on:
  push:
    branches: [main]
    paths:
      - src/cass/**
      - src/db/**
      - src/policy/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/cass-refresh-regressions.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cass-refresh-regressions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkpoint-recovery:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: cass-refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cass-refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Apply the reviewed publication recovery diff to its exact source
        run: |
          set -euo pipefail
          test "$(git hash-object src/cass/import.rs)" = 3b535ece2e1832ab5a8731f3bd4a4b2d88ccbcb1
          test "$(git hash-object src/cass/refresh.rs)" = 278ed265a4bea0fe17430c8988c2aafcbf34d48e
          test "$(git hash-object src/cass/backfill_public_tests.rs)" = 295bb74a2324018173f50c62ee093e07ff26c44e
          cat > "$RUNNER_TEMP/cass-publication-manual.patch" <<'PATCH'
          --- a/src/cass/refresh.rs
