name: CASS refresh regressions
on:
  push:
    branches: [main]
    paths:
      - src/cass/**
      - src/db/**
      - src/policy/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/cass-refresh-regressions.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cass-refresh-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkpoint-recovery:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: cass-refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cass-refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Materialize the reviewed source candidates and publisher correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(src/cass/import.rs src/cass/refresh.rs src/cass/backfill_public_tests.rs)
          bases=(3b535ece2e1832ab5a8731f3bd4a4b2d88ccbcb1 278ed265a4bea0fe17430c8988c2aafcbf34d48e 295bb74a2324018173f50c62ee093e07ff26c44e)
          candidates=(b4b1e21e24bb15b024bcac0ddf6f3edef830ec12 8541cf0daa2adab83cd9e8ff39f02469f671ff92 859cfc027f7d0cce378701305280327fe7ff2497)
          for i in 0 1 2; do test "$(git hash-object "${paths[$i]}")" = "${bases[$i]}"; done
          for i in 0 1 2; do
            gh api "repos/Dicklesworthstone/eidetic_engine_cli/git/blobs/${candidates[$i]}" --jq .content | base64 --decode > "${paths[$i]}"
            test "$(git hash-object "${paths[$i]}")" = "${candidates[$i]}"
          done
          cat > "$RUNNER_TEMP/cass-publication-correction.patch" <<'PATCH'
          --- a/src/cass/refresh.rs
          +++ b/src/cass/refresh.rs
          @@ -466,9 +466,10 @@
                       {
                           return Err(refusal("cass_refresh_index_job_scope_mismatch"));
                       }
          -            if job.job_type_enum() != Some(crate::db::SearchIndexJobType::SingleDocument)
          -                || job.documents_total != 1
          -            {
          +            // A single-document intake job may publish a full or coalesced
          +            // generation. The publisher updates documents_total to that corpus
          +            // size; it is progress, not part of the immutable job identity.
          +            if job.job_type_enum() != Some(crate::db::SearchIndexJobType::SingleDocument) {
                           return Err(refusal("cass_refresh_index_job_invalid"));
                       }
                       match job.status_enum() {
          @@ -928,7 +929,7 @@
                   let before_counts = row_counts(&db);
                   for status in ["pending", "failed", "cancelled", "running", "completed"] {
                       db.execute_raw(&format!(
          -                "UPDATE search_index_jobs SET status = {} WHERE id = {}",
          +                "UPDATE search_index_jobs SET status = {}, documents_total = 17 WHERE id = {}",
                           sql_text(status),
                           sql_text(&latest),
                       ))
          @@ -947,6 +948,7 @@
                           after_job.status, before_job.status,
                           "do not steal live work"
                       );
          +            assert_eq!(after_job.documents_total, 17, "retain publisher progress");
                   }
               }
           
          @@ -1027,8 +1029,17 @@
                   db.execute_raw("UPDATE search_index_jobs SET status = 'completed'")
                       .unwrap();
                   let original = stable_search_index_job_id(&workspace, &id);
          +        let invalid_json = "not-json PRIVATE_PAYLOAD_SENTINEL";
          +        let before_invalid = db.get_session(&id).unwrap();
          +        assert!(metadata_object(Some(invalid_json)).is_err());
          +        // The live schema rejects invalid JSON itself. Exercise that guard
          +        // rather than disabling it to manufacture an impossible stored row.
          +        assert!(db.execute_raw(&format!(
          +            "UPDATE sessions SET metadata_json = {} WHERE id = {}",
          +            sql_text(invalid_json), sql_text(&id),
          +        )).is_err());
          +        assert_eq!(db.get_session(&id).unwrap(), before_invalid);
                   for metadata in [
          -            "not-json PRIVATE_PAYLOAD_SENTINEL".to_owned(),
                       "[]".to_owned(),
                       json!({CHECKPOINT_KEY: null}).to_string(),
                       json!({CHECKPOINT_KEY: {"schema": CHECKPOINT_SCHEMA}}).to_string(),
          @@ -1082,7 +1093,7 @@
                       Some("memory")
                   );
                   db.execute_raw(
          -            "UPDATE search_index_jobs SET document_source = 'session', documents_total = 2",
          +            "UPDATE search_index_jobs SET document_source = 'session', job_type = 'full_rebuild'",
                   )
                   .unwrap();
                   let error = reconcile_session_publication(&db, &workspace, &id)
          @@ -1111,4 +1122,39 @@
                       assert_eq!(row_counts(&db), before);
                   }
               }
          -}
          +
          +    #[test]
          +    fn real_index_publication_round_trips_through_metadata_only_recovery() {
          +        let (db, workspace, id, session) = fixture("/private/real-publication.jsonl", 1);
          +        let index = tempfile::tempdir().unwrap();
          +        let original = stable_search_index_job_id(&workspace, &id);
          +        let published = crate::core::index::process_index_job_for_connection(
          +            &db, &original, index.path(),
          +        ).unwrap();
          +        assert_eq!(published.outcome, "completed", "{published:?}");
          +        assert!(published.documents_total > 1, "session and evidence must be indexed");
          +        assert!(reconcile_session_publication(&db, &workspace, &id).unwrap().is_none());
          +
          +        let spans = [span(&session, 1), span(&session, 2), span(&session, 3)];
          +        let growth = refresh_session(&db, &workspace, &id, &session, &spans).unwrap();
          +        let latest = growth.index_job_id.unwrap();
          +        assert_ne!(latest, original);
          +        assert_eq!(reconcile_session_publication(&db, &workspace, &id).unwrap(), Some(latest.clone()));
          +        let before_session = db.get_session(&id).unwrap();
          +        let before_evidence = db.list_evidence_spans_for_session(&id).unwrap();
          +        let published = crate::core::index::process_index_job_for_connection(
          +            &db, &latest, index.path(),
          +        ).unwrap();
          +        assert_eq!(published.outcome, "completed", "{published:?}");
          +        assert!(published.documents_total > 1);
          +        let work = db.get_search_index_job(&latest).unwrap().unwrap();
          +        assert_eq!(work.status_enum(), Some(SearchIndexJobStatus::Completed));
          +        assert_eq!(work.documents_total, published.documents_total);
          +        assert!(reconcile_session_publication(&db, &workspace, &id).unwrap().is_none());
          +        let retry = refresh_session(&db, &workspace, &id, &session, &spans).unwrap();
          +        assert!(!retry.changed);
          +        assert!(retry.index_job_id.is_none());
          +        assert_eq!(db.get_session(&id).unwrap(), before_session);
          +        assert_eq!(db.list_evidence_spans_for_session(&id).unwrap(), before_evidence);
          +    }
          +}
          PATCH
          echo "ad437fab003a0bf0d07bd5a6fc8f4c4f841932495d629b334e883b514a7372d1  $RUNNER_TEMP/cass-publication-correction.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/cass-publication-correction.patch"
          git apply "$RUNNER_TEMP/cass-publication-correction.patch"
          rustfmt --edition 2024 --config skip_children=true src/cass/refresh.rs src/cass/backfill_public_tests.rs
          git diff --check
          git diff > "$RUNNER_TEMP/cass-publication-source.patch"
      - name: Preserve exact candidate blobs without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          repo = 'Dicklesworthstone/eidetic_engine_cli'
          paths = ['src/cass/import.rs', 'src/cass/refresh.rs', 'src/cass/backfill_public_tests.rs']
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          assert set(changed) == set(paths), 'Unexpected source edits'
          manifest = {'baseCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'files': []}
          for path in paths:
              old = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path]).decode().strip()
              new = subprocess.check_output(['git', 'hash-object', path]).decode().strip()
              payload = json.dumps({'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'})
              response = subprocess.run(['gh', 'api', 'repos/' + repo + '/git/blobs', '--input', '-'], input=payload, text=True, capture_output=True, check=True)
              assert json.loads(response.stdout)['sha'] == new, 'Source transport changed'
              manifest['files'].append({'path': path, 'baseBlob': old, 'sha': new})
          pathlib.Path(os.environ['RUNNER_TEMP'], 'cass-publication-source.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cass-publication-source
          path: |
            ${{ runner.temp }}/cass-publication-source.json
            ${{ runner.temp }}/cass-publication-source.patch
          retention-days: 7
      - name: Check all Cargo targets
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/cass-publication-check.log"
      - name: Run all 34 refresh and publication recovery regressions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --lib cass::import::refresh:: -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/cass-publication-refresh.log"
          grep -Fq 'test result: ok. 34 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/cass-publication-refresh.log"
      - name: Run public metadata-only recovery and existing growth regressions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --lib cass::import::tests::metadata_only_reimport_recovers_latest_publication_without_reading_transcript -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/cass-publication-metadata.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/cass-publication-metadata.log"
          cargo test --locked --lib cass::import::tests::reimport_backfills_existing_transcripts_and_reconciles_snapshot_jobs -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/cass-publication-growth.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/cass-publication-growth.log"
      - name: Report strict Clippy without hiding existing warnings
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/cass-publication-clippy.log"
      - name: Check repository formatting
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo fmt --check 2>&1 | tee "$RUNNER_TEMP/cass-publication-format.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: cass-publication-verification
          path: ${{ runner.temp }}/cass-publication-*
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
