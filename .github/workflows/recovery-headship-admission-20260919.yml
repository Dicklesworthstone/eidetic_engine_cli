name: Revision-aware retrieval and recovery
on:
  push:
    branches: [main]
    paths:
      - src/core/jsonl_import.rs
      - src/core/jsonl_recovery.rs
      - src/core/jsonl_revisions.rs
      - src/core/jsonl_recovery_regression_tests.rs
      - src/core/jsonl_revision_heads_tests.rs
      - src/core/search_rule_admission.rs
      - src/core/search_revision_admission.rs
      - src/core/search_revision_admission_tests.rs
      - src/core/search_diagnostic_snapshot.rs
      - src/core/backup_revision_recovery_tests.rs
      - tests/search_conformal_e2e.rs
      - tests/support/revision_search_cli.rs
      - .github/workflows/recovery-headship-admission-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-headship-admission-delivery
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. This overrides the action's install
      # AT INVOCATION TIME, so a bare rustfmt/cargo later in this job resolves
      # through it, not through the `toolchain:` input below. Pinning one half
      # only installs components onto the dated toolchain and then invokes
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Record source and resolve pinned Franken stack paths
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-source-sha.log"
          ./scripts/checkout-franken-stack.sh "$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml
          git diff -- Cargo.toml > "$RUNNER_TEMP/recovery-build-paths.patch"
          rustc --version --verbose > "$RUNNER_TEMP/recovery-toolchain.log"
      - name: Check production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/recovery-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/recovery-check.log"
          exit "$status"
      - name: Execute retrieval recovery and ordinary import regressions
        run: |
          set -uo pipefail
          failed=0
          # FLOORS, NOT EXACT COUNTS -- THREE OF THESE SEVEN ARE ALREADY STALE, WHICH IS WHY
          # THIS LANE HAS BEEN RED SINCE 2026-09-28 WITH EVERY SUITE GREEN (bd-lagsa).
          #
          # Counted at HEAD by resolving each filter to its files through the #[path]
          # declarations and counting #[test], not by reading the numbers below:
          #
          #   core::search::rule_admission::      expected 14, actual 52
          #       the filter has a TRAILING :: and no `tests`, so it matches the whole
          #       subtree: search_rule_admission.rs 16 + search_rule_scope.rs 12 +
          #       search_revision_admission.rs 16 + search_rule_quarantine_tests.rs 8.
          #       Note a sibling lane pins `...rule_admission::scope::tests::` at 12 and is
          #       CORRECT -- the difference is entirely in how wide the filter is.
          #   core::search::diagnostic_snapshot:: expected 14, actual 15
          #       and diagnostic-generation pins `...diagnostic_snapshot::tests::` at 15,
          #       which is correct. Same module, two lanes, one stale by one test.
          #   core::jsonl_import::tests::         expected 61, actual 65
          #
          # The failing run's own log corroborates: it reports 15 and 65 where this step
          # demanded 14 and 61, and `0 failed` on every suite.
          #
          # The step already ACCUMULATES (`failed=1`, `exit "$failed"`), so no suite was ever
          # suppressed -- each group reported independently and three of them reported a
          # count mismatch on a green suite. Only the comparison changes here.
          #
          # Expected values are kept as FLOORS rather than re-pinned to 52/15/65: re-pinning
          # resets the clock, and these numbers are the reviewed inventories. The observed
          # count prints on both paths so a gap like 14-versus-52 is visible instead of
          # hidden inside a passing grep.
          run_group() {
            local name="$1" filter="$2" floor="$3" status=0 ran=""
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/recovery-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/recovery-$name.log"
            ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/recovery-$name.log" | head -1)
            if test "$status" -ne 0 || test -z "$ran" || test "$ran" -lt "$floor"; then
              echo "ATTRIBUTION: group '$name' FAILED -- cargo exit $status, passing-with-zero-failures count '${ran:-none}', required floor $floor"
              failed=1
            else
              echo "ATTRIBUTION: group '$name' ok -- $ran tests ran, floor $floor"
            fi
          }
          run_group retrieval-admission 'core::search::rule_admission::' 14
          run_group diagnostic-snapshot 'core::search::diagnostic_snapshot::' 14
          run_group headship-admission 'core::jsonl_import::recovery_regression_tests::' 13
          run_group ambiguous-heads 'core::jsonl_import::revisions::head_tests::' 4
          run_group record-graph 'core::jsonl_import::recovery::tests::' 13
          run_group ordinary-import 'core::jsonl_import::tests::' 61
          run_group backup-publication 'backup_revision_recovery_' 4
          exit "$failed"
      - name: Execute real CLI revision search and context acceptance
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo test --locked --test search_conformal_e2e -- --test-threads=2 > "$RUNNER_TEMP/recovery-cli.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/recovery-cli.log"
          test "$status" -eq 0
          grep -Fq 'test result: ok. 3 passed; 0 failed;' "$RUNNER_TEMP/recovery-cli.log"
      - name: Check all targets
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/recovery-all-targets.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/recovery-all-targets.log"
          exit "$status"
      - name: Check all-target Clippy
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/recovery-clippy.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/recovery-clippy.log"
          exit "$status"
      - name: Check changed-source formatting
        if: ${{ !cancelled() }}
        run: |
          status=0
          rustfmt --edition 2024 --config skip_children=true --check src/core/jsonl_import.rs src/core/jsonl_recovery.rs src/core/jsonl_revisions.rs src/core/jsonl_recovery_regression_tests.rs src/core/jsonl_revision_heads_tests.rs src/core/search_rule_admission.rs src/core/search_revision_admission.rs src/core/search_revision_admission_tests.rs src/core/search_diagnostic_snapshot.rs src/core/backup_revision_recovery_tests.rs tests/search_conformal_e2e.rs tests/support/revision_search_cli.rs > "$RUNNER_TEMP/recovery-fmt.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/recovery-fmt.log"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: recovery-headship-admission-verification
          path: |
            ${{ runner.temp }}/recovery-*.log
            ${{ runner.temp }}/recovery-*.patch
            target/tmp/revision-search-cli
          retention-days: 7
