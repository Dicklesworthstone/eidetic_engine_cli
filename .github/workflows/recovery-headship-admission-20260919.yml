name: Recovery headship and backup admission
on:
  push:
    branches: [main]
    paths: [.github/workflows/recovery-headship-admission-20260919.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-headship-admission-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Apply and commit two reviewed source increments directly to main
        run: |
          set -euo pipefail
          paths=(src/core/jsonl_import.rs src/core/jsonl_recovery.rs src/core/jsonl_revisions.rs src/core/jsonl_recovery_regression_tests.rs)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if grep -q 'fn early_backup_admission_and_final_recovery_verification_use_the_same_counts' src/core/jsonl_recovery_regression_tests.rs 2>/dev/null; then
            grep -q 'recovery::validate_backup_source(&parsed)' src/core/jsonl_import.rs
            grep -q 'legacy_supersession_ids.contains(&memory.id)' src/core/jsonl_import.rs
            grep -q 'self.legacy_supersession_ids.contains(&expected.id)' src/core/jsonl_recovery.rs
            echo 'Source increments already applied; verify the current source without rewriting it.'
          else
            test "$(git rev-parse HEAD:src/core/jsonl_import.rs)" = 358f4002defdacf26e6fe5d66c4c9c0368897d81
            test "$(git rev-parse HEAD:src/core/jsonl_recovery.rs)" = 7d59f208d8afb3683f3508431dfef9c490811c65
            test "$(git rev-parse HEAD:src/core/jsonl_revisions.rs)" = 954644f46609d1b7fc2a13e665c1c332c0e4b984
            cat <<'PATCH1' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/recovery-headship.patch"
          
          PATCH1
            echo "bf7b9d1619f79783082e30c75468019af159a414256351df8f72558143769256  $RUNNER_TEMP/recovery-headship.patch" | sha256sum --check
            cat <<'PATCH2' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/recovery-admission.patch"
          
          PATCH2
            echo "3e3ba992e35134da5ff7b93908d7903320b012e8d9c59bfa3feacca50cf9d273  $RUNNER_TEMP/recovery-admission.patch" | sha256sum --check
            publish() {
              local base="$1" pushed=0
              for attempt in 1 2 3; do
                if git push origin HEAD:main; then pushed=1; break; fi
                git fetch origin main
                git diff --exit-code "$base" origin/main -- "${paths[@]}"
                git merge --no-edit origin/main
                base=$(git rev-parse origin/main)
              done
              test "$pushed" -eq 1
            }
            base=$(git rev-parse HEAD)
            git apply --check "$RUNNER_TEMP/recovery-headship.patch"
            git apply "$RUNNER_TEMP/recovery-headship.patch"
            rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
            git diff --check
            git add -- "${paths[@]}"
            git commit -m 'fix(recovery): preserve explicit current revisions during restore' -m 'Limit legacy expiry-based inference to eligible imported identities, protecting both endpoints of explicit revision edges while retaining mixed-era ancestors. Verify absent supersession as well as present markers before publication. Add five real-store regressions for clock skew, reverse references, idempotency, unexpected retirement, legacy and mixed-era history, and redacted IDs. Formatting passed; compilation and runtime tests are reported separately.'
            publish "$base"
            base=$(git rev-parse HEAD)
            git apply --check "$RUNNER_TEMP/recovery-admission.patch"
            git apply "$RUNNER_TEMP/recovery-admission.patch"
            rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
            git diff --check
            git add -- "${paths[@]}"
            git commit -m 'fix(backup): reject incomplete recovery streams before destination writes' -m 'Share strict backup record-count and workspace admission between import and final recovery verification, before directory creation, database migration, or workspace insertion. Preserve ordinary JSONL warning semantics and existing trust caps. Add three tests including ten corruptions in both dry-run and applied modes, source immutability, destination absence, and final-fence agreement. Formatting passed; compilation and runtime tests are reported separately.'
            publish "$base"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/recovery-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-headship-admission-source
          path: |
            ${{ runner.temp }}/recovery-source-sha.log
            ${{ runner.temp }}/recovery-source.tar.gz
          retention-days: 7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Resolve pinned Franken stack build paths
        run: |
          set -euo pipefail
          ./scripts/checkout-franken-stack.sh "$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml
          git diff -- Cargo.toml > "$RUNNER_TEMP/recovery-build-paths.patch"
          rustc --version --verbose > "$RUNNER_TEMP/recovery-toolchain.log"
      - name: Check production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/recovery-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/recovery-check.log"
          exit "$status"
      - name: Execute real recovery regressions
        run: |
          set -uo pipefail
          failed=0
          run_group() {
            local name="$1" filter="$2" expected="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/recovery-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/recovery-$name.log"
            if test "$status" -ne 0 || ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$RUNNER_TEMP/recovery-$name.log"; then failed=1; fi
          }
          run_group headship-admission 'core::jsonl_import::recovery_regression_tests::' 8
          run_group record-graph 'core::jsonl_import::recovery::tests::' 13
          run_group backup-publication 'backup_revision_recovery_' 2
          exit "$failed"
      - name: Check production Clippy
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/recovery-clippy.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/recovery-clippy.log"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: recovery-headship-admission-verification
          path: |
            ${{ runner.temp }}/recovery-*.log
            ${{ runner.temp }}/recovery-*.patch
          retention-days: 7
