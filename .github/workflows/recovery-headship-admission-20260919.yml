name: Revision-aware retrieval and recovery
on:
  push:
    branches: [main]
    paths:
      - src/core/jsonl_import.rs
      - src/core/jsonl_recovery.rs
      - src/core/jsonl_revisions.rs
      - src/core/jsonl_recovery_regression_tests.rs
      - src/core/jsonl_revision_heads_tests.rs
      - src/core/search_rule_admission.rs
      - src/core/search_revision_admission.rs
      - src/core/search_revision_admission_tests.rs
      - src/core/search_diagnostic_snapshot.rs
      - src/core/backup_revision_recovery_tests.rs
      - .github/workflows/recovery-headship-admission-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-headship-admission-delivery
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Record source and resolve pinned Franken stack paths
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-source-sha.log"
          ./scripts/checkout-franken-stack.sh "$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml
          git diff -- Cargo.toml > "$RUNNER_TEMP/recovery-build-paths.patch"
          rustc --version --verbose > "$RUNNER_TEMP/recovery-toolchain.log"
      - name: Check production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/recovery-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/recovery-check.log"
          exit "$status"
      - name: Execute retrieval recovery and ordinary import regressions
        run: |
          set -uo pipefail
          failed=0
          run_group() {
            local name="$1" filter="$2" expected="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/recovery-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/recovery-$name.log"
            if test "$status" -ne 0 || ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$RUNNER_TEMP/recovery-$name.log"; then failed=1; fi
          }
          run_group retrieval-admission 'core::search::rule_admission::' 14
          run_group diagnostic-snapshot 'core::search::diagnostic_snapshot::' 14
          run_group headship-admission 'core::jsonl_import::recovery_regression_tests::' 8
          run_group ambiguous-heads 'core::jsonl_import::revisions::head_tests::' 4
          run_group record-graph 'core::jsonl_import::recovery::tests::' 13
          run_group ordinary-import 'core::jsonl_import::tests::' 61
          run_group backup-publication 'backup_revision_recovery_' 2
          exit "$failed"
      - name: Check all targets
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/recovery-all-targets.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/recovery-all-targets.log"
          exit "$status"
      - name: Check all-target Clippy
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/recovery-clippy.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/recovery-clippy.log"
          exit "$status"
      - name: Check changed-source formatting
        if: ${{ !cancelled() }}
        run: |
          status=0
          rustfmt --edition 2024 --config skip_children=true --check src/core/jsonl_import.rs src/core/jsonl_recovery.rs src/core/jsonl_revisions.rs src/core/jsonl_recovery_regression_tests.rs src/core/jsonl_revision_heads_tests.rs src/core/search_rule_admission.rs src/core/search_revision_admission.rs src/core/search_revision_admission_tests.rs src/core/search_diagnostic_snapshot.rs src/core/backup_revision_recovery_tests.rs > "$RUNNER_TEMP/recovery-fmt.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/recovery-fmt.log"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: recovery-headship-admission-verification
          path: |
            ${{ runner.temp }}/recovery-*.log
            ${{ runner.temp }}/recovery-*.patch
          retention-days: 7
