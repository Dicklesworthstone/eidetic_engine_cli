name: Shared workspace backup recovery
on:
  push:
    branches: [main]
    paths:
      - 'src/core/backup*.rs'
      - 'tests/backup_shared_workspace_cli.py'
      - '.github/workflows/workspace-backup-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-workspace-backup-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture exact committed recovery source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/workspace-backup-identity.log"
          git archive --format=tar.gz --output="$RUNNER_TEMP/workspace-backup-source.tar.gz" HEAD \
            src/core/backup*.rs tests/backup_shared_workspace_cli.py .github/workflows/workspace-backup-recovery.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-backup-source-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/workspace-backup-identity.log
            ${{ runner.temp }}/workspace-backup-source.tar.gz
          retention-days: 7
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: workspace-backup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            workspace-backup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            typed-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            session-learning-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Exercise shared-store ownership and real restores
        run: |
          set -euo pipefail
          cargo test --locked --lib core::backup::recovery::scope::tests -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/workspace-backup-scope.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/workspace-backup-scope.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: workspace-backup-scope-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-backup-*.log
          retention-days: 7
      - name: Exercise existing source inventory and destination fences
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          failed=0
          for group in core::backup::tests::recovery_inventory_ core::backup::recovery::tests; do
            log="$RUNNER_TEMP/workspace-backup-${group//::/-}.log"
            if ! cargo test --locked --lib "$group" -- --test-threads=2 2>&1 | tee "$log"; then
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Build and exercise the public shared-store recovery journey
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo build --locked --bin ee 2>&1 | tee "$RUNNER_TEMP/workspace-backup-build.log"
          python3 tests/backup_shared_workspace_cli.py target/debug/ee 2>&1 | tee "$RUNNER_TEMP/workspace-backup-cli.log"
          grep -q '^PASS: shared CLI store' "$RUNNER_TEMP/workspace-backup-cli.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: workspace-backup-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-backup-*.log
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
