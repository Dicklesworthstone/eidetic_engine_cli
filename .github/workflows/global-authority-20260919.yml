name: Global revision and seal source admission
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/global-authority-20260919.patch
      - scripts/delivery/retrieval-oracles-20260919.patch
      - .github/workflows/global-authority-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-authority-20260919
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Publish source-backed global admission directly to main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          paths=(src/core/global_store.rs src/core/global_store_revision_tests.rs src/core/search.rs src/core/search_diagnostic_snapshot.rs tests/support/revision_search_cli.rs)
          if test -f src/core/global_store_revision_tests.rs; then
            grep -q 'fn read_global_store_memories_at' src/core/global_store.rs
            grep -q 'global_store::read_global_store_memories_at' src/core/search.rs
          else
            test "$(git rev-parse HEAD:src/core/global_store.rs)" = 0cb29b161047c9a562b219bac4f61f9e977c8741
            test "$(git rev-parse HEAD:src/core/search.rs)" = e5f33c2e8e5952448b315c82276348d2ffb7af7a
            base=$(git rev-parse HEAD)
            git apply --check scripts/delivery/global-authority-20260919.patch
            git apply scripts/delivery/global-authority-20260919.patch
            git apply --check scripts/delivery/retrieval-oracles-20260919.patch
            git apply scripts/delivery/retrieval-oracles-20260919.patch
            rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "${paths[@]}"
            git commit -m 'fix(global): enforce revision and seal authority across retrieval and primer reads' -m 'Read bodies, supersession and seal evidence in a single read-only source snapshot. Withhold malformed authority without exposing source values. Preserve wall-clock-free current-head primer reads and pass explicit historical times through global search, independently of author expiry and workspace scope. Add seven real-store regressions covering exact boundaries, seals, tombstones, workspace isolation, absent stores and concurrent snapshots. Repair prior diagnostic controls that became future-dated and CLI assertions that requested an undocumented identity key, preserving every exact-identity assertion. Patch application and rustfmt passed; compiler and runtime results are separate.'
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
            test "$pushed" -eq 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/global-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/global-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: global-admission-source
          path: |
            ${{ runner.temp }}/global-source-sha.log
            ${{ runner.temp }}/global-source.tar.gz
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: global-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ needs.integrate.outputs.source_sha }}
          restore-keys: |
            global-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            seed-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check production library
        run: |
          set -o pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/global-source-sha.log"
          cargo check --locked --lib 2>&1 | tee "$RUNNER_TEMP/global-check.log"
      - name: Execute source admission and all diagnostic regressions
        run: |
          set -uo pipefail
          failed=0
          run_group() {
            local name="$1" filter="$2" expected="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/global-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/global-$name.log"
            if test "$status" -ne 0 || ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$RUNNER_TEMP/global-$name.log"; then failed=1; fi
          }
          run_group store 'core::global_store::' 27
          run_group diagnostic 'core::search::diagnostic_snapshot::tests::' 14
          run_group seed 'core::search::rule_admission::memory_revisions::seed_tests::' 6
          exit "$failed"
      - name: Execute real CLI search context and global-store integration
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          run_target() {
            local target="$1" expected="$2" status=0
            cargo test --locked --test "$target" -- --test-threads=2 > "$RUNNER_TEMP/global-$target.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/global-$target.log"
            if test "$status" -ne 0 || ! grep -Fq "test result: ok. $expected passed; 0 failed;" "$RUNNER_TEMP/global-$target.log"; then failed=1; fi
          }
          run_target search_conformal_e2e 3
          run_target global_store_e2e 6
          exit "$failed"
      - name: Check production Clippy and source formatting
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          failed=0
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/global-clippy.log" || failed=1
          rustfmt --edition 2024 --config skip_children=true --check src/core/global_store.rs src/core/global_store_revision_tests.rs src/core/search.rs src/core/search_diagnostic_snapshot.rs tests/support/revision_search_cli.rs 2>&1 | tee "$RUNNER_TEMP/global-fmt.log" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: global-admission-verification
          path: |
            ${{ runner.temp }}/global-*.log
            target/tmp/revision-search-cli/**
          retention-days: 7
