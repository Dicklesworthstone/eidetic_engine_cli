name: Global revision and seal source admission
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/global-authority-20260919.patch
      - scripts/delivery/retrieval-oracles-20260919.patch
      - .github/workflows/global-authority-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-authority-20260919
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Publish source-backed global admission directly to main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          paths=(src/core/global_store.rs src/core/global_store_revision_tests.rs src/core/search.rs src/core/search_diagnostic_snapshot.rs tests/support/revision_search_cli.rs)
          if test -f src/core/global_store_revision_tests.rs; then
            grep -q 'fn read_global_store_memories_at' src/core/global_store.rs
            grep -q 'global_store::read_global_store_memories_at' src/core/search.rs
          else
            test "$(git rev-parse HEAD:src/core/global_store.rs)" = 0cb29b161047c9a562b219bac4f61f9e977c8741
            test "$(git rev-parse HEAD:src/core/search.rs)" = e5f33c2e8e5952448b315c82276348d2ffb7af7a
            base=$(git rev-parse HEAD)
            git apply --check scripts/delivery/global-authority-20260919.patch
            git apply scripts/delivery/global-authority-20260919.patch
            git apply --check scripts/delivery/retrieval-oracles-20260919.patch
            git apply scripts/delivery/retrieval-oracles-20260919.patch
            rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "${paths[@]}"
            git commit -m 'fix(global): enforce revision and seal authority across retrieval and primer reads' -m 'Read bodies, supersession and seal evidence in a single read-only source snapshot. Withhold malformed authority without exposing source values. Preserve wall-clock-free current-head primer reads and pass explicit historical times through global search, independently of author expiry and workspace scope. Add seven real-store regressions covering exact boundaries, seals, tombstones, workspace isolation, absent stores and concurrent snapshots. Repair prior diagnostic controls that became future-dated and CLI assertions that requested an undocumented identity key, preserving every exact-identity assertion. Patch application and rustfmt passed; compiler and runtime results are separate.'
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
            # bd-aav0v: a BARE `test` under errexit. It means EVERY push attempt failed, which
            # is a completely different situation from a failing test -- the verification above
            # may have passed and only PUBLICATION failed. Silently the two are
            # indistinguishable. Exit code and condition unchanged; still a hard stop.
            if test "$pushed" -ne 1; then
              echo "ATTRIBUTION: PUBLICATION FAILED, not verification -- all 3 'git push origin HEAD:main' attempts were rejected, each followed by a fetch/merge onto the new origin/main. The work above was prepared and its checks ran; nothing reached main. Re-running the lane is the remedy, not changing the source."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/global-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/global-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: global-admission-source
          path: |
            ${{ runner.temp }}/global-source-sha.log
            ${{ runner.temp }}/global-source.tar.gz
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. This overrides the action's install
      # AT INVOCATION TIME, so a bare rustfmt/cargo in THIS job resolves through
      # it, not through the `toolchain:` input. Pinning one half only installs
      # components onto the dated toolchain and then invokes floating nightly,
      # which does not have them. That was d315cdc7f, repaired at 021a033b8.
      # NOTE: this env exists on THIS job only; the other job in this file has
      # no override, so its invocation is pinned by its input alone and that is
      # correct there. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: global-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ needs.integrate.outputs.source_sha }}
          restore-keys: |
            global-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            seed-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check production library
        run: |
          set -o pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/global-source-sha.log"
          cargo check --locked --lib 2>&1 | tee "$RUNNER_TEMP/global-check.log"
      - name: Execute source admission and all diagnostic regressions
        run: |
          set -uo pipefail
          failed=0
          # bd-lagsa + bd-aav0v. THIS IS THE STEP WHERE THIS LANE DIES, and it has zero
          # successes in its last 30 runs. Three arms shared one flag, so the standing red
          # named none of them. One of the three counts is stale; the other two are not, and
          # they are deliberately left alone.
          #
          #   core::global_store::                       27  was EXACT, now FLOOR (measured 28)
          #   core::search::diagnostic_snapshot::tests::  14  STALE, actual 15 -> FLOOR
          #   core::search::rule_admission::...seed_tests::  6  LEFT EXACT (see below)
          #
          # The diagnostic count: src/core/search_diagnostic_snapshot.rs holds 15 `#[test]`,
          # all inside its `mod tests` at :179, so the filter matches 15, not 14. It becomes a
          # FLOOR OF ITS REVIEWED VALUE -- the count proves 14 <= 15 so the floor is
          # satisfiable; it does not become a new exact pin that would drift the same way.
          # diagnostic-snapshot-20260919 pins the same module at 10 and is also wrong; both
          # were repaired together.
          #
          # `seed` stays EXACT because seed-authority-20260919 pins the identical filter at 6
          # and has RECENT SUCCESSES, so 6 is a cargo measurement, not a guess.
          #
          # `store` WAS left exact on the reasoning below, and the measurement has since
          # arrived, so it is now a FLOOR. Keeping the original note, because the condition it
          # set is exactly what was met:
          #
          #   "I could not measure it and will not guess. Its filter ends in `::`, so it
          #    matches the whole subtree, and my counter does not recurse into submodules --
          #    it reports 20 for a population that is certainly larger. A floor at 27 would
          #    be no safer than the exact 27, and a floor at 20 would weaken the gate on an
          #    unmeasured number. primer-admission-20260919 pins it at 27 too, so if 27 is
          #    wrong it is wrong in two lanes and belongs in one repair, not this one."
          #
          # It is wrong in both lanes, and cargo said so three times without my counter:
          #   this lane,  run 37607508968  "arm 'store' ... expected exactly 27, counted 28"
          #   primer-adm, run 37660994662  summary line `test result: ok. 28 passed`
          #   static      21 #[test] in src/core/global_store.rs + 7 in
          #               global_store_revision_tests.rs (mounted at :839) = 28
          #
          # b3e08c1bc added the 28th on 2026-10-07 at 14:31 --
          # `default_user_data_root_requires_absolute_xdg_and_preserves_home_fallback`, a
          # config fix with a test for it. core-memory-regressions.yml already pins that test
          # BY NAME, so its existence is corroborated by a third lane.
          #
          # "A floor at 27 would be no safer than the exact 27" was true under ignorance and
          # is false now: exact 27 FAILS on today's tree while floor 27 passes and still
          # catches a shrink. The floor stays at the REVIEWED 27 rather than ratcheting to 28,
          # matching external-ingestion-20260919 and the primer-admission repair -- 28
          # includes a test nobody reviewed as part of this lane's charter.
          run_group() {
            local name="$1" filter="$2" expected="$3" mode="${4:-exact}" status=0 ran=""
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/global-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/global-$name.log"
            ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/global-$name.log" | head -1)
            if test "$status" -ne 0; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
              failed=1
            elif test -z "$ran"; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- cargo exited 0 but emitted NO 'test result: ok. N passed; 0 failed' line; the suite reported nothing"
              failed=1
            elif test "$mode" = exact && test "$ran" != "$expected"; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- expected exactly $expected passing, counted $ran. If $ran is GREATER the suite grew and this pin is stale; if LOWER a test was removed."
              failed=1
            elif test "$mode" = floor && test "$ran" -lt "$expected"; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- counted $ran passing, required floor $expected"
              failed=1
            else
              echo "ATTRIBUTION: arm '$name' ($filter) ok -- $ran passed ($mode $expected)"
            fi
            return 0
          }
          run_group store 'core::global_store::' 27 floor
          run_group diagnostic 'core::search::diagnostic_snapshot::tests::' 14 floor
          run_group seed 'core::search::rule_admission::memory_revisions::seed_tests::' 6
          exit "$failed"
      - name: Execute real CLI search context and global-store integration
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          # bd-sj2p7: `global_store_e2e` WAS PASSED AS A TARGET AND IS NOT ONE.
          # Cargo.toml sets `autotests = false` and declares 46 [[test]] targets;
          # tests/global_store_e2e.rs is not among them. It is a MODULE of
          # integration_g_m (tests/suites/integration_g_m.rs, `#[path =
          # "../global_store_e2e.rs"]`), so `--test global_store_e2e` could only ever
          # answer "no test target named ...". This step was therefore structurally
          # incapable of running the tests it was written to check.
          # diagnostic-generation-20260919.yml:119 already does it correctly, and that
          # is the shape adopted here.
          #
          # The helper now takes an OPTIONAL FILTER so a module can be addressed
          # through its real target without duplicating the attribution logic.
          #
          # AND THE COUNT WAS STALE TOO (bd-lagsa), which the target fix would have
          # exposed as a fresh red: this demanded exactly 6 while
          # tests/global_store_e2e.rs now holds 7 #[test] functions. Converted to a
          # FLOOR, keeping 6 as the reviewed inventory rather than re-pinning to 7,
          # with the observed count printed on both paths so a gap stays visible
          # instead of hiding inside a passing grep. Same repair as this file's
          # sibling lane took for the same file.
          run_target() {
            local target="$1" floor="$2" filter="${3-}" status=0 ran=""
            local slug="${3-$1}"
            slug="${slug//:/}"
            if test -n "$filter"; then
              cargo test --locked --test "$target" "$filter" -- --test-threads=2 > "$RUNNER_TEMP/global-$slug.log" 2>&1 || status=$?
            else
              cargo test --locked --test "$target" -- --test-threads=2 > "$RUNNER_TEMP/global-$slug.log" 2>&1 || status=$?
            fi
            tail -n 100 "$RUNNER_TEMP/global-$slug.log"
            ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/global-$slug.log" | head -1)
            if test "$status" -ne 0 || test -z "$ran" || test "$ran" -lt "$floor"; then
              echo "ATTRIBUTION: '$slug' FAILED -- cargo exit $status, passing-with-zero-failures count '${ran:-none}', required floor $floor"
              failed=1
            else
              echo "ATTRIBUTION: '$slug' ok -- $ran tests ran, floor $floor"
            fi
          }
          run_target search_conformal_e2e 3
          run_target integration_g_m 6 'global_store_e2e::'
          exit "$failed"
      - name: Check production Clippy and source formatting
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          failed=0
          # bd-aav0v: a production lint and a FIVE-FILE format check under one flag. The
          # format arm spans src/core and tests/support, so naming it matters: a reflow
          # in tests/support/revision_search_cli.rs reddened a step whose title says
          # "production Clippy". Keep the `|| failed=...` form on each pipeline -- with
          # errexit on (default `bash -e {0}`) and pipefail set here, a BARE pipeline
          # would abort the step and no arm would report at all.
          clippy_exit=0
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/global-clippy.log" || clippy_exit=$?
          fmt_exit=0
          rustfmt --edition 2024 --config skip_children=true --check src/core/global_store.rs src/core/global_store_revision_tests.rs src/core/search.rs src/core/search_diagnostic_snapshot.rs tests/support/revision_search_cli.rs 2>&1 | tee "$RUNNER_TEMP/global-fmt.log" || fmt_exit=$?
          if test "$clippy_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' FAILED -- exit $clippy_exit"
            grep -m1 -E '^error' "$RUNNER_TEMP/global-clippy.log" || true
            grep -m1 -E '^\s*-->' "$RUNNER_TEMP/global-clippy.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' ok"
          fi
          if test "$fmt_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'rustfmt --check on five named sources' FAILED -- exit $fmt_exit; files named:"
            grep -m5 -E '^Diff in ' "$RUNNER_TEMP/global-fmt.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'rustfmt --check on five named sources' ok"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: global-admission-verification
          path: |
            ${{ runner.temp }}/global-*.log
            target/tmp/revision-search-cli/**
          retention-days: 7
