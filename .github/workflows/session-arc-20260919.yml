name: Source-backed session arc learning
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/session-arc-20260919/**
      - .github/workflows/session-arc-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: session-arc-learning-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: session-arc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            session-arc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            contradiction-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            rule-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            diagnostic-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Apply and compile the complete learning loop
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/arc-base.log"
          base64 --decode scripts/delivery/session-arc-20260919/session-arc.patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/arc.patch"
          echo "da3b52063de184cb13c1fea828e31f844cd0e264dc17ad5b22d63b2c4b92433b  $RUNNER_TEMP/arc.patch" | sha256sum --check
          base64 --decode scripts/delivery/session-arc-20260919/complete-loop.patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/arc-complete.patch"
          echo "3a62787a4f27da037fd7c55a098ee08434ce488205cb71e5ed2b840815f9448c  $RUNNER_TEMP/arc-complete.patch" | sha256sum --check
          contract=scripts/delivery/session-arc-20260919/preview-contract.patch
          echo "3ed003964db8915b91ecbbb1d66cc4ec0d2fea4a18ea933143d439c1aa60da61  $contract" | sha256sum --check
          if ! test -f src/core/curate_session_arc.rs; then
            test "$(git rev-parse HEAD:src/core/curate.rs)" = 6dbbefaae061e74ccea8328bf0d8f912a904ab2a
            test "$(git rev-parse HEAD:src/curate/mod.rs)" = 4c7ad95abe69627a929ee53612ddd9ac3653ab64
            test "$(git rev-parse HEAD:scripts/e2e_capture.sh)" = 7b4e978553dbc7de0dfb9c28cc3a1944582e2875
            test "$(git rev-parse HEAD:docs/schemas/ee.curate.show.v1.json)" = 1588bb2728153ec5a22e1c138a943505b518db91
            test "$(git rev-parse HEAD:tests/docs_schemas_match_responses.rs)" = 59a1a98981b167101c0f77aba88ca2f7fc890930
            git apply --check --whitespace=error-all "$RUNNER_TEMP/arc.patch"
            git apply "$RUNNER_TEMP/arc.patch"
            git apply --check --whitespace=error-all "$RUNNER_TEMP/arc-complete.patch"
            git apply "$RUNNER_TEMP/arc-complete.patch"
            git apply --check --whitespace=error-all "$contract"
            git apply "$contract"
          fi
          rustfmt --edition 2024 --config skip_children=true src/core/curate.rs src/core/curate_session_arc.rs src/core/curate_session_arc_tests.rs src/curate/mod.rs tests/session_arc_learning_cli.rs tests/docs_schemas_match_responses.rs
          bash -n scripts/e2e_capture.sh
          # Cargo autodiscovery is disabled; make the real-binary scenarios
          # an explicit target in the same transaction as their source file.
          if ! grep -Fq 'path = "tests/session_arc_learning_cli.rs"' Cargo.toml; then
            printf '\n[[test]]\nname = "session_arc_learning_cli"\npath = "tests/session_arc_learning_cli.rs"\n' >> Cargo.toml
          fi
          cargo check --locked --all-targets > "$RUNNER_TEMP/arc-check.log" 2>&1 || { tail -n 140 "$RUNNER_TEMP/arc-check.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: session-arc-compilation
          path: ${{ runner.temp }}/arc-*.log
          retention-days: 7
      - name: Test explicit paired learning and fail-closed source ownership
        run: |
          set -euo pipefail
          run_group() {
            local name="$1" filter="$2" count="$3"
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/arc-$name.log" 2>&1 || { tail -n 140 "$RUNNER_TEMP/arc-$name.log"; return 1; }
            tail -n 100 "$RUNNER_TEMP/arc-$name.log"
            grep -Eq "test result: ok\\. $count passed; 0 failed;" "$RUNNER_TEMP/arc-$name.log"
          }
          run_group learning 'core::curate::tests::session_arc_tests' 13
          run_group review 'core::curate::tests::review_session_' '[1-9][0-9]*'
          run_group ownership 'core::curate::tests::apply_curation_candidate_blocks_competing_create_derived_candidate_evidence_conflict' 1
          run_group drift 'core::curate::tests::apply_curation_candidate_rejects_create_derived_evidence_attachment_drift' 1
          run_group specificity 'specificity_score_credits_valid_canonical_session_provenance_not_empty_schemes' 1
          cargo test --locked --test session_arc_learning_cli -- --test-threads=2 > "$RUNNER_TEMP/arc-cli.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/arc-cli.log"; exit 1; }
          tail -n 100 "$RUNNER_TEMP/arc-cli.log"
          grep -Fq 'test result: ok. 2 passed; 0 failed;' "$RUNNER_TEMP/arc-cli.log"
          cargo test --locked --test integration_a_d docs_schemas_match_responses::curate_show_report_matches_schema -- --exact --test-threads=2 > "$RUNNER_TEMP/arc-schema.log" 2>&1 || { tail -n 140 "$RUNNER_TEMP/arc-schema.log"; exit 1; }
          tail -n 80 "$RUNNER_TEMP/arc-schema.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/arc-schema.log"
      - name: Publish tested source directly to main
        run: |
          set -euo pipefail
          base=$(cat "$RUNNER_TEMP/arc-base.log")
          workflow=.github/workflows/session-arc-20260919.yml
          cat > "$workflow" <<'RECEIPT'
          name: Source-backed session arc learning (delivered)
          # One-time source delivery completed with all-target compilation,
          # thirteen learning-loop regressions, two real-binary CLI scenarios,
          # strict JSON preview compatibility, review coverage and ownership/drift negatives.
          # Kept as an inert receipt: no push trigger or write permission.
          on:
            workflow_dispatch:
          permissions: {}
          jobs:
            receipt:
              if: ${{ false }}
              runs-on: ubuntu-latest
              steps:
                - run: echo 'Source delivery is complete; consult this workflow history for execution results.'
          RECEIPT
          printf '\n# Delivery Actions run: %s\n' "$GITHUB_RUN_ID" >> "$workflow"
          cat > .github/workflows/contradiction-graph-20260919.yml <<'RECEIPT'
          name: Deterministic contradiction graph integration (delivered)
          # Source commit 456eb9258248d22297d25d3ce88092bbbbf481e3.
          # Actions run 35461239537: all-target compilation, twelve standalone
          # core tests, twelve mixed-pack tests and thirteen guard regressions.
          # Inert retained receipt: no push trigger or future write permission.
          on:
            workflow_dispatch:
          permissions: {}
          jobs:
            receipt:
              if: ${{ false }}
              runs-on: ubuntu-latest
              steps:
                - run: echo 'Source delivery is complete; consult this workflow history for execution results.'
          RECEIPT
          files=(Cargo.toml src/core/curate.rs src/core/curate_session_arc.rs src/core/curate_session_arc_tests.rs src/curate/mod.rs tests/session_arc_learning_cli.rs scripts/e2e_capture.sh docs/schemas/ee.curate.show.v1.json tests/docs_schemas_match_responses.rs "$workflow" .github/workflows/contradiction-graph-20260919.yml)
          git diff --check
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(curate): learn linked failure and repair pairs from admitted session evidence' -m 'Recognize ordered arcs within one CASS window without inventing line provenance, reject negative/overlapping repairs, preserve complete pairs under limits, and report both capture lesson kinds correctly. Queue proposals atomically. Permit evidence sharing only with an exact source-reconstructed, reciprocally paired, explicitly applied live peer; keep the original evidence owner and record a typed related edge and audit in the same transaction. Preview shared ownership and the graph link before mutation. Carry concrete risk/mitigation and canonical CASS provenance without lowering specificity requirements. Preserve independent approval, dry runs, idempotent replay, and rollback. All-target compilation, thirteen learning regressions, two real-binary CLI scenarios, strict JSON preview-schema compatibility, existing review-session tests, canonical-provenance specificity and ordinary evidence-ownership negatives passed before publication.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${files[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
              cargo check --locked --all-targets > "$RUNNER_TEMP/arc-merge-check.log" 2>&1
              cargo test --locked --lib core::curate::tests::session_arc_tests -- --test-threads=2 > "$RUNNER_TEMP/arc-merge-tests.log" 2>&1
              grep -Fq 'test result: ok. 13 passed; 0 failed;' "$RUNNER_TEMP/arc-merge-tests.log"
              cargo test --locked --test session_arc_learning_cli -- --test-threads=2 > "$RUNNER_TEMP/arc-merge-cli.log" 2>&1
              grep -Fq 'test result: ok. 2 passed; 0 failed;' "$RUNNER_TEMP/arc-merge-cli.log"
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/arc-integrated-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/arc-integrated-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: session-arc-runtime-and-source
          path: |
            ${{ runner.temp }}/arc-*.log
            ${{ runner.temp }}/arc-integrated-source.tar.gz
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
