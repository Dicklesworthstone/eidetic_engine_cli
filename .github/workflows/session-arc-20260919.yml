name: Source-backed session arc learning
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/session-arc-20260919/**
      - .github/workflows/session-arc-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: session-arc-learning-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: session-arc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            session-arc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            contradiction-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            rule-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            diagnostic-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Apply and compile the complete learning loop
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/arc-base.log"
          base64 --decode scripts/delivery/session-arc-20260919/session-arc.patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/arc.patch"
          echo "da3b52063de184cb13c1fea828e31f844cd0e264dc17ad5b22d63b2c4b92433b  $RUNNER_TEMP/arc.patch" | sha256sum --check
          if ! test -f src/core/curate_session_arc.rs; then
            test "$(git rev-parse HEAD:src/core/curate.rs)" = 6dbbefaae061e74ccea8328bf0d8f912a904ab2a
            git apply --check --whitespace=error-all "$RUNNER_TEMP/arc.patch"
            git apply "$RUNNER_TEMP/arc.patch"
          fi
          rustfmt --edition 2024 --config skip_children=true src/core/curate.rs src/core/curate_session_arc.rs src/core/curate_session_arc_tests.rs
          cargo check --locked --all-targets > "$RUNNER_TEMP/arc-check.log" 2>&1 || { tail -n 140 "$RUNNER_TEMP/arc-check.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: session-arc-compilation
          path: ${{ runner.temp }}/arc-*.log
          retention-days: 7
      - name: Test explicit paired learning and fail-closed source ownership
        run: |
          set -euo pipefail
          run_group() {
            local name="$1" filter="$2" count="$3"
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/arc-$name.log" 2>&1 || { tail -n 140 "$RUNNER_TEMP/arc-$name.log"; return 1; }
            tail -n 100 "$RUNNER_TEMP/arc-$name.log"
            grep -Eq "test result: ok\\. $count passed; 0 failed;" "$RUNNER_TEMP/arc-$name.log"
          }
          run_group learning 'core::curate::tests::session_arc_tests' 12
          run_group review 'core::curate::tests::review_session_' '[1-9][0-9]*'
          run_group ownership 'core::curate::tests::apply_curation_candidate_blocks_competing_create_derived_candidate_evidence_conflict' 1
          run_group drift 'core::curate::tests::apply_curation_candidate_rejects_create_derived_evidence_attachment_drift' 1
      - name: Publish tested source directly to main
        run: |
          set -euo pipefail
          base=$(cat "$RUNNER_TEMP/arc-base.log")
          workflow=.github/workflows/session-arc-20260919.yml
          cat > "$workflow" <<'RECEIPT'
          name: Source-backed session arc learning (delivered)
          # One-time source delivery completed with all-target compilation,
          # twelve learning-loop regressions, existing review-session coverage,
          # and ordinary competing-evidence/attachment-drift negatives.
          # Kept as an inert receipt: no push trigger or write permission.
          on:
            workflow_dispatch:
          permissions: {}
          jobs:
            receipt:
              if: ${{ false }}
              runs-on: ubuntu-latest
              steps:
                - run: echo 'Source delivery is complete; consult this workflow history for execution results.'
          RECEIPT
          printf '\n# Delivery Actions run: %s\n' "$GITHUB_RUN_ID" >> "$workflow"
          files=(src/core/curate.rs src/core/curate_session_arc.rs src/core/curate_session_arc_tests.rs "$workflow")
          git diff --check
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(curate): learn linked failure and repair pairs from admitted session evidence' -m 'Recognize ordered arcs within one CASS window without inventing line provenance, reject negative/overlapping repairs, preserve complete pairs under limits, and report anti-pattern kinds correctly. Queue proposals atomically. Permit evidence sharing only with an exact source-reconstructed, reciprocally paired, explicitly applied live peer; keep the original evidence owner and record a typed related edge and audit in the same transaction. Preserve independent approval, dry runs, idempotent replay, and rollback. All-target compilation, twelve new real Rust regressions, existing review-session tests and ordinary evidence-ownership negatives passed before publication.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${files[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
              cargo check --locked --all-targets > "$RUNNER_TEMP/arc-merge-check.log" 2>&1
              cargo test --locked --lib core::curate::tests::session_arc_tests -- --test-threads=2 > "$RUNNER_TEMP/arc-merge-tests.log" 2>&1
              grep -Fq 'test result: ok. 12 passed; 0 failed;' "$RUNNER_TEMP/arc-merge-tests.log"
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/arc-integrated-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/arc-integrated-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: session-arc-runtime-and-source
          path: |
            ${{ runner.temp }}/arc-*.log
            ${{ runner.temp }}/arc-integrated-source.tar.gz
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
