name: CASS prefetch residency safety
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/cass-prefetch-20260920/apply_history.py
      - .github/workflows/cass-prefetch-residency-20260920.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cass-prefetch-residency
  cancel-in-progress: false
jobs:
  integrate-and-test:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: prefetch-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            prefetch-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            evidence-export-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate and execute residency regressions before publishing source
        run: |
          set -euo pipefail
          python3 scripts/delivery/cass-prefetch-20260920/apply_history.py
          paths=(src/core/cass_prefetch.rs src/core/cass_prefetch_residency_tests.rs)
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          git diff --check
          cargo test --locked --lib core::cass_prefetch::residency_tests -- --test-threads=2 > "$RUNNER_TEMP/prefetch-residency.log" 2>&1
          tail -n 100 "$RUNNER_TEMP/prefetch-residency.log"
          grep -Fq 'test result: ok. 8 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/prefetch-residency.log"
          cargo test --locked --lib core::cass_prefetch:: -- --test-threads=2 > "$RUNNER_TEMP/prefetch-all.log" 2>&1
          tail -n 100 "$RUNNER_TEMP/prefetch-all.log"
          cargo test --locked --lib daemon::server::tests::cass_prefetch -- --test-threads=2 > "$RUNNER_TEMP/prefetch-daemon.log" 2>&1
          tail -n 100 "$RUNNER_TEMP/prefetch-daemon.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/prefetch-daemon.log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "${paths[@]}"; then
            base=$(git rev-parse HEAD)
            git add -- "${paths[@]}"
            git commit -m 'fix(prefetch): bound resident histories and reset stale prediction state' -m 'Prevent new requests from relabeling old-generation history; recover cleanly on corpus changes. Bound aggregate owner cardinality and retained key/topic bytes with deterministic observation-LRU eviction and no identity truncation. Eight new residency regressions, all existing coordinator cases and daemon prefetch cases passed before this source commit.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/prefetch-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/prefetch-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: prefetch-source-and-tests
          path: ${{ runner.temp }}/prefetch-*
          retention-days: 7
      - name: Check all targets and production Clippy
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/prefetch-check.log"
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/prefetch-clippy.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: prefetch-verification
          path: ${{ runner.temp }}/prefetch-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
