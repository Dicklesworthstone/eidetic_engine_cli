      - name: Exercise remote embedding protocol and HTTP boundaries
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          # bd-aav0v: four arms shared one `failed`, so a red step named no arm. The
          # results.log line below recorded only the AGGREGATE, which cannot say which
          # of the four refused. Each arm now prints itself on both paths, and a
          # `timeout`-killed run is reported with its exit code (124) rather than
          # collapsing into the same 1 as a count mismatch -- which matters here because
          # both arms carry a 12-minute timeout and an HTTP boundary test is exactly the
          # kind that hangs.
          run_arm() {
            local name="$1" log="$RUNNER_TEMP/core-memory/$2" cmd_exit=0
            shift 2
            "$@" > "$log" 2>&1 || cmd_exit=$?
            tail -n 100 "$log"
            if test "$cmd_exit" -ne 0; then
