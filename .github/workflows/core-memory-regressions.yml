name: Core memory regressions

on:
  push:
    branches: [main]
    paths:
      - src/cass/**
      - src/config/**
      - src/core/config_surface.rs
      - src/core/global_store.rs
      - src/core/orient.rs
      - src/core/cass_error_recall*.rs
      - src/core/incident_card*.rs
      - src/core/backup*.rs
      - src/core/ask*.rs
      - src/core/resume*.rs
      - src/core/recall*.rs
      - src/core/memory_lifecycle.rs
      - src/core/memory.rs
      - src/core/model.rs
      - src/core/retrieval_affinity.rs
      - src/core/jsonl*.rs
      - src/core/context*.rs
      - src/core/curate*.rs
      - src/core/index*.rs
      - src/core/search*.rs
      - src/core/remote_embed.rs
      - src/core/global_promotion*.rs
      - src/daemon/server.rs
      - src/db/**
      - src/models/**
      - src/pack/**
      - src/mcp*.rs
      - tests/contracts/backup_import_roundtrip.rs
      - tests/contracts/cass_session_info*.rs
      - tests/contracts/graph_config_behavior.rs
      - tests/e2e_core_workflow.rs
      - tests/no_mocks_e2e.rs
      - tests/retrieval_index_regression_oracle.rs
      - tests/remote_embedding_backend_e2e.rs
      - tests/session_arc_learning_cli.rs
      - tests/mcp_parity.rs
      - tests/mcp_parity/**
      - tests/model_bundled_embedding_cli_e2e.rs
      - tests/model_lifecycle_readiness_integration.rs
      - tests/daemon_uds_rpc_round_trip.rs
      - tests/rule_mark_update_e2e.rs
      - tests/fixtures/failure_modes/semantic_dimension_exceeds_budget.json
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/core-memory-regressions.yml

permissions:
  contents: read

concurrency:
  group: core-memory-regressions-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            cass-refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Record exact source and toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-memory"
          {
            git rev-parse HEAD
            rustc --version --verbose
            cargo --version
            sha256sum Cargo.lock
          } | tee "$RUNNER_TEMP/core-memory/source.log"
          # bd-aav0v: a BARE `test` under errexit, so a mismatch aborted with no message. The
          # failure it guards against is specific and serious -- the checkout is not the commit
          # that triggered the run, which makes every verdict below a statement about a tree
          # nobody asked about. Silent, that is indistinguishable from a test failure.
          # Exit code and condition unchanged.
          checked_out_sha=$(git rev-parse HEAD)
          if test "$checked_out_sha" != "$GITHUB_SHA"; then
            echo "ATTRIBUTION: provenance guard STOPPED this lane -- the checkout is $checked_out_sha but the run was triggered for $GITHUB_SHA. Nothing below this point would describe the intended commit, so the lane refuses rather than publish a verdict about the wrong tree."
            exit 1
          fi
          git diff --exit-code
      - name: Check all Cargo targets
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --features mcp 2>&1 | tee "$RUNNER_TEMP/core-memory/check.log"
      - name: Exercise pinned model selection and storage compatibility
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          while read -r label filter; do
            log="$RUNNER_TEMP/core-memory/$label.log"
            status=0
            timeout 12m cargo test --locked --lib "$filter" -- --test-threads=1 > "$log" 2>&1 || status=$?
            tail -n 100 "$log"
            if test "$status" -ne 0; then
              echo "Case '$label' failed with exit $status."
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; [0-9]+ ignored;' "$log"; then
              echo "Case '$label' did not execute a passing, nonempty test selection."
              failed=1
            fi
            printf '%s exit=%s\n' "$label" "$status" >> "$RUNNER_TEMP/core-memory/results.log"
          done <<'CASES'
          model-selection-atomic db::tests::select_model2vec_embedding_
          model-storage-read-only db::tests::read_only_file_
          model-registered-identity core::index::tests::registered_model2vec_
          model-workspace-selection core::index::tests::workspace_registry_
          model-read-preparation core::index::ask_model::tests::
          model-fetch-lifecycle core::model::tests::
          CASES
          exit "$failed"
      - name: Exercise real smaller-model fetch, switch, and daemon retrieval
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/core-memory/model-smaller-public.log"
          status=0
          # Explicit opt-in: this one test fetches pinned 8M and 32M assets.
          # Its remaining children use EE_EMBED_DOWNLOAD=off and a network tripwire.
          timeout 15m cargo test --locked --test model_bundled_embedding_cli_e2e \
            smaller_model2vec_fetch_switch_reembed_and_daemon_retrieval \
            -- --ignored --exact --test-threads=1 > "$log" 2>&1 || status=$?
          tail -n 150 "$log"
          printf 'model-smaller-public exit=%s\n' "$status" >> "$RUNNER_TEMP/core-memory/results.log"
          if test "$status" -ne 0; then
            echo "Real smaller-model qualification failed with exit $status."
            exit 1
          fi
          if ! grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$log"; then
            echo "Real smaller-model qualification did not execute exactly one passing test."
            exit 1
          fi
      - name: Exercise configuration and isolated global hydration
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          while read -r label filter; do
            log="$RUNNER_TEMP/core-memory/$label.log"
