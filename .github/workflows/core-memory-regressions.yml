            printf '%s exit=%s\n' "$label" "$status" >> "$RUNNER_TEMP/core-memory/results.log"
          done <<'CASES'
          index-repair-serial core::index::tests::requested_index_repair_
          index-backend-identity core::index::remote_embedding_space_tests::
          index-backend-selection core::index::tests::explicit_remote_backend_outranks_rejected_workspace_registration
          search-empty-generation-serial core::search::tests::empty_generations::
          search-index-freshness core::search::tests::search_degradations_
          search-snapshot-generation core::search::tests::snapshot_generation_context_search_uses_its_database_snapshot
          search-generation-cache core::search::tests::search_generation_cache_follows_exchange_with_identical_metadata
          search-diagnostic-retrieval core::search::tests::diag_search_report_exposes_prefusion_arms_and_fusion_contributions
          CASES
          exit "$failed"
      - name: Exercise producer integrity and standalone semantic scoring
