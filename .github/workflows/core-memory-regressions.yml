          native-rule-outcome integration_n_r rule_mark_update_e2e::native_rule_outcome_changes_rule_once_without_changing_source_memory
          model-lifecycle integration_g_m model_lifecycle_readiness_integration::
          cass-context integration_n_r no_mocks_e2e::no_mocks_import_cass_fixture_sessions_stores_spans_and_searches
          readonly-context integration_n_r retrieval_index_regression_oracle::sequential_read_only_packs_are_byte_identical_and_do_not_mutate_the_workspace
          CASES
          exit "$failed"
      - name: Check strict Clippy and formatting
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          # bd-aav0v: three arms of DIFFERENT KINDS shared one flag -- a lint, a format
          # check, and a working-tree cleanliness check. The third is the one worth naming:
          # `git diff --exit-code` failing does not mean the code is wrong, it means
          # something in the step MODIFIED tracked files, which is a completely different
          # problem from a clippy warning and was previously indistinguishable from one.
          clippy_exit=0
          cargo clippy --locked --all-targets --features mcp -- -D warnings > "$RUNNER_TEMP/core-memory/clippy.log" 2>&1 || clippy_exit=$?
          fmt_exit=0
          cargo fmt --all --check > "$RUNNER_TEMP/core-memory/fmt.log" 2>&1 || fmt_exit=$?
          tail -n 100 "$RUNNER_TEMP/core-memory/clippy.log"
          tail -n 100 "$RUNNER_TEMP/core-memory/fmt.log"
          if test "$clippy_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo clippy --all-targets --features mcp -D warnings' FAILED -- exit $clippy_exit"
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo clippy --all-targets --features mcp -D warnings' ok"
          fi
          if test "$fmt_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo fmt --all --check' FAILED -- exit $fmt_exit"
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo fmt --all --check' ok"
          fi
          diff_exit=0
          git diff --exit-code || diff_exit=$?
          if test "$diff_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'working tree unmodified' FAILED -- git diff exit $diff_exit; this step changed tracked files"
            failed=1
          else
            echo "ATTRIBUTION: arm 'working tree unmodified' ok"
          fi
          exit "$failed"
