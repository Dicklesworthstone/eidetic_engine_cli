            # reads, and it collapsed two causes: `status -ne 0` (the tool failed, or the
            # 12-minute timeout fired) and a missing summary line (the assertion failed)
            # both set the same flag. Each case now names itself on stdout and the two
            # causes are distinguished, which matters most for the timeout: exit 124 and a
            # count mismatch are very different problems.
            if test "$status" -ne 0; then
              echo "ATTRIBUTION: case '$label' FAILED -- exit $status (tool failure or timeout, not an assertion)"
              failed=1
            elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              echo "ATTRIBUTION: case '$label' FAILED -- no passing-with-zero-failures summary line"
              failed=1
            else
              echo "ATTRIBUTION: case '$label' ok"
            fi
            printf '%s exit=%s\n' "$label" "$status" >> "$RUNNER_TEMP/core-memory/results.log"
          done <<'CASES'
          mcp-ask mcp::ask
          mcp-ask-registry mcp::tests::registered_ask
          mcp-ask-routing mcp::tests::build_cli_args_wave_read_tools_route_to_cli_commands
          CASES
          status=0
          timeout 12m cargo test --locked --features mcp --test mcp_parity ask -- --test-threads=1 > "$RUNNER_TEMP/core-memory/mcp-ask-parity.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/core-memory/mcp-ask-parity.log"
          # bd-aav0v, same split as the loop above. This one sits OUTSIDE the loop with a
          # hardcoded log path, which is why a scan keyed on the loop body misses it.
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: case 'mcp-ask-parity' FAILED -- exit $status (tool failure or timeout, not an assertion)"
            failed=1
          elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/core-memory/mcp-ask-parity.log"; then
            echo "ATTRIBUTION: case 'mcp-ask-parity' FAILED -- no passing-with-zero-failures summary line"
            failed=1
          else
            echo "ATTRIBUTION: case 'mcp-ask-parity' ok"
          fi
          printf 'mcp-ask-parity exit=%s\n' "$status" >> "$RUNNER_TEMP/core-memory/results.log"
          exit "$failed"
      - name: Exercise public memory, recovery, and learning contracts
