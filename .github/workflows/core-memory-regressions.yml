          config-layers core::config_surface::tests::merged_config_
          config-global-root core::global_store::tests::default_user_data_root_requires_absolute_xdg_and_preserves_home_fallback
          config-global-hydration core::orient::tests::orient_fast_content_hydrates_isolated_global_store
