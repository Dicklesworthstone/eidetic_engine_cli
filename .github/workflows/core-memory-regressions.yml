name: Core memory regressions

on:
  push:
    branches: [main]
    paths:
      - src/cass/**
      - src/core/backup*.rs
      - src/core/jsonl*.rs
      - src/core/context*.rs
      - src/core/curate*.rs
      - src/core/index*.rs
      - src/core/search*.rs
      - src/db/**
      - src/models/**
      - tests/contracts/backup_import_roundtrip.rs
      - tests/contracts/cass_session_info*.rs
      - tests/e2e_core_workflow.rs
      - tests/no_mocks_e2e.rs
      - tests/retrieval_index_regression_oracle.rs
      - tests/session_arc_learning_cli.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/core-memory-regressions.yml

permissions:
  contents: read

concurrency:
  group: core-memory-regressions-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            cass-refresh-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Record exact source and toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-memory"
          {
            git rev-parse HEAD
            rustc --version --verbose
            cargo --version
            sha256sum Cargo.lock
          } | tee "$RUNNER_TEMP/core-memory/source.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - name: Check all Cargo targets
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/core-memory/check.log"
      - name: Exercise import, revision, learning, and context regressions
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          while read -r label filter; do
            log="$RUNNER_TEMP/core-memory/$label.log"
            status=0
            timeout 12m cargo test --locked --lib "$filter" -- --test-threads=2 > "$log" 2>&1 || status=$?
            tail -n 100 "$log"
            if test "$status" -ne 0 || ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              failed=1
            fi
            printf '%s exit=%s\n' "$label" "$status" >> "$RUNNER_TEMP/core-memory/results.log"
          done <<'CASES'
          cass-activity cass::import::tests::since_
          cass-refresh cass::import::refresh::
          session-arc-text core::curate::session_arc::
          session-arc-learning core::curate::tests::session_arc_tests::
          backup-revisions core::backup::revision_recovery_tests::
          backup-chain core::backup::tests::the_export_chain_order_and_the_database_agree_on_which_revision_is_the_head
          jsonl-heads core::jsonl_import::revisions::head_tests::
          jsonl-lineage core::jsonl_import::tests::revision_lineage_
          jsonl-recovery core::jsonl_import::recovery_regression_tests::
          pack-admission pack_slot
          context-index core::context::tests::readonly_pack_preserves_stale_queued_index_while_writable_pack_reconciles
          index-workspace core::index::tests::process_index_jobs_respects_requested_workspace_over_newest_row
          CASES
          exit "$failed"
      - name: Exercise public memory, recovery, and learning contracts
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          while read -r label target filter; do
            log="$RUNNER_TEMP/core-memory/$label.log"
            status=0
            timeout 12m cargo test --locked --test "$target" "$filter" -- --test-threads=1 > "$log" 2>&1 || status=$?
            tail -n 100 "$log"
            if test "$status" -ne 0 || ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then
              failed=1
            fi
            printf '%s exit=%s\n' "$label" "$status" >> "$RUNNER_TEMP/core-memory/results.log"
          done <<'CASES'
          cass-session-contract contracts cass_session_info_
          backup-contract contracts backup_import_roundtrip::
          core-cli e2e_core_workflow core_workflow_init_remember_search_context_why
          learning-cli session_arc_learning_cli public_cli_
          cass-context integration_n_r no_mocks_e2e::no_mocks_import_cass_fixture_sessions_stores_spans_and_searches
          readonly-context integration_n_r retrieval_index_regression_oracle::sequential_read_only_packs_are_byte_identical_and_do_not_mutate_the_workspace
          CASES
          exit "$failed"
      - name: Check strict Clippy and formatting
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/core-memory/clippy.log" 2>&1 || failed=1
          cargo fmt --all --check > "$RUNNER_TEMP/core-memory/fmt.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/core-memory/clippy.log"
          tail -n 100 "$RUNNER_TEMP/core-memory/fmt.log"
          git diff --exit-code || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-memory-regressions-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-memory/
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
