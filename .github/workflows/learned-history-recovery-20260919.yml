# Source delivery is complete. This lane only reads and verifies its triggering commit.
name: Learned and pack history recovery
on:
  push:
    branches: [main]
    paths:
      - src/core/backup_history_recovery*.rs
      - src/core/backup_pack_recovery*.rs
      - src/core/backup_recovery.rs
      - .github/workflows/learned-history-recovery-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learned-history-recovery
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Capture exact verification source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/history-source-sha.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          tar -czf "$RUNNER_TEMP/history-source.tar.gz" src/core/backup.rs src/core/backup_recovery.rs src/core/backup_history_recovery*.rs src/core/backup_pack_recovery*.rs
          rustc --version --verbose > "$RUNNER_TEMP/history-toolchain.log"
      - uses: actions/upload-artifact@v4
        with:
          name: learned-history-source
          path: |
            ${{ runner.temp }}/history-source-sha.log
            ${{ runner.temp }}/history-source.tar.gz
            ${{ runner.temp }}/history-toolchain.log
          retention-days: 7
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/history-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/history-check.log"
          exit "$status"
      - name: Execute exact recovery regressions
        run: |
          set -uo pipefail
          failed=0
          run_group() {
            local name="$1" filter="$2" expected="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/history-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/history-$name.log"
            if test "$status" -ne 0 || ! grep -Fq "test result: ok. $expected passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/history-$name.log"; then failed=1; fi
          }
          run_group publication core::backup::history_recovery_tests 6
          run_group inventory core::backup::recovery:: 25
          run_group chunks core::backup::tests::default_backup_restores_learning_history 1
          run_group replay core::backup::tests::default_backup_restores_pack_history_and_replay 1
          run_group evidence core::backup::tests::pack_history_restores_native_evidence_and_legacy_missing_ledger 1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: learned-history-test-results
          path: ${{ runner.temp }}/history-*.log
          retention-days: 7
      - name: Check production Clippy and source formatting
        if: ${{ !cancelled() }}
        run: |
          failed=0
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/history-clippy.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/history-clippy.log"
          rustfmt --check --edition 2024 --config skip_children=true src/core/backup_history_recovery*.rs src/core/backup_pack_recovery*.rs > "$RUNNER_TEMP/history-format.log" 2>&1 || failed=1
          cat "$RUNNER_TEMP/history-format.log"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: learned-history-verification
          path: ${{ runner.temp }}/history-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
