# Source delivery is complete. This lane only reads and verifies its triggering commit.
name: Learned and pack history recovery
on:
  push:
    branches: [main]
    paths:
      - src/core/backup_history_recovery*.rs
      - src/core/backup_pack_recovery*.rs
      - src/core/backup_cass_recovery.rs
      - src/core/backup_recovery.rs
      - .github/workflows/learned-history-recovery-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learned-history-recovery
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. This overrides the action's install
      # AT INVOCATION TIME, so a bare rustfmt/cargo later in this job resolves
      # through it, not through the `toolchain:` input below. Pinning one half
      # only installs components onto the dated toolchain and then invokes
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Capture exact verification source
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/history-source-sha.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          tar -czf "$RUNNER_TEMP/history-source.tar.gz" src/core/backup.rs src/core/backup_recovery.rs src/core/backup_history_recovery*.rs src/core/backup_pack_recovery*.rs src/core/backup_cass_recovery.rs
          rustc --version --verbose > "$RUNNER_TEMP/history-toolchain.log"
      - uses: actions/upload-artifact@v4
        with:
          name: learned-history-source
          path: |
            ${{ runner.temp }}/history-source-sha.log
            ${{ runner.temp }}/history-source.tar.gz
            ${{ runner.temp }}/history-toolchain.log
          retention-days: 7
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            snapshot-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/history-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/history-check.log"
          exit "$status"
      - name: Execute exact recovery regressions
        run: |
          set -uo pipefail
          failed=0
          # bd-lagsa + bd-aav0v. This step is where the lane dies, and the cause was one
          # exact pin that is PROVABLY WRONG.
          #
          # `core::backup::recovery::` was pinned to exactly 31 here. trust-recovery-20260919
          # pins the SAME filter under the SAME `cargo test --locked --lib` scope, and its
          # exact pin of 50 PASSED on 2026-09-19 (its last conclusive run). An exact pin that
          # passes measures the population: it was 50, so 31 cannot also be right. This lane
          # has never recorded a success, which is what a permanently unsatisfiable pin looks
          # like. I am not re-pinning 50 -- that would be a fresh guess with the same failure
          # mode, and tests may have landed since -- so the two SUBTREE filters become FLOORS
          # of their reviewed values, which pass whether the truth is the old number or
          # larger and still catch removal.
          #
          # The three single-named-test pins stay EXACT on purpose. For one named test a
          # floor of 1 is strictly WEAKER: it would silently accept a different test that
          # happened to match after a rename. Exact is the stronger statement there, and
          # `--exact`-style pins are not the defect bd-lagsa describes.
          #
          # Five calls shared one flag, so a red named none of the ten runtime arms. Both
          # helpers record into the shared flag and always return 0: returning nonzero from
          # a BARE call under errexit would abort the step and lose the remaining arms.
          observed() {
            sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$1" | head -1
          }
          run_floor() {
            local name="$1" filter="$2" floor="$3" status=0 ran=""
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/history-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/history-$name.log"
            ran=$(observed "$RUNNER_TEMP/history-$name.log")
            if test "$status" -ne 0; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
              failed=1
            elif test -z "$ran" || test "$ran" -lt "$floor"; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- counted '${ran:-none}' passing with 0 failures, required floor $floor"
              failed=1
            else
              echo "ATTRIBUTION: arm '$name' ($filter) ok -- $ran passed, floor $floor"
            fi
            return 0
          }
          run_exact() {
            local name="$1" filter="$2" expected="$3" status=0 ran=""
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/history-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/history-$name.log"
            ran=$(observed "$RUNNER_TEMP/history-$name.log")
            if test "$status" -ne 0; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- cargo exit $status (a failing assertion or a crashed harness, not a count)"
              failed=1
            elif test "${ran:-none}" != "$expected"; then
              echo "ATTRIBUTION: arm '$name' ($filter) FAILED -- expected exactly $expected passing, counted '${ran:-none}'. This filter names ONE test, so a count other than $expected means the test was renamed, removed, or the filter now matches something else."
              failed=1
            else
              echo "ATTRIBUTION: arm '$name' ($filter) ok -- exactly $ran passed"
            fi
            return 0
          }
          run_floor publication core::backup::history_recovery_tests 6
          run_floor inventory core::backup::recovery:: 31
          run_exact chunks core::backup::tests::default_backup_restores_learning_history 1
          run_exact replay core::backup::tests::default_backup_restores_pack_history_and_replay 1
          run_exact evidence core::backup::tests::pack_history_restores_native_evidence_and_legacy_missing_ledger 1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: learned-history-test-results
          path: ${{ runner.temp }}/history-*.log
          retention-days: 7
      - name: Check production Clippy and source formatting
        if: ${{ !cancelled() }}
        run: |
          failed=0
          # bd-aav0v: a production lint and a GLOBBED format check under one flag. The
          # glob is the trap worth attributing: two of the three patterns are wildcards,
          # and bash leaves an unmatched pattern as a literal, so rustfmt is handed a
          # path that does not exist and fails -- which is a RENAMED OR DELETED source,
          # not a reflow, and reads identically under a shared flag. So print the
          # expansion and say which of the two it was.
          clippy_exit=0
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/history-clippy.log" 2>&1 || clippy_exit=$?
          tail -n 100 "$RUNNER_TEMP/history-clippy.log"
          fmt_sources=(src/core/backup_history_recovery*.rs src/core/backup_pack_recovery*.rs src/core/backup_cass_recovery.rs)
          echo "ATTRIBUTION: format arm scope -- ${#fmt_sources[@]} path(s): ${fmt_sources[*]}"
          unexpanded=0
          for candidate in "${fmt_sources[@]}"; do
            if test ! -f "$candidate"; then
              echo "ATTRIBUTION: format arm scope PROBLEM -- '$candidate' does not exist (an unmatched glob or a renamed source, NOT a formatting defect)"
              unexpanded=1
            fi
          done
          fmt_exit=0
          rustfmt --check --edition 2024 --config skip_children=true "${fmt_sources[@]}" > "$RUNNER_TEMP/history-format.log" 2>&1 || fmt_exit=$?
          cat "$RUNNER_TEMP/history-format.log"
          if test "$clippy_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' FAILED -- exit $clippy_exit"
            grep -m1 -E '^error' "$RUNNER_TEMP/history-clippy.log" || true
            grep -m1 -E '^\s*-->' "$RUNNER_TEMP/history-clippy.log" || true
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' ok"
          fi
          if test "$fmt_exit" -ne 0; then
            if test "$unexpanded" -ne 0; then
              echo "ATTRIBUTION: arm 'rustfmt --check on the backup recovery sources' FAILED -- exit $fmt_exit, and a scoped path above is MISSING; fix the glob or the step, not the formatting"
            else
              echo "ATTRIBUTION: arm 'rustfmt --check on the backup recovery sources' FAILED -- exit $fmt_exit; every scoped path exists, so this is a real reflow:"
              grep -m5 -E '^Diff in ' "$RUNNER_TEMP/history-format.log" || true
            fi
            failed=1
          else
            echo "ATTRIBUTION: arm 'rustfmt --check on the backup recovery sources' ok"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: learned-history-verification
          path: ${{ runner.temp }}/history-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
