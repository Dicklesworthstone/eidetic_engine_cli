name: macOS EE Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ee-artifact-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build aarch64-apple-darwin debug ee
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci/cargo-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          CARGO_PATH_ROOT="$project_root" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin

      - name: Build ee
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_DESCRIBE: ci-${{ github.sha }}
          # Cargo.toml contains the one declared, attested path rewrite.
          VERGEN_GIT_DIRTY: "true"
          EE_BUILD_TARGET: aarch64-apple-darwin
        run: cargo build --locked --workspace --bin ee --target aarch64-apple-darwin

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/aarch64-apple-darwin/debug/ee dist/ee
          chmod 755 dist/ee
          COPYFILE_DISABLE=1 tar -czf dist/ee-aarch64-apple-darwin-debug.tar.gz -C dist ee
          shasum -a 256 dist/ee-aarch64-apple-darwin-debug.tar.gz > dist/ee-aarch64-apple-darwin-debug.tar.gz.sha256

      - name: Attest packaged artifact and behavior
        shell: bash
        run: |
          set -euo pipefail
          build_command='["cargo","build","--locked","--workspace","--bin","ee","--target","aarch64-apple-darwin"]'
          manifest=dist/ee-aarch64-apple-darwin-debug.manifest.json
          python3 scripts/ci_artifact_attestation.py generate \
            --workspace "$GITHUB_WORKSPACE" \
            --binary dist/ee \
            --archive dist/ee-aarch64-apple-darwin-debug.tar.gz \
            --source-commit "$GITHUB_SHA" \
            --build-command-json "$build_command" \
            --rewrite-id franken_stack_path_rewrite_v1 \
            --cargo-path-root "$GITHUB_WORKSPACE/.ci/franken-stack/projects" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$manifest"
          python3 scripts/ci_artifact_attestation.py verify \
            --workspace "$GITHUB_WORKSPACE" \
            --binary dist/ee \
            --archive dist/ee-aarch64-apple-darwin-debug.tar.gz \
            --checksum dist/ee-aarch64-apple-darwin-debug.tar.gz.sha256 \
            --manifest "$manifest" \
            --expected-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$GITHUB_RUN_ID"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ee-aarch64-apple-darwin-debug
          path: |
            dist/ee-aarch64-apple-darwin-debug.tar.gz
            dist/ee-aarch64-apple-darwin-debug.tar.gz.sha256
            dist/ee-aarch64-apple-darwin-debug.manifest.json
          if-no-files-found: error
          retention-days: 3
