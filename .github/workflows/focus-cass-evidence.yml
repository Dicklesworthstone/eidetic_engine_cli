name: Native CASS focus recommendations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/core/focus_suggest*.rs
      - src/policy/**
      - docs/schemas/ee.focus.suggest.v1.json
      - .github/workflows/focus-cass-evidence.yml

permissions:
  contents: read

concurrency:
  group: focus-cass-${{ github.sha }}
  cancel-in-progress: false

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: focus-cass-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Verify exact source and all targets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/focus-cass"
          git rev-parse HEAD | tee "$RUNNER_TEMP/focus-cass/source.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/focus-cass/check.log"
      - name: Exercise native CASS, existing ranking and public CLI contracts
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          for target in unit cli; do
            log="$RUNNER_TEMP/focus-cass/$target.log"
            if test "$target" = unit; then
              timeout 12m cargo test --locked --lib core::focus_suggest:: -- --test-threads=2 > "$log" 2>&1 || failed=1
            else
              timeout 12m cargo test --locked --test integration_e_f focus_suggest_phase2_e2e:: -- --test-threads=1 > "$log" 2>&1 || failed=1
            fi
            tail -n 100 "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log" || failed=1
          done
          exit "$failed"
      - name: Check strict library lint and focus formatting
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/focus-cass/clippy.log" 2>&1 || failed=1
          rustfmt --edition 2024 --check --config skip_children=true src/core/focus_suggest.rs src/core/focus_suggest_cass.rs > "$RUNNER_TEMP/focus-cass/fmt.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/focus-cass/clippy.log"
          tail -n 100 "$RUNNER_TEMP/focus-cass/fmt.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: focus-cass-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focus-cass/
          retention-days: 7
