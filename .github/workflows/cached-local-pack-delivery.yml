name: Cached local pack delivery

on:
  push:
    branches: [main]
    paths: [.github/workflows/cached-local-pack-delivery.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Reconcile and export exact resident-local source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resident-pack"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'resident-pack'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = {
              'docs/schemas/ee.daemon.search.request.v2.json': '50f1038ee1e35aa440ce4fa1caf32f035845ec16',
              'src/cli/mod.rs': '901f7887f3283fd72b5b14226be7c7e21d777810',
              'src/core/context.rs': 'ff60dfd308c9c8be2a5d125e6b1a3d4deb1b25b0',
              'src/core/context_test_module.rs': 'a5af003964f5e467f06916ca7a387bc99d178ccd',
              'src/core/index.rs': '098698adf410524f61f3ed54c2111db4ce2cae01',
              'src/core/index_ask.rs': 'e389a7939cdfd587dc6cb968f93a74769d58eed5',
              'src/core/search.rs': '9f627fb251252681ffdcafe896418de5c908ee7b',
              'src/daemon/server.rs': '31b414b05d5cd050c4dc0e7b1acae85f2d82e78d',
              'src/daemon/server_cached_local_tests.rs': None,
          }
          base = git('rev-parse', 'HEAD')
          assert base == os.environ['GITHUB_SHA']
          for name, sha in expected.items():
              if sha is None:
                  assert not pathlib.Path(name).exists(), 'New source already exists: ' + name
              else:
                  assert git('rev-parse', 'HEAD:' + name) == sha, 'Concurrent source change: ' + name
          api = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs'
          blob = json.loads(subprocess.check_output(['gh', 'api', api + '/a6fc08aaeea553d7a6fcdc0a296783a7e7897524']))
          packed = base64.b64decode(blob['content'])
          assert hashlib.sha256(packed).hexdigest() == '810f7deb4ff7f8d521ecc78b7476c504cb059eaf2694740203f76c61e79b2389'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '06fd6e058effe12a803e4e28dcb828e1df8e070b5aa5930ee2c2a8a6025e695a'
          path = out / 'reviewed.patch'
          path.write_bytes(patch)
          touched = {line.split('\t', 2)[2] for line in git('apply', '--numstat', str(path)).splitlines()}
          assert touched == set(expected), touched
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          rust = [name for name in expected if name.endswith('.rs')]
          subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true', *rust], check=True)
          subprocess.run(['git', 'add', '-N', 'src/daemon/server_cached_local_tests.rs'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          assert set(git('diff', '--name-only').splitlines()) == set(expected)
          manifest = {'base': base, 'entries': []}
          for name, before in expected.items():
              content = pathlib.Path(name).read_bytes()
              request = json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode()
              created = json.loads(subprocess.check_output(['gh', 'api', api, '--input', '-'], input=request))
              assert created['sha'] == git('hash-object', name)
              manifest['entries'].append({'path': name, 'before': before, 'sha': created['sha'], 'sha256': hashlib.sha256(content).hexdigest()})
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (out / 'formatted.patch').write_text(subprocess.check_output(['git', 'diff', '--binary'], text=True))
          with tarfile.open(out / 'changed-source.tar.gz', 'w:gz') as archive:
              for name in expected:
                  archive.add(name, arcname=name)
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resident-pack-source-${{ github.run_id }}
          path: ${{ runner.temp }}/resident-pack/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: resident-pack-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check all Cargo targets
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --features mcp 2>&1 | tee "$RUNNER_TEMP/resident-pack/check.log"
      - name: Exercise resident model admission and real pack retrieval
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          while read -r name filter; do
            log="$RUNNER_TEMP/resident-pack/$name.log"
            status=0
            timeout 12m cargo test --locked --lib "$filter" -- --test-threads=2 > "$log" 2>&1 || status=$?
            tail -n 100 "$log"
            if test "$status" -ne 0 || ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"; then failed=1; fi
            printf '%s exit=%s\n' "$name" "$status" >> "$RUNNER_TEMP/resident-pack/results.log"
          done <<'CASES'
          resident-model core::index::ask_model::tests::resident_model_
          resident-rpc daemon::server::cached_local_tests::
          resident-pack resident_local_pack
          cli-pack cli::tests::pack_daemon_
          pack-cold core::context::tests::read_only_semantic_pack_keeps_embedding_preparation_local
          pack-freshness core::context::tests::daemon_pack_changed_store_restarts_local_admission
          readonly-model core::index::ask_model::tests::read_only_
          CASES
          exit "$failed"
      - name: Check strict Clippy and changed-source formatting
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          cargo clippy --locked --all-targets --features mcp -- -D warnings > "$RUNNER_TEMP/resident-pack/clippy.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/resident-pack/clippy.log"
          rustfmt --edition 2024 --check --config skip_children=true src/core/index_ask.rs src/core/index.rs src/core/search.rs src/core/context.rs src/core/context_test_module.rs src/daemon/server.rs src/daemon/server_cached_local_tests.rs src/cli/mod.rs || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resident-pack-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/resident-pack/
          retention-days: 7
          if-no-files-found: error
