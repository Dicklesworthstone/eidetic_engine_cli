name: Resident pack source correction

on:
  push:
    branches: [main]
    paths: [.github/workflows/cached-local-pack-delivery.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Correct and export only the two diagnosed test sources
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTUP_TOOLCHAIN: nightly-2026-08-31
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'resident-correction'
          out.mkdir()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert base == os.environ['GITHUB_SHA']
          api = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs'
          files = [
              ('src/cli/mod.rs', '17c5d9ef20ab3444fa913e60be15760af4409d81', '04b2ba5fdd30fc631477298c4f6e7a7f83724207', '6ef0757a99cc36f672e1035822bea6c0c08000e4'),
              ('src/core/index_ask.rs', '1d664bba8e31a714a9dea7dd57f35805f51cc857', '931cfb161bae8411b1419d228cb287a08ec5d72f', 'b307138974560d034928b1f92aa2c6a57a81a238'),
          ]
          manifest = {'base': base, 'entries': []}
          for name, before, prepared, expected in files:
              current = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + name], text=True).strip()
              assert current == before, 'Concurrent product change: ' + name
              blob = json.loads(subprocess.check_output(['gh', 'api', api + '/' + prepared]))
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == prepared
              text = data.decode()
              if name == 'src/cli/mod.rs':
                  first = text.index('    fn resident_local_pack_never_sends_a_query_to_unsupported_or_cold_peers()')
                  end = text.index('    fn pack_daemon_retrieval_preserves_local_pack_budget_provenance_and_writes()', first)
                  chunk = text[first:end]
                  old = 'Instant::now() + Duration::from_secs(3)'
                  assert chunk.count(old) == 1
                  text = text[:first] + chunk.replace(old, 'std::time::' + old) + text[end:]
              else:
                  old = '#[cfg(test)]\nuse frankensearch::Embedder as _;\n'
                  assert text.count(old) == 1
                  text = text.replace(old, '')
                  old = '            fn id(&self) -> &str {\n                self.inner.id()\n            }\n            fn is_semantic(&self) -> bool {'
                  new = '            fn id(&self) -> &str {\n                self.inner.id()\n            }\n            fn model_name(&self) -> &str {\n                self.inner.model_name()\n            }\n            fn is_semantic(&self) -> bool {'
                  assert text.count(old) == 1
                  text = text.replace(old, new)
              target = out / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text)
              subprocess.run(['rustfmt', '--edition', '2024', '--config-path', 'rustfmt.toml', '--config', 'skip_children=true', str(target)], check=True)
              data = target.read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert sha == expected, 'Unexpected formatted source: ' + name
              payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode()
              created = json.loads(subprocess.check_output(['gh', 'api', api, '--input', '-'], input=payload))
              assert created['sha'] == sha
              manifest['entries'].append({'path': name, 'before': before, 'prepared': prepared, 'sha': sha, 'sha256': hashlib.sha256(data).hexdigest()})
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with tarfile.open(out / 'changed-source.tar.gz', 'w:gz') as archive:
              for name, *_ in files:
                  archive.add(out / name, arcname=name)
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resident-pack-correction-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/resident-correction/manifest.json
            ${{ runner.temp }}/resident-correction/changed-source.tar.gz
          retention-days: 7
          if-no-files-found: error
