name: Cached local pack delivery

on:
  push:
    branches: [main]
    paths: [.github/workflows/cached-local-pack-delivery.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Admit exact manually authored patch and format changed Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cached-pack"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cached-pack'
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          request = urllib.request.Request(api + '/git/blobs/a2146d9837c97050f9aee62c5b9df386a64521d5', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              encoded = base64.b64decode(json.load(response)['content']).decode('ascii')
          # Correct one known transport insertion; the decoded patch is admitted
          # only by its original local SHA-256, never by a fuzzy source rewrite.
          encoded = encoded.replace('EFpyYY8', 'EFpyY8', 1)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '613f1a92bdd4939063070a0fbcf849e568b72c7e2e2dce92a430a797022f0e29'
          (out / 'authored.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(out / 'authored.patch')], check=True)
          subprocess.run(['git', 'apply', str(out / 'authored.patch')], check=True)
          PY
          rustfmt --edition 2024 --config skip_children=true src/core/index_ask.rs src/core/index.rs src/core/search.rs src/core/context.rs src/core/context_test_module.rs src/daemon/server.rs src/cli/mod.rs
          git diff --check
          git diff --stat
          git diff --binary > "$RUNNER_TEMP/cached-pack/formatted.patch"
      - name: Export exact preimages and product blobs without branch writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tarfile, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cached-pack'
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          allowed = {'src/core/index_ask.rs', 'src/core/index.rs', 'src/core/search.rs', 'src/core/context.rs', 'src/core/context_test_module.rs', 'src/daemon/server.rs', 'src/cli/mod.rs', 'docs/schemas/ee.daemon.search.request.v2.json'}
          paths = git('diff', '--name-only').splitlines()
          assert set(paths) == allowed, paths
          manifest = {'base': git('rev-parse', 'HEAD'), 'entries': []}
          assert manifest['base'] == os.environ['GITHUB_SHA']
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs'
          for name in paths:
              content = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode()
              request = urllib.request.Request(api, data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  sha = json.load(response)['sha']
              assert sha == expected
              manifest['entries'].append({'path': name, 'before': git('rev-parse', 'HEAD:' + name), 'sha': sha, 'sha256': hashlib.sha256(content).hexdigest()})
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with tarfile.open(out / 'changed-source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  archive.add(name, arcname=name)
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cached-pack-source-${{ github.run_id }}
          path: ${{ runner.temp }}/cached-pack/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: cached-pack-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            daemon-search-contract-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            prefetch-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check production library
        run: |
          set -euo pipefail
          cargo check --locked --lib 2>&1 | tee "$RUNNER_TEMP/cached-pack/check.log"
      - name: Exercise cached-only admission and pack fallback boundaries
        run: |
          set -euo pipefail
          run_tests() {
            local filter="$1" name="$2"
            cargo test --locked --lib "$filter" -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/cached-pack/$name.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/cached-pack/$name.log"
          }
          run_tests core::index::ask_model::tests::already_loaded_ admission
          run_tests core::index::ask_model::tests::cached_local_attestation_ identity
          run_tests daemon::server::tests::daemon_cached_local_ wire
          run_tests read_only_semantic_pack_names_cold_daemon_fallback_without_writes read-only-pack
          run_tests daemon_pack_changed_store_restarts_local_admission freshness
          run_tests core::index::ask_model::tests::read_only_ read-only-model
      - name: Check strict production Clippy
        run: |
          set -euo pipefail
          cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/cached-pack/clippy.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: cached-pack-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/cached-pack/
          retention-days: 7
          if-no-files-found: error
