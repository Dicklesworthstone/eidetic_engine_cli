name: Scoped read-only MCP answers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp-ask-20260918.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-ask-delivery
  cancel-in-progress: true

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Bind the reviewed adapter and preserve the existing strict contract
        shell: bash
        run: |
          set -euo pipefail
          # IDEMPOTENCY GUARD (bd-delivery-lanes-stuck-publish-to-main-hpgw8).
          #
          # This lane dies at `Expected one ask_tool_schema definition; no files changed`.
          # The python below has its OWN idempotency check -- it skips a function whose body
          # already equals the replacement -- but that check can never fire here, because
          # there is no definition left to compare against: `ask_tool_schema` and
          # `build_ask_tool_args` appear NOWHERE in src/mcp.rs, not even as non-top-level
          # items. The regex finds zero matches and refuses before reaching the check.
          #
          # THE DELIVERY LANDED AND THEN THE WRAPPERS BECAME UNNECESSARY. This is not a
          # rename. The McpToolEntry for "ee_ask" (src/mcp.rs:338) now registers the module's
          # functions DIRECTLY, so the two delegating wrappers this patch wanted to create
          # would be dead code:
          #   src/mcp.rs      #[path = "mcp_ask.rs"] / mod ask;   (the patch's own `module`)
          #   src/mcp.rs      input_schema: ask::schema,
          #   src/mcp.rs      args_builder: ask::build_args,
          #   src/mcp_ask.rs  pub(super) fn schema() -> Value {   (:33)
          #   src/mcp_ask.rs  pub(super) fn build_args(           (:91)
          # Each present exactly once. The last four are what make this conclusive rather
          # than suggestive: a mounted module proves the file is COMPILED, while the two
          # registrations prove production REACHES it. A mount alone would also be satisfied
          # by a module nothing calls.
          #
          # ALL-OR-NOTHING. A partially delivered tree must still refuse, so a missing marker
          # falls through to the python, which is already careful -- it raises
          # 'changed concurrently' or 'already has constraint handling' rather than guessing.
          #
          # exit 0 per the operator decision of 2026-10-07, following 4372cef4a, and bounded:
          # `integrate` is one job, so exiting this step skips none of the later ones. The
          # production MCP/CLI compile, the published-path feature resolve, the strict
          # argument-mapping tests, the real JSON-RPC dispatch and no-write store contracts,
          # and the existing MCP unit regressions all still run against the delivered source.
          # The publish step needs no change: it is already guarded by
          # `if ! git diff --cached --quiet`, so an empty diff commits and pushes nothing.
          delivered=1
          for pin in \
            'src/mcp.rs|#[path = "mcp_ask.rs"]' \
            'src/mcp.rs|mod ask;' \
            'src/mcp.rs|input_schema: ask::schema,' \
            'src/mcp.rs|args_builder: ask::build_args,' \
            'src/mcp_ask.rs|pub(super) fn schema() -> Value {' \
            'src/mcp_ask.rs|pub(super) fn build_args(' \
          ; do
            pin_path=${pin%%|*}
            pin_text=${pin#*|}
            if ! test -f "$pin_path" || ! grep -Fq "$pin_text" "$pin_path"; then
              echo "ATTRIBUTION: delivery marker ABSENT -- $pin_path does not contain '$pin_text', so this tree is not (or not fully) delivered and the adapter bind below must run."
              delivered=0
            fi
          done
          if test "$delivered" -eq 1; then
            echo "ATTRIBUTION: delivery ALREADY PRESENT -- src/mcp.rs mounts mcp_ask.rs and the ee_ask tool entry registers ask::schema and ask::build_args directly, so the module is both compiled and reached and the delegating wrappers this step would add are unnecessary. Nothing to bind. Succeeding rather than refusing: every verification step in this job still runs against the delivered source. Skipped: the adapter bind only."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/mcp.rs')
          source = path.read_text()
          replacements = {
              'ask_tool_schema': '''fn ask_tool_schema() -> Value {
              ask::schema()
          }''',
              'build_ask_tool_args': '''fn build_ask_tool_args(args: &mut Vec<OsString>, arguments: &Value) -> Result<(), String> {
              ask::build_args(args, arguments)
          }''',
          }
          guards = {
              'ask_tool_schema': ['"required": ["question"]', '"requireConfidence"', '"limitEvidence"'],
              'build_ask_tool_args': ['push_arg(args, "ask");', 'required_string(arguments, &["question"])', '"--require-confidence"'],
          }
          for name, replacement in replacements.items():
              pattern = re.compile(r'^fn ' + name + r'\([^\n]*\)[^\n]*\{\n.*?^\}', re.M | re.S)
              matches = list(pattern.finditer(source))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {name} definition; no files changed')
              match = matches[0]
              old = match.group()
              if re.sub(r'\s+', ' ', old).strip() == re.sub(r'\s+', ' ', replacement).strip():
                  continue
              if not all(anchor in old for anchor in guards[name]):
                  raise SystemExit(f'{name} changed concurrently; no files changed')
              if any(word in old for word in ['memoryScope', 'readOnly', '"--path"']):
                  raise SystemExit(f'{name} already has constraint handling; review required')
              source = source[:match.start()] + replacement + source[match.end():]
          module = '#[path = "mcp_ask.rs"]\nmod ask;\n\n'
          anchor = 'pub const SUBSYSTEM: &str = "mcp";'
          if module not in source:
              if source.count(anchor) != 1 or re.search(r'^mod ask;', source, re.M):
                  raise SystemExit('MCP module anchor changed; no files changed')
              source = source.replace(anchor, module + anchor, 1)
          old_description = 'Run ee ask --json for extractive answers; abstention stays in the response payload'
          new_description = 'Read-only extractive answers from scoped memories, native rules and admitted transcripts; supports literal task paths'
          if old_description in source:
              if source.count(old_description) != 1:
                  raise SystemExit('Ambiguous ask descriptor; no files changed')
              source = source.replace(old_description, new_description, 1)
          elif new_description not in source:
              raise SystemExit('Ask descriptor changed; no files changed')
          # Preserve the preexisting exact transport assertion, extending it
          # to require scope and path forwarding as well as actual read-only.
          old_input = '"question": "What MCP write tools require allowWrite?",\n                "limitEvidence": 4,'
          new_input = '"question": "What MCP write tools require allowWrite?",\n                "memoryScope": "verified",\n                "path": ["src/mcp.rs"],\n                "limitEvidence": 4,'
          if old_input in source:
              if source.count(old_input) != 1:
                  raise SystemExit('Ambiguous old ask input contract')
              source = source.replace(old_input, new_input, 1)
          elif new_input not in source:
              raise SystemExit('Ask input contract changed; review required')
          pattern = re.compile(r'assert_eq!\(\s*ask,\s*vec!\[.*?\]\s*\);', re.S)
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit('Expected one exact ask argument assertion')
          match = matches[0]
          old = match.group()
          if not all(item in old for item in ['What MCP write tools require allowWrite?', '/tmp/ee.db', '"ee"', '"--json"']):
              raise SystemExit('Existing ask assertion changed; review required')
          replacement = '''assert_eq!(
              ask,
              vec![
                  "ee", "--json", "ask", "--read-only",
                  "--memory-scope=verified", "--path=src/mcp.rs",
                  "--limit-evidence=4", "--min-confidence=0.4",
                  "--require-confidence=0.7", "--database=/tmp/ee.db",
                  "--", "What MCP write tools require allowWrite?",
              ]
          );'''
          source = source[:match.start()] + replacement + source[match.end():]
          adapter = Path('src/mcp_ask.rs')
          adapter_text = adapter.read_text()
          tests = '\n#[cfg(test)]\n#[path = "mcp_ask_live_tests.rs"]\nmod live_tests;\n'
          if 'mod live_tests;' not in adapter_text:
              adapter_text += tests
          elif tests.strip() not in adapter_text:
              raise SystemExit('Live test registration changed; no files changed')
          path.write_text(source)
          adapter.write_text(adapter_text)
          PY
          rustfmt --edition 2024 --config skip_children=true src/mcp.rs src/mcp_ask.rs src/mcp_ask_live_tests.rs
          git diff --check
          git diff --stat
          git diff > "$RUNNER_TEMP/mcp-ask-integration.patch"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: mcp-ask-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mcp-ask-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            ask-paths-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            ask-semantic-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Compile production MCP and CLI
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --features mcp --lib --bin ee 2>&1 | tee "$RUNNER_TEMP/mcp-ask-check.log"
      - name: Resolve the published path feature before protocol acceptance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          grep -q 'pub fn load_ask_corpus_for_paths(' src/core/ask_corpus.rs
          grep -q 'load_ask_corpus_for_paths(' src/cli/mod.rs
      - name: Test strict argument mapping
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --features mcp --lib mcp::ask::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/mcp-ask-arguments.log"
          grep -Eq 'test result: ok\. 12 passed; 0 failed' "$RUNNER_TEMP/mcp-ask-arguments.log"
      - name: Test real JSON-RPC dispatch and no-write store contracts
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --features mcp --lib mcp::ask::live_tests:: -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/mcp-ask-live.log"
          grep -Eq 'test result: ok\. 6 passed; 0 failed' "$RUNNER_TEMP/mcp-ask-live.log"
      - name: Run existing MCP unit regressions
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --features mcp --lib mcp::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/mcp-ask-existing.log"
          # VACUITY FLOOR (bd-lagsa). A failing test already fails this step through
          # `pipefail`; a run that executes nothing does not. This filter is behind
          # `--features mcp`, which makes the empty case MORE likely rather than less: if
          # the feature stops gating `mcp::tests::` into the build, the filter matches zero
          # tests, libtest reports zero passed and zero failed, cargo exits 0, and the lane
          # publishes MCP changes having verified none of them. Floor of 1.
          ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed;.*/\1/p' "$RUNNER_TEMP/mcp-ask-existing.log" | head -1)
          if test -z "$ran" || test "$ran" -lt 1; then
            echo "ATTRIBUTION: mcp::tests:: produced no passing-with-zero-failures line (count '${ran:-none}') -- refusing a vacuous pass"
            exit 1
          fi
          echo "ATTRIBUTION: mcp::tests:: ran $ran tests"
      - name: Commit verified MCP integration directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/mcp.rs src/mcp_ask.rs src/mcp_ask_live_tests.rs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(mcp): expose scoped native ask with literal paths and enforced read-only semantics' -m 'Route every MCP ask constraint through the shared CLI. Preserve scope, path bytes, native citations and live rule revisions; reject ambiguous/unknown constraints and option-like positional injection. Read-only annotations now match execution, including errors and abstentions. Production MCP/CLI check, twelve adapter tests, six real JSON-RPC/store tests and the existing MCP unit suite passed before this commit.'
            published=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then published=true; break; fi
              git fetch origin main
              git merge --no-edit origin/main
            done
            # bd-aav0v: bare, this aborted the step with NO OUTPUT under `set -e`, so a
            # lane that verified cleanly and merely lost three push races looked identical
            # to a lane whose tests failed. The remedies are opposite -- re-run versus
            # change the source -- so the distinction has to be in the log.
            if test "$published" != true; then
              echo "ATTRIBUTION: PUBLICATION failed, not verification -- all three pushes to main were rejected. Every check above this step passed; only the push lost its race. Re-run the lane; do not change the source on the strength of this red."
              exit 1
            fi
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/mcp-ask-source.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: scoped-mcp-ask-verification
          path: |
            ${{ runner.temp }}/mcp-ask-*.log
            ${{ runner.temp }}/mcp-ask-*.patch
          retention-days: 7
