name: Resume indexed projection
on:
  push:
    branches: [main]
    paths: [.github/workflows/resume-indexed-projection-20260919.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-coherence-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Recover exact reviewed source stages from the immutable delivery commit
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, subprocess
          from pathlib import Path
          raw = subprocess.check_output(['git', 'show', 'd3de72b1af8c1b08faba69da3a353eb0e7b85c66:.github/workflows/resume-indexed-projection-20260919.yml'])
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == '1f51ab70ddc94063e106f5a32977fe3f113b4af1'
          lines = raw.decode().splitlines()
          for number, name in enumerate([
              'Apply the reviewed snapshot and precise-clock repair',
              'Verify and commit coherent fresh session state before the second increment',
              'Apply bounded session projection and shared staleness index',
              'Verify all resume tests and emitted public schema before source publication',
          ], 1):
              start = lines.index('      - name: ' + name)
              run = lines.index('        run: |', start) + 1
              body = []
              for line in lines[run:]:
                  if line and not line.startswith('          '):
                      break
                  body.append(line[10:] if line else '')
              assert body and body[0] == 'set -euo pipefail'
              script = Path(os.environ['RUNNER_TEMP']) / f'resume-stage-{number}.sh'
              script.write_text('\n'.join(body) + '\n')
              subprocess.run(['bash', '-n', str(script)], check=True)
          PYCODE
      - name: Apply the source repair with a correctly dated real-database fixture
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/resume-stage-1.sh"
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p = Path('src/core/resume_snapshot_tests.rs')
          s = p.read_text()
          pattern = re.compile(r'(?m)^( +)valid_from: None,\n\1valid_to: None,')
          assert len(pattern.findall(s)) == 1
          replacement = [
              '// Match the deterministic August row clock below. A missing',
              '// author-validity bound defaults to the real insertion time,',
              '// which would legitimately exclude this row from August reads.',
              'valid_from: Some("2026-08-09T10:00:00Z".to_owned()),',
              'valid_to: None,',
          ]
          s = pattern.sub(lambda match: '\n'.join(match[1] + line for line in replacement), s, count=1)
          anchor = '    let now = super::super::parse_ts("2026-08-09T10:00:00.750Z").unwrap();'
          check = '''    // Differential control: the old whole-second caller hides this row,
              // even though the authored validity is already active.
              let workspace_id = crate::core::workspace::stable_workspace_id(&fixture.workspace);
              assert!(fixture.reader.list_recent_current_memories_for_retrieval(
                  &workspace_id, "2026-08-09T10:00:00Z", 8,
              ).unwrap().is_empty());
          '''
          assert s.count(anchor) == 1
          s = s.replace(anchor, check + anchor, 1)
          p.write_text(s)
          PYCODE
          rustfmt --edition 2024 --config skip_children=true src/core/resume_snapshot_tests.rs
          git diff --check
      - name: Verify and publish the coherent fresh-state source increment
        run: bash "$RUNNER_TEMP/resume-stage-2.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: resume-fresh-state-source-and-tests
          path: ${{ runner.temp }}/resume-*
          retention-days: 7
      - name: Apply bounded session projection and shared staleness index
        run: bash "$RUNNER_TEMP/resume-stage-3.sh"
      - name: Verify all 42 resume tests and emitted schema then publish the second source increment
        run: bash "$RUNNER_TEMP/resume-stage-4.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: resume-indexed-source-and-tests
          path: ${{ runner.temp }}/resume-*
          retention-days: 7
      - name: Check all targets and production Clippy
        if: ${{ success() }}
        run: |
          failed=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/resume-check.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/resume-check.log"
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/resume-clippy.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/resume-clippy.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: resume-indexed-checks
          path: ${{ runner.temp }}/resume-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: resume-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
