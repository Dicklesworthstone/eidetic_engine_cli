name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_windows_installer_live_smoke:
        description: 'Run the opt-in Windows live installer smoke against the latest release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_native_reranker_release_matrix:
        description: 'Run the fail-closed five-target native-reranker release proof'
        required: false
        default: false
        type: boolean
      rerank_model_url:
        description: 'Verified rerank-default-v1 archive URL used only by the opt-in release proof'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon-search-slo:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: daemon search 10k SLO (GitHub runner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      EE_EMBED_DOWNLOAD: "off"
      EE_EMBED_MODEL_FIXTURE_DIR: .ci/model-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Record performance host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          command -v jq
          command -v perl
          uname -a
          lscpu
          df -T "$RUNNER_TEMP"

      - name: Restore pinned Model2Vec fixture
        uses: actions/cache@v4
        with:
          path: .ci/model-fixture
          key: ee-model2vec-${{ runner.os }}-${{ hashFiles('franken-stack.lock') }}

      - name: Provision pinned Model2Vec fixture through ee
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ee-daemon-search-target
          EE_EMBED_DOWNLOAD: "auto"
        run: |
          set -euo pipefail
          fixture_workspace="$RUNNER_TEMP/ee-model-fixture-workspace"
          mkdir -p "$fixture_workspace" "$EE_EMBED_MODEL_FIXTURE_DIR"
          cargo run --locked -- init --workspace "$fixture_workspace" --json
          EE_EMBED_MODEL_DIR="$EE_EMBED_MODEL_FIXTURE_DIR" \
            cargo run --locked -- model fetch embedding-default \
              --workspace "$fixture_workspace" --json
          test -f "$EE_EMBED_MODEL_FIXTURE_DIR/potion-multilingual-128M/model.safetensors"
          test -f "$EE_EMBED_MODEL_FIXTURE_DIR/potion-multilingual-128M/tokenizer.json"
          test -f "$EE_EMBED_MODEL_FIXTURE_DIR/potion-multilingual-128M/config.json"
          cargo test --locked --test model_bundled_embedding_cli_e2e --no-run

      - name: Prove registered Model2Vec fixture without egress
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ee-daemon-search-target
        run: |
          set -euo pipefail
          if [[ ! -d "$EE_EMBED_MODEL_FIXTURE_DIR" ]]; then
            echo "::error::EE_EMBED_MODEL_FIXTURE_DIR is not an accessible directory" >&2
            exit 1
          fi
          if ! command -v unshare >/dev/null; then
            echo "::error::unshare is required for the egress-denied model fixture gate" >&2
            exit 1
          fi
          if ! command -v ip >/dev/null; then
            echo "::error::ip is required to verify the egress-denied network namespace" >&2
            exit 1
          fi
          unshare --user --map-root-user --net -- bash -euo pipefail <<'EE_UNSHARE'
            ip link set lo up
            interfaces=()
            for interface_path in /sys/class/net/*; do
              interfaces+=("${interface_path##*/}")
            done
            if [[ "${interfaces[*]}" != "lo" ]]; then
              echo "unexpected interfaces in egress-denied namespace: ${interfaces[*]}" >&2
              exit 1
            fi
            if [[ -n "$(ip route show)" ]]; then
              echo "unexpected route in egress-denied namespace" >&2
              ip route show >&2
              exit 1
            fi
            cargo test --offline --locked --test model_bundled_embedding_cli_e2e \
              registered_model2vec_fixture_is_neural_without_overrides_or_download_path -- \
              --ignored --exact --nocapture
            cargo test --offline --locked --test model_bundled_embedding_cli_e2e \
              public_reembed_persists_canonical_model2vec_source_and_offline_search_is_neural -- \
              --ignored --exact --nocapture
          EE_UNSHARE

      - name: Enforce cold and warm search p50 budgets
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ee-daemon-search-target
          EE_BENCH_ARTIFACT_DIR: ${{ runner.temp }}/ee-daemon-search-artifacts
        run: |
          set -euo pipefail
          if [[ -z "${EE_EMBED_MODEL_FIXTURE_DIR:-}" || ! -d "$EE_EMBED_MODEL_FIXTURE_DIR" ]]; then
            echo "::error::EE_EMBED_MODEL_FIXTURE_DIR is required by daemon-search-slo" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ee-daemon-search-artifacts"
          EE_EMBED_MODEL_FIXTURE_DIR="$EE_EMBED_MODEL_FIXTURE_DIR" \
            ./scripts/bench.sh --profile daemon-search-slo --json \
            | tee "$RUNNER_TEMP/ee-daemon-search-artifacts/ee-perf.v1.json"

      - name: Upload daemon search SLO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-search-slo-${{ github.sha }}
          path: ${{ runner.temp }}/ee-daemon-search-artifacts/
          if-no-files-found: error
          retention-days: 30

  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          # Cargo.toml uses ../<sibling-repo>/... paths to match the local
          # Mac/Linux dev checkout layout where ee lives next to the franken
          # sibling crates. CI clones the siblings under the workspace and
          # rewrites Cargo.toml to workspace-relative paths so both normal cargo
          # steps and Dockerized actions that mount only $GITHUB_WORKSPACE see
          # the same dependency tree. Both spellings are accepted so a future
          # revert to the historical /data/projects/... prefix would still build.
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Forbidden dependency audit
        run: ./scripts/check-forbidden-deps.sh

      # Supply-chain RustSec advisory gate (bd-2efax). `deny.toml [advisories]`
      # is now version=2 gate mode, so this fails the build on any open
      # vulnerability / unmaintained / unsound / yanked crate in the resolved
      # tree (fsqlite/frankensearch path-dep stack + serde_json included).
      # Runs against the Cargo.toml already rewritten to the cloned Franken
      # stack above, so the full transitive graph is in scope. NOTE: this is a
      # step in `verify` rather than the isolated job reviewer-p2-r3 suggested,
      # because a standalone job would have to duplicate the ~24-line Franken
      # stack checkout; splitting it cleanly is a follow-up once that checkout
      # is factored into a reusable composite action.
      #
      - name: RustSec advisory audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Closure linter
        run: ./scripts/closure-lint.sh --audit --json

      - name: Vision coverage
        run: |
          git fetch origin +main:refs/remotes/origin/main --depth=1
          sh ./scripts/vision-coverage.sh --json --compare-ref origin/main

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        env:
          RUSTFLAGS: "-C debuginfo=0 -C linker-features=-lld"
        run: cargo clippy --all-targets -- -D warnings

      - name: MCP parity tests
        env:
          RUSTFLAGS: "-C debuginfo=0 -C linker-features=-lld"
        run: cargo test --workspace --features mcp --test mcp_parity

  verify-tests:
    if: github.event_name != 'schedule'
    name: verify-tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - lib-cache-cass-config
          - lib-cli
          - lib-core
          - lib-curate-daemon
          - lib-db
          - lib-eval-graph
          - lib-rest
          - targets
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0 -C linker-features=-lld"
      RUST_TEST_THREADS: "1"
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          heartbeat_pid=""
          cleanup() {
            if [ -n "$heartbeat_pid" ]; then
              kill "$heartbeat_pid" 2>/dev/null || true
              wait "$heartbeat_pid" 2>/dev/null || true
              heartbeat_pid=""
            fi
          }
          trap cleanup EXIT

          run_test() {
            local label="$1"
            shift
            cleanup
            (
              while true; do
                sleep 300
                echo "::notice::$label still running at $(date -u +%FT%TZ)"
              done
            ) &
            heartbeat_pid=$!
            echo "::notice::$label started at $(date -u +%FT%TZ) with CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS RUSTFLAGS=$RUSTFLAGS RUST_TEST_THREADS=$RUST_TEST_THREADS"
            set +e
            timeout --foreground --kill-after=30s 90m "$@"
            local status=$?
            set -e
            cleanup
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::error::$label exceeded the 90m CI test budget; inspect the last emitted test name/output above for the hanging test." >&2
            fi
            return "$status"
          }

          case "$TEST_SHARD" in
            lib-cache-cass-config)
              run_test "cargo test --lib cache::" cargo test --workspace --lib --jobs 1 cache:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib cass::" cargo test --workspace --lib --jobs 1 cass:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib config::" cargo test --workspace --lib --jobs 1 config:: -- --test-threads=1 --nocapture
              ;;
            lib-cli)
              run_test "cargo test --lib cli::" cargo test --workspace --lib --jobs 1 cli:: -- --test-threads=1 --nocapture
              ;;
            lib-core)
              run_test "cargo test --lib core::" cargo test --workspace --lib --jobs 1 core:: -- --test-threads=1 --nocapture
              ;;
            lib-curate-daemon)
              run_test "cargo test --lib curate::" cargo test --workspace --lib --jobs 1 curate:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib daemon::" cargo test --workspace --lib --jobs 1 daemon:: -- --test-threads=1 --nocapture
              ;;
            lib-db)
              run_test "cargo test --lib db::" cargo test --workspace --lib --jobs 1 db:: -- --test-threads=1 --nocapture
              ;;
            lib-eval-graph)
              run_test "cargo test --lib eval::" cargo test --workspace --lib --jobs 1 eval:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib graph::" cargo test --workspace --lib --jobs 1 graph:: -- --test-threads=1 --nocapture
              ;;
            lib-rest)
              run_test "cargo test --lib fuzz::" cargo test --workspace --lib --jobs 1 fuzz:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib hooks::" cargo test --workspace --lib --jobs 1 hooks:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib mesh::" cargo test --workspace --lib --jobs 1 mesh:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib models::" cargo test --workspace --lib --jobs 1 models:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib obs::" cargo test --workspace --lib --jobs 1 obs:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib output::" cargo test --workspace --lib --jobs 1 output:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib pack::" cargo test --workspace --lib --jobs 1 pack:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib policy::" cargo test --workspace --lib --jobs 1 policy:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib runtime::" cargo test --workspace --lib --jobs 1 runtime:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib science::" cargo test --workspace --lib --jobs 1 science:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib search::" cargo test --workspace --lib --jobs 1 search:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib serve::" cargo test --workspace --lib --jobs 1 serve:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib shadow::" cargo test --workspace --lib --jobs 1 shadow:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib steward::" cargo test --workspace --lib --jobs 1 steward:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib testing::" cargo test --workspace --lib --jobs 1 testing:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib util::" cargo test --workspace --lib --jobs 1 util:: -- --test-threads=1 --nocapture
              ;;
            targets)
              run_test "cargo test targets" cargo test --workspace --bins --tests --examples --jobs 1 -- --test-threads=1 --nocapture
              ;;
            *)
              echo "::error::unknown TEST_SHARD=$TEST_SHARD" >&2
              exit 1
              ;;
          esac

  cross-platform-determinism:
    if: github.event_name != 'schedule'
    name: cross-platform-determinism (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            release_target: true
            binary: ee
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            runner: cross
            release_target: false
            binary: ee
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            release_target: true
            binary: ee
          - os: macos-15
            target: aarch64-apple-darwin
            release_target: true
            binary: ee
          - os: macos-15-intel
            target: x86_64-apple-darwin
            release_target: true
            binary: ee
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            release_target: true
            binary: ee.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          # See the verify job for the rationale on accepting both
          # ../<sibling> and /data/projects/<sibling> prefixes here.
          CARGO_PATH_ROOT="$project_root" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Checkout Franken stack path dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global core.longpaths true
          $projectRoot = Join-Path $env:GITHUB_WORKSPACE ".ci\franken-stack\projects"
          & ./scripts/checkout-franken-stack.ps1 -DestinationRoot $projectRoot
          $fsqliteManifest = Join-Path $projectRoot "frankensqlite\crates\fsqlite\Cargo.toml"
          if (-not (Test-Path $fsqliteManifest)) {
            Write-Error "MISSING: $fsqliteManifest"
            exit 1
          }
          $cargoPathRoot = $projectRoot -replace "\\", "/"
          $cargoText = Get-Content Cargo.toml -Raw
          foreach ($repo in @("asupersync","franken_agent_detection","franken_networkx","frankensearch","frankensqlite","sqlmodel_rust","toon_rust")) {
            $cargoText = $cargoText.Replace("/data/projects/$repo", "$cargoPathRoot/$repo")
            $cargoText = $cargoText.Replace("../$repo", "$cargoPathRoot/$repo")
          }
          Set-Content Cargo.toml -Value $cargoText -NoNewline

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install Python for target evidence checks
        if: matrix.release_target == true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Activate MSVC developer tools
        if: runner.os == 'Windows' && matrix.release_target == true
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install cross
        if: matrix.runner == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Verify Franken stack clone (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fnx_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects/franken_networkx"
          echo "::group::franken_networkx workspace manifest"
          ls -la "$fnx_root" || true
          if [ -f "$fnx_root/Cargo.toml" ]; then
            echo "--- $fnx_root/Cargo.toml (first 25 lines) ---"
            head -25 "$fnx_root/Cargo.toml"
          else
            echo "MISSING: $fnx_root/Cargo.toml"
            exit 1
          fi
          echo "::endgroup::"
          echo "::group::fnx-cgse manifest"
          if [ -f "$fnx_root/crates/fnx-cgse/Cargo.toml" ]; then
            head -10 "$fnx_root/crates/fnx-cgse/Cargo.toml"
          else
            echo "MISSING: $fnx_root/crates/fnx-cgse/Cargo.toml"
            exit 1
          fi
          echo "::endgroup::"

      - name: Verify Franken stack clone (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fnxRoot = Join-Path $env:GITHUB_WORKSPACE ".ci\franken-stack\projects\franken_networkx"
          Write-Host "::group::franken_networkx workspace manifest"
          Get-ChildItem -Force $fnxRoot | Format-Table | Out-String | Write-Host
          $rootManifest = Join-Path $fnxRoot "Cargo.toml"
          if (-not (Test-Path $rootManifest)) {
            Write-Error "MISSING: $rootManifest"
            exit 1
          }
          Get-Content $rootManifest -TotalCount 25 | Write-Host
          Write-Host "::endgroup::"
          Write-Host "::group::fnx-cgse manifest"
          $cgseManifest = Join-Path $fnxRoot "crates\fnx-cgse\Cargo.toml"
          if (-not (Test-Path $cgseManifest)) {
            Write-Error "MISSING: $cgseManifest"
            exit 1
          }
          Get-Content $cgseManifest -TotalCount 10 | Write-Host
          Write-Host "::endgroup::"

      - name: Build, link, audit, and compile-test release target
        if: matrix.release_target == true && runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          runner_temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            runner_temp="$(cygpath -u "$runner_temp")"
          fi
          proof_root="$runner_temp/bd-1nl13.7/$TARGET"
          mkdir -p "$proof_root"
          timestamps="$proof_root/timestamps.tsv"

          run_logged() {
            local label="$1"
            shift
            local log="$proof_root/$label.log"
            local started completed status
            started="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            printf '%s\t%s\tstarted\n' "$started" "$label" >>"$timestamps"
            set +e
            "$@" 2>&1 | tee "$log"
            status=$?
            set -e
            completed="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            printf '%s\t%s\tcompleted\t%s\n' "$completed" "$label" "$status" >>"$timestamps"
            return "$status"
          }

          locked_revision="$(awk -F '\t' '$1 == "frankensearch" { print $2 }' franken-stack.lock)"
          checked_out_revision="$(git -C .ci/franken-stack/projects/frankensearch rev-parse HEAD)"
          if [[ ! "$locked_revision" =~ ^[0-9a-f]{40}$ \
            || "$checked_out_revision" != "$locked_revision" ]]; then
            printf 'Frankensearch lock/checkout mismatch: lock=%s checkout=%s\n' \
              "$locked_revision" "$checked_out_revision" >&2
            exit 1
          fi
          printf '{"target":"%s","frankensearchRevision":"%s"}\n' \
            "$TARGET" "$checked_out_revision" >"$proof_root/target.json"

          run_logged build \
            cargo build --locked --workspace --bin ee --target "$TARGET"
          run_logged full-suite-link \
            cargo test --locked --workspace --lib --bins --tests --examples \
              --no-run --target "$TARGET"
          run_logged graph-determinism \
            cargo test --locked --workspace --test cross_platform_determinism \
              --target "$TARGET" -- --nocapture
          run_logged cargo-tree \
            cargo tree --locked --target "$TARGET" -e features --prefix none

          python - "$proof_root/cargo-tree.log" "$TARGET" <<'PY'
          import pathlib
          import sys

          forbidden = {
              "tokio", "tokio-util", "hyper", "axum", "tower", "reqwest",
              "async-std", "smol", "rusqlite", "sqlx", "diesel", "sea-orm",
              "petgraph", "ort", "ort-sys", "onnxruntime", "onnxruntime-sys",
          }
          tree_path = pathlib.Path(sys.argv[1])
          target = sys.argv[2]
          found = sorted({
              parts[0]
              for line in tree_path.read_text(encoding="utf-8").splitlines()
              if len(parts := line.split()) >= 2
              and parts[0] in forbidden
              and parts[1].startswith("v")
          })
          if found:
              tree_path.with_name("dependency-audit.txt").write_text(
                  f"{target}: forbidden dependencies: {', '.join(found)}\n",
                  encoding="utf-8",
              )
              raise SystemExit(
                  f"{target}: forbidden target-resolved dependencies: {', '.join(found)}"
              )
          verdict = f"{target}: target-resolved dependency tree is project-forbidden-dep and ORT free"
          tree_path.with_name("dependency-audit.txt").write_text(
              verdict + "\n", encoding="utf-8"
          )
          print(verdict)
          PY

          date -u +"%Y-%m-%dT%H:%M:%SZ" >"$proof_root/completed-at.txt"

      - name: Build, link, audit, and compile-test Windows release target natively
        if: matrix.release_target == true && runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $proofRoot = Join-Path $env:RUNNER_TEMP "bd-1nl13.7\$env:TARGET"
          $timestamps = Join-Path $proofRoot "timestamps.tsv"
          New-Item -ItemType Directory -Force -Path $proofRoot | Out-Null

          function Invoke-NativeLogged {
            param(
              [Parameter(Mandatory)][string]$Label,
              [Parameter(Mandatory)][string]$Command,
              [Parameter(Mandatory)][string[]]$Arguments
            )
            $log = Join-Path $proofRoot "$Label.log"
            Add-Content $timestamps "$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))`t$Label`tstarted"
            & $Command @Arguments 2>&1 | Tee-Object -FilePath $log | Write-Host
            $status = $LASTEXITCODE
            Add-Content $timestamps "$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))`t$Label`tcompleted`t$status"
            if ($status -ne 0) {
              throw "$Label failed with exit code $status"
            }
          }

          $lockedRevision = (Import-Csv franken-stack.lock -Delimiter "`t" -Header Project,Revision |
            Where-Object Project -eq "frankensearch").Revision
          $checkedOutRevision = (& git -C .ci/franken-stack/projects/frankensearch rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or
              $lockedRevision -notmatch '^[0-9a-f]{40}$' -or
              $checkedOutRevision -ne $lockedRevision) {
            throw "Frankensearch lock/checkout mismatch: lock=$lockedRevision checkout=$checkedOutRevision"
          }

          $linker = (Get-Command link.exe -CommandType Application | Select-Object -First 1).Source
          $compiler = (Get-Command cl.exe -CommandType Application | Select-Object -First 1).Source
          if (-not $linker -or -not $compiler -or $linker -match '[\\/]Git[\\/]usr[\\/]bin[\\/]link\.exe$') {
            throw "Windows proof requires the activated MSVC cl.exe/link.exe, got cl=$compiler link=$linker"
          }
          [ordered]@{
            schema = "ee.windows_native_toolchain_proof.v1"
            target = $env:TARGET
            compiler = $compiler
            linker = $linker
          } | ConvertTo-Json | Set-Content (Join-Path $proofRoot "windows-toolchain.json")
          [ordered]@{
            target = $env:TARGET
            frankensearchRevision = $checkedOutRevision
          } | ConvertTo-Json -Compress | Set-Content (Join-Path $proofRoot "target.json")

          Invoke-NativeLogged build cargo @("build", "--locked", "--workspace", "--bin", "ee", "--target", $env:TARGET)
          Invoke-NativeLogged full-suite-link cargo @(
            "test", "--locked", "--workspace", "--lib", "--bins", "--tests", "--examples",
            "--no-run", "--target", $env:TARGET
          )
          Invoke-NativeLogged graph-determinism cargo @(
            "test", "--locked", "--workspace", "--test", "cross_platform_determinism",
            "--target", $env:TARGET, "--", "--nocapture"
          )
          Invoke-NativeLogged cargo-tree cargo @(
            "tree", "--locked", "--target", $env:TARGET, "-e", "features", "--prefix", "none"
          )

          $forbidden = @(
            "tokio", "tokio-util", "hyper", "axum", "tower", "reqwest",
            "async-std", "smol", "rusqlite", "sqlx", "diesel", "sea-orm",
            "petgraph", "ort", "ort-sys", "onnxruntime", "onnxruntime-sys"
          )
          $found = Get-Content (Join-Path $proofRoot "cargo-tree.log") |
            ForEach-Object { ($_ -split '\s+')[0] } |
            Where-Object { $_ -in $forbidden } |
            Sort-Object -Unique
          if ($found) {
            throw "$env:TARGET forbidden target-resolved dependencies: $($found -join ', ')"
          }
          "$env:TARGET target-resolved dependency tree is project-forbidden-dep and ORT free" |
            Set-Content (Join-Path $proofRoot "dependency-audit.txt")
          [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ") |
            Set-Content (Join-Path $proofRoot "completed-at.txt")

      - name: Cross-platform graph determinism
        if: matrix.release_target != true && matrix.runner != 'cross'
        run: cargo test --workspace --test cross_platform_determinism --target ${{ matrix.target }} -- --nocapture

      - name: Cross-platform graph determinism (cross)
        if: matrix.runner == 'cross'
        run: cross test --workspace --test cross_platform_determinism --target ${{ matrix.target }} -- --nocapture

      - name: Run fail-closed native-reranker release proof
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_reranker_release_matrix == true && matrix.release_target == true && runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
          RERANK_MODEL_URL: ${{ inputs.rerank_model_url }}
          RERANK_MODEL_BYTES: '82767464'
          RERANK_MODEL_SHA256: adaada3ccc15ae535e9bea238d2ec05e4f39726bdcad07dd87cba9f85dc10edb
        run: |
          set -euo pipefail
          if [[ -z "$RERANK_MODEL_URL" ]]; then
            echo "::error::rerank_model_url is required for the native-reranker release proof"
            exit 1
          fi
          for tool in cargo curl git jq python; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::required release-proof tool is missing: $tool"
              exit 1
            }
          done

          runner_temp="$RUNNER_TEMP"
          workspace_root="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then
            runner_temp="$(cygpath -u "$runner_temp")"
            workspace_root="$(cygpath -u "$workspace_root")"
          fi
          proof_root="$runner_temp/bd-1nl13.7/$TARGET"
          model_root="$runner_temp/bd-1nl13.7-model/$TARGET"
          archive="$model_root/rerank-default-v1.tar.zst"
          timestamps="$proof_root/timestamps.tsv"
          mkdir -p "$proof_root" "$model_root"

          run_logged() {
            local label="$1"
            shift
            local log="$proof_root/$label.log"
            local started completed status
            started="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            printf '%s\t%s\tstarted\n' "$started" "$label" >>"$timestamps"
            set +e
            "$@" 2>&1 | tee "$log"
            status=$?
            set -e
            completed="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            printf '%s\t%s\tcompleted\t%s\n' "$completed" "$label" "$status" >>"$timestamps"
            return "$status"
          }

          native_path() {
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -w "$1"
            else
              printf '%s' "$1"
            fi
          }

          sha256_file() {
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | awk '{ print $1 }'
            else
              sha256sum "$1" | awk '{ print $1 }'
            fi
          }

          run_logged model-download \
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$archive" "$RERANK_MODEL_URL"
          actual_bytes="$(wc -c <"$archive" | tr -d '[:space:]')"
          actual_sha256="$(sha256_file "$archive")"
          if [[ "$actual_bytes" != "$RERANK_MODEL_BYTES" \
            || "$actual_sha256" != "$RERANK_MODEL_SHA256" ]]; then
            printf 'reranker artifact mismatch: expected bytes=%s sha256=%s; got bytes=%s sha256=%s\n' \
              "$RERANK_MODEL_BYTES" "$RERANK_MODEL_SHA256" \
              "$actual_bytes" "$actual_sha256" >&2
            exit 1
          fi

          target_dir="$(cargo metadata --locked --no-deps --format-version 1 \
            | python -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
          if command -v cygpath >/dev/null 2>&1; then
            target_dir="$(cygpath -u "$target_dir")"
          fi
          binary="$target_dir/$TARGET/debug/$BINARY_NAME"
          if [[ ! -x "$binary" ]]; then
            echo "::error::compiled ee binary is missing or non-executable: $binary"
            exit 1
          fi
          model_home="$model_root/home"
          model_workspace="$model_root/workspace"
          model_tmp="$model_root/tmp"
          mkdir -p "$model_home/AppData/Roaming" "$model_home/AppData/Local" \
            "$model_workspace" "$model_tmp"
          native_home="$(native_path "$model_home")"
          native_workspace="$(native_path "$model_workspace")"
          native_tmp="$(native_path "$model_tmp")"
          native_archive="$(native_path "$archive")"
          native_appdata="$(native_path "$model_home/AppData/Roaming")"
          native_localappdata="$(native_path "$model_home/AppData/Local")"
          run_logged model-init env \
            HOME="$native_home" USERPROFILE="$native_home" \
            APPDATA="$native_appdata" LOCALAPPDATA="$native_localappdata" \
            TMPDIR="$native_tmp" TMP="$native_tmp" TEMP="$native_tmp" \
            "$binary" --workspace "$native_workspace" init --json
          run_logged model-fetch env \
            HOME="$native_home" USERPROFILE="$native_home" \
            APPDATA="$native_appdata" LOCALAPPDATA="$native_localappdata" \
            TMPDIR="$native_tmp" TMP="$native_tmp" TEMP="$native_tmp" \
            "$binary" --workspace "$native_workspace" \
              model fetch rerank-default --from-file "$native_archive" --json

          unpacked_dir="$model_home/.local/share/ee/models/rerank/rerank-default-v1/rerank-default-v1"
          if [[ ! -f "$unpacked_dir/tokenizer.json" ]] \
            || [[ ! -f "$unpacked_dir/model_f32.safetensors" \
              && ! -f "$unpacked_dir/model.safetensors" ]]; then
            echo "::error::verified model fetch did not produce the native reranker files"
            exit 1
          fi

          case "$RUNNER_OS" in
            Linux)
              upstream_model_dir="/private/tmp/ee-reranker-port/model"
              sudo mkdir -p "$upstream_model_dir"
              sudo chown -R "$(id -u):$(id -g)" /private/tmp/ee-reranker-port
              ;;
            Windows)
              workspace_native="$(cygpath -w "$workspace_root")"
              drive_letter="$(printf '%s' "$workspace_native" | cut -d: -f1)"
              upstream_model_dir="$(cygpath -u "$drive_letter:\\private\\tmp\\ee-reranker-port\\model")"
              mkdir -p "$upstream_model_dir"
              ;;
            *)
              upstream_model_dir="/private/tmp/ee-reranker-port/model"
              mkdir -p "$upstream_model_dir"
              ;;
          esac
          cp -R "$unpacked_dir/." "$upstream_model_dir/"
          test -f "$upstream_model_dir/tokenizer.json"

          native_model_dir="$(native_path "$unpacked_dir")"
          run_logged full-ee-suite env \
            HOME="$native_home" USERPROFILE="$native_home" \
            APPDATA="$native_appdata" LOCALAPPDATA="$native_localappdata" \
            TMPDIR="$native_tmp" TMP="$native_tmp" TEMP="$native_tmp" \
            EE_E2E_RERANK_MODEL_DIR="$native_model_dir" \
            EE_E2E_RERANK_REQUIRE_MODEL=1 \
            EE_E2E_NATIVE_RERANK_REQUIRE_MODEL=1 \
            cargo test --locked --workspace --lib --bins --tests --examples \
              --target "$TARGET" -- --test-threads=1 --nocapture

          run_logged frankensearch-rerank-suite env \
            HOME="$native_home" USERPROFILE="$native_home" \
            APPDATA="$native_appdata" LOCALAPPDATA="$native_localappdata" \
            TMPDIR="$native_tmp" TMP="$native_tmp" TEMP="$native_tmp" \
            cargo test --locked \
              --manifest-path "$workspace_root/.ci/franken-stack/projects/frankensearch/Cargo.toml" \
              -p frankensearch-rerank --no-default-features --features native \
              --target "$TARGET" \
              -- --test-threads=1 --nocapture
          if grep -F '[native_reranker] SKIP' \
            "$proof_root/frankensearch-rerank-suite.log"; then
            echo "::error::upstream native reranker tests skipped their real model"
            exit 1
          fi
          if ! grep -F '[native_reranker] ranking(desc)=' \
            "$proof_root/frankensearch-rerank-suite.log" >/dev/null; then
            echo "::error::upstream native reranker parity proof was not observed"
            exit 1
          fi

          e2e_tmp="$model_root/native-e2e"
          vector="$proof_root/rerank-vector.json"
          mkdir -p "$e2e_tmp"
          if run_logged native-reranker-e2e env \
            EE_BINARY="$binary" \
            EE_E2E_TMPDIR="$e2e_tmp" \
            EE_E2E_RERANK_MODEL_ARCHIVE="$archive" \
            EE_E2E_NATIVE_RERANK_REQUIRE_MODEL=1 \
            EE_E2E_RERANK_VECTOR_OUT="$vector" \
            EE_E2E_TARGET_TRIPLE="$TARGET" \
            bash scripts/e2e_native_reranker.sh; then
            e2e_status=0
          else
            e2e_status=$?
          fi
          e2e_run="$(find "$e2e_tmp" -mindepth 1 -maxdepth 1 -type d \
            -name 'ee-native-reranker-e2e.*' | head -1)"
          if [[ -n "$e2e_run" && -d "$e2e_run/logs" ]]; then
            mkdir -p "$proof_root/native-e2e-logs"
            cp -R "$e2e_run/logs/." "$proof_root/native-e2e-logs/"
          fi
          if [[ "$e2e_status" -ne 0 ]]; then
            exit "$e2e_status"
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" >"$proof_root/strict-completed-at.txt"

      - name: Run fail-closed Windows native-reranker release proof natively
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_reranker_release_matrix == true && matrix.release_target == true && runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
          RERANK_MODEL_URL: ${{ inputs.rerank_model_url }}
          RERANK_MODEL_BYTES: '82767464'
          RERANK_MODEL_SHA256: adaada3ccc15ae535e9bea238d2ec05e4f39726bdcad07dd87cba9f85dc10edb
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:RERANK_MODEL_URL)) {
            throw "rerank_model_url is required for the Windows native-reranker release proof"
          }

          $proofRoot = Join-Path $env:RUNNER_TEMP "bd-1nl13.7\$env:TARGET"
          $modelRoot = Join-Path $env:RUNNER_TEMP "bd-1nl13.7-model\$env:TARGET"
          $archive = Join-Path $modelRoot "rerank-default-v1.tar.zst"
          $timestamps = Join-Path $proofRoot "timestamps.tsv"
          New-Item -ItemType Directory -Force -Path $proofRoot, $modelRoot | Out-Null

          function Add-ProofTimestamp {
            param([string]$Label, [string]$Phase, [int]$Status = 0)
            $line = "$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))`t$Label`t$Phase"
            if ($Phase -eq "completed") { $line += "`t$Status" }
            Add-Content $timestamps $line
          }

          function Invoke-NativeLogged {
            param(
              [Parameter(Mandatory)][string]$Label,
              [Parameter(Mandatory)][string]$Command,
              [Parameter(Mandatory)][string[]]$Arguments
            )
            $log = Join-Path $proofRoot "$Label.log"
            Add-ProofTimestamp $Label "started"
            & $Command @Arguments 2>&1 | Tee-Object -FilePath $log | Write-Host
            $status = $LASTEXITCODE
            Add-ProofTimestamp $Label "completed" $status
            if ($status -ne 0) { throw "$Label failed with exit code $status" }
          }

          function Invoke-EeJson {
            param([string]$Label, [string[]]$Arguments)
            $stdoutPath = Join-Path $proofRoot "$Label.stdout.json"
            $stderrPath = Join-Path $proofRoot "$Label.stderr.log"
            Add-ProofTimestamp $Label "started"
            $stdout = & $script:eeBinary @Arguments 2> $stderrPath
            $status = $LASTEXITCODE
            $stdout | Set-Content $stdoutPath
            $stdout | Write-Host
            if (Test-Path $stderrPath) { Get-Content $stderrPath | Write-Host }
            Add-ProofTimestamp $Label "completed" $status
            if ($status -ne 0) { throw "$Label failed with exit code $status" }
            $json = ($stdout -join "`n") | ConvertFrom-Json
            if ($json.schema -ne "ee.response.v2" -or $json.success -ne $true) {
              throw "$Label did not emit a successful ee.response.v2 envelope"
            }
            return $json
          }

          Invoke-NativeLogged model-download curl.exe @(
            "--fail", "--location", "--retry", "3", "--retry-all-errors",
            "--output", $archive, $env:RERANK_MODEL_URL
          )
          $artifact = Get-Item $archive
          $sha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($artifact.Length -ne [int64]$env:RERANK_MODEL_BYTES -or
              $sha256 -ne $env:RERANK_MODEL_SHA256) {
            throw "reranker artifact mismatch: bytes=$($artifact.Length) sha256=$sha256"
          }

          $metadata = (& cargo metadata --locked --no-deps --format-version 1) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed" }
          $script:eeBinary = Join-Path $metadata.target_directory "$env:TARGET\debug\$env:BINARY_NAME"
          if (-not (Test-Path -PathType Leaf $script:eeBinary)) {
            throw "compiled ee binary is missing: $script:eeBinary"
          }

          $home = Join-Path $modelRoot "home"
          $workspace = Join-Path $modelRoot "workspace"
          $tmp = Join-Path $modelRoot "tmp"
          $env:HOME = $home
          $env:USERPROFILE = $home
          $env:APPDATA = Join-Path $home "AppData\Roaming"
          $env:LOCALAPPDATA = Join-Path $home "AppData\Local"
          $env:TMPDIR = $tmp
          $env:TMP = $tmp
          $env:TEMP = $tmp
          New-Item -ItemType Directory -Force -Path $home, $workspace, $tmp, $env:APPDATA, $env:LOCALAPPDATA | Out-Null

          Invoke-EeJson model-init @("--workspace", $workspace, "init", "--json") | Out-Null
          Invoke-EeJson model-fetch @(
            "--workspace", $workspace, "model", "fetch", "rerank-default",
            "--from-file", $archive, "--json"
          ) | Out-Null
          $modelDir = Join-Path $home ".local\share\ee\models\rerank\rerank-default-v1\rerank-default-v1"
          if (-not (Test-Path (Join-Path $modelDir "tokenizer.json")) -or
              (-not (Test-Path (Join-Path $modelDir "model_f32.safetensors")) -and
               -not (Test-Path (Join-Path $modelDir "model.safetensors")))) {
            throw "verified model fetch did not produce native reranker files at $modelDir"
          }

          $driveRoot = [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          $upstreamModelDir = Join-Path $driveRoot "private\tmp\ee-reranker-port\model"
          New-Item -ItemType Directory -Force -Path $upstreamModelDir | Out-Null
          Copy-Item -Recurse -Force (Join-Path $modelDir "*") $upstreamModelDir

          $env:EE_E2E_RERANK_MODEL_DIR = $modelDir
          $env:EE_E2E_RERANK_REQUIRE_MODEL = "1"
          $env:EE_E2E_NATIVE_RERANK_REQUIRE_MODEL = "1"
          Invoke-NativeLogged full-ee-suite cargo @(
            "test", "--locked", "--workspace", "--lib", "--bins", "--tests", "--examples",
            "--target", $env:TARGET, "--", "--test-threads=1", "--nocapture"
          )
          $frankensearchManifest = Join-Path $env:GITHUB_WORKSPACE ".ci\franken-stack\projects\frankensearch\Cargo.toml"
          Invoke-NativeLogged frankensearch-rerank-suite cargo @(
            "test", "--locked", "--manifest-path", $frankensearchManifest,
            "-p", "frankensearch-rerank", "--no-default-features", "--features", "native",
            "--target", $env:TARGET, "--", "--test-threads=1", "--nocapture"
          )
          $upstreamLog = Get-Content (Join-Path $proofRoot "frankensearch-rerank-suite.log") -Raw
          if ($upstreamLog.Contains("[native_reranker] SKIP") -or
              -not $upstreamLog.Contains("[native_reranker] ranking(desc)=")) {
            throw "upstream native reranker did not prove real-model ranking without skips"
          }

          Invoke-NativeLogged binary-linkage dumpbin.exe @("/dependents", $script:eeBinary)
          if ((Get-Content (Join-Path $proofRoot "binary-linkage.log") -Raw) -match
              '(?i)onnxruntime|(^|[\\/])ort\.dll') {
            throw "Windows ee.exe links a forbidden ONNX Runtime library"
          }

          $e2eHome = Join-Path $modelRoot "native-e2e-home"
          $e2eWorkspace = Join-Path $modelRoot "native-e2e-workspace"
          New-Item -ItemType Directory -Force -Path $e2eHome, $e2eWorkspace | Out-Null
          $env:HOME = $e2eHome
          $env:USERPROFILE = $e2eHome
          $env:APPDATA = Join-Path $e2eHome "AppData\Roaming"
          $env:LOCALAPPDATA = Join-Path $e2eHome "AppData\Local"
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          Invoke-EeJson e2e-init @("--workspace", $e2eWorkspace, "init", "--json") | Out-Null
          Invoke-EeJson e2e-model-fetch @(
            "--workspace", $e2eWorkspace, "model", "fetch", "rerank-default",
            "--from-file", $archive, "--json"
          ) | Out-Null
          $env:EE_E2E_RERANK_MODEL_DIR = Join-Path $e2eHome ".local\share\ee\models\rerank\rerank-default-v1\rerank-default-v1"

          $corpus = @(
            @("semantic", "fact", "BD1NL1314_RERANK_TRAP release release release format format checklist checklist cargo cargo clippy clippy, but this is a noisy lexical trap and not the Rust release policy target."),
            @("procedural", "rule", "BD1NL1314_RERANK_TARGET The correct Rust release policy says run cargo fmt --check and cargo clippy before publishing."),
            @("semantic", "fact", "BD1NL1314_RERANK_NOISE_ONE Database migration notes cover index ownership and schema upgrade ordering."),
            @("semantic", "fact", "BD1NL1314_RERANK_NOISE_TWO Onboarding screenshots and terminal color themes need a design review."),
            @("semantic", "fact", "BD1NL1314_RERANK_NOISE_THREE Rust ownership and borrowing prevent memory safety errors at compile time.")
          )
          $index = 0
          foreach ($memory in $corpus) {
            Invoke-EeJson "e2e-remember-$index" @(
              "--workspace", $e2eWorkspace, "remember", $memory[2],
              "--level", $memory[0], "--kind", $memory[1],
              "--tags", "bd-1nl13.7,rerank,e2e", "--no-auto-link",
              "--no-propose-candidates", "--json"
            ) | Out-Null
            $index++
          }
          Invoke-EeJson e2e-index @("--workspace", $e2eWorkspace, "index", "rebuild", "--json") | Out-Null
          Invoke-EeJson e2e-top-k @(
            "--workspace", $e2eWorkspace, "config", "set", "search.rerank_top_k", "5", "--json"
          ) | Out-Null
          Invoke-EeJson e2e-rerank-off @(
            "--workspace", $e2eWorkspace, "config", "set", "search.rerank", "off", "--json"
          ) | Out-Null
          $query = "What exact Rust release policy should run before publishing?"
          $fusion = Invoke-EeJson e2e-fusion @(
            "--workspace", $e2eWorkspace, "search", $query,
            "--limit", "5", "--relevance-floor", "0", "--explain", "--json"
          )
          Invoke-EeJson e2e-rerank-auto @(
            "--workspace", $e2eWorkspace, "config", "set", "search.rerank", "auto", "--json"
          ) | Out-Null
          $reranked = Invoke-EeJson e2e-reranked @(
            "--workspace", $e2eWorkspace, "search", $query,
            "--limit", "5", "--relevance-floor", "0", "--explain", "--json"
          )

          $fusionResults = @($fusion.data.results)
          $rerankedResults = @($reranked.data.results)
          $fusionOrder = @($fusionResults | ForEach-Object content)
          $rerankedOrder = @($rerankedResults | ForEach-Object content)
          if ($fusion.data.rerank.mode -ne "fusion_only" -or
              $fusionResults.Count -ne 5 -or $rerankedResults.Count -ne 5 -or
              $reranked.data.rerank.mode -ne "reranked" -or
              $reranked.data.rerank.rerankScoreCount -ne 5 -or
              ($rerankedResults | Where-Object {
                $_.scoreKind -ne "reranked" -or $_.rerankScore -lt 0 -or $_.rerankScore -gt 1
              }).Count -ne 0) {
            throw "native ee.exe did not expose the required five-result reranker posture and scores"
          }
          if ((Compare-Object ($fusionResults.memoryId | Sort-Object) ($rerankedResults.memoryId | Sort-Object)) -or
              (($fusionOrder -join "`n") -eq ($rerankedOrder -join "`n")) -or
              -not $rerankedOrder[0].StartsWith("BD1NL1314_RERANK_TARGET") -or
              -not $rerankedOrder[1].StartsWith("BD1NL1314_RERANK_TRAP")) {
            throw "native ee.exe did not preserve candidates and observably rerank the planted lexical trap"
          }

          [ordered]@{
            schema = "ee.rerank_determinism.vector.v1"
            query = $query
            fusionOnlyOrder = $fusionOrder
            rerankedOrder = $rerankedOrder
            rerankedScores = @($rerankedResults | ForEach-Object {
              [ordered]@{ content = $_.content; rerankScore = $_.rerankScore }
            })
          } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $proofRoot "rerank-vector.json")
          [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ") |
            Set-Content (Join-Path $proofRoot "strict-completed-at.txt")

      - name: Upload per-target native-reranker evidence
        if: ${{ always() && matrix.release_target }}
        uses: actions/upload-artifact@v4
        with:
          name: bd-1nl13.7-${{ matrix.target }}
          path: ${{ runner.temp }}/bd-1nl13.7/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

      - name: Build macOS ee artifact
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        run: cargo build --workspace --bin ee --target ${{ matrix.target }}

      - name: Package macOS ee artifact
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/debug/ee dist/ee
          chmod 755 dist/ee
          tar -czf dist/ee-${{ matrix.target }}-debug.tar.gz -C dist ee
          shasum -a 256 dist/ee-${{ matrix.target }}-debug.tar.gz > dist/ee-${{ matrix.target }}-debug.tar.gz.sha256

      - name: Upload macOS ee artifact
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        uses: actions/upload-artifact@v4
        with:
          name: ee-${{ matrix.target }}-debug
          path: |
            dist/ee-${{ matrix.target }}-debug.tar.gz
            dist/ee-${{ matrix.target }}-debug.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  native-reranker-release-proof:
    name: native-reranker-release-proof
    needs:
      - cross-platform-determinism
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_native_reranker_release_matrix == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all per-target proof artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: bd-1nl13.7-*
          path: ${{ runner.temp }}/bd-1nl13.7-aggregate

      - name: Require five targets and compare reranker vectors
        env:
          PROOF_ROOT: ${{ runner.temp }}/bd-1nl13.7-aggregate
          MATRIX_RESULT: ${{ needs.cross-platform-determinism.result }}
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_ROOT"
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            printf 'cross-platform-determinism result=%s; refusing a passing aggregate proof\n' \
              "$MATRIX_RESULT" | tee "$PROOF_ROOT/aggregate.log"
            exit 1
          fi
          python - "$PROOF_ROOT" <<'PY' 2>&1 | tee -a "$PROOF_ROOT/aggregate.log"
          import datetime
          import json
          import math
          import pathlib
          import re
          import sys

          expected_targets = {
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "aarch64-unknown-linux-gnu",
              "x86_64-unknown-linux-gnu",
              "x86_64-pc-windows-msvc",
          }
          expected_revision = None
          tolerance = 0.01
          root = pathlib.Path(sys.argv[1])
          records = {}

          for sidecar in sorted(root.glob("bd-1nl13.7-*/target.json")):
              target_data = json.loads(sidecar.read_text(encoding="utf-8"))
              target = target_data.get("target")
              if target in records:
                  raise SystemExit(f"duplicate target evidence: {target}")
              revision = target_data.get("frankensearchRevision")
              if not isinstance(revision, str) \
                  or re.fullmatch(r"[0-9a-f]{40}", revision) is None:
                  raise SystemExit(
                      f"{target}: invalid Frankensearch revision evidence: {revision!r}"
                  )
              if expected_revision is None:
                  expected_revision = revision
              elif revision != expected_revision:
                  raise SystemExit(
                      f"{target}: Frankensearch revision {revision} differs from "
                      f"the five-target revision {expected_revision}"
                  )
              if target == "x86_64-pc-windows-msvc":
                  toolchain_path = sidecar.with_name("windows-toolchain.json")
                  if not toolchain_path.is_file():
                      raise SystemExit(f"{target}: Windows toolchain proof is missing")
                  toolchain = json.loads(toolchain_path.read_text(encoding="utf-8-sig"))
                  if toolchain.get("schema") != "ee.windows_native_toolchain_proof.v1" \
                      or toolchain.get("target") != target:
                      raise SystemExit(f"{target}: invalid Windows toolchain proof")
                  compiler = str(toolchain.get("compiler", "")).replace("\\", "/").lower()
                  linker = str(toolchain.get("linker", "")).replace("\\", "/").lower()
                  if not compiler.endswith("/cl.exe") \
                      or not linker.endswith("/link.exe") \
                      or "/git/usr/bin/link.exe" in linker:
                      raise SystemExit(
                          f"{target}: proof did not bind compilation to native MSVC tools"
                      )
              for marker in ("completed-at.txt", "strict-completed-at.txt"):
                  if not sidecar.with_name(marker).is_file():
                      raise SystemExit(f"{target}: success marker is missing: {marker}")
              timestamps_path = sidecar.with_name("timestamps.tsv")
              if not timestamps_path.is_file():
                  raise SystemExit(f"{target}: timestamps.tsv is missing")
              completed = [
                  line.split("\t")
                  for line in timestamps_path.read_text(encoding="utf-8").splitlines()
                  if "\tcompleted\t" in line
              ]
              if not completed or any(fields[-1] != "0" for fields in completed):
                  raise SystemExit(f"{target}: a timestamped proof command failed")
              vector_path = sidecar.with_name("rerank-vector.json")
              if not vector_path.is_file():
                  raise SystemExit(f"{target}: rerank-vector.json is missing")
              vector = json.loads(vector_path.read_text(encoding="utf-8"))
              expected_keys = {
                  "schema", "query", "fusionOnlyOrder",
                  "rerankedOrder", "rerankedScores",
              }
              if set(vector) != expected_keys:
                  raise SystemExit(f"{target}: invalid vector keys")
              if vector["schema"] != "ee.rerank_determinism.vector.v1":
                  raise SystemExit(f"{target}: invalid vector schema")
              if len(vector["fusionOnlyOrder"]) != 5 \
                  or len(vector["rerankedOrder"]) != 5 \
                  or len(vector["rerankedScores"]) != 5:
                  raise SystemExit(f"{target}: vector must contain five candidates")
              score_contents = [
                  item.get("content") for item in vector["rerankedScores"]
              ]
              scores = [
                  item.get("rerankScore") for item in vector["rerankedScores"]
              ]
              if score_contents != vector["rerankedOrder"]:
                  raise SystemExit(f"{target}: score/content order is inconsistent")
              if not all(
                  isinstance(score, (int, float))
                  and not isinstance(score, bool)
                  and math.isfinite(score)
                  and 0.0 <= score <= 1.0
                  for score in scores
              ):
                  raise SystemExit(f"{target}: reranker scores must be finite numbers")
              records[target] = vector

          if set(records) != expected_targets or len(records) != 5:
              missing = sorted(expected_targets - set(records))
              extra = sorted(set(records) - expected_targets)
              raise SystemExit(
                  f"expected exactly five release targets; missing={missing} extra={extra}"
              )

          reference_target = "x86_64-unknown-linux-gnu"
          reference = records[reference_target]
          for target, vector in sorted(records.items()):
              if vector["query"] != reference["query"]:
                  raise SystemExit(f"{target}: rerank query drifted")
              if vector["fusionOnlyOrder"] != reference["fusionOnlyOrder"]:
                  raise SystemExit(f"{target}: fusion-only order drifted")
              if vector["rerankedOrder"] != reference["rerankedOrder"]:
                  raise SystemExit(f"{target}: reranked order drifted")
              for index, (actual, expected) in enumerate(zip(
                  vector["rerankedScores"], reference["rerankedScores"], strict=True
              )):
                  if actual["content"] != expected["content"] \
                      or abs(actual["rerankScore"] - expected["rerankScore"]) > tolerance:
                      raise SystemExit(
                          f"{target}: score {index} exceeds tolerance {tolerance}"
                      )

          aggregate = {
              "schema": "ee.rerank_release_proof.v1",
              "generatedAt": datetime.datetime.now(
                  datetime.timezone.utc
              ).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "frankensearchRevision": expected_revision,
              "referenceTarget": reference_target,
              "scoreTolerance": tolerance,
              "targets": sorted(records),
              "targetCount": len(records),
              "verdict": "pass",
          }
          (root / "aggregate-proof.json").write_text(
              json.dumps(aggregate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(aggregate, sort_keys=True))
          PY

      - name: Upload aggregate five-target proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-1nl13.7-five-target-proof
          path: ${{ runner.temp }}/bd-1nl13.7-aggregate
          if-no-files-found: error
          retention-days: 14

  windows-installer-static-conformance:
    if: github.event_name != 'schedule'
    name: windows-installer-static-conformance
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Windows PowerShell 5.1 parser/static installer conformance
        shell: powershell
        run: >
          ./scripts/windows-installer-static-check.ps1
          -RepoRoot "$env:GITHUB_WORKSPACE"
          -LogPath "$env:RUNNER_TEMP/windows-installer-static-conformance.jsonl"
          -ResetLog

      - name: PowerShell 7 parser/static installer conformance
        shell: pwsh
        run: >
          ./scripts/windows-installer-static-check.ps1
          -RepoRoot "$env:GITHUB_WORKSPACE"
          -LogPath "$env:RUNNER_TEMP/windows-installer-static-conformance.jsonl"

      - name: Upload Windows installer static conformance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-static-conformance-log
          path: ${{ runner.temp }}/windows-installer-static-conformance.jsonl

  windows-installer-mocked-flow-conformance:
    if: github.event_name != 'schedule'
    name: windows-installer-mocked-flow-conformance
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Mocked installer verification flow conformance
        shell: pwsh
        run: >
          ./scripts/windows-installer-mocked-flow-check.ps1
          -RepoRoot "$env:GITHUB_WORKSPACE"
          -ArtifactRoot "$env:RUNNER_TEMP/windows-installer-mocked-flow"
          -LogPath "$env:RUNNER_TEMP/windows-installer-mocked-flow.jsonl"
          -ResetLog

      - name: Upload Windows installer mocked flow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-mocked-flow-log
          path: |
            ${{ runner.temp }}/windows-installer-mocked-flow.jsonl
            ${{ runner.temp }}/windows-installer-mocked-flow/**/installer-output.txt

  windows-installer-live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_installer_live_smoke == 'true'
    name: windows-installer-live-smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EE_TEST_SEED: bd-3tprq.4-windows-installer-live-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Live GitHub release installer smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./scripts/windows-installer-live-smoke.ps1
          -RepoRoot "$env:GITHUB_WORKSPACE"
          -ArtifactRoot "$env:RUNNER_TEMP/windows-installer-live-smoke"
          -InstallRoot "$env:RUNNER_TEMP/ee-windows-installer-live"
          -LogPath "$env:RUNNER_TEMP/windows-installer-live-smoke.jsonl"
          -ResetLog

      - name: Upload Windows live installer smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-live-smoke-log
          path: |
            ${{ runner.temp }}/windows-installer-live-smoke.jsonl
            ${{ runner.temp }}/windows-installer-live-smoke/**/installer-output.txt

  windows-msvc-cli-smoke:
    if: github.event_name != 'schedule'
    name: windows-msvc-cli-smoke
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EE_TEST_SEED: bd-3usjw.68-windows-msvc-cli-smoke
      EE_EMBED_DOWNLOAD: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global core.longpaths true
          $projectRoot = Join-Path $env:RUNNER_TEMP "franken-stack\projects"
          & ./scripts/checkout-franken-stack.ps1 -DestinationRoot $projectRoot
          $fsqliteManifest = Join-Path $projectRoot "frankensqlite\crates\fsqlite\Cargo.toml"
          if (-not (Test-Path $fsqliteManifest)) {
            Write-Error "MISSING: $fsqliteManifest"
            exit 1
          }
          $cargoPathRoot = $projectRoot -replace "\\", "/"
          $cargoText = Get-Content Cargo.toml -Raw
          foreach ($repo in @("asupersync","franken_agent_detection","franken_networkx","frankensearch","frankensqlite","sqlmodel_rust","toon_rust")) {
            $cargoText = $cargoText.Replace("/data/projects/$repo", "$cargoPathRoot/$repo")
            $cargoText = $cargoText.Replace("../$repo", "$cargoPathRoot/$repo")
          }
          Set-Content Cargo.toml -Value $cargoText -NoNewline

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Windows path resolver and binary smoke test
        shell: pwsh
        run: cargo test --workspace --test e2e_windows_smoke --target x86_64-pc-windows-msvc -- --nocapture

      - name: Build ee for PowerShell smoke script
        shell: pwsh
        run: cargo build --workspace --bin ee --target x86_64-pc-windows-msvc

      - name: PowerShell walking-skeleton smoke
        shell: pwsh
        run: >
          ./scripts/e2e_windows_smoke.ps1
          -EeBinary "target/x86_64-pc-windows-msvc/debug/ee.exe"
          -WorkspaceRoot "$env:RUNNER_TEMP/ee-windows-msvc-cli-smoke"
          -LogPath "$env:RUNNER_TEMP/ee-windows-msvc-cli-smoke.jsonl"

      - name: Upload Windows smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-cli-smoke-log
          path: ${{ runner.temp }}/ee-windows-msvc-cli-smoke.jsonl

  install-pipeline-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: install-pipeline-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq ca-certificates curl xz-utils

      - name: Install jq
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Audit install pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/audit_install_pipeline.sh

      - name: Read audit decision
        id: audit
        shell: bash
        run: |
          DECIDED_PATH="$(jq -r '.decided_path' tests/audit_artifacts/latest_install_pipeline.json)"
          LATEST_TAG="$(jq -r '.github_releases.releases[0].tagName // ""' tests/audit_artifacts/latest_install_pipeline.json)"
          echo "decided_path=$DECIDED_PATH" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Install pipeline path: $DECIDED_PATH"
          echo "Latest release tag: ${LATEST_TAG:-none}"

      - name: Upload install audit
        uses: actions/upload-artifact@v4
        with:
          name: install-pipeline-audit-${{ runner.os }}
          path: tests/audit_artifacts/install_pipeline_*.json

      - name: Skip live smoke until first release
        if: steps.audit.outputs.decided_path != 'path_a_post_release'
        run: |
          echo "::notice title=Install pipeline pre-release::Skipping live installer smoke until GitHub release, Homebrew tap, and crates.io ownership are ready."

      - name: Linux installer smoke
        if: steps.audit.outputs.decided_path == 'path_a_post_release' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for image in ubuntu:24.04 debian:bookworm-slim; do
            docker run --rm -e EE_RELEASE_TAG="${{ steps.audit.outputs.latest_tag }}" "$image" sh -eu -c '
              apt-get update
              apt-get install -y curl ca-certificates xz-utils
              curl -fsSL "https://github.com/Dicklesworthstone/eidetic_engine_cli/releases/download/${EE_RELEASE_TAG}/install.sh" \
                | EE_VERSION="${EE_RELEASE_TAG}" bash -s -- --verify
              export PATH="$HOME/.local/bin:$PATH"
              EE_EXPECTED_VERSION="${EE_RELEASE_TAG#v}"
              ee --version | grep -F "$EE_EXPECTED_VERSION"
              ee doctor --json
            '
          done

      - name: macOS installer smoke
        if: steps.audit.outputs.decided_path == 'path_a_post_release' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/Dicklesworthstone/eidetic_engine_cli/releases/download/${{ steps.audit.outputs.latest_tag }}/install.sh \
            | EE_VERSION="${{ steps.audit.outputs.latest_tag }}" EE_INSTALL_DIR="$RUNNER_TEMP/ee-bin" \
                /bin/bash -s -- --verify
          export PATH="$RUNNER_TEMP/ee-bin:$PATH"
          EE_EXPECTED_VERSION="${{ steps.audit.outputs.latest_tag }}"
          EE_EXPECTED_VERSION="${EE_EXPECTED_VERSION#v}"
          ee --version | grep -F "$EE_EXPECTED_VERSION"
          ee doctor --json

      - name: Homebrew installer smoke
        if: steps.audit.outputs.decided_path == 'path_a_post_release' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install Dicklesworthstone/tap/ee
          EE_EXPECTED_VERSION="${{ steps.audit.outputs.latest_tag }}"
          EE_EXPECTED_VERSION="${EE_EXPECTED_VERSION#v}"
          ee --version | grep -F "$EE_EXPECTED_VERSION"
          ee doctor --json

      - name: Cargo installer smoke
        if: steps.audit.outputs.decided_path == 'path_a_post_release'
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/clean-cargo-home"
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo install eidetic-engine
          EE_EXPECTED_VERSION="${{ steps.audit.outputs.latest_tag }}"
          EE_EXPECTED_VERSION="${EE_EXPECTED_VERSION#v}"
          ee --version | grep -F "$EE_EXPECTED_VERSION"
          ee doctor --json
