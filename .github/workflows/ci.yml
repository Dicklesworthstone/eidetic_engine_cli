name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_windows_installer_live_smoke:
        description: 'Run the opt-in Windows live installer smoke against the latest release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          # Cargo.toml uses ../<sibling-repo>/... paths to match the local
          # Mac/Linux dev checkout layout where ee lives next to the franken
          # sibling crates. CI clones the siblings under the workspace and
          # rewrites Cargo.toml to workspace-relative paths so both normal cargo
          # steps and Dockerized actions that mount only $GITHUB_WORKSPACE see
          # the same dependency tree. Both spellings are accepted so a future
          # revert to the historical /data/projects/... prefix would still build.
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Forbidden dependency audit
        run: ./scripts/check-forbidden-deps.sh

      # Supply-chain RustSec advisory gate (bd-2efax). `deny.toml [advisories]`
      # is now version=2 gate mode, so this fails the build on any open
      # vulnerability / unmaintained / unsound / yanked crate in the resolved
      # tree (fsqlite/frankensearch path-dep stack + serde_json included).
      # Runs against the Cargo.toml already rewritten to the cloned Franken
      # stack above, so the full transitive graph is in scope. NOTE: this is a
      # step in `verify` rather than the isolated job reviewer-p2-r3 suggested,
      # because a standalone job would have to duplicate the ~24-line Franken
      # stack checkout; splitting it cleanly is a follow-up once that checkout
      # is factored into a reusable composite action.
      #
      - name: RustSec advisory audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Closure linter
        run: ./scripts/closure-lint.sh --audit --json

      - name: Vision coverage
        run: |
          git fetch origin +main:refs/remotes/origin/main --depth=1
          sh ./scripts/vision-coverage.sh --json --compare-ref origin/main

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        env:
          RUSTFLAGS: "-C debuginfo=0 -C linker-features=-lld"
        run: cargo clippy --all-targets -- -D warnings

      - name: MCP parity tests
        env:
          RUSTFLAGS: "-C debuginfo=0 -C linker-features=-lld"
        run: cargo test --workspace --features mcp --test mcp_parity

  verify-tests:
    if: github.event_name != 'schedule'
    name: verify-tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - lib-cache-cass-config
          - lib-cli
          - lib-core
          - lib-curate-daemon
          - lib-db
          - lib-eval-graph
          - lib-rest
          - targets
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C debuginfo=0 -C linker-features=-lld"
      RUST_TEST_THREADS: "1"
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          heartbeat_pid=""
          cleanup() {
            if [ -n "$heartbeat_pid" ]; then
              kill "$heartbeat_pid" 2>/dev/null || true
              wait "$heartbeat_pid" 2>/dev/null || true
              heartbeat_pid=""
            fi
          }
          trap cleanup EXIT

          run_test() {
            local label="$1"
            shift
            cleanup
            (
              while true; do
                sleep 300
                echo "::notice::$label still running at $(date -u +%FT%TZ)"
              done
            ) &
            heartbeat_pid=$!
            echo "::notice::$label started at $(date -u +%FT%TZ) with CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS RUSTFLAGS=$RUSTFLAGS RUST_TEST_THREADS=$RUST_TEST_THREADS"
            set +e
            timeout --foreground --kill-after=30s 90m "$@"
            local status=$?
            set -e
            cleanup
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::error::$label exceeded the 90m CI test budget; inspect the last emitted test name/output above for the hanging test." >&2
            fi
            return "$status"
          }

          case "$TEST_SHARD" in
            lib-cache-cass-config)
              run_test "cargo test --lib cache::" cargo test --workspace --lib --jobs 1 cache:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib cass::" cargo test --workspace --lib --jobs 1 cass:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib config::" cargo test --workspace --lib --jobs 1 config:: -- --test-threads=1 --nocapture
              ;;
            lib-cli)
              run_test "cargo test --lib cli::" cargo test --workspace --lib --jobs 1 cli:: -- --test-threads=1 --nocapture
              ;;
            lib-core)
              run_test "cargo test --lib core::" cargo test --workspace --lib --jobs 1 core:: -- --test-threads=1 --nocapture
              ;;
            lib-curate-daemon)
              run_test "cargo test --lib curate::" cargo test --workspace --lib --jobs 1 curate:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib daemon::" cargo test --workspace --lib --jobs 1 daemon:: -- --test-threads=1 --nocapture
              ;;
            lib-db)
              run_test "cargo test --lib db::" cargo test --workspace --lib --jobs 1 db:: -- --test-threads=1 --nocapture
              ;;
            lib-eval-graph)
              run_test "cargo test --lib eval::" cargo test --workspace --lib --jobs 1 eval:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib graph::" cargo test --workspace --lib --jobs 1 graph:: -- --test-threads=1 --nocapture
              ;;
            lib-rest)
              run_test "cargo test --lib fuzz::" cargo test --workspace --lib --jobs 1 fuzz:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib hooks::" cargo test --workspace --lib --jobs 1 hooks:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib mesh::" cargo test --workspace --lib --jobs 1 mesh:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib models::" cargo test --workspace --lib --jobs 1 models:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib obs::" cargo test --workspace --lib --jobs 1 obs:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib output::" cargo test --workspace --lib --jobs 1 output:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib pack::" cargo test --workspace --lib --jobs 1 pack:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib policy::" cargo test --workspace --lib --jobs 1 policy:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib runtime::" cargo test --workspace --lib --jobs 1 runtime:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib science::" cargo test --workspace --lib --jobs 1 science:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib search::" cargo test --workspace --lib --jobs 1 search:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib serve::" cargo test --workspace --lib --jobs 1 serve:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib shadow::" cargo test --workspace --lib --jobs 1 shadow:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib steward::" cargo test --workspace --lib --jobs 1 steward:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib testing::" cargo test --workspace --lib --jobs 1 testing:: -- --test-threads=1 --nocapture
              run_test "cargo test --lib util::" cargo test --workspace --lib --jobs 1 util:: -- --test-threads=1 --nocapture
              ;;
            targets)
              run_test "cargo test targets" cargo test --workspace --bins --tests --examples --jobs 1 -- --test-threads=1 --nocapture
              ;;
            *)
              echo "::error::unknown TEST_SHARD=$TEST_SHARD" >&2
              exit 1
              ;;
          esac

  cross-platform-determinism:
    if: github.event_name != 'schedule'
    name: cross-platform-determinism (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            runner: cross
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          ./scripts/checkout-franken-stack.sh "$project_root"
          # See the verify job for the rationale on accepting both
          # ../<sibling> and /data/projects/<sibling> prefixes here.
          CARGO_PATH_ROOT="$project_root" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml

      - name: Checkout Franken stack path dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global core.longpaths true
          $projectRoot = Join-Path $env:GITHUB_WORKSPACE ".ci\franken-stack\projects"
          & ./scripts/checkout-franken-stack.ps1 -DestinationRoot $projectRoot
          $fsqliteManifest = Join-Path $projectRoot "frankensqlite\crates\fsqlite\Cargo.toml"
          if (-not (Test-Path $fsqliteManifest)) {
            Write-Error "MISSING: $fsqliteManifest"
            exit 1
          }
          $cargoPathRoot = $projectRoot -replace "\\", "/"
          $cargoText = Get-Content Cargo.toml -Raw
          foreach ($repo in @("asupersync","franken_agent_detection","franken_networkx","frankensearch","frankensqlite","sqlmodel_rust","toon_rust")) {
            $cargoText = $cargoText.Replace("/data/projects/$repo", "$cargoPathRoot/$repo")
            $cargoText = $cargoText.Replace("../$repo", "$cargoPathRoot/$repo")
          }
          Set-Content Cargo.toml -Value $cargoText -NoNewline

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.runner == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Verify Franken stack clone (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fnx_root="$GITHUB_WORKSPACE/.ci/franken-stack/projects/franken_networkx"
          echo "::group::franken_networkx workspace manifest"
          ls -la "$fnx_root" || true
          if [ -f "$fnx_root/Cargo.toml" ]; then
            echo "--- $fnx_root/Cargo.toml (first 25 lines) ---"
            head -25 "$fnx_root/Cargo.toml"
          else
            echo "MISSING: $fnx_root/Cargo.toml"
            exit 1
          fi
          echo "::endgroup::"
          echo "::group::fnx-cgse manifest"
          if [ -f "$fnx_root/crates/fnx-cgse/Cargo.toml" ]; then
            head -10 "$fnx_root/crates/fnx-cgse/Cargo.toml"
          else
            echo "MISSING: $fnx_root/crates/fnx-cgse/Cargo.toml"
            exit 1
          fi
          echo "::endgroup::"

      - name: Verify Franken stack clone (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fnxRoot = Join-Path $env:GITHUB_WORKSPACE ".ci\franken-stack\projects\franken_networkx"
          Write-Host "::group::franken_networkx workspace manifest"
          Get-ChildItem -Force $fnxRoot | Format-Table | Out-String | Write-Host
          $rootManifest = Join-Path $fnxRoot "Cargo.toml"
          if (-not (Test-Path $rootManifest)) {
            Write-Error "MISSING: $rootManifest"
            exit 1
          }
          Get-Content $rootManifest -TotalCount 25 | Write-Host
          Write-Host "::endgroup::"
          Write-Host "::group::fnx-cgse manifest"
          $cgseManifest = Join-Path $fnxRoot "crates\fnx-cgse\Cargo.toml"
          if (-not (Test-Path $cgseManifest)) {
            Write-Error "MISSING: $cgseManifest"
            exit 1
          }
          Get-Content $cgseManifest -TotalCount 10 | Write-Host
          Write-Host "::endgroup::"

      - name: Cross-platform graph determinism
        if: matrix.runner != 'cross'
        run: cargo test --workspace --test cross_platform_determinism --target ${{ matrix.target }} -- --nocapture

      - name: Cross-platform graph determinism (cross)
        if: matrix.runner == 'cross'
        run: cross test --workspace --test cross_platform_determinism --target ${{ matrix.target }} -- --nocapture

      - name: Build macOS ee artifact
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        run: cargo build --workspace --bin ee --target ${{ matrix.target }}

      - name: Package macOS ee artifact
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/debug/ee dist/ee
          chmod 755 dist/ee
          tar -czf dist/ee-${{ matrix.target }}-debug.tar.gz -C dist ee
          shasum -a 256 dist/ee-${{ matrix.target }}-debug.tar.gz > dist/ee-${{ matrix.target }}-debug.tar.gz.sha256

      - name: Upload macOS ee artifact
        if: ${{ matrix.target == 'aarch64-apple-darwin' }}
        uses: actions/upload-artifact@v4
        with:
          name: ee-${{ matrix.target }}-debug
          path: |
            dist/ee-${{ matrix.target }}-debug.tar.gz
            dist/ee-${{ matrix.target }}-debug.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  windows-installer-static-conformance:
    if: github.event_name != 'schedule'
    name: windows-installer-static-conformance
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Windows PowerShell 5.1 parser/static installer conformance
        shell: powershell
        run: >
          ./scripts/windows-installer-static-check.ps1
          -RepoRoot "$env:GITHUB_WORKSPACE"
          -LogPath "$env:RUNNER_TEMP/windows-installer-static-conformance.jsonl"
          -ResetLog

      - name: PowerShell 7 parser/static installer conformance
        shell: pwsh
        run: >
          ./scripts/windows-installer-static-check.ps1
          -RepoRoot "$env:GITHUB_WORKSPACE"
          -LogPath "$env:RUNNER_TEMP/windows-installer-static-conformance.jsonl"

      - name: Upload Windows installer static conformance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-static-conformance-log
          path: ${{ runner.temp }}/windows-installer-static-conformance.jsonl

  windows-installer-mocked-flow-conformance:
    if: github.event_name != 'schedule'
    name: windows-installer-mocked-flow-conformance
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Mocked installer verification flow conformance
        shell: pwsh
        run: >
          ./scripts/windows-installer-mocked-flow-check.ps1
          -RepoRoot "$env:GITHUB_WORKSPACE"
          -ArtifactRoot "$env:RUNNER_TEMP/windows-installer-mocked-flow"
          -LogPath "$env:RUNNER_TEMP/windows-installer-mocked-flow.jsonl"
          -ResetLog

      - name: Upload Windows installer mocked flow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-mocked-flow-log
          path: |
            ${{ runner.temp }}/windows-installer-mocked-flow.jsonl
            ${{ runner.temp }}/windows-installer-mocked-flow/**/installer-output.txt

  windows-installer-live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_installer_live_smoke == 'true'
    name: windows-installer-live-smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EE_TEST_SEED: bd-3tprq.4-windows-installer-live-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Live GitHub release installer smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./scripts/windows-installer-live-smoke.ps1
          -RepoRoot "$env:GITHUB_WORKSPACE"
          -ArtifactRoot "$env:RUNNER_TEMP/windows-installer-live-smoke"
          -InstallRoot "$env:RUNNER_TEMP/ee-windows-installer-live"
          -LogPath "$env:RUNNER_TEMP/windows-installer-live-smoke.jsonl"
          -ResetLog

      - name: Upload Windows live installer smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-live-smoke-log
          path: |
            ${{ runner.temp }}/windows-installer-live-smoke.jsonl
            ${{ runner.temp }}/windows-installer-live-smoke/**/installer-output.txt

  windows-msvc-cli-smoke:
    if: github.event_name != 'schedule'
    name: windows-msvc-cli-smoke
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EE_TEST_SEED: bd-3usjw.68-windows-msvc-cli-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout Franken stack path dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global core.longpaths true
          $projectRoot = Join-Path $env:RUNNER_TEMP "franken-stack\projects"
          & ./scripts/checkout-franken-stack.ps1 -DestinationRoot $projectRoot
          $fsqliteManifest = Join-Path $projectRoot "frankensqlite\crates\fsqlite\Cargo.toml"
          if (-not (Test-Path $fsqliteManifest)) {
            Write-Error "MISSING: $fsqliteManifest"
            exit 1
          }
          $cargoPathRoot = $projectRoot -replace "\\", "/"
          $cargoText = Get-Content Cargo.toml -Raw
          foreach ($repo in @("asupersync","franken_agent_detection","franken_networkx","frankensearch","frankensqlite","sqlmodel_rust","toon_rust")) {
            $cargoText = $cargoText.Replace("/data/projects/$repo", "$cargoPathRoot/$repo")
            $cargoText = $cargoText.Replace("../$repo", "$cargoPathRoot/$repo")
          }
          Set-Content Cargo.toml -Value $cargoText -NoNewline

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Windows path resolver and binary smoke test
        shell: pwsh
        run: cargo test --workspace --test e2e_windows_smoke --target x86_64-pc-windows-msvc -- --nocapture

      - name: Build ee for PowerShell smoke script
        shell: pwsh
        run: cargo build --workspace --bin ee --target x86_64-pc-windows-msvc

      - name: PowerShell walking-skeleton smoke
        shell: pwsh
        run: >
          ./scripts/e2e_windows_smoke.ps1
          -EeBinary "target/x86_64-pc-windows-msvc/debug/ee.exe"
          -WorkspaceRoot "$env:RUNNER_TEMP/ee-windows-msvc-cli-smoke"
          -LogPath "$env:RUNNER_TEMP/ee-windows-msvc-cli-smoke.jsonl"

      - name: Upload Windows smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-cli-smoke-log
          path: ${{ runner.temp }}/ee-windows-msvc-cli-smoke.jsonl

  install-pipeline-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: install-pipeline-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq ca-certificates curl xz-utils

      - name: Install jq
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Audit install pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/audit_install_pipeline.sh

      - name: Read audit decision
        id: audit
        shell: bash
        run: |
          DECIDED_PATH="$(jq -r '.decided_path' tests/audit_artifacts/latest_install_pipeline.json)"
          LATEST_TAG="$(jq -r '.github_releases.releases[0].tagName // ""' tests/audit_artifacts/latest_install_pipeline.json)"
          echo "decided_path=$DECIDED_PATH" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Install pipeline path: $DECIDED_PATH"
          echo "Latest release tag: ${LATEST_TAG:-none}"

      - name: Upload install audit
        uses: actions/upload-artifact@v4
        with:
          name: install-pipeline-audit-${{ runner.os }}
          path: tests/audit_artifacts/install_pipeline_*.json

      - name: Skip live smoke until first release
        if: steps.audit.outputs.decided_path != 'path_a_post_release'
        run: |
          echo "::notice title=Install pipeline pre-release::Skipping live installer smoke until GitHub release, Homebrew tap, and crates.io ownership are ready."

      - name: Linux installer smoke
        if: steps.audit.outputs.decided_path == 'path_a_post_release' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for image in ubuntu:24.04 debian:bookworm-slim; do
            docker run --rm -e EE_RELEASE_TAG="${{ steps.audit.outputs.latest_tag }}" "$image" sh -eu -c '
              apt-get update
              apt-get install -y curl ca-certificates xz-utils
              curl -fsSL "https://github.com/Dicklesworthstone/eidetic_engine_cli/releases/download/${EE_RELEASE_TAG}/install.sh" \
                | EE_VERSION="${EE_RELEASE_TAG}" sh
              export PATH="$HOME/.local/bin:$PATH"
              EE_EXPECTED_VERSION="${EE_RELEASE_TAG#v}"
              ee --version | grep -F "$EE_EXPECTED_VERSION"
              ee doctor --json
            '
          done

      - name: macOS installer smoke
        if: steps.audit.outputs.decided_path == 'path_a_post_release' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/Dicklesworthstone/eidetic_engine_cli/releases/download/${{ steps.audit.outputs.latest_tag }}/install.sh \
            | EE_VERSION="${{ steps.audit.outputs.latest_tag }}" EE_INSTALL_DIR="$RUNNER_TEMP/ee-bin" sh
          export PATH="$RUNNER_TEMP/ee-bin:$PATH"
          EE_EXPECTED_VERSION="${{ steps.audit.outputs.latest_tag }}"
          EE_EXPECTED_VERSION="${EE_EXPECTED_VERSION#v}"
          ee --version | grep -F "$EE_EXPECTED_VERSION"
          ee doctor --json

      - name: Homebrew installer smoke
        if: steps.audit.outputs.decided_path == 'path_a_post_release' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install Dicklesworthstone/tap/ee
          EE_EXPECTED_VERSION="${{ steps.audit.outputs.latest_tag }}"
          EE_EXPECTED_VERSION="${EE_EXPECTED_VERSION#v}"
          ee --version | grep -F "$EE_EXPECTED_VERSION"
          ee doctor --json

      - name: Cargo installer smoke
        if: steps.audit.outputs.decided_path == 'path_a_post_release'
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/clean-cargo-home"
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo install eidetic-engine
          EE_EXPECTED_VERSION="${{ steps.audit.outputs.latest_tag }}"
          EE_EXPECTED_VERSION="${EE_EXPECTED_VERSION#v}"
          ee --version | grep -F "$EE_EXPECTED_VERSION"
          ee doctor --json
