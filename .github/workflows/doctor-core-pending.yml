name: Doctor core repair outcomes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/doctor-core-pending.yml
      - src/core/doctor*.rs
      - src/cli/mod.rs
      - tests/e2e_doctor_concise_default.rs
      - tests/doctor_fixtures/**

permissions:
  contents: read

concurrency:
  group: doctor-core-pending-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Apply the reviewed patch with exact source guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/doctor-core"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          expected = {
              'docs/agent-ux/ee-doctor-first-aid-precedence.md': 'c7d68bae535bbbc81e1ace0cbbd89c27d30f3c44',
              'src/cli/mod.rs': '332b80225abe8feeea76b2bd98e30d3a7375353e',
              'src/core/doctor_fixers.rs': '5f40fec947e230b053a5a5e2d1145a4bed468165',
              'tests/doctor_fixtures/assertion_contract.py': '41e1addd9884aab0c71c679a66eceb22260bd8d0',
              'tests/doctor_fixtures/fm-schema_migrations-migration-drift-checksum-mismatch/assert.sh': '36417ffa6511aff0660531e1e4cd03894b390097',
              'tests/doctor_fixtures/fm-state_files-empty-or-truncated-database/assert.sh': 'a560e35689a6104d17006c3993240779ac9ee644',
              'tests/doctor_fixtures/lib.sh': '719e8e98a8bc2b45e2a32de2237dd8b95729e7bf',
              'tests/e2e_doctor_concise_default.rs': 'dd6335efc9970450978d4099ed3894fd4710e536',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise SystemExit('Concurrent source change; reconcile before integration: ' + path)
          encoded = ''''''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '9fe7f7efea25be2717a180ca5b33666dcf02fc2040c0704f66b0333809717caf':
              raise SystemExit('Patch digest mismatch')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'doctor-core'
          path = output / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          (output / 'preimages.json').write_text(json.dumps(expected, indent=2))
          (output / 'source-sha.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          PY
          rustfmt --edition 2024 --config skip_children=true src/cli/mod.rs src/core/doctor_fixers.rs tests/e2e_doctor_concise_default.rs
          git diff --check
          git diff > "$RUNNER_TEMP/doctor-core/prepared.patch"
          python3 -m unittest discover -s tests/doctor_fixtures -p assertion_contract.py -k GuidanceOnlyContract > "$RUNNER_TEMP/doctor-core/assertions.log" 2>&1
      - name: Export prepared source blobs without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request, zipfile
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'doctor-core'
          preimages = json.loads((output / 'preimages.json').read_text())
          entries = []
          with zipfile.ZipFile(output / 'prepared-source.zip', 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path, before in preimages.items():
                  content = pathlib.Path(path).read_bytes()
                  body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode()
                  request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'doctor-core-source-integration'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      sha = json.load(response)['sha']
                  expected = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
                  if sha != expected:
                      raise SystemExit('Published blob identity mismatch: ' + path)
                  mode = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).split()[0]
                  entries.append({'path': path, 'preimage': before, 'sha': sha, 'mode': mode, 'type': 'blob'})
                  archive.writestr(path, content)
          (output / 'source-blobs.json').write_text(json.dumps({'sourceCommit': (output / 'source-sha.txt').read_text().strip(), 'entries': entries, 'runtimeValidation': 'pending'}, indent=2))
          print((output / 'source-blobs.json').read_text())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-core-source-${{ github.sha }}
          path: ${{ runner.temp }}/doctor-core/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: doctor-core-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            doctor-index-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            doctor-receipts-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Exercise required guidance, optional advisories, and real repair receipts
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for filter in core::doctor_fixers::tests:: cli::tests::doctor_fix_ core::doctor_runtime::index_repair::tests::; do
            label=${filter//:/_}
            log="$RUNNER_TEMP/doctor-core/$label.log"
            timeout 12m cargo test --locked --lib "$filter" -- --test-threads=1 > "$log" 2>&1 || failed=1
            tail -n 70 "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log" || failed=1
          done
          timeout 12m cargo test --locked --test integration_e_f e2e_doctor_concise_default:: -- --test-threads=1 > "$RUNNER_TEMP/doctor-core/public-cli.log" 2>&1 || failed=1
          tail -n 70 "$RUNNER_TEMP/doctor-core/public-cli.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/doctor-core/public-cli.log" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: doctor-core-results-${{ github.sha }}
          path: ${{ runner.temp }}/doctor-core/
          retention-days: 7
