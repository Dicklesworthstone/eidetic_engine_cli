name: Pack candidate-pool regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pack-candidate-pool.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Prepare the narrowly scoped source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = {
              'src/config/file.rs': '38b8d94df8142a6387488cd268726354eae4b93b',
              'src/core/config_surface.rs': '7a9aed19766f8425da7bd3ce95815c95061f8270',
              'src/core/context.rs': '689a041b5d035d4021c0f26e0b5785ffe392517f',
              'src/cli/mod.rs': 'ca1d7ee885b4119ae0ee8551f2d1eb329a8b46dd',
          }
          tests = ['src/cli/candidate_pool_tests.rs', 'src/core/config_candidate_pool_tests.rs',
                   'src/core/context_candidate_pool_tests.rs']
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
          for path in tests:
              expected[path] = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          def edit(path, old, new, count=1):
              file = pathlib.Path(path)
              text = file.read_text()
              assert text.count(old) == count, (path, old, text.count(old))
              file.write_text(text.replace(old, new))
          edit('src/core/config_surface.rs',
               'GRAPH_WITNESSES_RETENTION_DAYS_KEY, MEMORY_INCLUDE_GLOBAL_KEY, MEMORY_PARTICIPATE_KEY,\n',
               'GRAPH_WITNESSES_RETENTION_DAYS_KEY, MEMORY_INCLUDE_GLOBAL_KEY, MEMORY_PARTICIPATE_KEY,\n    PACK_CANDIDATE_POOL_KEY,\n')
          edit('src/core/config_surface.rs', '    PositiveInteger,\n    PercentInteger,',
               '    PositiveInteger,\n    PositiveU32,\n    PercentInteger,')
          edit('src/core/config_surface.rs',
               'fn config_key_spec(key: &str) -> Option<GraphKeySpec> {\n    match key {',
               '''fn config_key_spec(key: &str) -> Option<GraphKeySpec> {
              match key {
                  PACK_CANDIDATE_POOL_KEY => Some(GraphKeySpec {
                      key: PACK_CANDIDATE_POOL_KEY,
                      path: &["pack", "candidate_pool"],
                      kind: GraphValueKind::PositiveU32,
                  }),''')
          edit('src/core/config_surface.rs', '        GraphValueKind::PercentInteger => {',
               '''        GraphValueKind::PositiveU32 => {
                      let expected = "an integer in the range 1..=4294967295";
                      let value = raw
                          .parse::<u32>()
                          .ok()
                          .filter(|value| *value > 0)
                          .ok_or_else(|| invalid_value(spec, raw, expected))?;
                      Ok(TomlScalar::Integer(i64::from(value)))
                  }
                  GraphValueKind::PercentInteger => {''')
          edit('src/core/config_surface.rs', 'fn merged_config(\n',
               '''/// Resolve an omitted request pool using the same layers as `config get`.
          /// Explicit request values (including query-file and task-lens overrides) win;
          /// request validation and runtime profile caps still run in the pack core.
          pub(crate) fn resolve_pack_candidate_pool(
              workspace_root: &Path,
              explicit: Option<u32>,
          ) -> Result<Option<u32>, ConfigSurfaceError> {
              if explicit.is_some() {
                  return Ok(explicit);
              }
              let merged = merged_workspace_config(workspace_root)?;
              merged
                  .values
                  .pack
                  .candidate_pool
                  .map(|value| {
                      u32::try_from(value).map_err(|_| ConfigSurfaceError::InvalidValue {
                          key: PACK_CANDIDATE_POOL_KEY,
                          value: value.to_string(),
                          expected: "an integer in the range 1..=4294967295",
                      })
                  })
                  .transpose()
          }

          fn merged_config(
          ''')
          edit('src/config/file.rs',
               'impl PackConfig {\n    fn parse(document: &DocumentMut) -> Result<Self, ConfigParseError> {\n        Ok(Self {',
               '''impl PackConfig {
              fn parse(document: &DocumentMut) -> Result<Self, ConfigParseError> {
                  let candidate_pool = optional_u64(document, "pack", "candidate_pool")?;
                  if let Some(value) = candidate_pool
                      && (value == 0 || value > u64::from(u32::MAX))
                  {
                      return Err(ConfigParseError::InvalidValue {
                          key: "pack.candidate_pool".to_owned(),
                          value: value.to_string(),
                          message: "expected an integer in the range 1..=4294967295".to_owned(),
                      });
                  }
                  Ok(Self {''')
          edit('src/config/file.rs', '            candidate_pool: optional_u64(document, "pack", "candidate_pool")?,',
               '            candidate_pool,')
          edit('src/core/context.rs', '        candidate_pool: options.candidate_pool,',
               '''        candidate_pool: crate::core::config_surface::resolve_pack_candidate_pool(
                      &options.workspace_path,
                      options.candidate_pool,
                  )
                  .map_err(|error| ContextPackError::Pack(error.to_string()))?,''', 2)
          edit('src/cli/mod.rs',
               '''    /// Explicit maximum token budget for the context pack.
              #[arg(long, short = 't', value_name = "N")]
              pub max_tokens: Option<u32>,

              /// Maximum candidate memories to retrieve before packing.
              #[arg(long, default_value_t = 100)]
              pub candidate_pool: u32,''',
               '''    /// Explicit maximum token budget for the context pack.
              #[arg(long, short = 't', value_name = "N")]
              pub max_tokens: Option<u32>,

              /// Maximum candidate memories to retrieve (defaults to pack.candidate_pool).
              #[arg(long)]
              pub candidate_pool: Option<u32>,''')
          edit('src/cli/mod.rs',
               '        max_tokens: args.max_tokens,\n        candidate_pool: Some(args.candidate_pool),',
               '        max_tokens: args.max_tokens,\n        candidate_pool: args.candidate_pool,')
          edit('src/cli/mod.rs',
               '''            candidate_pool: args
                          .candidate_pool
                          .or_else(|| lens_overlay.and_then(|overlay| overlay.candidate_pool))
                          .unwrap_or(100),''',
               '''            candidate_pool: args
                          .candidate_pool
                          .or_else(|| lens_overlay.and_then(|overlay| overlay.candidate_pool)),''')
          for path, module in [('src/core/config_surface.rs', 'config_candidate_pool_tests'),
                               ('src/core/context.rs', 'context_candidate_pool_tests'),
                               ('src/cli/mod.rs', 'candidate_pool_tests')]:
              file = pathlib.Path(path)
              file.write_text(file.read_text() + f'\n#[cfg(test)]\n#[path = "{module}.rs"]\nmod {module};\n')
          postimages = {
              'src/cli/mod.rs': 'ad760829d698403845a86a457f8c1667b05b56be',
              'src/config/file.rs': 'a8a1e1eb4c7bd9fc961a57540e6629775a16eaa0',
              'src/core/config_surface.rs': '957ff09497669d0892eda158ebc74d15df3adb80',
              'src/core/context.rs': '51421a2338d956f61adeb637fc7639d5381a9b31',
          }
          for path, sha in postimages.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate-pool'
          output.mkdir()
          (output / 'source-before.json').write_text(json.dumps(expected, indent=2))
          (output / 'source-sha.txt').write_text(os.environ['GITHUB_SHA'] + '\n')
          (output / 'paths.json').write_text(json.dumps(sorted(expected)))
          PY
      - name: Format and syntax-check the changed Rust sources
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true src/config/file.rs src/core/config_surface.rs src/core/context.rs src/cli/mod.rs src/cli/candidate_pool_tests.rs src/core/config_candidate_pool_tests.rs src/core/context_candidate_pool_tests.rs
          rustfmt --check --edition 2024 --config skip_children=true src/config/file.rs src/core/config_surface.rs src/core/context.rs src/cli/mod.rs src/cli/candidate_pool_tests.rs src/core/config_candidate_pool_tests.rs src/core/context_candidate_pool_tests.rs
          python3 -m py_compile tests/pack_candidate_pool_cli.py
          git diff --check
          git diff --binary > "$RUNNER_TEMP/candidate-pool/prepared.patch"
          git diff --stat > "$RUNNER_TEMP/candidate-pool/diff-stat.txt"
      - name: Export source objects without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request, zipfile
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate-pool'
          paths = json.loads((output / 'paths.json').read_text())
          before = json.loads((output / 'source-before.json').read_text())
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed).issubset(paths), changed
          objects = {}
          with zipfile.ZipFile(output / 'prepared-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in paths:
                  data = pathlib.Path(path).read_bytes()
                  expected = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
                  request = urllib.request.Request(
                      'https://api.github.com/repos/Dicklesworthstone/eidetic_engine_cli/git/blobs',
                      data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                               'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                      method='POST')
                  with urllib.request.urlopen(request, timeout=90) as response:
                      result = json.load(response)
                  assert result['sha'] == expected, path
                  objects[path] = {'before': before[path], 'after': expected}
                  archive.writestr(path, data)
          (output / 'source-blobs.json').write_text(json.dumps(objects, indent=2) + '\n')
          print(json.dumps(objects, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-pool-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-pool/
          retention-days: 7
          if-no-files-found: error
