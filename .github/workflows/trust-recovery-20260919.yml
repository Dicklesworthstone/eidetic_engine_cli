name: Trust recovery publication
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/trust-recovery-20260919/**
      - src/core/backup_signal_recovery*.rs
      - src/core/backup_publication_recovery*.rs
      - .github/workflows/trust-recovery-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trust-recovery-publication
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. RUSTUP_TOOLCHAIN overrides the
      # action's install AT INVOCATION TIME, so pinning only the action installs
      # components onto the dated toolchain and then runs a bare rustfmt/cargo on
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            evidence-export-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Complete reference recovery and test final publication admission
        run: |
          set -euo pipefail
          grep -Fq 'evidence_export::redact_evidence(self, level, provenance_admitted)' src/core/backup.rs
          python3 scripts/delivery/trust-recovery-20260919/apply.py
          paths=(src/core/backup.rs src/core/backup_history_recovery.rs src/core/backup_trust_recovery.rs src/core/backup_trust_recovery_tests.rs src/core/backup_reference_recovery_tests.rs src/core/backup_signal_recovery.rs src/core/backup_signal_recovery_tests.rs src/core/backup_publication_recovery.rs src/core/backup_publication_recovery_tests.rs)
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          git diff --check
          for family in trust signals; do
            status=0
            expected=8
            if test "$family" = trust; then expected=11; fi
            cargo test --locked --lib "core::backup::recovery::history::$family::tests" -- --test-threads=2 > "$RUNNER_TEMP/trust-$family.log" 2>&1 || status=$?
            tail -n 120 "$RUNNER_TEMP/trust-$family.log"
            test "$status" -eq 0
            grep -Fq "test result: ok. $expected passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/trust-$family.log"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "${paths[@]}"; then
            base=$(git rev-parse HEAD)
            git add -- "${paths[@]}"
            git commit -m 'fix(backup): preserve restored authority through the final publication boundary' -m 'Recheck exact admitted learned, pack, evidence, trust and outcome history in a read-only snapshot after derived index rebuilding. Legitimate job/generation changes do not bypass or falsely trip the durable-content check. Preserve opaque external reference identities across backup generations. All 19 focused trust, post-rebuild corruption, learning-signal and reference regressions passed before this source commit.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch --deepen=100 origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/trust-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/trust-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: trust-recovery-source-and-tests
          path: ${{ runner.temp }}/trust-*
          retention-days: 7
      - name: Verify recovery composition and production lint
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          # bd-aav0v + bd-lagsa, two defects in one step.
          #
          # (1) SEVEN ARMS SHARED ONE `failed` WITH NO ATTRIBUTION -- five run_group calls
          #     plus a cargo check and a cargo clippy -- so a red step named no arm. Worse,
          #     run_group collapsed TWO DISTINGUISHABLE CAUSES into one flag: `status -ne 0`
          #     (the tool failed) and a missing summary line (the assertion failed) set the
          #     same value, so the log could not say which. Each arm now prints itself on
          #     both paths and reports cargo's exit separately from the count verdict.
          #
          # (2) THE COUNTS WERE EXACT AND AT LEAST TWO HAVE DRIFTED. This step last reached
          #     a conclusive verdict on 2026-09-19 (success); every run since is `cancelled`
          #     by the concurrency group, so the drift has never been reported. Resolving
          #     each filter through its #[path] and `mod` declarations puts
          #     `core::backup::recovery::` far above 50 and
          #     `core::backup::evidence_export::tests` above 6.
          #
          #     I am NOT re-pinning to a measured number. A transitive module walk is not
          #     cargo's own test selection -- a substring filter matches whatever module
          #     path it matches, and my walk may over-include -- so a new exact pin would
          #     just be a fresh guess with the same failure mode. FLOORS are correct
          #     regardless: a floor of the reviewed value passes whether the truth is the
          #     old number or a larger one, and still catches removal. The observed count
          #     prints on both paths so real drift stays visible instead of hiding inside a
          #     passing grep.
          run_group() {
            local name="$1" filter="$2" floor="$3" status=0 ran=""
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/trust-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/trust-$name.log"
            ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/trust-$name.log" | head -1)
            if test "$status" -ne 0; then
              echo "ATTRIBUTION: arm '$name' FAILED -- cargo exit $status (tool failure, not an assertion)"
              failed=1
            elif test -z "$ran" || test "$ran" -lt "$floor"; then
              echo "ATTRIBUTION: arm '$name' FAILED -- passing-with-zero-failures count '${ran:-none}', required floor $floor"
              failed=1
            else
              echo "ATTRIBUTION: arm '$name' ok -- $ran tests ran, floor $floor"
            fi
          }
          run_group inventory core::backup::recovery:: 50
          run_group learning core::backup::history_recovery_tests 6
          run_group projection core::backup::evidence_export::tests 6
          run_group live-trust default_backup_restores_trust_history_and_live_consumers 1
          run_group live-signals default_backup_restores_learning_signals_and_live_review 1
          check_exit=0
          cargo check --locked --all-targets > "$RUNNER_TEMP/trust-check.log" 2>&1 || check_exit=$?
          tail -n 80 "$RUNNER_TEMP/trust-check.log"
          if test "$check_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo check --all-targets' FAILED -- cargo exit $check_exit"
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo check --all-targets' ok"
          fi
          clippy_exit=0
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/trust-clippy.log" 2>&1 || clippy_exit=$?
          tail -n 80 "$RUNNER_TEMP/trust-clippy.log"
          if test "$clippy_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' FAILED -- cargo exit $clippy_exit"
            failed=1
          else
            echo "ATTRIBUTION: arm 'cargo clippy --lib -D warnings' ok"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: trust-recovery-verification
          path: ${{ runner.temp }}/trust-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
