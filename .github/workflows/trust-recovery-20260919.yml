name: Trust recovery publication
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/trust-recovery-20260919/**
      - .github/workflows/trust-recovery-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trust-recovery-publication
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            evidence-export-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate and test the trust publication fence
        run: |
          set -euo pipefail
          grep -Fq 'evidence_export::redact_evidence(self, level, provenance_admitted)' src/core/backup.rs
          python3 scripts/delivery/trust-recovery-20260919/apply.py
          paths=(src/core/backup.rs src/core/backup_history_recovery.rs src/core/backup_trust_recovery.rs src/core/backup_trust_recovery_tests.rs src/core/backup_reference_recovery_tests.rs)
          rustfmt --edition 2024 --config skip_children=true "${paths[@]}"
          git diff --check
          status=0
          cargo test --locked --lib core::backup::recovery::history::trust::tests -- --test-threads=2 > "$RUNNER_TEMP/trust-focused.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/trust-focused.log"
          test "$status" -eq 0
          grep -Fq 'test result: ok. 8 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/trust-focused.log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "${paths[@]}"; then
            base=$(git rev-parse HEAD)
            git add -- "${paths[@]}"
            git commit -m 'fix(backup): preserve quarantine, seal and certificate authority on restore' -m 'Bind the admitted trust history to actual typed rows in the existing unpublished read snapshot. Reject same-count quarantine release or expiry changes, fabricated reveals and certificate verification, substituted commitments, and agent reattribution. Include every inactive historical decision, preserve redacted identities across two recovery generations, and keep the source store unchanged. All eight real trust and reference regressions passed before publication. Preserve opaque external reference identity across backup generations.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch --deepen=100 origin main
              git diff --exit-code "$base" origin/main -- "${paths[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/trust-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/trust-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: trust-recovery-source-and-tests
          path: ${{ runner.temp }}/trust-*
          retention-days: 7
      - name: Verify recovery composition and production lint
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          failed=0
          run_group() {
            local name="$1" filter="$2" count="$3" status=0
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/trust-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/trust-$name.log"
            if test "$status" -ne 0 || ! grep -Fq "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/trust-$name.log"; then failed=1; fi
          }
          run_group inventory core::backup::recovery:: 39
          run_group learning core::backup::history_recovery_tests 6
          run_group projection core::backup::evidence_export::tests 6
          run_group live default_backup_restores_trust_history_and_live_consumers 1
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/trust-clippy.log" 2>&1 || failed=1
          tail -n 80 "$RUNNER_TEMP/trust-clippy.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: trust-recovery-verification
          path: ${{ runner.temp }}/trust-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: trust-recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
