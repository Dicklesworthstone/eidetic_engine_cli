name: Path-specific native rule answers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ask-paths-20260918.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ask-paths-delivery
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Integrate reviewed path applicability without losing concurrent work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          git fetch origin main
          git merge --ff-only origin/main
          test "$(git hash-object scripts/delivery/ask-path-scope.patch)" = 02a729e8b48e264291ca4c68416b0bd29ca0b17c
          if ! grep -q 'pub fn load_ask_corpus_for_paths(' src/core/ask_corpus.rs; then
            git apply --check --recount scripts/delivery/ask-path-scope.patch
            git apply --recount scripts/delivery/ask-path-scope.patch
          fi
          grep -q 'pub paths: Vec<String>' src/cli/mod.rs
          grep -q 'load_ask_corpus_for_paths(' src/cli/mod.rs
          grep -q 'fn rule_matches_targets(' src/core/ask_corpus.rs
          grep -q 'fn public_path_rules_select_only_matching_native_sources_without_writes' tests/contracts/ask_native.rs
          rustfmt --edition 2024 --config skip_children=true src/cli/mod.rs src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs tests/contracts/ask_native.rs
          git diff --check
          git diff --stat
          git diff > "$RUNNER_TEMP/ask-paths-integration.patch"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-paths-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-paths-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            ask-semantic-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            ask-evidence-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Compile production library and CLI
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --lib --bin ee 2>&1 | tee "$RUNNER_TEMP/ask-paths-check.log"
      - name: Verify real-store path applicability and snapshot isolation
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --lib core::ask::corpus::native_tests::path_rules_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ask-paths-core.log"
          grep -Eq 'test result: ok\. 6 passed; 0 failed' "$RUNNER_TEMP/ask-paths-core.log"
      - name: Verify public path answers, lifecycle and read-only contracts
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --test contracts public_path_rules_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ask-paths-cli.log"
          grep -Eq 'test result: ok\. 3 passed; 0 failed' "$RUNNER_TEMP/ask-paths-cli.log"
      - name: Commit verified integration directly to main
        shell: bash
        run: |
          set -euo pipefail
          files=(src/cli/mod.rs src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs tests/contracts/ask_native.rs docs/adr/0067-extractive-ask.md)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ask): answer from matching directory and file-scoped native rules' -m 'Complete the pending path-scoping implementation: repeatable literal --path selectors, existing portable path safety and recall matching, source-of-truth rule scope revisions, unchanged authority and citation integrity. No target contents, index writes or scope widening. Production library/CLI compilation, six real-store path tests and three public CLI contracts passed before this commit.'
            published=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then published=true; break; fi
              git fetch origin main
              git merge --no-edit origin/main
            done
            test "$published" = true
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/ask-paths-source.log"
      - name: Run broader ask regressions without hiding existing failures
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --lib core::ask:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ask-paths-engine.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: path-specific-ask-verification
          path: |
            ${{ runner.temp }}/ask-paths-*.log
            ${{ runner.temp }}/ask-paths-*.patch
          retention-days: 7
