name: Path-specific native rule answers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ask-paths-20260918.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ask-paths-delivery
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Integrate compiled path applicability and canonical error contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          git fetch origin main
          git merge --ff-only origin/main
          test "$(git hash-object scripts/delivery/ask-path-scope.patch)" = 02a729e8b48e264291ca4c68416b0bd29ca0b17c
          if ! grep -q 'pub fn load_ask_corpus_for_paths(' src/core/ask_corpus.rs; then
            git apply --check --recount scripts/delivery/ask-path-scope.patch
            git apply --recount scripts/delivery/ask-path-scope.patch
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('tests/contracts/ask_native.rs')
          text = path.read_text()
          pattern = re.compile(r'^fn public_path_rules_reject_unsafe_targets_before_optional_auditing\(\).*?^\}', re.M | re.S)
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit('Expected one unsafe-target contract; refusing ambiguous edit')
          match = matches[0]
          body = match.group()
          old = 'assert_eq!(output.status.code(), Some(2));'
          new = 'assert_eq!(output.status.code(), Some(ee::models::ProcessExitCode::Usage as i32));'
          if body.count(old) == 1:
              body = body.replace(old, new, 1)
          elif 'ee::models::ProcessExitCode::Usage as i32' not in body:
              raise SystemExit('Unsafe-target exit-code assertion changed; review required')
          for anchor in ['"ee.error.v2"', '"usage"', 'private-canary', 'std::fs::read(&database)']:
              if anchor not in body:
                  raise SystemExit('Required error/privacy/no-write assertion missing')
          path.write_text(text[:match.start()] + body + text[match.end():])
          PY
          grep -q 'pub paths: Vec<String>' src/cli/mod.rs
          grep -q 'load_ask_corpus_for_paths(' src/cli/mod.rs
          grep -q 'fn rule_matches_targets(' src/core/ask_corpus.rs
          rustfmt --edition 2024 --config skip_children=true src/cli/mod.rs src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs tests/contracts/ask_native.rs
          git diff --check
          git diff --stat
          git diff > "$RUNNER_TEMP/ask-paths-integration.patch"
      - name: Commit path-specific native rule feature directly to main
        shell: bash
        run: |
          set -euo pipefail
          files=(src/cli/mod.rs src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs tests/contracts/ask_native.rs docs/adr/0067-extractive-ask.md)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ask): answer from matching directory and file-scoped native rules' -m 'Complete path-scoping through repeatable literal --path selectors, portable path safety, existing recall matching and snapshot-pinned native revisions. Keep authority, citation integrity and read-only behavior. The preceding run compiled production and passed six real-store path tests and two public answer contracts. Correct the remaining usage-error assertion to the canonical Usage enum; the complete current-tree rerun follows this commit, not claimed here.'
            published=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then published=true; break; fi
              git fetch origin main
              git merge --no-edit origin/main
            done
            test "$published" = true
          fi
          git rev-parse HEAD | tee "$RUNNER_TEMP/ask-paths-source.log"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-paths-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-paths-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            ask-semantic-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
            ask-evidence-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Compile current production library and CLI
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --lib --bin ee 2>&1 | tee "$RUNNER_TEMP/ask-paths-check.log"
      - name: Verify real-store path applicability and snapshot isolation
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --lib core::ask::corpus::native_tests::path_rules_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ask-paths-core.log"
          grep -Eq 'test result: ok\. 6 passed; 0 failed' "$RUNNER_TEMP/ask-paths-core.log"
      - name: Verify public path answers, canonical errors and read-only contracts
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --test contracts public_path_rules_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ask-paths-cli.log"
          grep -Eq 'test result: ok\. 3 passed; 0 failed' "$RUNNER_TEMP/ask-paths-cli.log"
      - name: Run complete ask regressions including linked parent revocation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --lib core::ask:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ask-paths-engine.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: path-specific-ask-verification
          path: |
            ${{ runner.temp }}/ask-paths-*.log
            ${{ runner.temp }}/ask-paths-*.patch
          retention-days: 7
