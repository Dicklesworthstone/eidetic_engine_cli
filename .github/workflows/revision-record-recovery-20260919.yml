name: Revision and memory graph recovery
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/revision-record-recovery-20260919/**
      - .github/workflows/revision-record-recovery-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revision-record-recovery-delivery
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. This overrides the action's install
      # AT INVOCATION TIME, so a bare rustfmt/cargo later in this job resolves
      # through it, not through the `toolchain:` input below. Pinning one half
      # only installs components onto the dated toolchain and then invokes
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Apply reviewed revision and record recovery implementation
        run: |
          set -euo pipefail
          # IDEMPOTENCY GUARD (bd-delivery-lanes-stuck-publish-to-main-hpgw8).
          #
          # This step ran its blob pins, decode and `git apply` UNCONDITIONALLY, so it was
          # guaranteed to fail once the delivery landed: the pins describe the PRE-delivery
          # tree and `git apply` refuses a patch that is already applied. Red since 2026-09-20
          # by construction.
          #
          # The delivery IS integrated, verified against the patch's OWN target files rather
          # than inferred from this lane's output:
          #   src/db/mod.rs                 pub(crate) fn list_memory_supersession_markers(
          #   src/models/jsonl.rs           pub fn superseded_at(
          #   src/core/jsonl_revisions.rs   fn invalid(reason: ...) -> JsonlImportIssue
          #   src/core/jsonl_recovery.rs    fn mismatch(reason: ...) -> DomainError
          #   src/core/backup.rs            fn restore_backup_to_side_path_with_verification_...
          # all five present, and all four files the patch creates exist.
          #
          # The pins stay INSIDE the guard rather than being deleted or re-pinned: on the
          # not-yet-delivered path they are the "it is safe to patch this exact tree"
          # precondition and still do real work. Re-pinning them to today's blobs would only
          # reset the clock, which is the trap this whole bead is about.
          if ! grep -Fq 'pub(crate) fn list_memory_supersession_markers(' src/db/mod.rs; then
            test "$(git rev-parse HEAD:src/core/backup.rs)" = 6042eeebcbcd349934062cba54ab05b131b2106c
            test "$(git rev-parse HEAD:src/core/jsonl_import.rs)" = e6caf20b1a9a317030ad9729cbef10dd09e7bb3c
            test "$(git rev-parse HEAD:src/db/mod.rs)" = ce7658a6bfad8b8818c2751de348df1b028d0ca5
            test "$(git rev-parse HEAD:src/models/jsonl.rs)" = 53ee00f5e3160eb655de23de1504f3eddf810b61
            test "$(git rev-parse HEAD:src/output/jsonl_export.rs)" = d42b0036b3f92f010d18ebfbf6bde3a40e6093a1
            cat scripts/delivery/revision-record-recovery-20260919/{0,1,2,3,4,5,6}.xz.b64 | base64 --decode | xz --decompress > "$RUNNER_TEMP/revision.patch"
            echo "6a19cd85a1254fff2faed3bd27ef8004e2bf028f25fe5caf1abc44ad5fe88aff  $RUNNER_TEMP/revision.patch" | sha256sum --check
            git apply --check "$RUNNER_TEMP/revision.patch"
            git apply "$RUNNER_TEMP/revision.patch"
          else
            echo 'revision and record recovery already integrated; skipping delivery'
          fi
          rustfmt --edition 2024 --config skip_children=true src/core/backup.rs src/core/backup_revision_recovery_tests.rs src/core/jsonl_import.rs src/core/jsonl_recovery.rs src/core/jsonl_revisions.rs src/db/mod.rs src/models/jsonl.rs src/output/jsonl_export.rs
          git diff --check
      - name: Commit functional source directly to main
        run: |
          set -euo pipefail
          paths=(src/core/backup.rs src/core/backup_revision_recovery_tests.rs src/core/jsonl_import.rs src/core/jsonl_recovery.rs src/core/jsonl_revisions.rs src/db/mod.rs src/models/jsonl.rs src/output/jsonl_export.rs)
          base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          # NOTHING-TO-COMMIT GUARD, the second half of this lane's idempotency.
          #
          # An unconditional delivery lane has TWO unconditional steps, apply and commit, and
          # guarding only the apply converts "fails before verifying" into "verifies, then
          # fails to commit nothing" -- measured on the sibling lane
          # verify-ask-admission-20260917 at run 37513255753, which failed here with
          # "nothing to commit, working tree clean". Both are guarded in this one change so
          # that lesson does not have to be relearned per lane.
          if git diff --cached --quiet; then
            echo 'delivery already integrated and verified; nothing to commit or push'
            exit 0
          fi
          git commit -m 'fix(recovery): preserve revision headship and verify restored memory graph' -m 'Export actual superseded_at independently of author expiry; restore explicit revision markers and validated successor-only archives without resurrecting history. Reject cyclic, dangling, cross-family and contradictory revision references before writes. Redact revision references consistently. Before publication, read the staged memory graph in one snapshot and compare identities, body and scoring/trust fields, chronology, tags, Bayesian evidence, family metadata and links against the admitted archive projection. Add 13 focused regressions and two real create/restore/index and late-corruption scenarios. Formatting and patch application passed; compilation and runtime evidence are reported separately.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 3
            git fetch origin main
            git diff --exit-code "$base" origin/main -- "${paths[@]}"
            git merge --no-edit origin/main
            base=$(git rev-parse origin/main)
          done
          git rev-parse HEAD > "$RUNNER_TEMP/revision-source-sha.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/revision-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: revision-recovery-source
          path: |
            ${{ runner.temp }}/revision-source-sha.log
            ${{ runner.temp }}/revision-source.tar.gz
          retention-days: 7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Resolve pinned Franken stack build paths
        run: |
          set -euo pipefail
          ./scripts/checkout-franken-stack.sh "$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml
          git diff -- Cargo.toml > "$RUNNER_TEMP/revision-build-paths.patch"
          rustc --version --verbose > "$RUNNER_TEMP/revision-toolchain.log"
      - name: Check the production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/revision-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/revision-check.log"
          exit "$status"
      - name: Execute recovery and revision regressions
        run: |
          set -uo pipefail
          failed=0
          # FLOOR, NOT AN EXACT COUNT, plus an ATTRIBUTION line.
          #
          # This helper grepped for the literal "ok. $expected passed; 0 failed;", so it redded
          # whenever a family GREW. Measured 2026-10-06 once the delivery guard let these steps
          # run for the first time since 2026-09-20 -- every test passed and two groups had
          # grown:
          #     records     expected 13   actual 13   ok
          #     inventory   expected 14   actual 15   FAILED on the exact match
          #     publication expected  2   actual  4   FAILED on the exact match
          #     existing    expected  1   actual  1   ok
          # That is bd-qz6dh's retired tripwire: an assertion that reds when someone ADDS a
          # passing test. A floor keeps what matters -- the group ran, nothing failed, and
          # coverage has not shrunk -- and stops punishing growth.
          #
          # The extraction only matches a "0 failed" result line, so a FAILED run yields an
          # empty value and the guard fails closed rather than silently passing.
          #
          # The ATTRIBUTION line addresses bd-workflow-shared-exit-flag-aav0v: four groups share
          # one `failed` flag, so without it a red step names no arm and the reader has to count
          # tests by hand to find which group fired. I had to do exactly that to write this.
          run_group() {
            local name="$1" filter="$2" expected="$3" status=0 actual=""
            cargo test --locked --lib "$filter" -- --test-threads=2 > "$RUNNER_TEMP/revision-$name.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/revision-$name.log"
            actual=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed;.*/\1/p' "$RUNNER_TEMP/revision-$name.log" | head -1)
            if test "$status" -ne 0 || test -z "$actual" || test "$actual" -lt "$expected"; then
              echo "ATTRIBUTION: group '$name' FAILED -- cargo exit $status, passing-with-zero-failures count '${actual:-none}', required floor $expected"
              failed=1
            fi
          }
          run_group records 'core::jsonl_import::recovery::tests::' 13
          run_group inventory 'core::backup::recovery::tests::' 14
          run_group publication 'backup_revision_recovery_' 2
          run_group existing 'core::backup::tests::restore_backup_to_side_path_imports_memories' 1
          exit "$failed"
      - name: Check production Clippy
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/revision-clippy.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/revision-clippy.log"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: revision-recovery-verification
          path: |
            ${{ runner.temp }}/revision-*.log
            ${{ runner.temp }}/revision-*.patch
          retention-days: 7
