name: Ask admission verification

# Scoped CLI integration is committed at 1cbb1ef6148286050103bc18d052004ea07af5fe.
# This workflow never writes source or moves refs. Run it manually to verify
# the selected source revision; its conclusion is not a full-suite proof.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Exact source and formatting
        run: |
          git rev-parse HEAD
          git status --porcelain
          rustfmt --check --edition 2024 --config skip_children=true src/core/ask.rs src/core/ask_corpus.rs src/core/ask_admission.rs src/core/ask_privacy_tests.rs src/core/ask_scope_tests.rs src/cli/mod.rs tests/contracts/ask_lifecycle.rs tests/contracts/ask_scope.rs
      - name: Compile production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/ask-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/ask-check.log"
          exit "$status"
      - name: Execute all ask engine and real-store regressions
        run: |
          status=0
          cargo test --locked --lib core::ask:: -- --nocapture > "$RUNNER_TEMP/ask-core.log" 2>&1 || status=$?
          tail -n 160 "$RUNNER_TEMP/ask-core.log"
          exit "$status"
      - name: Execute public CLI lifecycle, scope and privacy contracts
        run: |
          status=0
          cargo test --locked --test contracts ask_lifecycle -- --nocapture > "$RUNNER_TEMP/ask-cli.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/ask-cli.log"
          exit "$status"
