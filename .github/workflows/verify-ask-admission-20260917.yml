name: Ask admission verification

# Manual read-only verification only: no source delivery, ref updates, or
# automatic source exports. Each job reports results for its checked-out SHA.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Exact source and Rust parsing
        run: |
          git rev-parse HEAD
          git status --porcelain
          rustfmt --edition 2024 --config skip_children=true --emit stdout src/core/ask_admission.rs src/core/ask_privacy_tests.rs tests/contracts/ask_scope.rs > /dev/null
          rustfmt --check --edition 2024 --config skip_children=true src/cli/mod.rs src/core/effect.rs tests/contracts/ask_read_only.rs
      - name: Compile production library
        run: cargo check --locked --lib
      - name: Execute public lifecycle, scope, privacy and read-only contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked --test contracts ask_lifecycle -- --nocapture
      - name: Execute ordinary ask audit regression
        if: ${{ !cancelled() }}
        run: cargo test --locked --test contracts ee_ask_writes_returned_mem_rows_for_cited_memories -- --nocapture
      - name: Execute all ask engine and real-store regressions
        if: ${{ !cancelled() }}
        run: cargo test --locked --lib core::ask:: -- --nocapture
      - name: Check normalized command effect coverage
        if: ${{ !cancelled() }}
        run: cargo test --locked --test integration_e_f effect_contracts::effect_manifest_covers_all_normalized_cli_command_paths -- --nocapture
