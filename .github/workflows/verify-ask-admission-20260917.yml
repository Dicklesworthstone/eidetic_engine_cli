name: Path-scoped native answers

on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/ask-path-scope.patch
      - scripts/delivery/ask-native-fixture-hashes.patch
      - .github/workflows/verify-ask-admission-20260917.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. This overrides the action's install
      # AT INVOCATION TIME, so a bare rustfmt/cargo later in this job resolves
      # through it, not through the `toolchain:` input below. Pinning one half
      # only installs components onto the dated toolchain and then invokes
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Apply path-scoped answers and canonical native evidence fixtures
        run: |
          set -euo pipefail
          git rev-parse HEAD
          echo '6dd7c524de98fdc914328a05fe89c8e10f2352848f75d4f55ca3078871e3864e  scripts/delivery/ask-path-scope.patch' | sha256sum --check
          echo 'adca0a8687d4f21be8c31720b4bc4d3750285e02a5726c09e367fb1a12178d04  scripts/delivery/ask-native-fixture-hashes.patch' | sha256sum --check
          git apply --check scripts/delivery/ask-path-scope.patch
          git apply --check scripts/delivery/ask-native-fixture-hashes.patch
          git apply scripts/delivery/ask-path-scope.patch
          git apply scripts/delivery/ask-native-fixture-hashes.patch
          rustfmt --edition 2024 --config skip_children=true src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs src/core/ask_evidence_tests.rs src/cli/mod.rs tests/contracts/ask_native.rs
          git diff --check
          git diff --stat
      - name: Compile production library
        id: compile
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/ask-path-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/ask-path-check.log"
          exit "$status"
      - name: Execute all ask engine and real-store regressions
        run: |
          status=0
          cargo test --locked --lib core::ask:: -- --test-threads=2 > "$RUNNER_TEMP/ask-path-engine.log" 2>&1 || status=$?
          tail -n 260 "$RUNNER_TEMP/ask-path-engine.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/ask-path-engine.log" || status=1
          test "$(grep -c '^test core::ask::corpus::native_tests::path_rules_.* \.\.\. ok$' "$RUNNER_TEMP/ask-path-engine.log")" -eq 6 || status=1
          test "$(grep -c '^test core::ask::corpus::evidence_tests::.* \.\.\. ok$' "$RUNNER_TEMP/ask-path-engine.log")" -eq 10 || status=1
          exit "$status"
      - name: Execute public path, lifecycle, scope, privacy and read-only contracts
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          status=0
          cargo test --locked --test contracts ask_lifecycle -- --test-threads=2 > "$RUNNER_TEMP/ask-path-cli.log" 2>&1 || status=$?
          tail -n 200 "$RUNNER_TEMP/ask-path-cli.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/ask-path-cli.log" || status=1
          test "$(grep -c '^test .*ask_lifecycle::native::public_path_rules_.* \.\.\. ok$' "$RUNNER_TEMP/ask-path-cli.log")" -eq 3 || status=1
          exit "$status"
      - name: Commit compiled and tested path-scoped answers directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs src/core/ask_evidence_tests.rs src/cli/mod.rs tests/contracts/ask_native.rs docs/adr/0067-extractive-ask.md
          git commit -m 'feat(ask): answer from directory and file rules for explicit task paths' -m 'Add repeatable --path selectors through the public CLI and live corpus. Reuse rule-path normalization and recall matching; preserve memory scope, native identity, exact citation bytes and lifecycle checks. Reject unsafe targets without path disclosure. Six real-store and three public CLI tests cover matching, authorization, concurrent scope updates and nonmutation. Correct existing curation fixtures to invoke real validation and transcript fixtures to use the mandatory blake3 hash prefix without relaxing production integrity. Production compilation, the complete ask engine and all public lifecycle regressions passed before commit.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              git rev-parse HEAD > "$RUNNER_TEMP/ask-path-commit.log"
              exit 0
            fi
            test "$attempt" -lt 3
            tested=$(git rev-parse HEAD)
            git fetch origin main
            git merge --no-edit origin/main
            git diff --exit-code "$tested" HEAD -- src tests Cargo.toml Cargo.lock build.rs
          done
          exit 1
      - name: Preserve exact source and test results
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/ask-path-source-sha.log"
          git diff -- src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs src/core/ask_evidence_tests.rs src/cli/mod.rs tests/contracts/ask_native.rs docs/adr/0067-extractive-ask.md > "$RUNNER_TEMP/ask-path-uncommitted.patch"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ask-path-source.tar.gz" HEAD
          for file in ask.rs ask_corpus.rs ask_native_tests.rs ask_evidence_tests.rs; do cp "src/core/$file" "$RUNNER_TEMP/ask-path-$file"; done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: path-scoped-ask-verification
          path: |
            ${{ runner.temp }}/ask-path-*.log
            ${{ runner.temp }}/ask-path-*.patch
            ${{ runner.temp }}/ask-path-*.rs
            ${{ runner.temp }}/ask-path-source.tar.gz
          retention-days: 7
