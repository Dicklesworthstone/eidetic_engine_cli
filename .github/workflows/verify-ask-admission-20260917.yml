name: Native rule answer acceptance

on:
  push:
    branches: [main]
    paths:
      - 'tests/contracts/ask_native.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Record source and parse the new acceptance tests
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/ask-native-source.log"
          git status --porcelain
          rustfmt --edition 2024 --config skip_children=true --emit stdout tests/contracts/ask_native.rs > /dev/null
          git diff --exit-code
      - name: Execute rule creation, curation, retirement, conflict and existing ask contracts
        run: |
          status=0
          cargo test --locked --test contracts ask_lifecycle -- --nocapture > "$RUNNER_TEMP/ask-native-cli.log" 2>&1 || status=$?
          tail -n 160 "$RUNNER_TEMP/ask-native-cli.log"
          exit "$status"
      - name: Verify the existing memory retrieval audit contract
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo test --locked --test contracts ee_ask_writes_returned_mem_rows_for_cited_memories -- --nocapture > "$RUNNER_TEMP/ask-native-audit.log" 2>&1 || status=$?
          tail -n 80 "$RUNNER_TEMP/ask-native-audit.log"
          exit "$status"
      - name: Preserve actual acceptance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-rule-cli-acceptance
          path: ${{ runner.temp }}/ask-native-*.log
          retention-days: 7
