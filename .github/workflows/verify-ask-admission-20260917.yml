name: Read-only ask acceptance

# Read-only acceptance of the immutable-store feature. Production compilation,
# 124 engine tests, ordinary audit and effect coverage also passed in run
# 35293588723; these checks complete its three incorrect error-envelope assertions.
on:
  push:
    branches: [main]
    paths:
      - 'tests/contracts/ask_read_only.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Verify exact source and test formatting
        run: |
          git rev-parse HEAD
          git status --porcelain
          rustfmt --check --edition 2024 --config skip_children=true tests/contracts/ask_read_only.rs
      - name: Execute public ask acceptance including nonmutation on errors
        run: |
          status=0
          cargo test --locked --test contracts ask_lifecycle -- --nocapture > "$RUNNER_TEMP/ask-read-only-cli.log" 2>&1 || status=$?
          tail -n 140 "$RUNNER_TEMP/ask-read-only-cli.log"
          exit "$status"
      - name: Verify ordinary cited retrieval auditing
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo test --locked --test contracts ee_ask_writes_returned_mem_rows_for_cited_memories -- --nocapture > "$RUNNER_TEMP/ask-read-only-audit.log" 2>&1 || status=$?
          tail -n 70 "$RUNNER_TEMP/ask-read-only-audit.log"
          exit "$status"
      - name: Preserve acceptance logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ask-read-only-acceptance
          path: ${{ runner.temp }}/ask-read-only-*.log
          retention-days: 7
