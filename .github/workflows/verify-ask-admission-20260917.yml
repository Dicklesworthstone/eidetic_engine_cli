name: Path-scoped native answers

on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/ask-path-scope.patch
      - scripts/delivery/ask-native-fixture-hashes.patch
      - .github/workflows/verify-ask-admission-20260917.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      # bd-niay4. PIN BOTH HALVES OR NEITHER. This overrides the action's install
      # AT INVOCATION TIME, so a bare rustfmt/cargo later in this job resolves
      # through it, not through the `toolchain:` input below. Pinning one half
      # only installs components onto the dated toolchain and then invokes
      # floating nightly, which does not have them. That was d315cdc7f, repaired
      # at 021a033b8. Keep equal to rust-toolchain.toml's `channel`.
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-admission-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Apply path-scoped answers and canonical native evidence fixtures
        run: |
          set -euo pipefail
          git rev-parse HEAD
          echo '6dd7c524de98fdc914328a05fe89c8e10f2352848f75d4f55ca3078871e3864e  scripts/delivery/ask-path-scope.patch' | sha256sum --check
          echo 'adca0a8687d4f21be8c31720b4bc4d3750285e02a5726c09e367fb1a12178d04  scripts/delivery/ask-native-fixture-hashes.patch' | sha256sum --check
          # IDEMPOTENCY GUARDS, one per patch (bd-delivery-lanes-stuck-publish-to-main-hpgw8).
          #
          # This step applied both patches UNCONDITIONALLY, so it was guaranteed to fail the
          # moment it succeeded: the next run applies the same patch to a tree that already
          # contains it and `git apply` refuses. Both patches ARE delivered -- verified in the
          # tree, not inferred from the lane's own output:
          #   ask-path-scope          -> `pub fn load_ask_corpus_for_paths(` in src/core/ask_corpus.rs
          #   ask-native-fixture-hashes -> `blake3::hash(body.as_bytes()).to_hex()` in
          #                                src/core/ask_evidence_tests.rs
          # so this lane has been red by construction rather than by any drift.
          #
          # ONE GUARD PER PATCH, deliberately. The two patches deliver unrelated things -- a
          # path-scoped ask corpus and computed blake3 fixture hashes -- so a single shared
          # marker would skip a genuinely undelivered second patch the moment the first landed.
          # The sha256 checks above stay unconditional: they verify blob integrity, which is
          # worth doing whether or not the patch is applied.
          if ! grep -Fq 'pub fn load_ask_corpus_for_paths(' src/core/ask_corpus.rs; then
            git apply --check scripts/delivery/ask-path-scope.patch
            git apply scripts/delivery/ask-path-scope.patch
          else
            echo 'ask-path-scope already integrated; skipping its delivery'
          fi
          if ! grep -Fq 'blake3::hash(body.as_bytes()).to_hex()' src/core/ask_evidence_tests.rs; then
            git apply --check scripts/delivery/ask-native-fixture-hashes.patch
            git apply scripts/delivery/ask-native-fixture-hashes.patch
          else
            echo 'ask-native-fixture-hashes already integrated; skipping its delivery'
          fi
          rustfmt --edition 2024 --config skip_children=true src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs src/core/ask_evidence_tests.rs src/cli/mod.rs tests/contracts/ask_native.rs
          git diff --check
          git diff --stat
      - name: Compile production library
        id: compile
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/ask-path-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/ask-path-check.log"
          exit "$status"
      - name: Execute all ask engine and real-store regressions
        run: |
          status=0
          cargo test --locked --lib core::ask:: -- --test-threads=2 > "$RUNNER_TEMP/ask-path-engine.log" 2>&1 || status=$?
          tail -n 260 "$RUNNER_TEMP/ask-path-engine.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/ask-path-engine.log" || status=1
          # FLOORS, NOT EXACT COUNTS (bd-qz6dh's conclusion, applied here).
          #
          # These were `-eq 6` and `-eq 10`. The second one RED on 2026-10-06 while every test
          # passed: `test result: ok. 415 passed; 0 failed`, and the evidence_tests family had
          # grown from 10 to 12. So the step failed because someone ADDED two passing tests.
          #
          # bd-qz6dh retired exactly this shape with exactly this reasoning -- "an assertion
          # that reds when someone ADDS a passing test is a tripwire pointed the wrong way".
          # A floor keeps the protection that matters (the family executed and did not shrink
          # below its known coverage) and drops the part that punishes growth. Removal below
          # the floor is still caught.
          test "$(grep -c '^test core::ask::corpus::native_tests::path_rules_.* \.\.\. ok$' "$RUNNER_TEMP/ask-path-engine.log")" -ge 6 || status=1
          test "$(grep -c '^test core::ask::corpus::evidence_tests::.* \.\.\. ok$' "$RUNNER_TEMP/ask-path-engine.log")" -ge 10 || status=1
          exit "$status"
      - name: Execute public path, lifecycle, scope, privacy and read-only contracts
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          status=0
          cargo test --locked --test contracts ask_lifecycle -- --test-threads=2 > "$RUNNER_TEMP/ask-path-cli.log" 2>&1 || status=$?
          tail -n 200 "$RUNNER_TEMP/ask-path-cli.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/ask-path-cli.log" || status=1
          # Floor, not an exact count -- same reasoning as the two in the step above. This one
          # happens to match today (3), so it is latent rather than red; converting it now
          # means the next person to add a public path-rules test does not have to diagnose a
          # green suite reported as a failure.
          test "$(grep -c '^test .*ask_lifecycle::native::public_path_rules_.* \.\.\. ok$' "$RUNNER_TEMP/ask-path-cli.log")" -ge 3 || status=1
          exit "$status"
      - name: Commit compiled and tested path-scoped answers directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs src/core/ask_evidence_tests.rs src/cli/mod.rs tests/contracts/ask_native.rs docs/adr/0067-extractive-ask.md
          # NOTHING-TO-COMMIT GUARD, the second half of this lane's idempotency
          # (bd-delivery-lanes-stuck-publish-to-main-hpgw8).
          #
          # An unconditional delivery lane has TWO unconditional steps, not one: apply, and
          # commit. Guarding only the apply converted "fails before verifying" into "verifies,
          # then fails to commit nothing" -- measured, run 37513255753:
          #
          #   5-8. success   (guard + compile + all ask engine and public contract regressions)
          #     9. failure   nothing to commit, working tree clean   -> exit code 1
          #
          # When the delivery was already integrated the apply is skipped, so nothing is staged
          # and `git commit` exits nonzero under `set -euo pipefail`. Exit 0 instead: the lane's
          # job is to ensure the feature is on main and verified, and on this path both are
          # already true. A push with nothing to push is not a success condition worth faking,
          # which is why this returns early rather than inventing an empty commit.
          if git diff --cached --quiet; then
            echo 'delivery already integrated and verified; nothing to commit or push'
            exit 0
          fi
          git commit -m 'feat(ask): answer from directory and file rules for explicit task paths' -m 'Add repeatable --path selectors through the public CLI and live corpus. Reuse rule-path normalization and recall matching; preserve memory scope, native identity, exact citation bytes and lifecycle checks. Reject unsafe targets without path disclosure. Six real-store and three public CLI tests cover matching, authorization, concurrent scope updates and nonmutation. Correct existing curation fixtures to invoke real validation and transcript fixtures to use the mandatory blake3 hash prefix without relaxing production integrity. Production compilation, the complete ask engine and all public lifecycle regressions passed before commit.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              git rev-parse HEAD > "$RUNNER_TEMP/ask-path-commit.log"
              exit 0
            fi
            test "$attempt" -lt 3
            tested=$(git rev-parse HEAD)
            git fetch origin main
            git merge --no-edit origin/main
            git diff --exit-code "$tested" HEAD -- src tests Cargo.toml Cargo.lock build.rs
          done
          exit 1
      - name: Preserve exact source and test results
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/ask-path-source-sha.log"
          git diff -- src/core/ask.rs src/core/ask_corpus.rs src/core/ask_native_tests.rs src/core/ask_evidence_tests.rs src/cli/mod.rs tests/contracts/ask_native.rs docs/adr/0067-extractive-ask.md > "$RUNNER_TEMP/ask-path-uncommitted.patch"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ask-path-source.tar.gz" HEAD
          for file in ask.rs ask_corpus.rs ask_native_tests.rs ask_evidence_tests.rs; do cp "src/core/$file" "$RUNNER_TEMP/ask-path-$file"; done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: path-scoped-ask-verification
          path: |
            ${{ runner.temp }}/ask-path-*.log
            ${{ runner.temp }}/ask-path-*.patch
            ${{ runner.temp }}/ask-path-*.rs
            ${{ runner.temp }}/ask-path-source.tar.gz
          retention-days: 7
