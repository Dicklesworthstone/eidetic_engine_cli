name: Eval retrieval diagnostic implementation
on:
  push:
    branches: [main]
    paths: [.github/workflows/eval-retrieval-diagnostics-20260921.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eval-retrieval-diagnostics-20260921
  cancel-in-progress: true
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - name: Apply reviewed implementation and publish coherent source
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # IDEMPOTENCY GUARD (bd-delivery-lanes-stuck-publish-to-main-hpgw8, bd-aav0v).
          #
          # This step had NO guard at all: it rewrote hunk headers in its own patch, applied
          # it, and published, unconditionally. So it was guaranteed to fail the moment it
          # succeeded. Run 37579638854 is what that looks like -- twelve lines of
          # "patch does not apply" across all six target files, which reads as "the feature
          # is broken" when the truth is the opposite.
          #
          # THE FEATURE IS DELIVERED. Verified in the tree, not inferred from this lane's own
          # output -- every symbol the patch adds is present, in production AND in the
          # contracts, each exactly once:
          #   src/eval/runner.rs                    pub fn retrieval_degradations(
          #   src/eval/runner.rs                    pub fn compute_search_query_metrics(
          #   src/cli/mod.rs                        fn write_eval_retrieval_diagnostics<W: Write>(
          #   tests/contracts/eval_science.rs       fn eval_retrieval_run_preserves_real_...(
          #   tests/contracts/science_analytics.rs  assert_eval_retrieval_diagnostics(
          #
          # ALL-OR-NOTHING, NOT ANY. A partially delivered tree must still REFUSE: skipping on
          # the first marker would abandon the rest of a half-applied delivery. Present-but-
          # incomplete therefore falls through to the unconditional path below, where
          # `git apply --check` is the right thing to fail on.
          #
          # WHY exit 0 AND NOT exit 1. Operator decision 2026-10-07, following 4372cef4a: an
          # already-delivered lane succeeds rather than refusing. It is bounded here because
          # `integrate-and-verify` is ONE job -- exiting this step does not skip the later
          # steps, so the pinned-dependency resolve, the six diagnostic unit regressions, the
          # real-CLI contracts and the historical quality golden all still run against the
          # delivered source. "On main and verified" both hold on this path.
          #
          # THE GUARD COVERS THE WHOLE STEP, deliberately. Guarding only `git apply` would
          # move the failure three blocks down to the publish block's
          # `assert set(changed) in (set(paths), ...)`, which requires those six files to have
          # CHANGED and so fails on an empty diff. A guard that relocates a red instead of
          # resolving it is worse than no guard, because the next reader has to rediscover it.
          delivered=1
          for pin in \
            'src/eval/runner.rs|pub fn retrieval_degradations(' \
            'src/eval/runner.rs|pub fn compute_search_query_metrics(' \
            'src/cli/mod.rs|fn write_eval_retrieval_diagnostics<W: Write>(' \
            'tests/contracts/eval_science.rs|fn eval_retrieval_run_preserves_real_search_degradations_for_each_query(' \
            'tests/contracts/science_analytics.rs|assert_eval_retrieval_diagnostics(' \
          ; do
            pin_path=${pin%%|*}
            pin_text=${pin#*|}
            if ! grep -Fq "$pin_text" "$pin_path"; then
              echo "ATTRIBUTION: delivery marker ABSENT -- $pin_path does not contain '$pin_text', so this tree is not (or not fully) delivered and the patch below must run."
              delivered=0
            fi
          done
          if test "$delivered" -eq 1; then
            echo "ATTRIBUTION: delivery ALREADY PRESENT -- all five reviewed symbols are in the tree across src/eval/runner.rs, src/cli/mod.rs and both contract files, so there is nothing to apply or publish. Succeeding rather than refusing: the later steps in this job still run the six diagnostic regressions, the real-CLI contracts and the quality golden against the delivered source. Skipped: the patch header rewrite, the apply, and the publish."
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, pathlib
          path = pathlib.Path('scripts/delivery/eval-retrieval-diagnostics-20260921.patch')
          data = path.read_bytes()
          expected = '7cca07282172c2731e4d15380d80d6ac76862a48cf644d089ffca726cbcae4ca'
          if hashlib.sha256(data).hexdigest() != expected:
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert blob == '09f42566a1725d7a65ca9ae65d412df817162a81', 'Unknown payload; refuse'
              old = b'@@ -16583,7 +16584,7 @@\n                     "fixtureCount": reports.len()'
              new = b'@@ -16583,7 +16584,7 @@\n                     "reports": reports,\n                     "fixtureCount": reports.len()'
              assert data.count(old) == 1
              data = data.replace(old, new, 1)
              assert hashlib.sha256(data).hexdigest() == expected, 'Original review digest must match'
              path.write_bytes(data)
          PY
          git apply --check scripts/delivery/eval-retrieval-diagnostics-20260921.patch
          git apply scripts/delivery/eval-retrieval-diagnostics-20260921.patch
          rustfmt --edition 2024 --config skip_children=true src/eval/runner.rs src/cli/mod.rs tests/contracts/eval_science.rs tests/contracts/science_analytics.rs tests/eval_report_e2e.rs
          git diff --check
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'Dicklesworthstone/eidetic_engine_cli'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          paths = ['src/eval/runner.rs', 'src/cli/mod.rs', 'tests/contracts/eval_science.rs', 'tests/contracts/science_analytics.rs', 'tests/eval_report_e2e.rs', 'tests/golden/eval-report.snap']
          patch = 'scripts/delivery/eval-retrieval-diagnostics-20260921.patch'
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert set(changed) in (set(paths), set(paths + [patch])), 'Unreviewed paths changed'
          paths = sorted(changed)
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          root = 'https://api.github.com/repos/Dicklesworthstone/eidetic_engine_cli/'
          def api(method, suffix, data=None):
              req = urllib.request.Request(root + suffix, method=method,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'User-Agent': 'ee-eval-diagnostics'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)
          commit = api('GET', 'git/commits/' + base)
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_text()
              blob = api('POST', 'git/blobs', {'content': content, 'encoding': 'utf-8'})
              local_blob = subprocess.check_output(['git', 'hash-object', path]).decode().strip()
              assert local_blob == blob['sha'], 'Source transport changed'
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api('POST', 'git/trees', {'base_tree': commit['tree']['sha'], 'tree': entries})
          subprocess.run(['git', 'add', '--', *paths], check=True)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == tree['sha'], 'Tested tree differs from publication'
          message = '''fix(eval): preserve per-query search degradations in run and report (bd-j09rg)

          Carry source diagnostics with query metrics into the existing response
          envelope, attributed to fixture and query. Preserve search status, requested
          and applied modes, fallback posture and canonical recovery actions. Normalize
          only the private scratch root and screen secret-like diagnostic text. Do not
          leak raw SQL errors. Scores, thresholds, quality hashes, report schemas and
          cancellation behavior are unchanged. Human output reports the same failures.

          Add six unit regressions and two real-CLI contracts requiring actual hash
          fallback evidence for every query. Replace obsolete empty-warning assertions
          with positive attribution assertions while retaining the quality goldens.
          Exact patch/digest, pinned rustfmt, whitespace and complete source-tree checks
          passed before publication. Rust compilation/runtime tests run subsequently;
          this commit does not claim their result.'''
          new = api('POST', 'git/commits', {'tree': tree['sha'], 'parents': [base], 'message': message})
          api('PATCH', 'git/refs/heads/main', {'sha': new['sha'], 'force': False})
          pathlib.Path(os.environ['RUNNER_TEMP'], 'eval-diagnostics-source.log').write_text(json.dumps({'sourceCommit': new['sha'], 'sourceTree': tree['sha'], 'baseCommit': base, 'files': entries}, indent=2))
          print('Published and verified exact tested source:', new['sha'])
          PY
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: eval-diagnostics-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            eval-diagnostics-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            core-retrieval-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            native-rule-scope-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Resolve pinned Franken dependencies
        run: |
          set -euo pipefail
          ./scripts/checkout-franken-stack.sh "$GITHUB_WORKSPACE/.ci/franken-stack/projects"
          CARGO_PATH_ROOT=".ci/franken-stack/projects" perl -0pi -e '
            s{/data/projects/(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
            s{\.\./(asupersync|franken_agent_detection|franken_networkx|frankensearch|frankensqlite|sqlmodel_rust|toon_rust)}{$ENV{CARGO_PATH_ROOT}/$1}g;
          ' Cargo.toml
          git diff -- Cargo.toml > "$RUNNER_TEMP/eval-diagnostics-build-paths.patch"
          rustc --version --verbose > "$RUNNER_TEMP/eval-diagnostics-toolchain.log"
      - name: Execute six diagnostic unit regressions
        run: |
          set -uo pipefail
          status=0
          cargo test --locked --lib 'eval::runner::retrieval_diagnostic_tests::' -- --test-threads=2 > "$RUNNER_TEMP/eval-diagnostics-unit.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/eval-diagnostics-unit.log"
          # TWO bare guards were here (bd-aav0v): `test "$status" -eq 0` and an exact-count
          # grep. Either aborted the step with NO output, and they mean different things -- a
          # failing test versus a changed population.
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: arm 'eval::runner::retrieval_diagnostic_tests::' STOPPED this lane -- cargo exited $status, so a test FAILED or the harness crashed. This is not a count mismatch; the failing test is in the tail above."
            exit 1
          fi
          # FLOOR, at a MEASURED value (bd-lagsa). Measured on RCH 2026-10-08:
          # `cargo test --locked --lib 'eval::runner::retrieval_diagnostic_tests::'`
          # -> ok. 6 passed; 0 failed. Exact reds this lane when the subtree grows.
          diag_unit_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/eval-diagnostics-unit.log" | head -1)
          if test -z "$diag_unit_ran" || test "$diag_unit_ran" -lt 6; then
            echo "ATTRIBUTION: arm 'eval::runner::retrieval_diagnostic_tests::' STOPPED this lane -- passing-with-zero-failures count '${diag_unit_ran:-none}', required floor 6. An empty count means no 'test result: ok.' line at all, which is what a filter matching zero tests looks like."
            exit 1
          fi
          echo "ATTRIBUTION: arm 'eval::runner::retrieval_diagnostic_tests::' ok -- ran $diag_unit_ran tests (floor 6, measured 6 on 2026-10-08), 0 failed."
      - name: Execute real CLI diagnostic contracts
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          set -uo pipefail
          status=0
          cargo test --locked --test contracts 'eval_science::eval_retrieval_' -- --test-threads=1 > "$RUNNER_TEMP/eval-diagnostics-cli.log" 2>&1 || status=$?
          tail -n 160 "$RUNNER_TEMP/eval-diagnostics-cli.log"
          test "$status" -eq 0
          grep -Fq 'test result: ok. 2 passed; 0 failed;' "$RUNNER_TEMP/eval-diagnostics-cli.log"
      - name: Capture actual report and check historical quality golden
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          set -uo pipefail
          failed=0
          target/debug/ee --json eval report fx.release_failure.v1 > "$RUNNER_TEMP/eval-diagnostics-report.json" 2> "$RUNNER_TEMP/eval-diagnostics-report-stderr.log" || failed=1
          cargo test --locked --test integration_e_f 'eval_report_e2e::' -- --test-threads=1 > "$RUNNER_TEMP/eval-diagnostics-golden.log" 2>&1 || failed=1
          tail -n 120 "$RUNNER_TEMP/eval-diagnostics-golden.log"
          # bd-sj2p7: `eval_report_e2e` WAS PASSED AS A TARGET AND IS NOT ONE.
          # Cargo.toml sets `autotests = false` and declares 46 [[test]] targets;
          # tests/eval_report_e2e.rs is not among them. It is a MODULE of
          # integration_e_f (tests/suites/integration_e_f.rs:225, `#[path =
          # "../eval_report_e2e.rs"]`), so `--test eval_report_e2e` could only ever
          # answer "no test target named ...". Addressed through its real target with a
          # module filter.
          #
          # CORRECTING THE COMMENT THIS REPLACES, which reasoned about the wrong failure
          # mode: it said "if that target is renamed or removed from Cargo.toml's
          # autotests discovery, cargo can succeed while running no tests from it".
          # There is no autotests discovery -- `autotests = false` -- and the target was
          # never declared, so the command did not pass vacuously, it failed outright.
          # The floor was right for the wrong reason; it stays, because with a FILTER the
          # vacuity mode it describes becomes real (a filter matching nothing exits 0).
          #
          # VACUITY FLOOR (bd-lagsa). `|| failed=1` carries cargo's exit, so a FAILING
          # test was always caught. A filter that matches nothing also exits 0, and
          # tests/eval_report_e2e.rs holds exactly 1 #[test], so a floor of 1 is both the
          # reviewed inventory and the minimum that rules out an empty run.
          ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed;.*/\1/p' "$RUNNER_TEMP/eval-diagnostics-golden.log" | head -1)
          if test -z "$ran" || test "$ran" -lt 1; then
            echo "ATTRIBUTION: test target eval_report_e2e produced no passing-with-zero-failures line (count '${ran:-none}') -- refusing a vacuous pass"
            failed=1
          else
            echo "ATTRIBUTION: test target eval_report_e2e ran $ran tests"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: eval-diagnostics-verification
          path: |
            ${{ runner.temp }}/eval-diagnostics-*.log
            ${{ runner.temp }}/eval-diagnostics-*.patch
            ${{ runner.temp }}/eval-diagnostics-*.json
          retention-days: 7
