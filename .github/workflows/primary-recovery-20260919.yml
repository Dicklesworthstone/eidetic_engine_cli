name: Verify durable recovery fidelity
on:
  push:
    branches: [main]
    paths:
      - 'src/core/backup*.rs'
      - 'src/core/jsonl*.rs'
      - 'src/db/**'
      - 'src/models/**'
      - .github/workflows/primary-recovery-20260919.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: durable-recovery-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # bd-niay4. SINGLE-HALF PIN, AND IT IS CORRECT HERE. "Pin both halves"
          # is CONDITIONAL on a job-level RUSTUP_TOOLCHAIN existing to override
          # the action at invocation time. This workflow sets none, so there is
          # no second half and this is not d315cdc7f. The ref `@nightly` selects
          # FLOATING nightly by itself; this input is what dates the install.
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            contradiction-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check formatting and all targets
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/recovery-source.log"
          rustfmt --check --edition 2024 --config skip_children=true src/core/backup.rs src/core/backup_recovery.rs src/core/backup_history_recovery.rs src/core/backup_lifecycle_recovery.rs src/core/backup_lifecycle_recovery_tests.rs src/core/backup_maintenance_recovery.rs src/core/backup_maintenance_recovery_tests.rs src/core/jsonl_recovery.rs src/core/backup_revision_recovery_tests.rs src/core/backup_primary_publication_tests.rs
          timeout 25m cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/recovery-check.log"
      - name: Execute primary, lifecycle and maintenance regressions
        run: |
          set -euo pipefail
          run_group() {
            local filter=$1 count=$2 label=$3
            timeout 20m cargo test --locked --lib "$filter" -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/recovery-$label.log"
            grep -Fq "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/recovery-$label.log"
          }
          run_group core::backup::recovery::history::lifecycle::tests 12 lifecycle
          run_group core::backup::recovery::history::maintenance::tests 10 maintenance
          run_group core::backup::recovery::tests 15 inventory
          run_group core::backup::revision_recovery_tests 14 primary
          for filter in default_backup_restores_curation_history_and_applies_review default_backup_restores_procedures_and_live_retirement default_backup_restores_maintenance_and_live_consumers; do
            run_group "core::backup::tests::$filter" 1 "$filter"
          done
          timeout 15m cargo test --locked --lib core::jsonl_import::recovery::tests -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/recovery-jsonl.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/recovery-jsonl.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: primary-lifecycle-maintenance-results
          path: ${{ runner.temp }}/recovery-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
