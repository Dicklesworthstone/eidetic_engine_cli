name: Verify durable recovery fidelity
on:
  push:
    branches: [main]
    paths:
      - 'src/core/backup*.rs'
      - 'src/core/jsonl*.rs'
      - 'src/db/**'
      - 'src/models/**'
      - .github/workflows/primary-recovery-20260919.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: durable-recovery-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # bd-niay4. SINGLE-HALF PIN, AND IT IS CORRECT HERE. "Pin both halves"
          # is CONDITIONAL on a job-level RUSTUP_TOOLCHAIN existing to override
          # the action at invocation time. This workflow sets none, so there is
          # no second half and this is not d315cdc7f. The ref `@nightly` selects
          # FLOATING nightly by itself; this input is what dates the install.
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            contradiction-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check formatting and all targets
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/recovery-source.log"
          rustfmt --check --edition 2024 --config skip_children=true src/core/backup.rs src/core/backup_recovery.rs src/core/backup_history_recovery.rs src/core/backup_lifecycle_recovery.rs src/core/backup_lifecycle_recovery_tests.rs src/core/backup_maintenance_recovery.rs src/core/backup_maintenance_recovery_tests.rs src/core/jsonl_recovery.rs src/core/backup_revision_recovery_tests.rs src/core/backup_primary_publication_tests.rs
          timeout 25m cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/recovery-check.log"
      - name: Execute primary, lifecycle and maintenance regressions
        run: |
          set -uo pipefail
          failed=0
          run_group() {
            local filter=$1 count=$2 label=$3 cargo_exit=0
            # `|| return 1` is required, not decorative: without `set -e` the
            # function's status is the grep's alone, so a cargo/timeout failure
            # would be swallowed whenever a stale log still matched.
            #
            # bd-aav0v: that property is PRESERVED -- the early return below still
            # fires on a tool failure -- but the function now says WHICH arm refused
            # and WHY. Eight arms previously wrote a bare `failed=1`, so a red step
            # listed the groups it ran and never named the one that said no.
            #
            # The two causes are now distinguished, which matters here because every
            # group carries `timeout 20m`: exit 124 (the timeout fired) and a count
            # mismatch are very different problems and were reported identically.
            # `|| cargo_exit=$?` keeps the capture errexit-safe under pipefail; the
            # pipeline's status is cargo's when cargo is what failed.
            timeout 20m cargo test --locked --lib "$filter" -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/recovery-$label.log" || cargo_exit=$?
            if test "$cargo_exit" -ne 0; then
              echo "ATTRIBUTION: group '$label' FAILED -- exit $cargo_exit (tool failure or 20m timeout, not an assertion)"
              return 1
            fi
            if ! grep -Fq "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/recovery-$label.log"; then
              local ran
              ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored;.*/\1/p' "$RUNNER_TEMP/recovery-$label.log" | head -1)
              echo "ATTRIBUTION: group '$label' FAILED -- expected exactly $count passing, observed '${ran:-no summary line}'"
              return 1
            fi
            echo "ATTRIBUTION: group '$label' ok -- $count passing, as pinned"
          }
          run_group core::backup::recovery::history::lifecycle::tests 12 lifecycle || failed=1
          run_group core::backup::recovery::history::maintenance::tests 10 maintenance || failed=1
          run_group core::backup::recovery::tests 15 inventory || failed=1
          # 14 -> 18. DERIVED, not guessed: core::backup::revision_recovery_tests
          # is src/core/backup_revision_recovery_tests.rs (9 #[test]) plus its
          # `#[path = "backup_primary_publication_tests.rs"] mod publication`
          # (9 more) = 18, which is exactly what CI observed before this grep
          # refused it. Raise this number in the same commit that adds a test to
          # either file.
          #
          # This grep WAS the fourth of nine checks in a `set -euo pipefail`
          # step, so while it was stale the three named single-test groups, the
          # jsonl recovery run and the final `git diff --exit-code` below never
          # executed at all. The step now accumulates into `failed` (bd-lagsa),
          # so a stale count here costs one red instead of five silent checks.
          run_group core::backup::revision_recovery_tests 18 primary || failed=1
          for filter in default_backup_restores_curation_history_and_applies_review default_backup_restores_procedures_and_live_retirement default_backup_restores_maintenance_and_live_consumers; do
            run_group "core::backup::tests::$filter" 1 "$filter" || failed=1
          done
          # bd-aav0v: the last three arms sit outside run_group and were the least
          # attributed of all -- the jsonl pair shared one flag between a tool failure
          # and an assertion, and `git diff` shared it with both.
          jsonl_exit=0
          timeout 15m cargo test --locked --lib core::jsonl_import::recovery::tests -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/recovery-jsonl.log" || jsonl_exit=$?
          if test "$jsonl_exit" -ne 0; then
            echo "ATTRIBUTION: group 'jsonl' FAILED -- exit $jsonl_exit (tool failure or 15m timeout, not an assertion)"
            failed=1
          elif ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/recovery-jsonl.log"; then
            echo "ATTRIBUTION: group 'jsonl' FAILED -- no passing-with-zero-failures summary line"
            failed=1
          else
            echo "ATTRIBUTION: group 'jsonl' ok"
          fi
          # This arm is a different KIND of check from the seven above it: a failing
          # `git diff` does not mean a test is wrong, it means SOMETHING IN THIS STEP
          # MODIFIED TRACKED FILES. Sharing one flag made those indistinguishable.
          diff_exit=0
          git diff --exit-code || diff_exit=$?
          if test "$diff_exit" -ne 0; then
            echo "ATTRIBUTION: arm 'working tree unmodified' FAILED -- git diff exit $diff_exit; this step changed tracked files"
            failed=1
          else
            echo "ATTRIBUTION: arm 'working tree unmodified' ok"
          fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: primary-lifecycle-maintenance-results
          path: ${{ runner.temp }}/recovery-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
