name: Atomic decision recording

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/core/decide*.rs
      - src/core/memory.rs
      - src/db/**
      - docs/schemas/ee.decide.record.v1.json
      - .github/workflows/decision-atomicity.yml

permissions:
  contents: read

concurrency:
  group: decision-atomicity-${{ github.sha }}
  cancel-in-progress: false

jobs:
  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: decision-atomicity-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            core-memory-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Record source and check all targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/decisions"
          git rev-parse HEAD | tee "$RUNNER_TEMP/decisions/source.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/decisions/check.log"
      - name: Run decision transaction and public workflow tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for target in unit cli; do
            log="$RUNNER_TEMP/decisions/$target.log"
            if test "$target" = unit; then
              timeout 12m cargo test --locked --lib core::decide:: -- --test-threads=2 > "$log" 2>&1 || failed=1
            else
              timeout 12m cargo test --locked --test integration_a_d decide_workflow:: -- --test-threads=1 > "$log" 2>&1 || failed=1
            fi
            tail -n 100 "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log" || failed=1
          done
          exit "$failed"
      - name: Check lint and formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          cargo clippy --locked --lib -- -D warnings > "$RUNNER_TEMP/decisions/clippy.log" 2>&1 || failed=1
          rustfmt --edition 2024 --check --config skip_children=true src/core/decide.rs src/core/decide_atomic.rs src/core/decide_atomic_tests.rs > "$RUNNER_TEMP/decisions/fmt.log" 2>&1 || failed=1
          tail -n 100 "$RUNNER_TEMP/decisions/clippy.log"
          tail -n 100 "$RUNNER_TEMP/decisions/fmt.log"
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: decisions-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/decisions/
          retention-days: 7
