name: Session arc learning integration and verification
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/session-arc-specificity-fix-20260919.patch
      - .github/workflows/session-arc-learning-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: session-arc-learning-delivery
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # bd-niay4. SINGLE-HALF PIN, AND IT IS CORRECT HERE. "Pin both halves"
          # is CONDITIONAL on a job-level RUSTUP_TOOLCHAIN existing to override
          # the action at invocation time. This workflow sets none in any job,
          # so there is no second half and this is not d315cdc7f. The ref
          # `@nightly` selects FLOATING nightly by itself; this input dates it.
          toolchain: nightly-2026-08-31
          components: rustfmt
      - name: Integrate preserved learning implementation and validation repair
        id: commit
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          delivery=scripts/delivery/session-arc-20260919
          decode() {
            base64 --decode "$delivery/$1.patch.xz.b64" | xz --decompress > "$RUNNER_TEMP/$1.patch"
            echo "$2  $RUNNER_TEMP/$1.patch" | sha256sum --check
          }
          decode session-arc da3b52063de184cb13c1fea828e31f844cd0e264dc17ad5b22d63b2c4b92433b
          decode complete-loop 3a62787a4f27da037fd7c55a098ee08434ce488205cb71e5ed2b840815f9448c
          echo "3ed003964db8915b91ecbbb1d66cc4ec0d2fea4a18ea933143d439c1aa60da61  $delivery/preview-contract.patch" | sha256sum --check
          if ! test -f src/core/curate_session_arc.rs; then
            test "$(git rev-parse HEAD:src/core/curate.rs)" = 6dbbefaae061e74ccea8328bf0d8f912a904ab2a
            test "$(git rev-parse HEAD:src/curate/mod.rs)" = 4c7ad95abe69627a929ee53612ddd9ac3653ab64
            test "$(git rev-parse HEAD:scripts/e2e_capture.sh)" = 7b4e978553dbc7de0dfb9c28cc3a1944582e2875
            test "$(git rev-parse HEAD:docs/schemas/ee.curate.show.v1.json)" = 1588bb2728153ec5a22e1c138a943505b518db91
            test "$(git rev-parse HEAD:tests/docs_schemas_match_responses.rs)" = 59a1a98981b167101c0f77aba88ca2f7fc890930
            for patch in "$RUNNER_TEMP/session-arc.patch" "$RUNNER_TEMP/complete-loop.patch" "$delivery/preview-contract.patch"; do
              git apply --check --whitespace=error-all "$patch"
              git apply "$patch"
            done
          else
            grep -Fq 'session_arc::persist_pair_link(' src/core/curate.rs
          fi
          fix=scripts/delivery/session-arc-specificity-fix-20260919.patch
          echo "effe76169f84742562557b63302f51eaeba14e9aa427e40f7736b2b1b6650f28  $fix" | sha256sum --check
          if ! grep -Fq 'URI schemes and line locators are provenance, not error codes.' src/curate/mod.rs; then
            git apply --check --whitespace=error-all "$fix"
            git apply "$fix"
          fi
          if ! grep -Fq 'path = "tests/session_arc_learning_cli.rs"' Cargo.toml; then
            printf '\n[[test]]\nname = "session_arc_learning_cli"\npath = "tests/session_arc_learning_cli.rs"\n' >> Cargo.toml
          fi
          files=(Cargo.toml src/core/curate.rs src/core/curate_session_arc.rs src/core/curate_session_arc_tests.rs src/curate/mod.rs tests/session_arc_learning_cli.rs scripts/e2e_capture.sh docs/schemas/ee.curate.show.v1.json tests/docs_schemas_match_responses.rs)
          rustfmt --edition 2024 --config skip_children=true src/core/curate.rs src/core/curate_session_arc.rs src/core/curate_session_arc_tests.rs src/curate/mod.rs tests/session_arc_learning_cli.rs tests/docs_schemas_match_responses.rs
          git diff --check
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(learn): integrate reviewed session-arc pairs and truthful application previews' -m 'Recover the preserved source-backed learning implementation, including same-window CASS arcs, explicit reciprocal acceptance, immutable shared evidence ownership, audited links, atomic review persistence, capture kind mapping and strict CLI preview schemas. Fix malformed provenance being credited as an error code rather than weakening the specificity regression. Include real-binary CLI acceptance tests. Patch validation and formatting passed; current-source compilation and runtime results are reported separately. bd-2vq2z.9'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 4
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${files[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/session-arc-source.log"
          tar -czf "$RUNNER_TEMP/session-arc-source.tar.gz" "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: session-arc-published-source
          path: |
            ${{ runner.temp }}/session-arc-source.log
            ${{ runner.temp }}/session-arc-source.tar.gz
          retention-days: 7
  verify:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # bd-niay4. SINGLE-HALF PIN, AND IT IS CORRECT HERE. "Pin both halves"
          # is CONDITIONAL on a job-level RUSTUP_TOOLCHAIN existing to override
          # the action at invocation time. This workflow sets none in any job,
          # so there is no second half and this is not d315cdc7f. The ref
          # `@nightly` selects FLOATING nightly by itself; this input dates it.
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: session-arc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            session-arc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            contradiction-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Compile all targets
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/session-arc-source.log"
          timeout 20m cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/session-arc-check.log"
      - name: Execute learning, CLI and schema regressions
        run: |
          set -euo pipefail
          run_group() {
            local label=$1 filter=$2 count=$3
            timeout 15m cargo test --locked --lib "$filter" -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/session-arc-$label.log"
            grep -Eq "test result: ok\. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/session-arc-$label.log"
          }
          run_group learning core::curate::tests::session_arc_tests 13
          run_group review core::curate::tests::review_session_ '[1-9][0-9]*'
          run_group ownership core::curate::tests::apply_curation_candidate_blocks_competing_create_derived_candidate_evidence_conflict 1
          run_group drift core::curate::tests::apply_curation_candidate_rejects_create_derived_evidence_attachment_drift 1
          run_group specificity specificity_score_credits_valid_canonical_session_provenance_not_empty_schemes 1
          timeout 15m cargo test --locked --test session_arc_learning_cli -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/session-arc-cli.log"
          grep -Fq 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/session-arc-cli.log"
          timeout 10m cargo test --locked --test integration_a_d docs_schemas_match_responses::curate_show_report_matches_schema -- --exact 2>&1 | tee "$RUNNER_TEMP/session-arc-schema.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/session-arc-schema.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: session-arc-rust-results
          path: ${{ runner.temp }}/session-arc-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
