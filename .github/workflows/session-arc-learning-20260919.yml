name: Session arc learning integration and verification
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/session-arc-specificity-fix-20260919.patch
      - scripts/delivery/session-arc-20260919/**
      - .github/workflows/session-arc-learning-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # The legacy session-arc workflow uses session-arc-learning-delivery.
  # Serialize this implementation independently; source guards protect both.
  group: session-arc-imported-messages
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      # Pin installation and invocation together; never shadow a dated install
      # with a floating RUSTUP_TOOLCHAIN (bd-niay4).
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: session-arc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            session-arc-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            prefetch-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Reproduce imported-message failure and apply the source repair
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/imported-messages.patch"
          base64 --decode scripts/delivery/session-arc-20260919/imported-messages.patch.xz.b64 | xz --decompress > "$patch"
          echo "d492cf5e93300f435e8c71cecc1f965e7a8ad539d095ba2680c8f8ddf8da48e1  $patch" | sha256sum --check
          git rev-parse HEAD > "$RUNNER_TEMP/session-arc-base.log"
          if ! grep -Fq 'pub(super) fn explicit_message_candidates(' src/core/curate_session_arc.rs; then
            test "$(git rev-parse HEAD:src/core/curate.rs)" = 0476b9ff4091d9e9bcf2a21d7adc0ef578173358
            test "$(git rev-parse HEAD:src/core/curate_session_arc.rs)" = dcbf66e05689a69b40747badb20ccb9b75518a89
            test "$(git rev-parse HEAD:src/core/curate_session_arc_tests.rs)" = 59dbd7ff6aa57ea996ecd577991bbcb22b76b570
            test "$(git rev-parse HEAD:tests/session_arc_learning_cli.rs)" = de7811224a2a91f9a49895eae755d70120509398
            git apply --check --whitespace=error-all "$patch"
            git apply --include=tests/session_arc_learning_cli.rs "$patch"
            status=0
            timeout 20m cargo test --locked --test session_arc_learning_cli public_cli_applies_individually_imported_explicit_messages -- --exact --nocapture > "$RUNNER_TEMP/session-arc-before.log" 2>&1 || status=$?
            tail -n 100 "$RUNNER_TEMP/session-arc-before.log"
            test "$status" -eq 101
            grep -Fq 'test result: FAILED. 0 passed; 1 failed; 0 ignored;' "$RUNNER_TEMP/session-arc-before.log"
            grep -Fq 'candidateCount' "$RUNNER_TEMP/session-arc-before.log"
            git apply --exclude=tests/session_arc_learning_cli.rs "$patch"
          fi
          rustfmt --edition 2024 --config skip_children=true src/core/curate.rs src/core/curate_session_arc.rs src/core/curate_session_arc_tests.rs tests/session_arc_learning_cli.rs
          git diff --check
      - name: Exercise complete learning and independent acceptance before publication
        run: |
          set -euo pipefail
          run_group() {
            local label=$1 filter=$2 count=$3
            timeout 15m cargo test --locked --lib "$filter" -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/session-arc-$label.log"
            grep -Eq "test result: ok\. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/session-arc-$label.log"
          }
          run_group learning core::curate::tests::session_arc_tests 21
          run_group review core::curate::tests::review_session_ '[1-9][0-9]*'
          run_group ownership core::curate::tests::apply_curation_candidate_blocks_competing_create_derived_candidate_evidence_conflict 1
          run_group drift core::curate::tests::apply_curation_candidate_rejects_create_derived_evidence_attachment_drift 1
          run_group specificity specificity_score_credits_valid_canonical_session_provenance_not_empty_schemes 1
          timeout 15m cargo test --locked --test session_arc_learning_cli -- --test-threads=2 2>&1 | tee "$RUNNER_TEMP/session-arc-cli.log"
          grep -Fq 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/session-arc-cli.log"
      - name: Commit tested source directly to main without replacing concurrent work
        id: publish
        run: |
          set -euo pipefail
          files=(src/core/curate.rs src/core/curate_session_arc.rs src/core/curate_session_arc_tests.rs tests/session_arc_learning_cli.rs)
          base=$(git rev-parse HEAD)
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'fix(learn): pair imported failure and repair messages with exact evidence' -m 'Reproduce the missing candidates through the public CLI before repair, then require 21 session-arc regressions and all three real-CLI flows to pass. Pair adjacent explicit messages before topic inference, preserve source identity and existing same-topic proposal IDs, and keep both approvals independent. Review, evidence ownership, attachment drift and provenance specificity controls passed. bd-6br0o'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 4
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${files[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/session-arc-source.log"
          git archive HEAD | gzip > "$RUNNER_TEMP/session-arc-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: session-arc-source-and-tests
          path: ${{ runner.temp }}/session-arc-*
          retention-days: 7
      - name: Exercise unchanged capture E2E from importer through accepted learning
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          set -euo pipefail
          timeout 15m cargo build --locked --bin ee 2>&1 | tee "$RUNNER_TEMP/session-arc-build.log"
          mkdir -p "$RUNNER_TEMP/session-arc-capture" "$RUNNER_TEMP/session-arc-workspaces"
          export EE_BIN="$PWD/target/debug/ee"
          export EE_BINARY="$EE_BIN"
          export EE_E2E_KEEP=1
          export EE_E2E_TMPDIR="$RUNNER_TEMP/session-arc-workspaces"
          export LOG_DIR="$RUNNER_TEMP/session-arc-capture"
          timeout 15m bash scripts/e2e_capture.sh 2>&1 | tee "$RUNNER_TEMP/session-arc-capture.log"
          test -s "$LOG_DIR/summary.json"
          python3 - "$LOG_DIR/summary.json" <<'PY'
          import json, sys
          print(json.dumps(json.load(open(sys.argv[1])), indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: session-arc-capture-evidence
          path: |
            ${{ runner.temp }}/session-arc-capture*
            ${{ runner.temp }}/session-arc-workspaces
          include-hidden-files: true
          retention-days: 7
      - name: Verify all-target compilation, library Clippy and public schema
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          set -euo pipefail
          timeout 20m cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/session-arc-check.log"
          timeout 15m cargo clippy --locked --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/session-arc-clippy.log"
          timeout 10m cargo test --locked --test integration_a_d docs_schemas_match_responses::curate_show_report_matches_schema -- --exact 2>&1 | tee "$RUNNER_TEMP/session-arc-schema.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/session-arc-schema.log"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: session-arc-rust-results
          path: ${{ runner.temp }}/session-arc-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
