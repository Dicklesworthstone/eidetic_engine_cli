name: Native transcript answers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/delivery/ask-evidence-20260918.patch'
      - '.github/workflows/ask-evidence-20260918.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-evidence-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-evidence-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate reviewed native evidence admission
        run: |
          git rev-parse HEAD
          git apply --check --recount scripts/delivery/ask-evidence-20260918.patch
          git apply --recount scripts/delivery/ask-evidence-20260918.patch
          rustfmt --edition 2024 --config skip_children=true src/core/ask_admission.rs src/core/ask_corpus.rs src/core/ask_native.rs src/core/ask_evidence.rs
          git diff --check
          git diff --stat
      - name: Compile production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/evidence-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/evidence-check.log"
          exit "$status"
      - name: Execute real-store transcript regressions
        run: |
          status=0
          cargo test --locked --lib core::ask::corpus::admission::evidence::tests:: -- --nocapture > "$RUNNER_TEMP/evidence-focused.log" 2>&1 || status=$?
          tail -n 140 "$RUNNER_TEMP/evidence-focused.log"
          grep -Eq 'test result: ok\. 9 passed; 0 failed' "$RUNNER_TEMP/evidence-focused.log" || status=1
          exit "$status"
      - name: Commit tested production feature directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/ask_admission.rs src/core/ask_corpus.rs src/core/ask_native.rs src/core/ask_evidence.rs
          git commit -m 'feat(ask): answer directly from live-admitted native CASS evidence' -m 'Load admitted transcript excerpts through bounded source-of-truth pages in the owned ask snapshot. Preserve EvidenceId, revision, exact excerpt offsets and canonical session/line provenance with cass_evidence trust and a neutral prior. Keep narrow memory scopes fail closed, exclude linked excerpts whose parent memory is ineligible, and count a session and its linked derivations as one corroborating lineage. Production compilation and nine real-store regressions passed before this commit; broader regression results follow separately.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git merge --no-edit origin/main
          done
          exit 1
      - name: Execute complete ask engine regressions
        run: |
          status=0
          cargo test --locked --lib core::ask:: -- --nocapture > "$RUNNER_TEMP/evidence-engine.log" 2>&1 || status=$?
          tail -n 200 "$RUNNER_TEMP/evidence-engine.log"
          exit "$status"
      - name: Execute existing public ask contracts
        if: ${{ !cancelled() }}
        run: |
          status=0
          cargo test --locked --test contracts ask_lifecycle -- --nocapture > "$RUNNER_TEMP/evidence-cli.log" 2>&1 || status=$?
          tail -n 140 "$RUNNER_TEMP/evidence-cli.log"
          exit "$status"
      - name: Preserve exact source and verification logs
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/evidence-source-sha.log"
          git diff -- src/core/ask_admission.rs src/core/ask_corpus.rs src/core/ask_native.rs src/core/ask_evidence.rs > "$RUNNER_TEMP/evidence-uncommitted.patch"
          git archive --format=tar.gz --output="$RUNNER_TEMP/evidence-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-transcript-verification
          path: |
            ${{ runner.temp }}/evidence-*.log
            ${{ runner.temp }}/evidence-*.patch
            ${{ runner.temp }}/evidence-source.tar.gz
          retention-days: 7
