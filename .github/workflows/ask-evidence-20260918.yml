name: Native transcript answers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/delivery/ask-evidence-20260918.patch'
      - '.github/workflows/ask-evidence-20260918.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ask-evidence-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ask-evidence-${{ runner.os }}-nightly-2026-08-31-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate reviewed transcript admission and public contracts
        run: |
          git rev-parse HEAD
          git apply --check --recount scripts/delivery/ask-evidence-20260918.patch
          git apply --recount scripts/delivery/ask-evidence-20260918.patch
          rustfmt --edition 2024 --config skip_children=true src/core/ask_admission.rs src/core/ask_corpus.rs src/core/ask_native.rs src/core/ask_evidence.rs tests/contracts/ask_lifecycle.rs tests/contracts/ask_native.rs tests/contracts/ask_transcript.rs
          git diff --check
          git diff --stat
      - name: Compile production library
        run: |
          status=0
          cargo check --locked --lib > "$RUNNER_TEMP/evidence-check.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/evidence-check.log"
          exit "$status"
      - name: Execute real-store transcript regressions
        run: |
          status=0
          cargo test --locked --lib core::ask::corpus::admission::evidence::tests:: -- --nocapture > "$RUNNER_TEMP/evidence-focused.log" 2>&1 || status=$?
          tail -n 140 "$RUNNER_TEMP/evidence-focused.log"
          # bd-aav0v: ONE VARIABLE, TWO STATES. `status` took `$?` from cargo and also a
          # literal 1 from the count check, so `exit "$status"` named neither -- a failing
          # test and a changed population produced the same red. The remedies are opposite:
          # fix the code, versus update or floor the pin.
          #
          # Exit code and redness are UNCHANGED: any failing arm still fails the step, and
          # both arms are still evaluated so neither can mask the other.
          evidence_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/evidence-focused.log" | head -1)
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: arm 'core::ask::corpus::admission::evidence::tests::' FAILED -- cargo exited $status, so a test failed or the harness crashed. Not a count mismatch; the failing test is in the tail above. Summary count: ${evidence_ran:-none}."
          elif test -z "$evidence_ran"; then
            echo "ATTRIBUTION: arm 'core::ask::corpus::admission::evidence::tests::' FAILED -- cargo exited 0 but printed no 'test result: ok. N passed; 0 failed' line. That is what a filter matching ZERO tests looks like, and it is treated as a failure, not as a count of zero."
            status=1
          elif test "$evidence_ran" != 9; then
            echo "ATTRIBUTION: arm 'core::ask::corpus::admission::evidence::tests::' FAILED -- expected exactly 9 passing, counted $evidence_ran. If $evidence_ran is GREATER the suite grew and this pin is stale (bd-lagsa); if LOWER a test was removed. This pin is NOT yet measured, so it stays exact rather than being floored on a guess."
            status=1
          else
            echo "ATTRIBUTION: arm 'core::ask::corpus::admission::evidence::tests::' ok -- exactly 9 passed, 0 failed."
          fi
          exit "$status"
      - name: Execute new and existing public ask contracts before publication
        run: |
          status=0
          cargo test --locked --test contracts ask_lifecycle -- --nocapture > "$RUNNER_TEMP/evidence-cli.log" 2>&1 || status=$?
          tail -n 160 "$RUNNER_TEMP/evidence-cli.log"
          # bd-aav0v: same shared-flag shape as the step above -- `status` carried both
          # cargo's exit and the count check's literal 1. Exit code and redness unchanged;
          # both arms still evaluated.
          lifecycle_ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed.*/\1/p' "$RUNNER_TEMP/evidence-cli.log" | head -1)
          if test "$status" -ne 0; then
            echo "ATTRIBUTION: arm 'contracts ask_lifecycle' FAILED -- cargo exited $status, so a test failed or the harness crashed. Not a count mismatch; the failing test is in the tail above. Summary count: ${lifecycle_ran:-none}."
          elif test -z "$lifecycle_ran"; then
            echo "ATTRIBUTION: arm 'contracts ask_lifecycle' FAILED -- cargo exited 0 but printed no 'test result: ok. N passed; 0 failed' line. That is what a filter matching ZERO tests looks like, and it is treated as a failure, not as a count of zero."
            status=1
          elif test "$lifecycle_ran" != 20; then
            echo "ATTRIBUTION: arm 'contracts ask_lifecycle' FAILED -- expected exactly 20 passing, counted $lifecycle_ran. If $lifecycle_ran is GREATER the suite grew and this pin is stale (bd-lagsa); if LOWER a test was removed. This pin is NOT yet measured, so it stays exact rather than being floored on a guess."
            status=1
          else
            echo "ATTRIBUTION: arm 'contracts ask_lifecycle' ok -- exactly 20 passed, 0 failed."
          fi
          exit "$status"
      - name: Commit tested production feature directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/core/ask_admission.rs src/core/ask_corpus.rs src/core/ask_native.rs src/core/ask_evidence.rs tests/contracts/ask_lifecycle.rs tests/contracts/ask_native.rs tests/contracts/ask_transcript.rs docs/adr/0067-extractive-ask.md
          git commit -m 'feat(ask): answer directly from live-admitted native CASS evidence' -m 'Load admitted transcript excerpts through bounded source-of-truth pages in the owned ask snapshot. Preserve EvidenceId, revision, exact excerpt offsets and canonical session/line provenance with cass_evidence trust and a neutral prior. Keep narrow memory scopes fail closed, exclude linked excerpts whose parent memory is ineligible, and count a session and its linked derivations as one corroborating lineage. Nine real-store tests and all twenty lifecycle CLI contracts passed before this commit. Exercise real curation validation with a legitimate agent-assertion source rather than bypassing trust policy in the fixture. Broader engine regression results follow separately.'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git merge --no-edit origin/main
          done
          exit 1
      - name: Execute complete ask engine regressions
        run: |
          status=0
          cargo test --locked --lib core::ask:: -- --nocapture > "$RUNNER_TEMP/evidence-engine.log" 2>&1 || status=$?
          tail -n 210 "$RUNNER_TEMP/evidence-engine.log"
          # VACUITY FLOOR (bd-lagsa). `status` already carries cargo's exit, so a FAILING
          # test was always caught. What was not caught is a run that executed nothing:
          # re-path `core::ask::` and the filter matches zero tests, libtest reports zero
          # passed and zero failed, cargo exits 0, and this sweep of the whole ask engine
          # passes having run none of it. Floor of 1, since the module is expected to grow.
          ran=$(sed -nE 's/^test result: ok\. ([0-9]+) passed; 0 failed;.*/\1/p' "$RUNNER_TEMP/evidence-engine.log" | head -1)
          if test -z "$ran" || test "$ran" -lt 1; then
            echo "ATTRIBUTION: core::ask:: produced no passing-with-zero-failures line (count '${ran:-none}') -- refusing a vacuous pass"
            status=1
          else
            echo "ATTRIBUTION: core::ask:: ran $ran tests"
          fi
          exit "$status"
      - name: Preserve exact source and verification logs
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/evidence-source-sha.log"
          git diff -- src/core/ask_admission.rs src/core/ask_corpus.rs src/core/ask_native.rs src/core/ask_evidence.rs tests/contracts/ask_lifecycle.rs tests/contracts/ask_native.rs tests/contracts/ask_transcript.rs docs/adr/0067-extractive-ask.md > "$RUNNER_TEMP/evidence-uncommitted.patch"
          git archive --format=tar.gz --output="$RUNNER_TEMP/evidence-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-transcript-verification
          path: |
            ${{ runner.temp }}/evidence-*.log
            ${{ runner.temp }}/evidence-*.patch
            ${{ runner.temp }}/evidence-source.tar.gz
          retention-days: 7
