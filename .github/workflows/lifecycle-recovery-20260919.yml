name: Curation and procedure recovery fidelity
on:
  push:
    branches: [main]
    paths:
      - scripts/delivery/lifecycle-recovery-20260919.patch.xz.b64
      - .github/workflows/lifecycle-recovery-20260919.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifecycle-recovery-delivery
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.repository == 'Dicklesworthstone/eidetic_engine_cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EE_EMBED_DOWNLOAD: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            lifecycle-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            contradiction-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            learned-history-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            recovery-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Integrate and verify production recovery
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          echo "$base" > "$RUNNER_TEMP/lifecycle-source-sha.log"
          base64 --decode scripts/delivery/lifecycle-recovery-20260919.patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/lifecycle.patch"
          echo "96e7ac65be20ddcb496bee849fa474fe24f16391be7161bc3b9a296b5c94976d  $RUNNER_TEMP/lifecycle.patch" | sha256sum --check
          if ! test -f src/core/backup_lifecycle_recovery.rs; then
            test "$(git rev-parse HEAD:src/core/backup_history_recovery.rs)" = 1d31dcaf36922648e08bc03132372b5676b7b800
            git apply --check --whitespace=error-all "$RUNNER_TEMP/lifecycle.patch"
            git apply "$RUNNER_TEMP/lifecycle.patch"
          else
            grep -Fq 'self.lifecycle.verify_connection(db)' src/core/backup_history_recovery.rs
          fi
          files=(src/core/backup_history_recovery.rs src/core/backup_lifecycle_recovery.rs src/core/backup_lifecycle_recovery_tests.rs)
          rustfmt --edition 2024 --config skip_children=true "${files[@]}"
          tar -czf "$RUNNER_TEMP/lifecycle-tested-source.tar.gz" "${files[@]}"
          verify() {
            cargo check --locked --all-targets > "$RUNNER_TEMP/lifecycle-check.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/lifecycle-check.log"; return 1; }
            cargo test --locked --lib core::backup::recovery::history::lifecycle::tests -- --test-threads=2 > "$RUNNER_TEMP/lifecycle-tests.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/lifecycle-tests.log"; return 1; }
            tail -n 100 "$RUNNER_TEMP/lifecycle-tests.log"
            grep -Fq 'test result: ok. 12 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/lifecycle-tests.log"
            for filter in default_backup_restores_curation_history_and_applies_review default_backup_restores_procedures_and_live_retirement; do
              cargo test --locked --lib "core::backup::tests::$filter" -- --exact > "$RUNNER_TEMP/lifecycle-$filter.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/lifecycle-$filter.log"; return 1; }
              tail -n 50 "$RUNNER_TEMP/lifecycle-$filter.log"
              grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/lifecycle-$filter.log"
            done
          }
          verify
          git diff --check
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(backup): preserve curation authority and procedure lifecycle through recovery' -m 'Compare authenticated typed curation proposals, TTL policies, procedures and event provenance before and after derived rebuilding. Admit only explicit redaction-review transitions, preserve retirement and applied/rejected decisions, and reject same-count corruption without publishing a partial store. All-target compilation, twelve adversarial lifecycle tests and both existing public recovery continuations passed before this commit.'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 3
              git fetch origin main
              git diff --exit-code "$base" origin/main -- "${files[@]}"
              git merge --no-edit origin/main
              base=$(git rev-parse origin/main)
              verify
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/lifecycle-integrated-sha.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lifecycle-recovery-results
          path: |
            ${{ runner.temp }}/lifecycle-*.log
            ${{ runner.temp }}/lifecycle-tested-source.tar.gz
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
