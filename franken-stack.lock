# ee.franken-stack.lock.v1
#
# Full commit IDs are mandatory. This set pins the sibling revisions that
# ee's Cargo.lock must close over. FrankenSQLite is pinned at
# the 0.3.0 line with the ExpressionTooDeep fix and a dedicated 16 MiB worker
# for every SQLModel open/query/close mode. SQLModel consumes that stack-safe
# synchronous facade directly, so fresh schema migration no longer drives
# deep engine futures on the caller stack. The [patch.crates-io] entry still
# satisfies sqlmodel-frankensqlite's `fsqlite 0.3` requirement. Frankensearch's
# storage crates continue to use registry fsqlite 0.1.x until that project
# migrates, so the closure intentionally carries both lines (2026-08-12).
