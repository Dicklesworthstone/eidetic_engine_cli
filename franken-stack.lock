# ee.franken-stack.lock.v1
#
# Full commit IDs are mandatory. These are source revisions for the registry
# packages selected by Cargo.lock; sibling checkouts are not required. The
# 0.17.0 publication candidate uses the
# published Asupersync 0.5.0 source and coordinated downstream minor versions:
# FrankenSQLite 0.4.10 (whole family; repairs strict read-only opens and bd-obwsy),
# Frankensearch 0.7.1, franken-agent-detection 0.3.8, FrankenNetworkX 0.3.0,
# SQLModel 0.5.0 and tru 0.2.4. This records source provenance while their
# registry packages are qualified; publication status is tracked in
# UPGRADE_LOG.md.
#
# Each revision below must be one whose own manifest declares the version
# Cargo.toml pins, since that is what the franken-stack preflight compares.
# Verified 2026-10-13 by reading each commit's manifest at the paths
# package_manifests maps in scripts/rch_verify.sh: 11 of 12 packages agreed.
# franken_agent_detection did not -- its entry was f3c00b742, whose manifest
# declares 0.3.3 while Cargo.toml pins =0.3.8 -- so it now points at v0.3.8
# (99ae86cdf, manifest 0.3.8), of which f3c00b742 is an ancestor. sqlmodel's
# two crates carry version.workspace = true and inherit 0.5.0 from the
# workspace root; they are correct despite declaring no version of their own.
#
# RE-VERIFIED 2026-11-07: 12 of 12 packages across all 7 rows agree, zero
# mismatches and zero unverifiable. This is worth dating because the header
# above was written for the 0.17.0 candidate and Cargo.toml now declares 0.18.0,
# so the natural assumption is that this file has gone stale -- it has not,
# because the franken-stack pins did not move across that release. It also
# retires the first suspect CLAUDE.md names for a refused pinned dispatch ("a
# pinned refusal almost always means one stale row in franken-stack.lock"):
# whatever refuses the lane today, it is not this file. Look instead at
# build-admission TMPDIR, the AppleDouble export base and worker admissibility.
#
# Method, so the claim is reproducible rather than asserted. For each row, the
# manifest was read AT THE LOCKED REVISION with `git show <sha>:<path>` from a
# sibling checkout -- never from its working tree, which is drifted on this host
# and would have measured the wrong thing -- using the same per-package manifest
# paths `package_manifests` maps in scripts/rch_verify.sh, and compared against
# the version Cargo.lock selects for that package rather than against the
# `=x.y.z` pin in Cargo.toml, since Cargo.lock is what the header above calls
# authoritative and it is the only source that covers the transitive rows
# (fsqlite-core, fsqlite-error, sqlmodel-*, tru) that Cargo.toml never names.
# Sibling checkouts remain NOT required to use this lock; they are required only
# to re-run this check.
#
# If you re-run it, PARSE THE TOML -- do not match `^version = "..."` with a
# line-anchored regex. Such a regex reads whichever `version` comes first in the
# file, so a `[dependencies.x]` table above `[package]`, or a crate that
# inherits via `version.workspace = true`, yields some dependency's version and
# no error. Read `[package].version`, falling back to the root's
# `[workspace.package].version` on an inherit (two sqlmodel crates do inherit).
# Both readings were taken on 2026-11-07 and agree at 12 of 12; the regex was
# right here only because `[workspace.package]` happens to precede
# `[workspace.dependencies]` in that root. Also note 33 of the 537 names in
# Cargo.lock carry MORE THAN ONE version, so a name -> version map is safe only
# because each of these 12 appears exactly once -- check that before extending
# this check to another package.
